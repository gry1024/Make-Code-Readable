itive_timeseries, cur_positive_attributes, cur_positive_points = generate_positive_timeseries(len(positive_cluster[i]), current_seq_len)\n        positive_timeseries.extend(cur_positive_timeseries)\n        positive_attributes.extend(cur_positive_attributes)\n        positive_idx_list.extend([i] * len(positive_cluster[i]))\n        cluster_points_list.append(cur_positive_points)\n        positive_points_list.extend([cur_positive_points] * len(positive_cluster[i]))\n    negative_timeseries, negative_attributes, negative_different_types, negative_points_list = generate_negative_timeseries(num_negative_items, cluster_points_list[0], current_seq_len)\n    \n    # Shuffle\n    shuffle_indices = np.random.permutation(len(positive_metrics) + num_negative_items)\n    combined_timeseries = positive_timeseries + negative_timeseries\n    combined_attributes = positive_attributes + negative_attributes\n    combined_metrics = positive_metrics + negative_metrics\n    combined_different_types = [None] * len(positive_timeseries) + negative_different_types\n    combined_points = positive_points_list + negative_points_list\n    combined_cluster_idx = positive_idx_list + [None] * num_negative_items\n\n    combined_timeseries = [combined_timeseries[i] for i in shuffle_indices]\n    combined_attributes = [combined_attributes[i] for i in shuffle_indices]\n    combined_metrics = [combined_metrics[i] for i in shuffle_indices]\n    combined_different_types = [combined_different_types[i] for i in shuffle_indices]\n    combined_points = [combined_points[i] for i in shuffle_indices]\n    combined_cluster_idx = [combined_cluster_idx[i] for i in shuffle_indices]\n\n    label = {\n        'timeseries': [i.tolist() for i in combined_timeseries],\n        'label': {\n            'clusters': [],\n            'correlations': [],\n            'cols': combined_metrics,\n            'situation': situation\n        },\n        'attribute_pool': combined_attributes\n    }\n    appended_clusters = set()\n\n    # Generate attribute_pool\n    prompt = f'In a {situation} system, there are {len(shuffle_indices)} metrics:'\n    question_list = []\n    answer_list = []\n    llm_prompt_list = []\n    fields_list = []\n    corr_pool_list = [None] * len(shuffle_indices)\n\n    original_timeseries = copy.deepcopy(combined_timeseries)\n    for i in range(len(shuffle_indices)):\n        # Scalar\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(combined_timeseries[i], ENCODING_METHOD)\n        combined_timeseries[i] = scaled_timeseries\n        \n        # Generate prompt\n        prompt += f\"\\n {combined_metrics[i]} is of length {current_seq_len}: {cur_ts_prompt};\"\n\n        # Generate QAs\n        # (Task 1) Describe the trend of each time series\n        question_list.append(f\"Analyze the trend of {combined_metrics[i]} in detail.\")\n        fields_list.append({'trend': [i]})\n        answer_list.append(generate_trend_prompt(combined_points[i]))\n        llm_prompt_list.append([])\n\n        # (Task 2) Describe the trend of two time series\n        for j in range(len(shuffle_indices)):            \n            if combined_cluster_idx[i] is None and combined_cluster_idx[j] is None:\n                continue\n            if i == j:\n                continue\n            cur_answer = ''\n            if combined_cluster_idx[i] == combined_cluster_idx[j]:\n                # Control the number\n                if random.random() > 0.7:\n                    continue\n                # Similar\n                cur_answer += f\" Both time series are showing similar trends, indicating a possible correlation in terms of trend: \" + generate_trend_prompt(combined_points[i])\n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. We found that the trends in {combined_metrics[i]} and {combined_metrics[j]} are very similar. Please explain why {combined_metrics[i]} and {combined_metrics[j]} have very similar trends in their physical meaning in English in one simle sentence (e.g. both a and b are xxx-related metrics, so xxx). Make sure to keep the sentence simple. \"\n                if metric_to_cluster[combined_metrics[i]] == metric_to_cluster[combined_metrics[j]]:\n                    cur_llm_prompt += f\"(Hint: These two metrics are both {metric_to_cluster[combined_metrics[i]]}-related.)\"\n                llm_prompt_list.append([cur_llm_prompt])\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": True\n                })\n            else:\n                if random.random() > 0.25:\n                    continue\n\n                if combined_cluster_idx[i] is not None:\n                    a, b = i, j\n                else:\n                    a, b = j, i\n                \n                if combined_different_types[b] is None:\n                    cur_answer += f\"{combined_metrics[b]} is totally different from {combined_metrics[a]} in terms of trend. The trend of {combined_metrics[a]} is: \" + generate_trend_prompt(combined_points[a]) + f\" While the trend of {combined_metrics[b]} is: \" + generate_trend_prompt(combined_points[b])\n                else:\n                    cur_answer += f\"{combined_metrics[b]} is different from {combined_metrics[a]} in terms of trend. Although the trend between may be similar in some parts, their trends near point {int(combined_points[b][combined_different_types[b][0]][0])} are different, \"\n                    if combined_different_types[b][1] > 0:\n                        cur_answer += f\"where {combined_metrics[b]} has a higher trend than {combined_metrics[a]}.\"\n                    else:\n                        cur_answer += f\"where {combined_metrics[b]} has a lower trend than {combined_metrics[a]}.\"\n            \n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. We found that the trends in {combined_metrics[i]} and {combined_metrics[j]} are not similar. Please explain why the trends {combined_metrics[i]} and {combined_metrics[j]} are not similar in their physical meaning in English in one simle sentence (e.g. both a and b are xxx-related metrics, so xxx). Make sure to keep the sentence simple. \"\n                llm_prompt_list.append([cur_llm_prompt])\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": False\n                })\n\n            question_list.append(f\"Based on the **trend** characteristics analyze whether there may be a correlation of trend between {combined_metrics[i]} and {combined_metrics[j]}. Conclude the physical meaning of the trend correlation (or no correlation) in one sentence.\")\n            fields_list.append({'trend': [i, j]})\n            cur_answer += f\" <|prompt{all_prompt_idx}|>\"\n            all_prompt_idx += 1\n            answer_list.append(cur_answer)\n        \n        # (Task 3) Find similar time series (cluster)\n        question_list.append(f\"Based on the **trends** in the time series, please find time series (including itself) that may be related to {combined_metrics[i]}, output their numbers, and explain the reasons. If related metrics are found, explain why they have similar trends considering their physical meaning in one sentence. If no related time series are found, output that no related time series were found.\")\n        if combined_cluster_idx[i] is None:\n            cur_answer = f\"Among these time series, I did not find any other time series that may be related to {combined_metrics[i]} in terms of trend.\"\n            llm_prompt_list.append([])\n            fields_list.append({'trend': [i]})\n        else:\n            cur_answer = f\"Among these time series, \" + \", \".join([combined_metrics[j] for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]]) + f\" may be related to {combined_metrics[i]} in terms of trend. All the time series have similar trends: \" + generate_trend_prompt(combined_points[i])\n            fields_list.append({'trend': [j for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]]})\n\n            if combined_cluster_idx[i] not in appended_clusters:\n                label[\"label\"][\"clusters\"].append({\n                    'col_idx': [int(j) for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]],\n                    'cols': [combined_metrics[j] for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]],\n                    'explain': f\"<|prompt{all_prompt_idx}|>\",\n                })\n                appended_clusters.add(combined_cluster_idx[i])\n\n            corr_pool_list[i] = [[j for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]], cur_answer + f\" <|prompt{all_prompt_idx}|>\"]\n            cur_answer += f' <|prompt{all_prompt_idx}|>'\n            all_prompt_idx += 1\n            llm_prompt_list.append([f\"In a {situation} system, there are many monitoring metrics. We found the overall trends in \" + ', '.join([combined_metrics[j] for j in range(len(shuffle_indices)) if combined_cluster_idx[i] == combined_cluster_idx[j]]) + f\" are very similar. Please explain their relationship in physical meaning and simply describe why they can be similar in English in 1 sentence, like `these metrics are all xxx-related or xxx.` (the format may be different, but keep simple): \"])\n        answer_list.append(cur_answer)\n    \n    return original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list, label\n\ndef generate_dataset():\n    result = []\n    prompts = []\n    labels = []\n    with tqdm(total=NUM_DATA, desc='Generating prompt...') as t:\n        cnt = 0\n        while True:\n            try:\n                original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list, label = generate_prompt_data(SEQ_LEN)\n            except ValueError as err:\n                continue\n            except IndexError as err:\n                continue\n            result.append((original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list))\n            labels.append(label)\n            for item in llm_prompt_list:\n                prompts.extend(item)\n                t.update()\n                cnt += 1\n            if cnt >= NUM_DATA:\n                break\n\n    # Use LLM to generate answer\n    print(f'Generated {len(result)} data items, with {len(prompts)} prompts. {all_prompt_idx=}')\n\n    if DRYRUN:\n        llm_answers = ['This is a test answer.'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm')\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    idx = 0\n    for original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list in result:\n        for i in range(len(question_list)):\n            for j in range(len(llm_prompt_list[i])):\n                answer_list[i] = answer_list[i].replace(f'<|prompt{idx}|>', llm_answers[idx])\n                idx += 1\n        for i in range(len(corr_pool_list)):\n            if corr_pool_list[i] is not None:\n                corr_pool_list[i][1] = replace_prompts(llm_answers, corr_pool_list[i][1])\n\n    # Replace <|prompti|> with llm_answers in label\n    labels = replace_prompts(llm_answers, labels)\n\n    return result, labels\n\nif __name__ == '__main__':\n    print('Generating...')\n    result, cluster_labels = generate_dataset()\n    evol_labels = []\n\n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(EVOL_LABEL_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(CLUSTER_LABEL_PATH), exist_ok=True)\n\n    with open(OUTPUT_PATH, 'wt') as f:\n        for ts_idx, (original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool) in enumerate(result):\n            for i in range(len(question_list)):\n                result = {\n                    'input': prompt[:-1] + '. ' + question_list[i],\n                    'output': answer_list[i],\n                    'timeseries': timeseries_to_list(combined_timeseries),\n                }\n                cur_label = {\n                    \"fields\": fields_list[i],\n                    \"metrics\": combined_metrics,\n                    \"corr_pool\": corr_pool,\n                    \"attribute_pool\": combined_attributes,\n                    \"instruction\": prompt,\n                    \"question\": question_list[i],\n                    \"ts_idx\": ts_idx\n                }\n\n                f.write(json.dumps(result, ensure_ascii=False) + '\\n')\n                evol_labels.append(cur_label)\n\n    with open(CLUSTER_LABEL_PATH, 'wt') as f:\n        json.dump(cluster_labels, f, ensure_ascii=False, indent=4)\n    with open(EVOL_LABEL_PATH, 'wt') as f:\n        json.dump(evol_labels, f, ensure_ascii=False, indent=4)\n", "blocks": []}, {"path": "chatts/align/mts_shape_template_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series\nfrom chatts.ts_generator.trend_utils import generate_random_points, generate_trend_prompt, generate_trend_curve\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom tqdm import tqdm\nimport yaml\nimport json\nimport copy\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_template_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/mts_shape_template_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\n\n\n# All Config for TS Features\nall_config = {\n    \"overall_attribute\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 0.9,\n            \"periodic fluctuation\": 0.1\n        },\n        \"trend\": {\n            \"keep steady\": 0.6\n        },\n        \"frequency\": {\n            \"high frequency\": 0.5,\n            \"low frequency\": 0.5\n        },\n        \"noise\": {\n            \"noisy\": 0.1,\n            \"almost no noise\": 0.9\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 10,\n        \"downward spike\": 6,\n        \"continuous upward spike\": 4,\n        \"continuous downward spike\": 2,\n        \"wide upward spike\": 3,\n        \"wide downward spike\": 3\n    }\n}\n\n\ndef generate_positive_timeseries(cnt: int, seq_len: int = 256) -> Tuple[List[np.ndarray], List[dict], List[Tuple[int, float]]]:\n    timeseries = []\n    attributes = []\n\n    points, curve_type = generate_random_points(seq_len)\n\n    for _ in range(cnt):\n        if random.random() > 0.8:\n            changes = {(None, None)}\n        else:\n            changes = {}\n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n\n        # Add some changes to points\n        for i in range(len(points)):\n            new_x = min(max(0, points[i][0] + random.randint(-5, 5)), seq_len - 1)\n            new_y = points[i][1] + random.uniform(-0.05, 0.05) * (max([point[1] for point in points]) - min([point[1] for point in points]))\n            points[i] = (new_x, new_y)\n\n        # Generate trend\n        curve_x, curve_y, curve_type = generate_trend_curve(seq_len, points)\n        if curve_y.max() - curve_y.min() > 1e-3:\n            ts += curve_y / (curve_y.max() - curve_y.min()) * attribute_pool['overall_amplitude'] * random.uniform(3.0, 15.0)\n\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, points\n\n\ndef generate_negative_timeseries(cnt: int, positive_points: List[Tuple[int, float]], seq_len: int = 256) -> Tuple[List[np.ndarray], List[dict], List[Optional[Tuple[int, float]]], List[List[Tuple[int, float]]]]:\n    timeseries = []\n    attributes = []\n    different_type = []\n    result_points = []\n\n    for _ in range(cnt):\n        if random.random() > 0.8:\n            changes = {(None, None)}\n        else:\n            changes = {}\n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n\n        if random.random() > 0.7 or len(positive_points) <= 3:\n            # Type 1: Totally different\n            points, curve_type = generate_random_points(seq_len)\n            different_type.append(None)\n        else:\n            # Type 2: Change one point in positive_points\n            points = copy.deepcopy(positive_points)\n            i = random.choice(range(len(points)))\n            new_x = min(max(0, points[i][0] + random.randint(-5, 5)), seq_len - 1)\n            diff = random.choice([-1, 1]) * random.uniform(0.5, 1.0) * (max([point[1] for point in points]) - min([point[1] for point in points]))\n            new_y = points[i][1] + diff\n            points[i] = (new_x, new_y)\n            different_type.append((i, float(diff)))\n\n        # Generate trend\n        curve_x, curve_y, curve_type = generate_trend_curve(seq_len, points)\n        result_points.append(points)\n\n        # Add to ts\n        if curve_y.max() - curve_y.min() > 1e-3:\n            ts += curve_y / (curve_y.max() - curve_y.min()) * attribute_pool['overall_amplitude'] * random.uniform(3.0, 15.0)\n\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, different_type, result_points\n\n\ndef generate_trend_naive_mts(seq_len: Optional[int]=256):\n    if SEQ_LEN is None:\n        if random.random() > 0.4:\n            current_seq_len = 256\n        else:\n            current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Number of generated items\n    num_positive_items = random.randint(2, 4)\n    num_negative_items = random.randint(0, 5)\n    \n    # Generate time series\n    positive_timeseries, positive_attributes, positive_points = generate_positive_timeseries(num_positive_items, current_seq_len)\n    negative_timeseries, negative_attributes, negative_different_types, negative_points_list = generate_negative_timeseries(num_negative_items, positive_points, current_seq_len)\n    \n    # Shuffle\n    shuffle_indices = np.random.permutation(num_positive_items + num_negative_items)\n    combined_timeseries = positive_timeseries + negative_timeseries\n    combined_attributes = positive_attributes + negative_attributes\n    combined_different_types = [None] * len(positive_timeseries) + negative_different_types\n    combined_points = [positive_points] * len(positive_attributes) + negative_points_list\n    combined_timeseries = [combined_timeseries[i] for i in shuffle_indices]\n    combined_attributes = [combined_attributes[i] for i in shuffle_indices]\n    combined_different_types = [combined_different_types[i] for i in shuffle_indices]\n    combined_points = [combined_points[i] for i in shuffle_indices]\n    shuffle_argsort = np.argsort(shuffle_indices)\n    positive_indices, negative_indices = shuffle_argsort[:num_positive_items], shuffle_argsort[num_positive_items:num_positive_items + num_negative_items]\n\n    # Generate attribute_pool\n    prompt = f'There are {len(shuffle_indices)} time series:'\n    question_list = []\n    answer_list = []\n    original_timeseries = copy.deepcopy(combined_timeseries)\n    for i in range(len(shuffle_indices)):\n        # Scalar\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(combined_timeseries[i], ENCODING_METHOD)\n        combined_timeseries[i] = scaled_timeseries\n        \n        # Generate prompt\n        prompt += f\" Time series {i+1} is of length {current_seq_len}: {cur_ts_prompt};\"\n\n        # Generate QAs\n        # (Task 1) Describe the trend of each time series\n        question_list.append(f\"Analyze the trend of time series {i+1} in detail.\")\n        answer_list.append(generate_trend_prompt(combined_points[i]))\n\n        # (Task 2) Describe the trend of two time series\n        for j in range(len(shuffle_indices)):\n            # Control the number\n            if random.random() > 0.6:\n                continue\n            if i not in positive_indices and j not in positive_indices:\n                continue\n            if i == j:\n                continue\n            question_list.append(f\"Based on the **trend** characteristics analyze whether there may be a correlation of trend between time series {i+1} and time series {j+1}.\")\n            cur_answer = ''\n            if i in positive_indices and j in positive_indices:\n                # Similar\n                cur_answer += f\" Both time series are showing similar trends, indicating a possible correlation in terms of trend: \" + generate_trend_prompt(combined_points[i])\n            else:\n                if i in positive_indices:\n                    if combined_different_types[j] is None:\n                        cur_answer += f\"Time series {j+1} is totally different from time series {i+1} in terms of trend. The trend of time series {i+1} is: \" + generate_trend_prompt(combined_points[i]) + f\". While the trend of time series {j+1} is: \" + generate_trend_prompt(combined_points[j])\n                    else:\n                        cur_answer += f\"Time series {j+1} is different from time series {i+1} in terms of trend. Although the trend between may be similar in some parts, their trends near point {int(combined_points[j][combined_different_types[j][0]][0])} are different, \"\n                        if combined_different_types[j][1] > 0:\n                            cur_answer += f\"where time series {j+1} has a higher trend than time series {i+1}.\"\n                        else:\n                            cur_answer += f\"where time series {j+1} has a lower trend than time series {i+1}.\"\n                else:\n                    if combined_different_types[i] is None:\n                        cur_answer += f\"Time series {j+1} is totally different from time series {i+1} in terms of trend. The trend of time series {i+1} is: \" + generate_trend_prompt(combined_points[i]) + f\". While the trend of time series {j+1} is: \" + generate_trend_prompt(positive_points)\n                    else:\n                        cur_answer += f\"Time series {j+1} is different from time series {i+1} in terms of trend. Although the trend between may be similar in some parts, their trends near point {int(combined_points[i][combined_different_types[i][0]][0])} are different, \"\n                        if combined_different_types[i][1] > 0:\n                            cur_answer += f\"where time series {i+1} has a higher trend than time series {j+1}.\"\n                        else:\n                            cur_answer += f\"where time series {i+1} has a lower trend than time series {j+1}.\"\n            answer_list.append(cur_answer)\n        \n    return original_timeseries, combined_timeseries, combined_attributes, prompt, question_list, answer_list\n\n\nif __name__ == \"__main__\":\n    print('Generating...')\n    \n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    with open(OUTPUT_PATH, 'wt') as f:\n        with tqdm(total=NUM_DATA, desc='Generating') as t:\n            cnt = 0\n            while True:\n                try:\n                    original_timeseries, combined_timeseries, combined_attributes, prompt, question_list, answer_list = generate_trend_naive_mts(SEQ_LEN)\n                except ValueError as err:\n                    continue\n                except IndexError as err:\n                    continue\n                for i in range(len(question_list)):\n                    result = {\n                        'input': prompt[:-1] + '. ' + question_list[i],\n                        'output': answer_list[i],\n                        'timeseries': timeseries_to_list(combined_timeseries),\n                        # 'original_timeseries': [ts.tolist() for ts in original_timeseries]\n                    }\n                    f.write(json.dumps(result, ensure_ascii=False) + '\\n')\n                    t.update()\n                    cnt += 1\n                if cnt >= NUM_DATA:\n                    break\n", "blocks": []}, {"path": "chatts/align/uts_llm_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_time_series, generate_controlled_attributes, attribute_to_text, generate_random_attributes, all_attribute_set\nfrom chatts.utils.llm_utils import LLMClient\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nimport yaml\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/uts_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\nLABEL_PATH = f'{OUTPUT_BASE_DIR}/labels/uts_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nEVOL_LABEL_PATH = f'{OUTPUT_BASE_DIR}/evol_labels/uts_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDISABLE_EXTREME_LENGTHS = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_extreme_lengths\"]\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"dryrun\"]\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_llm_path\"]\n\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\nall_prompt_idx = 0\n\n\ndef replace_prompts(data, obj):\n    pattern = re.compile(r\"<\\|prompt(\\d+)\\|>\")\n    if isinstance(obj, dict):\n        return {k: replace_prompts(data, v) for k, v in obj.items()}\n    elif isinstance(obj, list):\n        return [replace_prompts(data, item) for item in obj]\n    elif isinstance(obj, str):\n        def repl(m): return data[int(m.group(1))]\n        return pattern.sub(repl, obj)\n    else:\n        return obj\n\n\ndef generate_prompt_data():\n    global all_prompt_idx\n    # Determine sequence length\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        elif p > 0.1 or DISABLE_EXTREME_LENGTHS:\n            current_seq_len = random.randint(64, 1024)\n        elif p > 0.05:\n            current_seq_len = random.randint(5, 64)\n        else:\n            current_seq_len = random.randint(1024, 4096)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Randomly pick category and metric\n    sample = random.choice(list(metric_config))\n    category = sample['category']\n    metric = random.choice(sample['metrics'])\n\n    # Generate attribute_pool and time series\n    if DISABLE_METRIC_CONFIG:\n        attribute_pool = generate_random_attributes(all_attribute_set['overall_attribute'], all_attribute_set['change'], seq_len=current_seq_len)\n    else:\n        attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n\n    attribute_pool['metric_name'] = metric\n    attribute_pool['situation'] = category\n\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Encode series\n    scaled_ts, ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    instruction = (\n        f\"You are a time series analysis expert. This is a metric called {metric}\"\n        f\" collected from {category} with length of {current_seq_len}: {ts_prompt}.\"\n    )\n    questions, answers, prompts, fields = [], [], [], []\n\n    # Step 1: periodicity\n    questions.append(\n        \"Now, please analyze the characteristics of this metric from the perspectives of periodicity,\"\n        \" and conclude the physical meaning of the periodicity in one sentence.\"\n    )\n    fields.append({'seasonal': [0]})\n    answers.append(\n        attribute_to_text(timeseries, attribute_pool, generate_values=False,\n                             include_attributes=['periodicity', 'frequency'])\n        + f'<|prompt{all_prompt_idx}|>'\n    )\n    prompts.append([\n        f\"There is a metric called {metric} collected from {category} with length of {current_seq_len}. \"\n        \"The periodicity of this metric is as follow: \"\n        + attribute_to_text(timeseries, attribute_pool, generate_values=False,\n                              include_attributes=['periodicity'])\n        + \" Please analyze the physical meaning of this kind of periodicity in one sentence (xxx indicates that xxx):\"\n    ])\n    all_prompt_idx += 1\n\n    # Step 2: trend\n    questions.append(\n        \"Now, please analyze the characteristics of this metric from the perspectives of trend,\"\n        \" and conclude the physical meaning of the trend in one sentence.\"\n    )\n    fields.append({'trend': [0]})\n    answers.append(\n        attribute_to_text(timeseries, attribute_pool, generate_values=False,\n                             include_attributes=['trend'])\n        + f'<|prompt{all_prompt_idx}|>'\n    )\n    prompts.append([\n        f\"There is a metric called {metric} collected from {category} with length of {current_seq_len}. \"\n        f\"The trend of this metric is {attribute_pool['trend']['type']}. \"\n        \"Please analyze the physical meaning of this kind of trend in one sentence.\"\n    ])\n    all_prompt_idx += 1\n\n    # Step 3: local fluctuations\n    if attribute_pool.get('local'):\n        questions.append(\n            \"Now, please analyze the characteristics of this metric from the perspectives of local fluctuations, and conclude the physical meaning of each in one sentence. Answer format: shake, position around point 125, amplitude 135.03. A sudden surge in public interest, likely due to significant news, a major event, or a trending topic related to the platform that rapidly captured user attention; small sudden decrease, position around point 102, amplitude 31.05. A slight increase in interest, possibly driven by minor news, promotions, or social media discussions that briefly captured attention without indicating a significant trend.\"\n        )\n        fields.append({'local': [0]})\n        # combine multiple local explanations\n        local_texts = []\n        for local_char in attribute_pool['local']:\n            local_texts.append(\n                f\"{local_char['type']}, position around point {local_char['position_start']},\"\n                f\" amplitude {local_char['amplitude']:.2f}. <|prompt{all_prompt_idx}|>\"\n            )\n            all_prompt_idx += 1\n        answers.append(';'.join(local_texts))\n\n        # build individual prompts\n        local_prompts = []\n        for local_char in attribute_pool['local']:\n            local_prompts.append(\n                f\"There is a metric called {metric} collected from {category} with length of {current_seq_len}. \"\n                f\"A local fluctuation of this metric is found. The type is {local_char['type']}. \"\n                \"Please analyze the physical meaning of this fluctuation in one sentence (keep it simple, just output the physical meaning itself, do not output any description words like `the fluctuation of this metric`. Output Example: indicates that there are many computational extensive programs using CPU):\"\n            )\n        prompts.append(local_prompts)\n\n    # Compile results\n    result = []\n    for q, a, p, f in zip(questions, answers, prompts, fields):\n        result.append({\n            'instruction': instruction,\n            'question': q,\n            'answer': a,\n            'fields': f,\n            'prompt': p,\n            'timeseries': [scaled_ts],\n            'original_timeseries': [timeseries],\n            'metrics': [metric],\n            'attribute_pool': [attribute_pool],\n            'corr_pool': []  # no correlation in single-var dataset\n        })\n    return result\n\n\ndef generate_dataset():\n    result, prompts = [], []\n    with tqdm(total=NUM_DATA, desc='Generating prompt...') as t:\n        cnt = 0\n        while cnt < NUM_DATA:\n            try:\n                items = generate_prompt_data()\n            except (ValueError, IndexError):\n                continue\n            for item in items:\n                item['ts_idx'] = len(result)\n                result.append(item)\n                prompts.extend(item['prompt'])\n                cnt += 1\n                t.update()\n\n    if DRYRUN:\n        llm_answers = ['This is a test answer.'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm')\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    # Replace placeholder tokens with LLM outputs\n    idx = 0\n    for item in result:\n        for _ in item['prompt']:\n            item['answer'] = item['answer'].replace(f'<|prompt{idx}|>', llm_answers[idx])\n            idx += 1\n\n    # Build labels matching original format\n    labels_out, evol_labels_out = [], []\n\n    for item in result:\n        evol_labels_out.append({\n            'fields': item['fields'],\n            'metrics': item['metrics'],\n            'corr_pool': item['corr_pool'],\n            'attribute_pool': item['attribute_pool'],\n            'instruction': item['instruction'],\n            'question': item['question'],\n            'ts_idx': item['ts_idx'],\n        })\n        \n        labels_out.append({\n            'label': item['attribute_pool'][0],\n            'ts_idx': item['ts_idx'],\n            'timeseries': timeseries_to_list(item['original_timeseries'][0]),\n        })\n    return result, evol_labels_out, labels_out\n\n\nif __name__ == '__main__':\n    result, evol_labels, labels = generate_dataset()\n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(EVOL_LABEL_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(LABEL_PATH), exist_ok=True)\n    with open(OUTPUT_PATH, 'wt') as f:\n        for item in result:\n            out = {\n                'input': item['instruction'].rstrip('.') + '. ' + item['question'],\n                'output': item['answer'],\n                'timeseries': timeseries_to_list(item['timeseries']),\n                'ts_idx': item['ts_idx'],\n                'fields': item['fields']\n            }\n            f.write(json.dumps(out, ensure_ascii=False) + '\\n')\n    with open(EVOL_LABEL_PATH, 'wt') as f:\n        json.dump(evol_labels, f, ensure_ascii=False, indent=4)\n    with open(LABEL_PATH, 'wt') as f:\n        json.dump(labels, f, ensure_ascii=False, indent=4)\n", "blocks": []}, {"path": "chatts/align/uts_template_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nimport copy\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series, attribute_to_text, all_attribute_set\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nimport yaml\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_template_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/uts_template_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\nDISABLE_EXTREME_LENGTHS = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_extreme_lengths\"]\n\n\ndef clamp_raw_point(point: int, seq_len: int) -> int:\n    return max(0, min(int(point), seq_len - 1))\n\n\ndef attribute_pool_to_json(attribute_pool: dict) -> str:\n    result = copy.deepcopy(attribute_pool)\n    for i in range(len(result['local'])):\n        result[\"local\"][i]['amplitude'] = round(result[\"local\"][i]['amplitude'], 2)\n    if 'overall_amplitude' in result:\n        del result['overall_amplitude']\n    if 'overall_bias' in result:\n        del result['overall_bias']\n    if 'statistics' in result:\n        del result['statistics']\n    if 'trend_list' in result.get('trend', {}):\n        del result['trend']['trend_list']\n    return json.dumps(result, ensure_ascii=False)\n\ndef generate_single_dataset():\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        elif p > 0.1 or DISABLE_EXTREME_LENGTHS:\n            current_seq_len = random.randint(64, 1024)\n        elif p > 0.05:\n            current_seq_len = random.randint(5, 64)\n        else:\n            current_seq_len = random.randint(1024, 4096)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Choose a metric and generate\n    attribute_pool = generate_random_attributes(all_attribute_set['overall_attribute'], all_attribute_set['change'], seq_len=current_seq_len)\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Scalar\n    scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    # Generate QA\n    instruction = f\"There is a time series of length {current_seq_len}: {cur_ts_prompt}.\"\n    questions, answers = [], []\n    # (Step 1) general shape\n    questions.append(\"Now, please analyze the characteristics of this time series from the perspectives of periodicity, trend, local characteristics, frequency characteristics, and noise.\")\n    answers.append(attribute_to_text(timeseries, attribute_pool, generate_values=False))\n\n    # (Step 2) general shape and values\n    questions.append(\"Now, please analyze the characteristics of this time series from the perspectives of periodicity, trend, local characteristics, frequency characteristics, and noise. Also include the approximate mean values for every 16 points, as well as the maximum and minimum values of the time series (rounded to 2 decimal places).\")\n    answers.append(attribute_to_text(timeseries, attribute_pool, generate_values=True))\n\n    # (Step 3) generate the reason of each change\n    for local_char in attribute_pool['local']:\n        question_position = clamp_raw_point(local_char['position_start'] + random.randint(-5, 5), current_seq_len)\n        questions.append(f\"Is there a local characteristic fluctuation starting around point {question_position} in this time series?\")\n        answers.append(f\"Yes, this time series \" + local_char['detail'])\n\n    # (Step 4) randomly generate a non-change point and ask it\n    all_change_positions = [local_char['position_start'] for local_char in attribute_pool['local']]\n    for _ in range(3):\n        point = random.randint(0, current_seq_len - 1)\n        if all([abs(point - i) >= 50 for i in all_change_positions]):\n            questions.append(f\"Is there a local characteristic fluctuation starting around point {point} in this time series?\")\n            answers.append(f\"I did not find any local characteristic fluctuation starting around point {point} in this time series.\")\n\n    # (Step 5) Jsonize\n    questions.append(\"Please output the characteristics of the current time series in JSON format, including periodicity, trend, local characteristics, frequency characteristics, and noise fields.\")\n    answers.append(attribute_pool_to_json(attribute_pool))\n\n    # Generate final result\n    result = []\n    for q, a in zip(questions, answers):\n        result.append({\n            'instruction': instruction,\n            'question': q,\n            'answer': a,\n            'timeseries': [scaled_timeseries],\n            'original_timeseries': [timeseries]\n        })\n\n    return result\n\n\nif __name__ == '__main__':\n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    with open(OUTPUT_PATH, 'wt') as f:\n        with tqdm(total=NUM_DATA, desc='Generating') as t:\n            cnt = 0\n            while True:\n                try:\n                    result = generate_single_dataset()\n                except ValueError as err:\n                    continue\n                except IndexError as err:\n                    continue\n                for item in result:\n                    item = {\n                        'input': item['instruction'][:-1] + '. ' + item['question'],\n                        'output': item['answer'],\n                        'timeseries': timeseries_to_list(item['timeseries']),\n                        # 'original_timeseries': [i.tolist() for i in item['original_timeseries']]\n                    }\n                    f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n                    t.update()\n                    cnt += 1\n                if cnt >= NUM_DATA:\n                    break\n", "blocks": [{"start": 1, "end": 13, "summary_zh": "声明源码版权及 MIT 许可证的使用、分发与免责条件。", "summary_en": "Declare the copyright and MIT license terms for use, distribution, and disclaimer.", "lines": [{"n": 1, "zh": "版权声明：2025 年清华大学与字节跳动。", "en": "Copyright notice: 2025 Tsinghua University and ByteDance."}, {"n": 2, "zh": "许可证声明中的空注释行，不携带额外条款。", "en": "Blank comment line within the license notice, carrying no additional term."}, {"n": 3, "zh": "声明源码依据 MIT 许可证授权。", "en": "State that the source is licensed under the MIT License."}, {"n": 4, "zh": "限制：不遵守许可证 → 不得使用本文件。", "en": "Restriction: without complying with the license → this file may not be used."}, {"n": 5, "zh": "指出可从下列地址获取许可证副本。", "en": "State that a copy of the license is available at the following address."}, {"n": 6, "zh": "许可证文本中的空注释行，用于分隔链接。", "en": "Blank comment line in the license text, separating the link."}, {"n": 7, "zh": "给出 MIT 许可证网址 `https://opensource.org/license/mit`。", "en": "Give the MIT license URL `https://opensource.org/license/mit`."}, {"n": 8, "zh": "许可证文本中的空注释行，分隔授权与免责说明。", "en": "Blank comment line in the license text, separating licensing from the disclaimer."}, {"n": 9, "zh": "说明除非适用法律要求或另有书面约定，否则适用下述免责条款。", "en": "State that the following disclaimer applies unless required by law or agreed in writing."}, {"n": 10, "zh": "声明软件按“原样”分发。", "en": "State that the software is distributed on an “AS IS” basis."}, {"n": 11, "zh": "声明不附带任何明示或默示的保证或条件。", "en": "State that no warranties or conditions, express or implied, are provided."}, {"n": 12, "zh": "引导读者查阅许可证，了解具体权限。", "en": "Direct the reader to the license for the specific permissions."}, {"n": 13, "zh": "引导读者查阅许可证，了解具体限制。", "en": "Direct the reader to the license for the specific limitations."}]}, {"start": 14, "end": 25, "summary_zh": "导入序列生成、编码、进度显示及配置处理所需的模块。", "summary_en": "Import modules for series generation, encoding, progress display, and configuration handling.", "lines": [{"n": 15, "zh": "导入 `numpy` 并命名为 `np`。", "en": "Import `numpy` as `np`."}, {"n": 16, "zh": "导入随机数模块 `random`。", "en": "Import the `random` module."}, {"n": 17, "zh": "从 `tqdm` 导入进度条类 `tqdm`。", "en": "Import the `tqdm` progress-bar class from `tqdm`."}, {"n": 18, "zh": "导入正则表达式模块 `re`。", "en": "Import the regular-expression module `re`."}, {"n": 19, "zh": "导入 JSON 编解码模块 `json`。", "en": "Import the JSON encoding and decoding module `json`."}, {"n": 20, "zh": "导入对象复制模块 `copy`。", "en": "Import the object-copying module `copy`."}, {"n": 21, "zh": "从 `typing` 通配导入全部类型标注名称。", "en": "Wildcard-import all type-annotation names from `typing`."}, {"n": 22, "zh": "导入随机属性生成、序列生成、属性转文本函数及全局属性集合。", "en": "Import random-attribute generation, series generation, attribute-to-text functions, and the global attribute set."}, {"n": 23, "zh": "导入时间序列编码函数 `timeseries_encoding` 与列表转换函数 `timeseries_to_list`。", "en": "Import `timeseries_encoding` for series encoding and `timeseries_to_list` for list conversion."}, {"n": 24, "zh": "导入 YAML 解析模块 `yaml`。", "en": "Import the YAML parsing module `yaml`."}, {"n": 25, "zh": "导入操作系统接口模块 `os`。", "en": "Import the operating-system interface module `os`."}]}, {"start": 26, "end": 35, "summary_zh": "从数据生成配置读取样本规模、序列长度、编码与输出参数。", "summary_en": "Read sample count, sequence length, encoding, and output settings from the data-generation config.", "lines": [{"n": 28, "zh": "标注全局配置区。", "en": "Mark the global configuration section."}, {"n": 29, "zh": "读取 `config/datagen_config.yaml` 的 `num_data_template_qa` → `NUM_DATA`。", "en": "Read `num_data_template_qa` from `config/datagen_config.yaml` → `NUM_DATA`."}, {"n": 30, "zh": "读取配置的 `seq_len` → `SEQ_LEN`；注释说明设为 `None` 可启用随机长度。", "en": "Read configured `seq_len` → `SEQ_LEN`; the comment says `None` enables random lengths."}, {"n": 31, "zh": "读取配置的 `encoding_method` → `ENCODING_METHOD`。", "en": "Read configured `encoding_method` → `ENCODING_METHOD`."}, {"n": 32, "zh": "读取配置的 `data_output_dir` → `OUTPUT_BASE_DIR`。", "en": "Read configured `data_output_dir` → `OUTPUT_BASE_DIR`."}, {"n": 33, "zh": "拼接输出目录、长度、样本数与编码方式 → JSONL 文件路径 `OUTPUT_PATH`。", "en": "Combine output directory, length, sample count, and encoding method → JSONL path `OUTPUT_PATH`."}, {"n": 34, "zh": "读取配置的 `disable_extreme_lengths` → `DISABLE_EXTREME_LENGTHS`。", "en": "Read configured `disable_extreme_lengths` → `DISABLE_EXTREME_LENGTHS`."}]}, {"start": 36, "end": 39, "summary_zh": "将原始位置转换为整数并限制在有效序列下标范围内。", "summary_en": "Convert a raw position to an integer and clamp it to the valid sequence-index range.", "lines": [{"n": 37, "zh": "定义 `clamp_raw_point(point, seq_len)`，返回整数位置。", "en": "Define `clamp_raw_point(point, seq_len)` to return an integer position."}, {"n": 38, "zh": "返回 `int(point)` 被限制在 `[0, seq_len - 1]` 内的值。", "en": "Return `int(point)` clamped to `[0, seq_len - 1]`."}]}, {"start": 40, "end": 54, "summary_zh": "清理属性池中的内部字段并序列化为保留中文的 JSON。", "summary_en": "Remove internal fields from the attribute pool and serialize it as non-ASCII-preserving JSON.", "lines": [{"n": 41, "zh": "定义 `attribute_pool_to_json(attribute_pool)`，返回 JSON 字符串。", "en": "Define `attribute_pool_to_json(attribute_pool)` to return a JSON string."}, {"n": 42, "zh": "深拷贝 `attribute_pool` → `result` → 因为后续删改不应影响原属性池。", "en": "Deep-copy `attribute_pool` → `result` → because later edits must not affect the original pool."}, {"n": 43, "zh": "循环 `i` 从 `0` 到 `len(result['local']) - 1`。", "en": "Loop `i` from `0` through `len(result['local']) - 1`."}, {"n": 44, "zh": "将第 `i` 个局部特征的 `amplitude` 四舍五入到两位小数。", "en": "Round the `amplitude` of local feature `i` to two decimal places."}, {"n": 45, "zh": "若 `result` 含 `overall_amplitude` → 进入删除分支。", "en": "If `result` contains `overall_amplitude` → enter the deletion branch."}, {"n": 46, "zh": "删除内部字段 `overall_amplitude`。", "en": "Delete the internal `overall_amplitude` field."}, {"n": 47, "zh": "若 `result` 含 `overall_bias` → 进入删除分支。", "en": "If `result` contains `overall_bias` → enter the deletion branch."}, {"n": 48, "zh": "删除内部字段 `overall_bias`。", "en": "Delete the internal `overall_bias` field."}, {"n": 49, "zh": "若 `result` 含 `statistics` → 进入删除分支。", "en": "If `result` contains `statistics` → enter the deletion branch."}, {"n": 50, "zh": "删除统计字段 `statistics`。", "en": "Delete the `statistics` field."}, {"n": 51, "zh": "若 `result['trend']` 含 `trend_list` → 进入删除分支；趋势缺省时用 `{}`。", "en": "If `result['trend']` contains `trend_list` → enter the deletion branch; use `{}` when trend is absent."}, {"n": 52, "zh": "删除内部趋势分段 `trend['trend_list']`。", "en": "Delete the internal trend segmentation `trend['trend_list']`."}, {"n": 53, "zh": "将 `result` 序列化为 JSON 并返回；`ensure_ascii=False` 保留非 ASCII 字符。", "en": "Serialize and return `result` as JSON; `ensure_ascii=False` preserves non-ASCII characters."}]}, {"start": 55, "end": 67, "summary_zh": "按配置选择固定长度，或按概率采样常规及极端序列长度。", "summary_en": "Choose the configured fixed length or sample regular and extreme sequence lengths by probability.", "lines": [{"n": 55, "zh": "定义 `generate_single_dataset()`，生成一个样本对应的多组问答。", "en": "Define `generate_single_dataset()` to generate multiple QA pairs for one sample."}, {"n": 56, "zh": "若 `SEQ_LEN is None` → 随机选择当前序列长度。", "en": "If `SEQ_LEN is None` → choose the current sequence length randomly."}, {"n": 57, "zh": "采样 `[0, 1)` 均匀随机数 → `p`。", "en": "Sample a uniform random number in `[0, 1)` → `p`."}, {"n": 58, "zh": "若 `p > 0.4` → 采用固定长度分支。", "en": "If `p > 0.4` → take the fixed-length branch."}, {"n": 59, "zh": "`current_seq_len` 设为 `256`。", "en": "Set `current_seq_len` to `256`."}, {"n": 60, "zh": "否则若 `p > 0.1` 或禁用极端长度 → 采用常规随机长度分支。", "en": "Else if `p > 0.1` or extreme lengths are disabled → take the regular random-length branch."}, {"n": 61, "zh": "从 `[64, 1024]` 含端点随机取整数 → `current_seq_len`。", "en": "Sample an inclusive random integer from `[64, 1024]` → `current_seq_len`."}, {"n": 62, "zh": "否则若 `p > 0.05` → 采用短序列分支。", "en": "Else if `p > 0.05` → take the short-sequence branch."}, {"n": 63, "zh": "从 `[5, 64]` 含端点随机取整数 → `current_seq_len`。", "en": "Sample an inclusive random integer from `[5, 64]` → `current_seq_len`."}, {"n": 64, "zh": "否则 → 采用长序列分支。", "en": "Otherwise → take the long-sequence branch."}, {"n": 65, "zh": "从 `[1024, 4096]` 含端点随机取整数 → `current_seq_len`。", "en": "Sample an inclusive random integer from `[1024, 4096]` → `current_seq_len`."}, {"n": 66, "zh": "否则，即 `SEQ_LEN` 非 `None` → 使用配置长度。", "en": "Otherwise, meaning `SEQ_LEN` is not `None` → use the configured length."}, {"n": 67, "zh": "将 `SEQ_LEN` 赋给 `current_seq_len`。", "en": "Assign `SEQ_LEN` to `current_seq_len`."}]}, {"start": 68, "end": 75, "summary_zh": "随机生成序列属性与数值，再按配置编码时间序列。", "summary_en": "Randomly generate series attributes and values, then encode the time series as configured.", "lines": [{"n": 69, "zh": "步骤：选择指标属性并生成时间序列。", "en": "Step: choose metric attributes and generate the time series."}, {"n": 70, "zh": "用全局整体属性、变化属性及 `current_seq_len` 随机生成 `attribute_pool`。", "en": "Randomly generate `attribute_pool` from global overall attributes, change attributes, and `current_seq_len`."}, {"n": 71, "zh": "依据属性池生成 `timeseries`，并接收补充数值细节后的新 `attribute_pool`。", "en": "Generate `timeseries` from the attribute pool and receive the new `attribute_pool` enriched with numeric details."}, {"n": 73, "zh": "标注标量时间序列编码步骤。", "en": "Mark the scalar time-series encoding step."}, {"n": 74, "zh": "按 `ENCODING_METHOD` 编码 → 缩放序列 `scaled_timeseries`、提示片段 `cur_ts_prompt`，并丢弃第三项元数据。", "en": "Encode with `ENCODING_METHOD` → `scaled_timeseries` and prompt fragment `cur_ts_prompt`, discarding the third metadata value."}]}, {"start": 76, "end": 85, "summary_zh": "构造公共指令，并生成不含及包含统计值的整体描述问答。", "summary_en": "Build the shared instruction and create overall-description QA pairs without and with statistics.", "lines": [{"n": 76, "zh": "标注开始生成问答。", "en": "Mark the start of QA generation."}, {"n": 77, "zh": "拼接序列长度与 `cur_ts_prompt` → 公共 `instruction`。", "en": "Combine sequence length and `cur_ts_prompt` → shared `instruction`."}, {"n": 78, "zh": "初始化空问题列表 `questions` 与空答案列表 `answers`。", "en": "Initialize empty question list `questions` and empty answer list `answers`."}, {"n": 79, "zh": "步骤 1：生成整体形态描述问答。", "en": "Step 1: generate the overall-shape description QA pair."}, {"n": 80, "zh": "追加问题：从周期性、趋势、局部特征、频率与噪声角度分析序列。", "en": "Append a question asking for analysis of periodicity, trend, local characteristics, frequency, and noise."}, {"n": 81, "zh": "追加 `attribute_to_text(..., generate_values=False)` 生成的整体描述答案，不含统计值。", "en": "Append the overall-description answer from `attribute_to_text(..., generate_values=False)`, excluding statistics."}, {"n": 83, "zh": "步骤 2：生成同时包含整体形态与数值的描述问答。", "en": "Step 2: generate a description QA pair containing both overall shape and values."}, {"n": 84, "zh": "追加问题：分析相同属性，并给出每 16 点近似均值及保留两位小数的最大、最小值。", "en": "Append a question requesting the same attributes plus approximate means per 16 points and maximum/minimum values rounded to two decimals."}, {"n": 85, "zh": "追加 `attribute_to_text(..., generate_values=True)` 生成的答案，包含统计值。", "en": "Append the answer from `attribute_to_text(..., generate_values=True)`, including statistics."}]}, {"start": 86, "end": 92, "summary_zh": "逐个局部变化构造带位置扰动的确认问题及肯定答案。", "summary_en": "Build confirmation questions with perturbed positions and affirmative answers for each local change.", "lines": [{"n": 87, "zh": "步骤 3：为每个局部变化生成原因说明问答。", "en": "Step 3: generate explanatory QA pairs for each local change."}, {"n": 88, "zh": "循环遍历 `attribute_pool['local']` 中的每个 `local_char`。", "en": "Loop over each `local_char` in `attribute_pool['local']`."}, {"n": 89, "zh": "将变化起点加上 `[-5, 5]` 随机偏移并夹到有效范围 → `question_position`。", "en": "Add a random offset in `[-5, 5]` to the change start and clamp it → `question_position`."}, {"n": 90, "zh": "追加问题：询问 `question_position` 附近是否开始出现局部特征波动。", "en": "Append a question asking whether a local characteristic fluctuation starts near `question_position`."}, {"n": 91, "zh": "追加肯定答案：拼接固定前缀与 `local_char['detail']`。", "en": "Append an affirmative answer combining the fixed prefix with `local_char['detail']`."}]}, {"start": 93, "end": 103, "summary_zh": "采样远离变化点的反例问答，并追加属性 JSON 输出问答。", "summary_en": "Sample negative QA examples far from change points and append an attribute-JSON output QA pair.", "lines": [{"n": 93, "zh": "步骤 4：随机选取非变化点并提问。", "en": "Step 4: randomly select non-change points and ask about them."}, {"n": 94, "zh": "提取所有局部特征的 `position_start` → `all_change_positions`。", "en": "Extract every local feature's `position_start` → `all_change_positions`."}, {"n": 95, "zh": "循环 3 次，每次尝试采样一个反例位置。", "en": "Loop three times, attempting to sample one negative-example position per iteration."}, {"n": 96, "zh": "从 `[0, current_seq_len - 1]` 含端点随机取 `point`。", "en": "Sample `point` as an inclusive random integer in `[0, current_seq_len - 1]`."}, {"n": 97, "zh": "若 `point` 与所有变化起点的距离均 `>= 50` → 接受该反例。", "en": "If `point` is at least 50 positions from every change start → accept the negative example."}, {"n": 98, "zh": "追加问题：询问 `point` 附近是否开始出现局部特征波动。", "en": "Append a question asking whether a local characteristic fluctuation starts near `point`."}, {"n": 99, "zh": "追加否定答案：说明未在 `point` 附近发现此类波动。", "en": "Append a negative answer stating that no such fluctuation was found near `point`."}, {"n": 101, "zh": "步骤 5：生成 JSON 格式化问答。", "en": "Step 5: generate the JSON-formatting QA pair."}, {"n": 102, "zh": "追加问题：要求以 JSON 输出周期、趋势、局部特征、频率及噪声字段。", "en": "Append a question requesting JSON output with periodicity, trend, local-characteristic, frequency, and noise fields."}, {"n": 103, "zh": "追加 `attribute_pool_to_json(attribute_pool)` 生成的 JSON 答案。", "en": "Append the JSON answer produced by `attribute_pool_to_json(attribute_pool)`."}]}, {"start": 104, "end": 116, "summary_zh": "将问题答案配对，组装含原始与编码序列的记录列表。", "summary_en": "Pair questions with answers and assemble records containing encoded and original series.", "lines": [{"n": 105, "zh": "标注开始组装最终结果。", "en": "Mark the start of final-result assembly."}, {"n": 106, "zh": "初始化空结果列表 `result`。", "en": "Initialize empty result list `result`."}, {"n": 107, "zh": "循环配对 `questions` 与 `answers`，依次得到 `q`、`a`。", "en": "Loop over paired `questions` and `answers`, yielding `q` and `a`."}, {"n": 108, "zh": "向 `result` 追加新记录对象 `{`。", "en": "Append a new record object to `result` `{`."}, {"n": 109, "zh": "字段 `instruction` ← 公共指令 `instruction`。", "en": "Field `instruction` ← shared `instruction`."}, {"n": 110, "zh": "字段 `question` ← 当前问题 `q`。", "en": "Field `question` ← current question `q`."}, {"n": 111, "zh": "字段 `answer` ← 当前答案 `a`。", "en": "Field `answer` ← current answer `a`."}, {"n": 112, "zh": "字段 `timeseries` ← 仅含 `scaled_timeseries` 的单元素列表。", "en": "Field `timeseries` ← one-element list containing only `scaled_timeseries`."}, {"n": 113, "zh": "字段 `original_timeseries` ← 仅含原始 `timeseries` 的单元素列表。", "en": "Field `original_timeseries` ← one-element list containing only the original `timeseries`."}, {"n": 114, "zh": "用 `}` 结束记录对象，用 `)` 结束 `result.append` 调用。", "en": "Close the record object with `}` and the `result.append` call with `)`."}, {"n": 116, "zh": "返回记录列表 `result`。", "en": "Return the record list `result`."}]}, {"start": 117, "end": 130, "summary_zh": "作为脚本运行时创建输出目录，并循环重试生成单个样本。", "summary_en": "When run as a script, create the output directory and repeatedly generate individual samples.", "lines": [{"n": 119, "zh": "若当前模块是程序入口 `__main__` → 执行数据写出流程。", "en": "If the current module is the `__main__` entry point → run the data-writing workflow."}, {"n": 120, "zh": "创建 `OUTPUT_PATH` 的父目录；目录已存在也不报错。", "en": "Create the parent directory of `OUTPUT_PATH`; do not fail if it already exists."}, {"n": 121, "zh": "以文本写模式打开 `OUTPUT_PATH` → 文件对象 `f`。", "en": "Open `OUTPUT_PATH` in text-write mode → file object `f`."}, {"n": 122, "zh": "创建总量为 `NUM_DATA`、描述为 `Generating` 的进度条 `t`。", "en": "Create progress bar `t` with total `NUM_DATA` and description `Generating`."}, {"n": 123, "zh": "初始化已写出问答数 `cnt = 0`。", "en": "Initialize written QA count `cnt = 0`."}, {"n": 124, "zh": "无限循环，直到达到目标样本数后显式退出。", "en": "Loop indefinitely until explicitly exiting after the target sample count is reached."}, {"n": 125, "zh": "尝试执行单样本生成，捕获指定的随机生成异常。", "en": "Try generating one sample, catching specified random-generation exceptions."}, {"n": 126, "zh": "调用 `generate_single_dataset()` → `result`。", "en": "Call `generate_single_dataset()` → `result`."}, {"n": 127, "zh": "若抛出 `ValueError` → 捕获为 `err`。", "en": "If `ValueError` is raised → catch it as `err`."}, {"n": 128, "zh": "跳过本次结果，回到循环重新生成。", "en": "Skip this result and return to the loop to regenerate."}, {"n": 129, "zh": "若抛出 `IndexError` → 捕获为 `err`。", "en": "If `IndexError` is raised → catch it as `err`."}, {"n": 130, "zh": "跳过本次结果，回到循环重新生成。", "en": "Skip this result and return to the loop to regenerate."}]}, {"start": 131, "end": 142, "summary_zh": "把问答记录转换为训练格式写入 JSONL，直到达到目标数量。", "summary_en": "Convert QA records to training format and write JSONL until the target count is reached.", "lines": [{"n": 131, "zh": "循环遍历当前样本的每条 `result` 记录 → `item`。", "en": "Loop over each record in the current sample's `result` → `item`."}, {"n": 132, "zh": "把 `item` 重建为训练记录对象 `{`。", "en": "Rebuild `item` as a training-record object `{`."}, {"n": 133, "zh": "`input` ← 去掉指令末字符后拼接 `. ` 与当前问题。", "en": "`input` ← instruction without its final character, followed by `. ` and the current question."}, {"n": 134, "zh": "`output` ← 当前记录的 `answer`。", "en": "`output` ← current record's `answer`."}, {"n": 135, "zh": "`timeseries` ← 将编码序列递归转换为数值列表。", "en": "`timeseries` ← encoded series recursively converted to numeric lists."}, {"n": 136, "zh": "保留注释代码：若启用，会把原始序列逐项转为列表；当前不写入该字段。", "en": "Commented-out code: if enabled, it would convert each original series to a list; this field is currently not written."}, {"n": 137, "zh": "`}` 结束训练记录对象。", "en": "`}` closes the training-record object."}, {"n": 138, "zh": "将 `item` 转为保留非 ASCII 字符的 JSON，追加换行后写入 `f`。", "en": "Convert `item` to non-ASCII-preserving JSON, append a newline, and write it to `f`."}, {"n": 139, "zh": "进度条 `t` 前进一步，对应当前问答记录。", "en": "Advance progress bar `t` by one step for the current QA record."}, {"n": 140, "zh": "`cnt` +1。", "en": "Increment `cnt` by 1."}, {"n": 141, "zh": "若 `cnt >= NUM_DATA` → 已生成足够问答。", "en": "If `cnt >= NUM_DATA` → enough QA records have been generated."}, {"n": 142, "zh": "`break` 结束无限生成循环。", "en": "`break` ends the infinite generation loop."}]}]}, {"path": "chatts/sft/generate_ift_dataset.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport json\nimport yaml\nimport os\nimport random\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom tqdm import tqdm\nimport copy\nimport traceback\n\n# Config\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))['data_output_dir']\nTARGET_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_ift\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['seq_len']\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/ift_{SEQ_LEN}_{ENCODING_METHOD}.jsonl'\nNUM_DATA_LLM = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\nLABEL_FILES = [\n    f'{OUTPUT_BASE_DIR}/labels/mts_local_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json',\n    f'{OUTPUT_BASE_DIR}/labels/mts_shape_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json',\n    f'{OUTPUT_BASE_DIR}/labels/uts_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'\n]\nALL_LOCAL_TYPES = {'increase after downward spike', 'increase after upward spike', 'upward spike', 'rapid decline followed by slow rise', 'slow rise followed by rapid decline', 'continuous upward spike', 'wide downward spike', 'slow decline followed by rapid rise', 'upward convex', 'shake', 'rapid rise followed by slow decline', 'sudden increase', 'downward spike', 'sudden decrease', 'continuous downward spike', 'decrease after upward spike', 'wide upward spike', 'decrease after downward spike', 'downward convex'}\n\n# Return: question, answer\n# L0: basic feature: STL shape + statistic\ndef generate_trend(sample):\n    question = 'What is the trend of this time series? Please choose from [\"steady\", \"decreasing\", \"increasing\"] and describe the value trend change. Answer format: steady, the starting point value is around 32.10, and the trend change value from left to right is around 0.12.'\n    answer = f\"{sample['label']['trend']['type']}, the starting point value is around {sample['label']['trend']['start']:.2f}, and the trend change value from left to right is around {sample['label']['trend']['amplitude']:.2f}.\"\n    if sample['label']['trend']['type'] == 'multiple':\n        raise NotImplementedError(\"ift not implemented for multiple trend\")\n    return question, answer\n\ndef generate_trend_llm(sample):\n    question = f'What is the trend of this time series? Please choose from [\"steady\", \"decreasing\", \"increasing\"], describe the value trend change, and conclude the llm meaning of this trend change in one sentence. Answer format: steady, the starting point value is around 32.10, and the trend change value from left to right is around 0.12. The trend indicates that the temperature is stable during the period.'\n    answer = f\"{sample['label']['trend']['type']}, the starting point value is around {sample['label']['trend']['start']:.2f}, and the trend change value from left to right is around {sample['label']['trend']['amplitude']:.2f}. The trend indicates that {sample['label']['trend']['detail']}\"\n    if sample['label']['trend']['type'] == 'multiple':\n        raise NotImplementedError(\"ift not implemented for multiple trend\")\n    return question, answer\n\ndef generate_season(sample):\n    question = 'What is the periodicity of this time series? Please choose from [\"no periodic fluctuation\", \"periodic fluctuation\"]. If there is periodic fluctuation, describe the fluctuation frequency and amplitude. Answer format: periodic fluctuation, each period is around 20.58 points, and the amplitude of the periodic fluctuation is around 31.51.'\n    if 'no' in sample['label']['seasonal']['type']:\n        answer = \"no periodic fluctuation\"\n    else:\n        answer = f\"periodic fluctuation, each period is around {sample['label']['frequency']['period']:.2f} points, and the amplitude of the periodic fluctuation is around {sample['label']['seasonal']['segments'][0]['amplitude']:.2f}.\"\n    return question, answer\n\ndef generate_season_llm(sample):\n    question = f'What is the periodicity of this time series? Please choose from [\"no periodic fluctuation\", \"periodic fluctuation\"], and conclude the llm meaning of the periodicity in one sentence. If there is periodic fluctuation, also describe the fluctuation frequency and amplitude. Answer format: periodic fluctuation, each period is around 20.58 points, and the amplitude of the periodic fluctuation is around 31.51. The periodic fluctuation indicates that the temperature is periodically changing in a day.'\n    if 'no' in sample['label']['seasonal']['type']:\n        answer = f'no periodic fluctuation. It indicates that {sample[\"label\"][\"seasonal\"][\"detail\"]}'\n    else:\n        answer = f\"periodic fluctuation, each period is around {sample['label']['frequency']['period']:.2f} points, and the amplitude of the periodic fluctuation is around {sample['label']['seasonal']['segments'][0]['amplitude']:.2f}. It indicates that {sample['label']['seasonal']['detail']}\"\n    return question, answer\n\ndef generate_noise(sample):\n    question = 'What are the noise characteristics of this time series? Please choose from [\"noisy\", \"almost no noise\"]. Answer format: noisy, the overall noise standard deviation is around 1.5.'\n    answer = f\"{sample['label']['noise']['type']}, the overall noise standard deviation is around {sample['label']['noise']['std']:.2f}.\"\n    return question, answer\n\n# L1: local feature: local change type + statistic\ndef generate_local(sample):\n    question = 'What are the local characteristic fluctuations of this time series? The optional types of local characteristic fluctuations include: [\"' + '\", \"'.join(sorted(ALL_LOCAL_TYPES)) + '\"]. You need to analyze all the characteristic fluctuations that appear in this time series and answer each type, position, and amplitude in the format. Different local characteristic fluctuations should be separated by semicolons. Answer format: shake, position around point 125, amplitude 135.03; small sudden decrease, position around point 102, amplitude 31.05.'\n    answer = '; '.join([f\"{i['type'] if type(i['type']) == str else i['type'][0]}, position around point {i['position_start']}, amplitude {i['amplitude']:.2f}\" for i in sample['label']['local']])\n\n    if len(sample['label']['local']) == 0:\n        answer = 'No local characteristic fluctuations found.'\n\n    features = []\n    for i in sample['label']['local']:\n        features.append({\n            'type': i['type'] if type(i['type']) == str else [j for j in i['type']],\n            'position': i['position_start'],\n            'amplitude': round(i['amplitude'], 2)\n        })\n    return question, answer\n\ndef generate_local_llm(sample):\n    question = f'What are the local characteristic fluctuations of this time series? The optional types of local characteristic fluctuations include: [\"' + '\", \"'.join(sorted(ALL_LOCAL_TYPES)) + '\"]. You need to analyze all the characteristic fluctuations that appear in this time series and answer each type, position, and amplitude in the format, and conclude the llm meaning of **each** fluctuation in one sentence. Different local characteristic fluctuations should be separated by semicolons. Answer format: shake, position around point 125, amplitude 135.03. A sudden surge in public interest, likely due to significant news, a major event, or a trending topic related to the platform that rapidly captured user attention; small sudden decrease, position around point 102, amplitude 31.05. A slight increase in interest, possibly driven by minor news, promotions, or social media discussions that briefly captured attention without indicating a significant trend.'\n    answer = '; '.join([f\"{i['type'] if type(i['type']) == str else i['type'][0]}, position around point {i['position_start']}, amplitude {i['amplitude']:.2f}. {i['detail'] if not i['detail'].endswith('.') else i['detail'][:-1]}\" for i in sample['label']['local']])\n\n    if len(sample['label']['local']) == 0:\n        answer = 'No local characteristic fluctuations found.'\n\n    features = []\n    for i in sample['label']['local']:\n        features.append({\n            'type': i['type'],\n            'position': i['position_start'],\n            'amplitude': round(i['amplitude'], 2),\n            'explain': i['detail']\n        })\n    return question, answer\n\n# L2: correlation and cluster\ndef generate_shape_correlation_llm(sample):\n    if len(sample['label']['correlations']) == 0:\n        raise NotImplementedError(\"ift not implemented for shape correlation with empty correlations\")\n    pairs = random.choice(sample['label']['correlations'])\n    question = f'From the perspective of the overall trend, do {pairs[\"pair\"][0]} and {pairs[\"pair\"][1]} have very similar trend characteristics? Just answer yes or no, and explain why they are correlated/no correlated considering their llm meaning in one sentence. Answer format: Yes. Both metrics are related to the same system component, so they are highly correlated.'\n    if pairs['label']:\n        answer = 'Yes. ' + pairs['explain']\n    else:\n        answer = 'No. ' + pairs['explain']\n    return question, answer\n\ndef generate_fluctuation_correlation_llm(sample):\n    # Choice and balance the label\n    positive_pairs = [p for p in sample['label']['correlations'] if p['label']]\n    negative_pairs = [p for p in sample['label']['correlations'] if not p['label']]\n\n    if len(positive_pairs) and (random.random() > 0.5 or len(negative_pairs) == 0):\n        pairs = random.choice(positive_pairs)\n    else:\n        pairs = random.choice(negative_pairs)\n    question = f'From the perspective of local fluctuations, do {pairs[\"pair\"][0]} and {pairs[\"pair\"][1]} both have fluctuations near point {sample[\"label\"][\"position\"]}? Answer yes or no, the types of their correlated fluctuations (if yes), and explain why they are correlated/no correlated considering their llm meaning in one sentence. Answer format: Yes. [metric 1], shake; [metric 2], upward spike. Both [metric 1] and [metric 2] are related to CPU metrics, so they may have near fluctuations when the CPU usage is high.'\n    if pairs['label']:\n        answer = 'Yes. '\n        # Find fluctuation type label\n        def get_fluctuation_type(metric: str):\n            for cluster in sample['label']['clusters']:\n                if metric in cluster['cols']:\n                    return cluster['col_idx'][cluster['cols'].index(metric)][1]\n        answer += '; '.join([f\"{m}, {get_fluctuation_type(m)}\" for m in pairs['pair']])\n        answer += '. ' + pairs['explain']\n    else:\n        answer = 'No. ' + pairs['explain']\n    features = copy.deepcopy(pairs)\n\n    if pairs['label']:\n        features['pair'] = [[m, get_fluctuation_type(m)] for m in pairs['pair']]\n    return question, answer\n\ndef generate_shape_cluster_llm(sample):\n    cluster = random.choice(sample['label']['clusters'])\n    question = f'From the perspective of the overall trend, which metric(s) have very similar trend characteristics with {random.choice(cluster[\"cols\"])}? List the metrics (including itself) and explain why they have similar overall trend considering their llm meaning in one sentence. Answer format: A, B, C. All metrics are related to the same system component, so they may have similar overall trend.'\n    answer = ', '.join(cluster['cols']) + '. ' + cluster['explain']\n    return question, answer\n\ndef generate_fluctuation_cluster_llm(sample):\n    cluster = random.choice(sample['label']['clusters'])\n    question = f'From the perspective of the position of local fluctuations, which metric(s) have very similar local fluctuation characteristics with {random.choice(cluster[\"cols\"])}? The optional types of local characteristic fluctuations include: [\"' + '\", \"'.join(sorted(ALL_LOCAL_TYPES)) + '\"]. List the metrics (including itself), the types of fluctuations, and explain why they have similar local fluctuations considering their llm meaning in one sentence. Answer format: [metric 1], shake; [metric 2], upward spike; [metric 3], downward spike. All metrics are related to the same system component, so they may have correlated local fluctuations near the same point.'\n    answer = '; '.join([f\"{i}, {cluster['col_idx'][idx][1]}\" for idx, i in enumerate(cluster['cols'])]) + '. ' + cluster['explain']\n    return question, answer\n\n\n# Generate dataset\ndef generate_qa(sample, filename: str):\n    # Step 1. Check data type\n    candidate_funcs = []\n    mts_flag = False\n    llm_flag = False\n    if 'uts' in filename:\n        candidate_funcs += [generate_trend, generate_season, generate_noise, generate_local, generate_trend_llm, generate_season_llm, generate_local_llm]\n        llm_flag = True\n    if 'shape' in filename:\n        candidate_funcs += [generate_shape_correlation_llm, generate_shape_cluster_llm]\n        mts_flag = True\n        llm_flag = True\n    if 'local' in filename:\n        candidate_funcs += [generate_fluctuation_correlation_llm, generate_fluctuation_cluster_llm]\n        mts_flag = True\n        llm_flag = True\n\n    # Step 2. Randomly choose a data type\n    funcs = np.random.choice(candidate_funcs, size=min(len(candidate_funcs), random.randint(3, 4)), replace=False)\n    \n    # Step 3. Augmentation\n    original_timeseries = copy.deepcopy(sample['timeseries'])\n    if mts_flag:\n        timeseries = sample['timeseries']\n\n        if llm_flag:\n            cols = sample['label']['cols']\n            question = f\"You are a time series analysis expert. In a monitoring system of {sample['label']['situation']}, there are {len(timeseries)} metrics collected.\"\n            for i in range(len(timeseries)):\n                # Scalar\n                cur_timeseries = np.array(timeseries[i])\n                scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(cur_timeseries, ENCODING_METHOD)\n                timeseries[i] = scaled_timeseries\n\n                question += f\"\"\"\\n \"{sample['label']['cols'][i]}\" is a time series with length of {len(timeseries[i])}: {cur_ts_prompt}\"\"\"\n            question += ', please analyze the time series features and answer the following questions:'\n    else:\n        # Scalar\n        timeseries = sample['timeseries']\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n        if llm_flag:\n            timeseries = [scaled_timeseries]\n            cols = [sample['label']['metric_name']]\n            question = f\"\"\"You are a time series analysis expert. This time series is \"{sample['label']['metric_name']}\" from {sample['label']['situation']} with length of {len(timeseries[0])}: {cur_ts_prompt}, please analyze the time series features and answer the following questions:\"\"\"\n        else:\n            timeseries = [scaled_timeseries]\n            cols = ['Time Series']\n            question = f'You are a time series analysis expert. Here is a time series of length {len(timeseries[0])}: {cur_ts_prompt}, please analyze the time series features and answer the following questions:'\n\n    answer = ''\n    \n    # Step 3. Generate QAs\n    for idx, func in enumerate(funcs):\n        cur_question, cur_answer = func(sample)\n        question += f'\\n{idx+1}. {cur_question}'\n        answer += f'{idx+1}. {cur_answer}\\n'\n    question += '\\nNow, based on the above questions, please strictly follow the output format requirements and provide the answers. Each line corresponds to an answer to a question, formatted as:'\n    question += '\\n'.join([f\"{i+1}. Strictly formatted answer {i+1}\" for i in range(len(funcs))])\n\n    # Step 4. Return result\n    return {\n        'timeseries': timeseries,\n        'original_timeseries': original_timeseries,\n        'cols': cols,\n        'question': question,\n        'answer': answer\n    }\n\ndef generate_dataset():\n    print(\"Start generation...\")\n    samples = []\n    filenames = []\n    for file in LABEL_FILES:\n        label = json.load(open(file))\n        for sample in label:\n            samples.append(sample)\n            filenames.append(file)\n    samples = samples\n    filenames = filenames\n\n    result = []\n    with tqdm(total=TARGET_CNT, desc='Generating samples') as pbar:\n        while len(result) < TARGET_CNT:\n            idx = random.randin
