h": "`x1` = `np.arange(SEQ_LEN_1)` → 生成 `0..255` 的采样坐标。", "en": "`x1` = `np.arange(SEQ_LEN_1)` → generate sample coordinates `0..255`."}, {"n": 37, "zh": "`x2` = `np.arange(SEQ_LEN_2)` → 生成 `0..999` 的采样坐标。", "en": "`x2` = `np.arange(SEQ_LEN_2)` → generate sample coordinates `0..999`."}]}, {"start": 39, "end": 49, "summary_zh": "生成突变与尖峰信号并组装多模态时序数据", "summary_en": "Generate drop and spike signals and assemble multimodal series data.", "lines": [{"n": 39, "zh": "标记 `TS1`：带突然下降的简单正弦信号。", "en": "Mark `TS1`: a simple sine signal with a sudden decrease."}, {"n": 40, "zh": "`ts1` = `sin(x1 / 10) * 5.0` → 生成振幅为 `5` 的正弦序列。", "en": "`ts1` = `sin(x1 / 10) * 5.0` → generate a sine series with amplitude `5`."}, {"n": 41, "zh": "`ts1[103:]` 每项 `-10.0` → 从索引 `103` 起制造阶跃下降。", "en": "Subtract `10.0` from every item in `ts1[103:]` → create a step drop from index `103`."}, {"n": 43, "zh": "标记 `TS2`：带上冲尖峰的增长趋势。", "en": "Mark `TS2`: an increasing trend with an upward spike."}, {"n": 44, "zh": "`ts2` = `x2 * 0.01` → 生成线性增长序列。", "en": "`ts2` = `x2 * 0.01` → generate a linearly increasing series."}, {"n": 45, "zh": "`ts2[100]` +`10.0` → 在索引 `100` 制造向上尖峰。", "en": "Add `10.0` to `ts2[100]` → create an upward spike at index `100`."}, {"n": 46, "zh": "构造 `prompt`：声明两条序列及长度、插入时序占位符，并要求先分析局部变化再比较发生时间。", "en": "Build `prompt`: declare both series and lengths, insert time-series placeholders, and request local-change analysis followed by a timing comparison."}, {"n": 47, "zh": "重写 `prompt`：用换行分隔系统角色、用户消息和助手起始标记，套用对话模板。", "en": "Rewrite `prompt`: separate system and user messages plus the assistant start marker with newlines to apply the chat template."}, {"n": 49, "zh": "`mm_data` = `{timeseries: [ts1.tolist(), ts2.tolist()]}` → 将两条数组转为列表并归入时序字段。", "en": "`mm_data` = `{timeseries: [ts1.tolist(), ts2.tolist()]}` → convert both arrays to lists under the time-series field."}]}, {"start": 50, "end": 59, "summary_zh": "构造并复制百份输入后执行批量生成推理", "summary_en": "Build and replicate one hundred inputs, then run batched generation.", "lines": [{"n": 50, "zh": "`inputs` = `{` 开始单条推理输入字典。", "en": "`inputs` = `{` opens a single inference-input dictionary."}, {"n": 51, "zh": "`prompt` = 对话模板字符串 → 设置文本输入。", "en": "`prompt` = the chat-template string → set the text input."}, {"n": 52, "zh": "`multi_modal_data` = `mm_data` → 挂接多模态时序输入。", "en": "`multi_modal_data` = `mm_data` → attach the multimodal time-series input."}, {"n": 53, "zh": "`}` 结束单条推理输入字典。", "en": "`}` closes the single inference-input dictionary."}, {"n": 55, "zh": "标记待办：测试批量推理速度。", "en": "Mark a TODO: test batch inference speed."}, {"n": 56, "zh": "`inputs` = `[inputs] * 100` → 将同一输入字典复制为 `100` 项列表。", "en": "`inputs` = `[inputs] * 100` → replicate the same input dictionary into a `100`-item list."}, {"n": 58, "zh": "标记推理段。", "en": "Mark the inference section."}, {"n": 59, "zh": "`outputs` = `language_model.generate(inputs, SamplingParams(max_tokens=300))` → 批量生成，每条最多 `300` 个令牌。", "en": "`outputs` = `language_model.generate(inputs, SamplingParams(max_tokens=300))` → generate in batch with at most `300` tokens each."}]}, {"start": 60, "end": 63, "summary_zh": "循环读取每项推理结果并打印首个候选文本", "summary_en": "Loop through inference results and print each first candidate text.", "lines": [{"n": 61, "zh": "循环 `outputs`，逐项取为 `o` {", "en": "Loop over `outputs`, taking each item as `o` {"}, {"n": 62, "zh": "`generated_text` = `o.outputs[0].text` → 取当前结果的首个候选文本。", "en": "`generated_text` = `o.outputs[0].text` → take the current result's first candidate text."}, {"n": 63, "zh": "打印 `generated_text`。", "en": "Print `generated_text`."}]}]}, {"path": "demo/generate_template_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n\"\"\"\n    This script is an example, which generates the data with a set of prompts. The data can be further used as seed QAs for TSEvol.\n    We only show some simple templates here for demonstration. You can modify the code to generate your own QA dataset.\n    Usage:\n        python3 -m demo.generate_template_qa\n\"\"\"\n\nimport random\nfrom tqdm import tqdm\nimport json\nimport yaml\nimport os\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_controlled_attributes, generate_time_series, attribute_to_text\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\n\n\n# CONFIG\nENCODING_METHOD = yaml.safe_load(open('config/datagen_config.yaml', 'rt'))['encoding_method']\nSEQ_LEN = yaml.safe_load(open('config/datagen_config.yaml', 'rt'))['seq_len']  # Set to none for random seq_len\nOUTPUT_BASE_DIR = yaml.safe_load(open('config/datagen_config.yaml', 'rt'))['data_output_dir']\nTOTAL_CNT = 1000\nOUTPUT_DATASET = f'{OUTPUT_BASE_DIR}/template_qa_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\nOUTPUT_LABEL = f'{OUTPUT_BASE_DIR}/evol_labels/template_qa_{TOTAL_CNT}_{ENCODING_METHOD}.json'\n\n# All Config for TS Attributes (type & probability)\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\n\n\ndef univariate_seed_qa():\n    if SEQ_LEN is None:\n        current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Randomly choose a type and metric name\n    sample = random.choice(list(metric_config))\n    category = sample['category']\n    metric = random.choice(sample['metrics'])\n\n    # Choose a metric and generate\n    attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Scalar\n    scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    # Generate QA\n    instruction = f\"You are a time series analysis expert. This is a metric called {metric} collected from {category} with length of {current_seq_len}: {cur_ts_prompt}.\"\n    questions, answers, fields = [], [], []\n    # (Step 1) general shape\n    questions.append(\"Now, please analyze the characteristics of this time series from the perspectives of periodicity, trend, local characteristics, frequency characteristics, and noise.\")\n    answers.append(attribute_to_text(timeseries, attribute_pool, generate_values=False))\n    cur_fields = {\"trend\": [0], \"seasonal\": [0], \"noise\": [0], \"local\": [0]}\n    fields.append(cur_fields)\n\n    # (Step 2) shape and values\n    questions.append(\"Now, please analyze the characteristics of this time series from the perspectives of periodicity, trend, local characteristics, frequency characteristics, and noise. Also include the approximate mean values for every 16 points, as well as the maximum and minimum values of the time series (rounded to 2 decimal places).\")\n    answers.append(attribute_to_text(timeseries, attribute_pool, generate_values=True))\n    cur_fields = {\"trend\": [0], \"seasonal\": [0], \"noise\": [0], \"local\": [0], \"statistic\": [0]}\n    fields.append(cur_fields)\n\n    # (Step 3) local change\n    for local_char in attribute_pool['local']:\n        question_position = local_char['position_start'] + random.randint(-5, 5)\n        questions.append(f\"Is there a local characteristic fluctuation starting around point {question_position} in this time series?\")\n        answers.append(f\"Yes, this time series \" + local_char['detail'])\n        cur_fields = {\"local\": [0]}\n        fields.append(cur_fields)\n\n    # Generate final result\n    result = []\n    for q, a, f in zip(questions, answers, fields):\n        result.append({\n            'instruction': instruction,\n            'question': q,\n            'answer': a,\n            'fields': f,\n            'metrics': [metric],\n            'attribute_pool': [attribute_pool],\n            'timeseries': [scaled_timeseries],\n            'original_timeseries': [timeseries],\n            'corr_pool': []\n        })\n\n    return result\n\n\ndef multivariate_seed_qa():\n    if SEQ_LEN is None:\n        current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Randomly choose the number of time series (variables)\n    num_series = random.randint(2, 10)\n\n    # Randomly select a category from metric_config\n    sample = random.choice(metric_config)\n    category = sample['category']\n\n    # Get all metrics from the selected category\n    metrics_in_category = []\n    for s in metric_config:\n        if s['category'] == category:\n            metrics_in_category.extend(s['metrics'])\n\n    # Ensure we have enough metrics to sample\n    if len(metrics_in_category) < num_series:\n        num_series = len(metrics_in_category)\n\n    # Randomly select metrics for the time series\n    metrics = random.sample(metrics_in_category, num_series)\n\n    timeseries_list = []\n    attribute_pool_list = []\n\n    for metric in metrics:\n        # Generate attribute_pool and time series for each metric\n        attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), current_seq_len)\n        timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n        # Append to lists\n        timeseries_list.append(timeseries)\n        attribute_pool_list.append(attribute_pool)\n\n    # Scale and encode the time series\n    scaled_timeseries_list = []\n    cur_ts_prompts = []\n\n    for timeseries in timeseries_list:\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n        scaled_timeseries_list.append(scaled_timeseries)\n        cur_ts_prompts.append(cur_ts_prompt)\n\n    # Generate instruction\n    instruction = f\"You are a time series analysis expert. There are {num_series} metrics collected from {category} with length of {current_seq_len}.\"\n\n    # List the metrics and their data\n    for i in range(num_series):\n        instruction += f\"\\nMetric {i+1}: {metrics[i]}. Time series data: {cur_ts_prompts[i]}\"\n\n    questions, answers, fields = [], [], []\n\n    # (Task 1) Detailed analysis of a specific time series\n    selected_index = random.randint(0, num_series - 1)\n    questions.append(f\"Please analyze the characteristics of time series {selected_index+1} ({metrics[selected_index]}), including its periodicity, trend, local characteristics, frequency characteristics, and noise.\")\n\n    desc_text = attribute_to_text(\n        timeseries_list[selected_index],\n        attribute_pool_list[selected_index],\n        generate_values=False\n    )\n    answers.append(desc_text)\n    cur_fields = {\"trend\": [selected_index], \"seasonal\": [selected_index], \"noise\": [selected_index], \"local\": [selected_index]}\n    fields.append(cur_fields)\n\n    # (Task 2) Describe a specific attribute for all time series\n    available_attributes = ['trend', 'periodicity', 'frequency', 'noise', 'local']\n    selected_attribute = random.choice(available_attributes)\n    questions.append(f\"Please describe the {selected_attribute} characteristics of all the time series.\")            \n\n    # Build the answer by extracting the selected attribute from each time series\n    attribute_text = \"\"\n    for i in range(num_series):\n        desc_text = attribute_to_text(\n            timeseries_list[i],\n            attribute_pool_list[i],\n            generate_values=False,\n            include_attributes=[selected_attribute]\n        )\n        attribute_text += f\"Time series {i+1} ({metrics[i]}):\\n{desc_text}\\n\"\n    attribute_fields_map = {\n        'trend': 'trend',\n        'periodicity': 'seasonal',\n        'frequency': 'seasonal',\n        'noise': 'noise',\n        'local': 'local'\n    }\n    cur_fields = {\n        attribute_fields_map[selected_attribute]: list(range(num_series))\n    }\n    fields.append(cur_fields)\n    answers.append(attribute_text.strip())\n\n    # (Task 3) Searching for time series with similar trend\n    visited = set()\n    corr_pool = []\n    for i in range(num_series):\n        if i in visited:\n            continue\n        visited.add(i)\n        cur_result = {i}\n        for j in range(i + 1, num_series):\n            if j in visited:\n                continue\n            if attribute_pool_list[i]['trend']['type'] == attribute_pool_list[j]['trend']['type'] and attribute_pool_list[i]['trend']['type'] != 'multiple':\n                # Similar trend found\n                visited.add(j)\n                cur_result.add(j)\n\n        if len(cur_result) > 1:\n            # Add a question\n            question = f\"Please find the time series with similar trend characteristics with {metrics[random.choice(list(cur_result))]}.\"\n            questions.append(question)\n            cur_answer = f\"Time series with similar trend characteristics: {', '.join([metrics[i] for i in cur_result])}, because their trend are all {attribute_pool_list[i]['trend']['type']}.\"\n            answers.append(cur_answer)\n            cur_fields = {\n                \"trend\": list(cur_result),\n                \"correlation\": [len(corr_pool)]\n            }\n            corr_pool.append((sorted(cur_result), cur_answer))\n\n    # (Task 4) Searching for time series with similar local fluctuation\n    visited = set()\n    for i in range(num_series):\n        if i in visited:\n            continue\n        visited.add(i)\n        cur_result = {i}\n        for j in range(i + 1, num_series):\n            if j in visited:\n                continue\n            if len(attribute_pool_list[i]['local']) != len(attribute_pool_list[j]['local']):\n                continue\n            for l1, l2 in zip(attribute_pool_list[i]['local'], attribute_pool_list[j]['local']):\n                if abs(l1['position_start'] - l2['position_start']) > 15:\n                    break\n            else:\n                # Similar local found\n                visited.add(j)\n                cur_result.add(j)\n\n        if len(cur_result) > 1:\n            # Add a question\n            question = f\"Please find the time series with similar local fluctuations characteristics with {metrics[random.choice(list(cur_result))]} in terms of their fluctuation positions.\"\n            questions.append(question)\n            cur_answer = f\"Time series with similar local fluctuations characteristics: {', '.join([metrics[i] for i in cur_result])}, because they all have local fluctuations near points: {','.join([l['position_start'] for l in attribute_pool_list[i]['local']])}.\"\n            answers.append(cur_answer)\n            cur_fields = {\n                \"local\": list(cur_result),\n                \"correlation\": [len(corr_pool)]\n            }\n            corr_pool.append((sorted(cur_result), cur_answer))\n\n    # Generate final result\n    result = []\n    for q, a, f in zip(questions, answers, fields):\n        result.append({\n            'instruction': instruction,\n            'question': q,\n            'answer': a,\n            'fields': f,\n            'metrics': metrics,\n            'attribute_pool': attribute_pool_list,\n            'timeseries': scaled_timeseries_list,\n            'original_timeseries': timeseries_list,\n            'corr_pool': corr_pool\n        })\n\n    return result\n\ndef generate_seed_qa_dataset():\n    generated_cnt = 0\n    ts_idx = 0\n    labels = []\n \n    # Create output directory\n    os.makedirs(OUTPUT_BASE_DIR, exist_ok=True)\n    os.makedirs(os.path.dirname(OUTPUT_LABEL), exist_ok=True)\n\n    with tqdm(total=TOTAL_CNT, desc='Generating seed qa') as t, open(OUTPUT_DATASET, 'wt') as f:\n        while True:\n            # Generate seed qa\n            try:\n                if random.random() > 0.5:\n                    seed_qa = univariate_seed_qa()\n                else:\n                    seed_qa = multivariate_seed_qa()\n            except Exception as err:\n                # Error when generating random time series, just try again\n                continue\n            \n            # Process seed qa\n            for item in seed_qa:\n                cur_label = {\n                    'fields': item['fields'],\n                    'metrics': item['metrics'],\n                    'corr_pool': item['corr_pool'],\n                    'attribute_pool': item['attribute_pool'],\n                    'instruction': item['instruction'],\n                    'question': item['question'],\n                    'ts_idx': ts_idx\n                }\n                cur_data = {\n                    'input': item['instruction'] + item['question'],\n                    'output': item['answer'],\n                    'timeseries': timeseries_to_list(item['timeseries'])\n                }\n                labels.append(cur_label)\n                f.write(json.dumps(cur_data, ensure_ascii=False) + '\\n')\n                generated_cnt += 1\n                t.update()\n            ts_idx += 1\n\n            if generated_cnt >= TOTAL_CNT:\n                break\n    json.dump(labels, open(OUTPUT_LABEL, 'wt'), ensure_ascii=False, indent=4)\n\n    print(f\"Finished! Total {generated_cnt} samples generated. Saved to {OUTPUT_DATASET} and {OUTPUT_LABEL}.\")\n\nif __name__ == '__main__':\n    generate_seed_qa_dataset()\n", "blocks": []}, {"path": "demo/vllm_api.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n\"\"\"\nExample code to demonstrate how to use the ChatTS vLLM API to analyze time series data. Make sure that the vLLM server is running before executing this code.\n\"\"\"\n\nimport openai\nimport numpy as np\n\n# Load Time Series Data\nSEQ_LEN_1 = 256\nSEQ_LEN_2 = 1000\n\nx1 = np.arange(SEQ_LEN_1)\nx2 = np.arange(SEQ_LEN_2)\n\n# TS1: A simple sin signal with a sudden decrease\nts1 = np.sin(x1 / 10) * 5.0\nts1[103:] -= 10.0\n\n# TS2: A increasing trend with a upward spike\nts2 = x2 * 0.01\nts2[100] += 10.0\nprompt = f\"I have 2 time series. TS1 is of length {SEQ_LEN_1}: <ts><ts/>; TS2 if of length {SEQ_LEN_2}: <ts><ts/>. Please analyze the local changes in these time series first and then conclude if these time series showing local changes near the same time?\"\nprompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{prompt}<|im_end|><|im_start|>assistant\\n\"\n\n# Create ts_list\nts_list = [ts1.tolist(), ts2.tolist()]\n\n# Send message\nclient = openai.OpenAI(base_url=\"http://127.0.0.1:12345/v1\", api_key=\"test\")\n\nresponse = client.chat.completions.create(\n    model=\"chatts\",\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\"type\": \"text\", \"text\": prompt}\n            ] + [{\"timeseries\": ts} for ts in ts_list],\n        }\n    ]\n)\n\nprint(response.choices[0].message.content)\n", "blocks": [{"start": 1, "end": 17, "summary_zh": "声明 MIT 许可证并说明接口示例的运行前提", "summary_en": "State the MIT license and the API example's runtime prerequisite.", "lines": [{"n": 1, "zh": "声明 2025 年清华大学与字节跳动的版权。", "en": "Declare the 2025 copyright of Tsinghua University and ByteDance."}, {"n": 2, "zh": "`#` 作为许可证注释的分隔线。", "en": "`#` acts as a separator in the license comment."}, {"n": 3, "zh": "声明本文件采用 MIT 许可证。", "en": "State that this file uses the MIT License."}, {"n": 4, "zh": "限制：仅可在遵守许可证时使用本文件。", "en": "Restrict use of this file to compliance with the License."}, {"n": 5, "zh": "引出许可证副本的获取地址。", "en": "Introduce where to obtain a copy of the License."}, {"n": 6, "zh": "`#` 分隔许可证说明与网址。", "en": "`#` separates the license text from its URL."}, {"n": 7, "zh": "给出许可证地址 `https://opensource.org/license/mit`。", "en": "Give the license URL `https://opensource.org/license/mit`."}, {"n": 8, "zh": "`#` 分隔许可证网址与后续条款。", "en": "`#` separates the license URL from the following terms."}, {"n": 9, "zh": "除非适用法律要求或另有书面约定：", "en": "Unless required by applicable law or agreed in writing:"}, {"n": 10, "zh": "软件按「原样」分发。", "en": "Distribute the software on an `AS IS` basis."}, {"n": 11, "zh": "不提供任何明示或默示的担保或条件。", "en": "Provide no warranties or conditions, express or implied."}, {"n": 12, "zh": "各语言下的权限以许可证为准。", "en": "Defer to the License for language-specific permissions."}, {"n": 13, "zh": "责任限制同样以许可证为准。", "en": "Defer to the License for limitations as well."}, {"n": 15, "zh": "`\"\"\"` 开始模块文档字符串。", "en": "`\"\"\"` opens the module docstring."}, {"n": 16, "zh": "说明示例通过 ChatTS vLLM API 分析时序，运行前须启动 vLLM 服务。", "en": "Explain that the example analyzes time series through the ChatTS vLLM API and requires a running vLLM server."}, {"n": 17, "zh": "`\"\"\"` 结束模块文档字符串。", "en": "`\"\"\"` closes the module docstring."}]}, {"start": 18, "end": 27, "summary_zh": "导入依赖并设置两条时序的长度与采样坐标", "summary_en": "Import dependencies and set lengths and sample coordinates for two series.", "lines": [{"n": 19, "zh": "`import openai` → 引入 OpenAI 兼容客户端。", "en": "`import openai` → import the OpenAI-compatible client."}, {"n": 20, "zh": "`import numpy as np` → 引入数值数组工具。", "en": "`import numpy as np` → import numerical array tools."}, {"n": 22, "zh": "标记时序数据载入段。", "en": "Mark the time-series data loading section."}, {"n": 23, "zh": "`SEQ_LEN_1` = `256` → 设置第一条序列长度。", "en": "`SEQ_LEN_1` = `256` → set the first series length."}, {"n": 24, "zh": "`SEQ_LEN_2` = `1000` → 设置第二条序列长度。", "en": "`SEQ_LEN_2` = `1000` → set the second series length."}, {"n": 26, "zh": "`x1` = `np.arange(SEQ_LEN_1)` → 生成 `0..255` 的采样坐标。", "en": "`x1` = `np.arange(SEQ_LEN_1)` → generate sample coordinates `0..255`."}, {"n": 27, "zh": "`x2` = `np.arange(SEQ_LEN_2)` → 生成 `0..999` 的采样坐标。", "en": "`x2` = `np.arange(SEQ_LEN_2)` → generate sample coordinates `0..999`."}]}, {"start": 28, "end": 37, "summary_zh": "构造含突变与尖峰的两条时序及分析提示词", "summary_en": "Build two series with a drop and spike, plus the analysis prompt.", "lines": [{"n": 29, "zh": "标记 `TS1`：带突然下降的简单正弦信号。", "en": "Mark `TS1`: a simple sine signal with a sudden decrease."}, {"n": 30, "zh": "`ts1` = `sin(x1 / 10) * 5.0` → 生成振幅为 `5` 的正弦序列。", "en": "`ts1` = `sin(x1 / 10) * 5.0` → generate a sine series with amplitude `5`."}, {"n": 31, "zh": "`ts1[103:]` 每项 `-10.0` → 从索引 `103` 起制造阶跃下降。", "en": "Subtract `10.0` from every item in `ts1[103:]` → create a step drop from index `103`."}, {"n": 33, "zh": "标记 `TS2`：带上冲尖峰的增长趋势。", "en": "Mark `TS2`: an increasing trend with an upward spike."}, {"n": 34, "zh": "`ts2` = `x2 * 0.01` → 生成线性增长序列。", "en": "`ts2` = `x2 * 0.01` → generate a linearly increasing series."}, {"n": 35, "zh": "`ts2[100]` +`10.0` → 在索引 `100` 制造向上尖峰。", "en": "Add `10.0` to `ts2[100]` → create an upward spike at index `100`."}, {"n": 36, "zh": "构造 `prompt`：声明两条序列及长度、插入时序占位符，并要求先分析局部变化再比较发生时间。", "en": "Build `prompt`: declare both series and lengths, insert time-series placeholders, and request local-change analysis followed by a timing comparison."}, {"n": 37, "zh": "重写 `prompt`：依次包裹系统角色、用户消息和助手起始标记，套用对话模板。", "en": "Rewrite `prompt`: wrap system and user messages plus the assistant start marker to apply the chat template."}]}, {"start": 38, "end": 45, "summary_zh": "整理多模态时序列表并初始化本地接口请求", "summary_en": "Prepare multimodal series data and start a local API request.", "lines": [{"n": 39, "zh": "标记创建 `ts_list`。", "en": "Mark creation of `ts_list`."}, {"n": 40, "zh": "`ts_list` = 两条 NumPy 序列各自 `tolist()` 后组成的列表。", "en": "`ts_list` = a list made by calling `tolist()` on each NumPy series."}, {"n": 42, "zh": "标记发送消息段。", "en": "Mark the message-sending section."}, {"n": 43, "zh": "`client` = 创建 `OpenAI` 客户端，连接本机 `12345` 端口的 `/v1` 接口，密钥为 `test`。", "en": "`client` = create an `OpenAI` client for the `/v1` API on local port `12345`, using key `test`."}, {"n": 45, "zh": "`response` = 调用 `client.chat.completions.create` {", "en": "`response` = call `client.chat.completions.create` {"}]}, {"start": 46, "end": 57, "summary_zh": "组装多模态聊天补全参数并输出首条模型回复", "summary_en": "Assemble multimodal chat-completion arguments and print the first reply.", "lines": [{"n": 46, "zh": "`model` = `chatts` → 指定 ChatTS 模型。", "en": "`model` = `chatts` → select the ChatTS model."}, {"n": 47, "zh": "`messages` = 开始消息列表 `[`。", "en": "`messages` = open the message list `[`."}, {"n": 48, "zh": "`{` 开始一条用户消息字典。", "en": "`{` opens a user-message dictionary."}, {"n": 49, "zh": "`role` = `user` → 设置消息角色为用户。", "en": "`role` = `user` → set the message role to user."}, {"n": 50, "zh": "`content` = 开始多模态内容列表 `[`。", "en": "`content` = open the multimodal content list `[`."}, {"n": 51, "zh": "加入 `{type: text, text: prompt}` → 放入文本提示。", "en": "Add `{type: text, text: prompt}` → include the text prompt."}, {"n": 52, "zh": "`]` 结束文本列表，再拼接循环 `ts_list` 生成的 `{timeseries: ts}` 项。", "en": "`]` closes the text list, then concatenate `{timeseries: ts}` items generated by looping over `ts_list`."}, {"n": 53, "zh": "`}` 结束用户消息字典。", "en": "`}` closes the user-message dictionary."}, {"n": 54, "zh": "`]` 结束 `messages` 列表。", "en": "`]` closes the `messages` list."}, {"n": 55, "zh": "`)` 结束 `client.chat.completions.create` 调用。", "en": "`)` closes the `client.chat.completions.create` call."}, {"n": 57, "zh": "打印 `response.choices[0].message.content` → 输出首个候选回复的正文。", "en": "Print `response.choices[0].message.content` → output the first candidate reply's content."}]}]}, {"path": "docs/index.html", "language": "xml", "note_zh": "", "note_en": "", "code": "\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n  <title>ChatTS — Understanding & Reasoning about Time Series<\/title>\n  <!-- Gradio web component for embedding the Space -->\n  <script type=\"module\" src=\"https://gradio.s3-us-west-2.amazonaws.com/5.0.1/gradio.js\"><\/script>\n  <style>\n    :root{\n      --bg:#090e1c; --fg:#e8edf8; --muted:#b8c3d9;\n      --brand:#7aa2ff; --accent:#a78bfa; --mint:#34d399; --sun:#f59e0b; --rose:#fb7185; --blue:#60a5fa;\n      --card:#0f1734; --card-2:#101937; --border:#243056;\n    }\n    *{box-sizing:border-box}\n    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,\"Helvetica Neue\",Arial;\n         color:var(--fg);background:radial-gradient(1200px 600px at 20% -10%, rgba(122,162,255,.18), transparent 40%),linear-gradient(180deg,#0a0f1f,#0b1126)}\n    a{color:var(--brand);text-decoration:none}\n    a:hover{text-decoration:underline}\n    .container{max-width:1180px;margin:0 auto;padding:32px 20px}\n    header{position:sticky;top:0;background:rgba(9,14,28,.6);backdrop-filter: blur(8px);border-bottom:1px solid var(--border);z-index:10}\n    header .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}\n    .logo{display:flex;gap:10px;align-items:center;font-weight:800}\n    .logo span{background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;color:transparent}\n    .nav a{margin-left:18px;color:var(--muted)}\n    /* Make the header logo a Datasets<\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"features\">\n      <h2>Key Features<\/h2>\n      <div class=\"grid cols-3\">\n        <div class=\"card\"><h3>Native TS Modality<\/h3><p>Built for multivariate time series as a first‑class input.<\/p><\/div>\n        <div class=\"card\"><h3>Flexible Inputs<\/h3><p>Handles variable sequence lengths and dimensions in a single prompt.<\/p><\/div>\n        <div class=\"card\"><h3>Conversational Reasoning<\/h3><p>Interactive dialogue to explore trends, anomalies, and statistics.<\/p><\/div>\n        <div class=\"card\"><h3>Value-Preserving Encoding<\/h3><p>Answers numeric questions precisely (e.g., spike magnitude at <em>t<\/em>).<\/p><\/div>\n        <div class=\"card\"><h3>Easy Integration<\/h3><p>Works with Transformers and vLLM; supports an OpenAI‑compatible server.<\/p><\/div>\n        <div class=\"card\"><h3>Demo & Tools<\/h3><p>Public web demo, training data/code, and evaluation suites.<\/p><\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"quickstart\">\n      <h2>Quick Start<\/h2>\n      <div class=\"grid cols-5\">\n        <a class=\"card qcard q-web\" href=\"https://huggingface.co/spaces/xiezhe22/ChatTS\" target=\"_blank\" rel=\"noopener\">\n          <h3>Web Demo<\/h3><p>Run in the browser — no install.<\/p>\n        <\/a>\n        <a class=\"card qcard q-depl\" href=\"https://github.com/NetManAIOps/ChatTS#quick-start\" target=\"_blank\" rel=\"noopener\">\n          <h3>Quick Start<\/h3><p>Deploy with Transformers, vLLM, or OpenAI‑style server.<\/p>\n        <\/a>\n        <a class=\"card qcard q-trn\" href=\"https://github.com/NetManAIOps/ChatTS#training-build-your-own\" target=\"_blank\" rel=\"noopener\">\n          <h3>Training<\/h3><p>Generate alignment/SFT data & fine‑tune.<\/p>\n        <\/a>\n        <a class=\"card qcard q-eval\" href=\"https://github.com/NetManAIOps/ChatTS#evaluation\" target=\"_blank\" rel=\"noopener\">\n          <h3>Evaluation<\/h3><p>Answer generation & scoring pipelines.<\/p>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"demo\">\n      <h2>Interactive Web Demo<\/h2>\n      <div class=\"demo-wrap\">\n        <!-- Gradio Space embed (recommended) -->\n        <gradio-app id=\"gradio-embed\" src=\"https://xiezhe22-chatts-simpleweb.hf.space/?__theme=dark\" style=\"\n        --body-background-fill:#0b1020;\n        --section-header-text:#e7ecf5;\n        --block-background-fill:#0f172a;\n        --block-border-color:#243056;\n        --border-color-primary:#243056;\n        --input-background-fill:#0f1630;\n        --input-text-color:#e7ecf5;\n      \"><\/gradio-app>\n      <\/div>\n    <\/section>\n\n    <section id=\"resources\">\n      <h2>Resources<\/h2>\n      <div class=\"grid cols-3\">\n        <a class=\"card\" href=\"https://arxiv.org/abs/2412.03104\" target=\"_blank\" rel=\"noopener\">\n          <h3>Paper (VLDB ’25)<\/h3><p>ChatTS: Aligning Time Series with LLMs via Synthetic Data.<\/p>\n        <\/a>\n        <a class=\"card\" href=\"https://huggingface.co/bytedance-research/ChatTS-14B\" target=\"_blank\" rel=\"noopener\">\n          <h3>Model Weights<\/h3><p>ChatTS‑14B checkpoints on Hugging Face.<\/p>\n        <\/a>\n        <a class=\"card\" href=\"https://huggingface.co/xiezhe24/ChatTS-14B-GPTQ-Int4\" target=\"_blank\" rel=\"noopener\">\n          <h3>Quantized Model<\/h3><p>GPTQ Int4 variant for efficient inference.<\/p>\n        <\/a>\n        <a class=\"card\" href=\"https://huggingface.co/datasets/ChatTSRepo/ChatTS-Training-Dataset\" target=\"_blank\" rel=\"noopener\">\n          <h3>Training Dataset<\/h3><p>Synthetic alignment / SFT / IFT data.<\/p>\n        <\/a>\n        <a class=\"card\" href=\"https://zenodo.org/records/14349206\" target=\"_blank\" rel=\"noopener\">\n          <h3>Evaluation Datasets<\/h3><p>Zenodo bundle of real & synthetic eval data.<\/p>\n        <\/a>\n        <a class=\"card\" href=\"https://github.com/xiezhe-24/ChatTS-Training\" target=\"_blank\" rel=\"noopener\">\n          <h3>Training Scripts<\/h3><p>End‑to‑end scripts (based on LLaMA‑Factory).<\/p>\n        <\/a>\n      <\/div>\n    <\/section>\n\n    <section id=\"showcase\">\n      <h2>Showcase<\/h2>\n      <p class=\"muted\">Use Cases from GitHub <a href=\"https://github.com/NetManAIOps/ChatTS/tree/main/figures\" target=\"_blank\" rel=\"noopener\">figures<\/a> folder.<\/p>\n      <div class=\"gallery\" id=\"gallery\"><\/div>\n    <\/section>\n\n    <footer>\n      <div>© Tsinghua University and ByteDance • <a href=\"https://github.com/NetManAIOps/ChatTS\" target=\"_blank\" rel=\"noopener\">GitHub<\/a><\/div>\n    <\/footer>\n  <\/main>\n\n  <script>\n    // ---------- FIGURE GALLERY (Edit the filenames below if needed) ----------\n    window.CHATTS_IMAGES = [\n      \"case_studies.png\",\n      \"chat_example.png\",\n    ];\n    const FIG_BASE = \"https://raw.githubusercontent.com/NetManAIOps/ChatTS/main/figures/\";\n    const gallery = document.getElementById(\"gallery\");\n    window.CHATTS_IMAGES.forEach(name => {\n      const img = document.createElement(\"img\");\n      img.loading = \"lazy\";\n      img.alt = name;\n      img.src = FIG_BASE + name;\n      gallery.appendChild(img);\n    });\n  <\/script>\n<\/body>\n<\/html>\n", "blocks": []}, {"path": "evaluation/evaluate_gpt_agent_models.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport openai\nimport base64\nimport multiprocessing\nimport matplotlib.pyplot as plt\nfrom sktime.classification.kernel_based import RocketClassifier\nfrom loguru import logger\nimport numpy as np\nimport json\nimport os\nfrom tqdm import tqdm\nimport traceback\nfrom typing import *\nimport io\nplt.rcParams[\"font.sans-serif\"] = [\"Heiti TC\"]\nplt.rcParams[\"axes.unicode_minus\"] = False\n\nfrom evaluation.evaluate_qa import evaluate_batch_qa\nfrom evaluation.react_agent import answer_question_react\n\n# CONFIG\nMODEL = 'gpt-4o-mini'\nEXP = 'gpt-4o-mini-agent-dataset-a'\nDATASET = 'evaluation/dataset/dataset_a.json'\nOPENAI_API_KEY = \"[Your API Key]\"\nOPENAI_BASE_URL = \"[Your Base URL]\"\nNUM_WORKERS = 32\n\ndef worker_generation(input_queue, output_list):\n    while not input_queue.empty():\n        idx, sample = input_queue.get()\n        try:\n            timeseries = sample['timeseries']\n            question_text = sample['question']\n            label = sample['answer']\n            cols = sample['cols']\n\n            # CONFIG\n            os.environ[\"OPENAI_API_KEY\"] = OPENAI_API_KEY\n            openai.api_key = OPENAI_API_KEY\n            openai.base_url = OPENAI_BASE_URL\n            client = openai.OpenAI(api_key=openai.api_key, base_url=openai.base_url)\n\n            answer, num_tokens, cot_prompt = answer_question_react(question_text, timeseries, cols, MODEL, client)\n            output_list.append({\n                'idx': idx,\n                'question_text': question_text,\n                'response': answer,\n                'num_tokens': num_tokens,\n                'cot_prompt': cot_prompt\n            })\n        except Exception as err:\n            logger.error(err)\n            traceback.print_exc()\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    generated_answer = []\n    os.makedirs(f'exp/{EXP}', exist_ok=True)\n    if os.path.exists(f\"exp/{EXP}/generated_answer.json\"):\n        generated_answer = json.load(open(f\"exp/{EXP}/generated_answer.json\"))\n    generated_idx = set([i['idx'] for i in generated_answer])\n\n    # Generation\n    logger.info(\"Start Generation...\")\n    manager = multiprocessing.Manager()\n    input_queue = manager.Queue()\n    output_list = manager.list()\n\n    total_cnt = 0\n    processes = []\n    for idx in range(len(dataset)):\n        if idx in generated_idx:\n            continue\n        input_queue.put((idx, dataset[idx]))\n        total_cnt += 1\n    for _ in range(NUM_WORKERS):\n        p = multiprocessing.Process(target=worker_generation, args=(input_queue, output_list))\n        processes.append(p)\n        p.start()\n\n    with tqdm(total=total_cnt) as pbar:\n        previous_len = 0\n        while any(p.is_alive() for p in processes):\n            current_len = len(output_list)\n            pbar.update(current_len - previous_len)\n\n            for output in output_list[previous_len:current_len]:\n                generated_answer.append(output)\n                json.dump(generated_answer, open(f\"exp/{EXP}/generated_answer.json\", \"wt\"), ensure_ascii=False, indent=4)\n\n            previous_len = current_len\n\n    for p in processes:\n        p.join()\n\n    # Evaluation\n    evaluate_batch_qa(dataset, generated_answer, EXP, num_workers=16)\n", "blocks": []}, {"path": "evaluation/evaluate_gpt_text_models.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport openai\nfrom loguru import logger\nimport numpy as np\nimport json\nimport os\nfrom tqdm import tqdm\nimport traceback\nfrom typing import *\n\nfrom evaluation.evaluate_qa import evaluate_batch_qa\nfrom multiprocessing import Pool\n\n# CONFIG\nMODEL = 'gpt-4o-mini'\nEXP = 'gpt-4o-mini-dataset-a'\nDATASET = 'evaluation/dataset/dataset_a.json'\nOPENAI_API_KEY = \"[Your API Key]\"\nOPENAI_BASE_URL = \"[Your Base URL]\"\nNUM_WORKERS = 32\n\n\ndef ask_gpt_api_with_timeseries(case_idx: int, timeseries: np.ndarray, cols: List[str], question: str) -> str:\n    openai.api_key = OPENAI_API_KEY\n    openai.base_url = OPENAI_BASE_URL\n\n    client = openai.OpenAI(api_key=openai.api_key, base_url=openai.base_url)\n\n    prompt_list = question.split('<ts><ts/>')\n    prompt = prompt_list[0]\n    for ts in range(len(timeseries)):\n        cur_ts = ','.join([f\"{i:.2f}\" for i in timeseries[ts]])\n        prompt += f\"{cur_ts}\" + prompt_list[ts + 1]\n\n    messages = [\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\"type\": \"text\", \"text\": prompt},\n            ]\n        }\n    ]\n\n    timeout_cnt = 0\n    while True:\n        if timeout_cnt > 10:\n            logger.error(\"Too many timeout!\")\n            raise RuntimeError(\"Too many timeout!\")\n        try:\n            response = client.chat.completions.create(\n                model=MODEL,\n                messages=messages,\n                timeout=20\n            )\n            break\n        except Exception as err:\n            logger.error(err)\n            logger.error(\"API timeout, trying again...\")\n            timeout_cnt += 1\n\n    answer = response.choices[0].message.content\n    total_tokens = response.usage.prompt_tokens\n    return answer, total_tokens\n\ndef process_sample(args):\n    sample, idx = args\n    try:\n        timeseries = sample['timeseries']\n        cols = sample['cols']\n        question_text = sample['question']\n        label = sample['answer']\n\n        answer, total_tokens = ask_gpt_api_with_timeseries(idx, timeseries, cols, question_text)\n\n        return {\n            'idx': idx,\n            'question_text': question_text,\n            'response': answer,\n            'num_tokens': total_tokens\n        }\n    except Exception as err:\n        logger.error(err)\n        traceback.print_exc()\n        return None\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    generated_answer = []\n    os.makedirs(f'exp/{EXP}', exist_ok=True)\n    if os.path.exists(f\"exp/{EXP}/generated_answer.json\"):\n        generated_answer = json.load(open(f\"exp/{EXP}/generated_answer.json\"))\n    generated_idx = set([i['idx'] for i in generated_answer])\n\n    # Generation\n    logger.info(\"Start Generation...\")\n    idx_to_generate = [i for i in range(len(dataset)) if i not in generated_idx]\n    with Pool(processes=NUM_WORKERS) as pool:\n        results = list(tqdm(pool.imap(process_sample, [(dataset[idx], idx) for idx in idx_to_generate]), total=len(idx_to_generate)))\n\n    # Filter out None results and update generated_answer\n    generated_answer.extend([res for res in results if res is not None])\n    json.dump(generated_answer, open(f\"exp/{EXP}/generated_answer.json\", \"wt\"), ensure_ascii=False, indent=4)\n\n    # Evaluation\n    evaluate_batch_qa(dataset, generated_answer, EXP, num_workers=NUM_WORKERS)\n", "blocks": []}, {"path": "evaluation/evaluate_gpt_vision_models.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport openai\nimport base64\nimport matplotlib.pyplot as plt\nfrom loguru import logger\nimport numpy as np\nimport json\nimport os\nimport time\nfrom tqdm import tqdm\nimport traceback\nfrom typing import *\nimport io\n\nfrom evaluation.evaluate_qa import evaluate_batch_qa\nfrom multiprocessing import Pool\n\n# CONFIG\nMODEL = 'gpt-4o-mini'\nEXP = 'gpt-4o-mini-vision-dataset-a'\nDATASET = 'evaluation/dataset/dataset_a.json'\nOPENAI_API_KEY = \"[Your API Key]\"\nOPENAI_BASE_URL = \"[Your Base URL]\"\n\n\ndef generate_image_from_timeseries(case_idx: int, timeseries: np.ndarray, cols: List[str]) -> str:\n    if len(timeseries) == 1:\n        plt.figure(figsize=(6, 2))\n        plt.plot(timeseries[0], linewidth=2, color='blue')\n        plt.grid(True)\n        plt.title(cols[0])\n        plt.tight_layout()\n    else:\n        fig, ax = plt.subplots(len(timeseries), 1, figsize=(6, len(timeseries) * 1.3))\n        for i in range(len(timeseries)):\n            ax[i].plot(timeseries[i])\n            ax[i].set_title(cols[i])\n        fig.tight_layout()\n    os.makedirs(f'exp/{EXP}/fig', exist_ok=True)\n    plt.savefig(f\"exp/{EXP}/fig/{case_idx}.jpg\", format='JPG')\n    plt.close()\n\n    img_b64_str = base64.b64encode(open(f\"exp/{EXP}/fig/{case_idx}.jpg\", 'rb').read()).decode('utf-8')\n    return img_b64_str\n\ndef ask_gpt4o_with_timeseries(case_idx: int, timeseries: np.ndarray, cols: List[str], question: str) -> str:\n    openai.api_key = OPENAI_API_KEY\n    openai.base_url = OPENAI_BASE_URL\n\n    client = openai.OpenAI(api_key=openai.api_key, base_url=openai.base_url)\n\n    img_b64_str = generate_image_from_timeseries(case_idx, timeseries, cols)\n    img_type = \"image/jpeg\"\n\n    messages = [\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\"type\": \"text\", \"text\": question},\n                {\"type\": \"image_url\", \"image_url\": {\"url\": f\"data:{img_type};base64,{img_b64_str}\"}}\n            ]\n        }\n    ]\n\n    timeout_cnt = 0\n    while True:\n        if timeout_cnt > 10:\n            logger.error(\"Too many timeout!\")\n            raise RuntimeError(\"Too many timeout!\")\n        try:\n            response = client.chat.completions.create(\n                model=MODEL,\n                messages=messages,\n                timeout=20\n            )\n            # Quick check\n            res_head = response.choices[0].message.content.lower()[:20]\n            if any([i in res_head for i in [\"i'm sorry\", \"unable to\", \"sorry\", \"there was an error\", \"i cannot\", \"i can't\"]]):\n                logger.error(\"API Error: \" + res_head)\n                logger.error(\"API timeout, trying again...\")\n                time.sleep(5.0)\n                timeout_cnt += 1\n                continue\n            break\n        except Exception as err:\n            logger.error(err)\n            logger.error(\"API timeout, trying again...\")\n            timeout_cnt += 1\n\n    answer = response.choices[0].message.content\n    total_tokens = response.usage.prompt_tokens\n    return answer, total_tokens\n\ndef process_sample(args):\n    sample, idx = args\n    try:\n        timeseries = sample['timeseries']\n        cols = sample['cols']\n        question_text = sample['question']\n        label = sample['answer']\n\n        answer, total_tokens = ask_gpt4o_with_timeseries(idx, timeseries, cols, question_text)\n\n        return {\n            'idx': idx,\n            'question_text': question_text,\n            'response': answer,\n            'num_tokens': total_tokens\n        }\n    except Exception as err:\n        logger.error(err)\n        traceback.print_exc()\n        return None\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    generated_answer = []\n    os.makedirs(f'exp/{EXP}', exist_ok=True)\n    if os.path.exists(f\"exp/{EXP}/generated_answer.json\"):\n        generated_answer = json.load(open(f\"exp/{EXP}/generated_answer.json\"))\n    generated_idx = set([i['idx'] for i in generated_answer])\n\n    # Generation\n    logger.info(\"Start Generation...\")\n    idx_to_generate = [i for i in range(len(dataset)) if i not in generated_idx]\n    with Pool(processes=32) as pool:\n        results = list(tqdm(pool.imap(process_sample, [(dataset[idx], idx) for idx in idx_to_generate]), total=len(idx_to_generate)))\n\n    # Filter out None results and update generated_answer\n    generated_answer.extend([res for res in results if res is not None])\n    json.dump(generated_answer, open(f\"exp/{EXP}/generated_answer.json\", \"wt\"), ensure_ascii=False, indent=4)\n\n    # Evaluation\n    evaluate_batch_qa(dataset, generated_answer, EXP, num_workers=16)\n", "blocks": []}, {"path": "evaluation/evaluate_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport json\nimport os\nimport numpy as np\nimport re\nfrom typing import *\nfrom loguru import logger\nfrom tqdm import tqdm\nimport traceback\nfrom multiprocessing import Pool\nfrom evaluation.ragas.score import calculate_ragas_score\n\n\ndef split_sentences(text):\n    abbreviations = ['max.', 'eg.', 'Mrs.', 'Dr.', 'Mr.']\n    \n    for abbr in abbreviations:\n        escaped_abbr = re.escape(abbr)\n        text = re.sub(escaped_abbr, abbr.replace('.', '<DOT>'), text)\n\n    pattern = r'[.!?。！？,;，；](?!\\d)'\n    sentences = re.split(pattern, text)\n    \n    sentences = [s.strip().replace('<DOT>', '.') for s in sentences if s.strip()]\n    \n    return sentences\n\ndef split_period_sentences(text):\n    abbreviations = ['max.', 'eg.', 'Mrs.', 'Dr.', 'Mr.']\n    \n    for abbr in abbreviations:\n        escaped_abbr = re.escape(abbr)\n        text = re.sub(escaped_abbr, abbr.replace('.', '<DOT>'), text)\n\n    pattern = r'[.。](?!\\d)'\n    sentences = re.split(pattern, text)\n    \n    sentences = [s.strip().replace('<DOT>', '.') for s in sentences if s.strip()]\n    \n    return sentences\n\ndef match_metric_name(metric: str, sentence: str) -> bool:\n    pattern = r'[^\\u4e00-\\u9fa5a-zA-Z]'\n    sentence = re.sub(pattern, '', sentence).lower()\n    metric = re.sub(pattern, '', metric).lower()\n\n    return metric in sentence\n\ndef evaluate_trend(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = False\n    sentences = split_sentences(answer)\n\n    if len(sentences) == 0:\n        return [0.0], [0.0], [], []\n\n    if 'steady' in attribute['type']:\n        if 'steady' in sentences[0]:\n            cate_correct = True\n    elif 'decrease' in attribute['type']:\n        if 'decreas' in sentences[0].lower():\n            cate_correct = True\n    elif 'increase' in attribute['type']:\n        if 'increas' in sentences[0].lower():\n            cate_correct = True\n\n    num_correct = []\n\n    # Check start point\n    for sentence in sentences:\n        float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n        if float_numbers is None or len(float_numbers) == 0:\n            continue\n        if 'start' in sentence:\n            if abs(attribute['start']) < 0.5:\n                if abs(float_numbers[0]) < 0.5:\n                    num_correct.append(1.0)\n                else:\n                    num_correct.append(0.0)\n            else:\n                num_correct.append(max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - attribute['start']) / abs(attribute['start']))))\n            break\n    else:\n        num_correct.append(0.0)\n\n    # Check amplitude\n    if attribute['type'] != 'keep steady':\n        for sentence in sentences:\n            float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n            if float_numbers is None or len(float_numbers) == 0:\n                continue\n            if 'change value' in sentence or 'from left to right' in sentence:\n                if abs(attribute['amplitude']) < 0.5:\n                    if abs(float_numbers[0]) < 0.5:\n                        num_correct.append(1.0)\n                    else:\n                        num_correct.append(0.0)\n                else:\n                    num_correct.append(max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - attribute['amplitude']) / abs(attribute['amplitude']))))\n                break\n        else:\n            num_correct.append(0.0)\n\n    return [cate_correct], num_correct, [], []\n\ndef evaluate_season(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = False\n    sentences = split_sentences(answer)\n\n    if len(sentences) == 0:\n        return [0.0], [0.0], [], []\n\n    if 'no' in attribute['type']:\n        if 'no periodic' in sentences[0].lower():\n            cate_correct = True\n    else:\n        if 'no' not in sentences[0].lower() and 'periodic' in sentences[0].lower():\n            cate_correct = True\n\n    num_correct = []\n\n    if attribute['type'] != 'no periodic fluctuation':\n        # Check period\n        for sentence in sentences:\n            float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n            if float_numbers is None or len(float_numbers) == 0:\n                continue\n            if 'each period' in sentence:\n                num_correct.append(max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - attribute['period']) / abs(attribute['period']))))\n                break\n        else:\n            num_correct.append(0.0)\n\n        # Check amplitude\n        for sentence in sentences:\n            float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n            if float_numbers is None or len(float_numbers) == 0:\n                continue\n            if 'amplitude' in sentence:\n                num_correct.append(max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - attribute['amplitude']) / abs(attribute['amplitude']))))\n                break\n        else:\n            num_correct.append(0.0)\n    else:\n        num_correct = []\n\n    return [cate_correct], num_correct, [], []\n\ndef evaluate_noise(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = False\n    sentences = split_sentences(answer)\n\n    if len(sentences) == 0:\n        return [0.0], [0.0], [], []\n\n    if 'almost no' in attribute['type']:\n        if 'no noise' in sentences[0].lower():\n            cate_correct = True\n    else:\n        if 'noisy' in sentences[0].lower():\n            cate_correct = True\n\n    num_correct = []\n\n    # Check period\n    if 'noisy' in attribute['type']:\n        for sentence in sentences:\n            float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n            if float_numbers is None or len(float_numbers) == 0:\n                continue\n            if 'standard' in sentence.lower() or 'std' in sentence.lower():\n                num_correct.append(max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - attribute['std']) / abs(attribute['std']))))\n                break\n        else:\n            num_correct.append(0.0)\n\n    return [cate_correct], num_correct, [], []\n\ndef evaluate_local(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = []\n    num_correct = []\n\n    # Split into facts\n    for feat in attribute:\n        matched_flag = False\n        pos_numerical = 0.0\n        amp_numerical = 0.0\n        for fact in re.split(r'[;；]', answer):\n            sentences = re.split(r'[，。,;；]', fact)\n            if type(feat['type']) == str:\n                feat['type'] = [feat['type']]\n            if any(i in sentences[0].lower() for i in feat['type']):\n                # Check period and amplitude\n                for sentence in sentences:\n                    float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n                    if float_numbers is None or len(float_numbers) == 0:\n                        continue\n                    if 'position' in sentence.lower() or 'around point' in sentence.lower():\n                        if abs(float_numbers[0] - feat['position']) > 64:\n                            continue\n                        pos_numerical = max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - feat['position']) / abs(feat['position'])))\n                        matched_flag = True\n                    if matched_flag and 'amplitude' in sentence.lower():\n                        amp_numerical = max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - feat['amplitude']) / abs(feat['amplitude'])))\n                if matched_flag:\n                    break\n        cate_correct.append(matched_flag)\n        num_correct.append(pos_numerical)\n        num_correct.append(amp_numerical)\n\n    return cate_correct, num_correct, [], []\n\ndef evaluate_local_inductive(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = []\n    num_correct = []\n    reason_correct = []\n    reason_details = []\n\n    # Split into facts\n    for feat in attribute:\n        matched_flag = False\n        pos_numerical = 0.0\n        amp_numerical = 0.0\n        reason_score = 0.0\n        cur_detail = {}\n        for fact in re.split(r'[;；]', answer):\n            sentences = re.split(r'[，。,;；]', fact)\n            if type(feat['type']) == str:\n                feat['type'] = [feat['type']]\n            if any(i in sentences[0].lower() for i in feat['type']):\n                # Check period and amplitude\n                for sentence in sentences:\n                    float_numbers = list(map(float, re.findall(r'-?\\d+\\.?\\d*', sentence)))\n                    if float_numbers is None or len(float_numbers) == 0:\n                        continue\n                    if 'position' in sentence.lower() or 'around point' in sentence.lower():\n                        if abs(float_numbers[0] - feat['position']) > 64:\n                            continue\n                        pos_numerical = max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - feat['position']) / abs(feat['position'])))\n                        matched_flag = True\n                    if matched_flag and 'amplitude' in sentence.lower():\n                        amp_numerical = max(0.0, min(1.0, 1.0 - abs(float_numbers[0] - feat['amplitude']) / abs(feat['amplitude'])))\n                if matched_flag:\n                    # Evaluate the inductive\n                    reason_score, cur_detail = calculate_ragas_score(\n                        question='Please analyze the physical meaning of this local fluctuation in one sentence.',\n                        response=split_period_sentences(fact)[-1],\n                        label=feat['explain']\n                    )\n                    cur_detail.update({\n                        'label': feat['explain'],\n                        'response': split_period_sentences(fact)[-1]\n                    })\n                    break\n        cate_correct.append(matched_flag)\n        num_correct.append(pos_numerical)\n        num_correct.append(amp_numerical)\n        reason_correct.append(reason_score)\n        reason_details.append(cur_detail)\n\n    return cate_correct, num_correct, reason_correct, reason_details\n\ndef evaluate_shape_correlation_inductive(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = False\n    sentences = split_sentences(answer)\n\n    if len(sentences) == 0:\n        return [False], [], [0.0], [{}]\n\n    if attribute['label']:\n        if 'yes' in sentences[0].lower():\n            cate_correct = True\n    else:\n        if 'no' in sentences[0].lower():\n            cate_correct = True\n\n    num_correct = []\n    reason_correct, reason_detail = calculate_ragas_score(\n                        question='Explain why they are correlated/no correlated considering their physical meaning in one sentence.',\n                        response=sentences[-1],\n                        label=attribute['explain']\n                    )\n\n    return [cate_correct], num_correct, [reason_correct], [reason_detail]\n\ndef evaluate_local_correlation_inductive(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = False\n    sentences = split_period_sentences(answer)\n\n    if len(sentences) == 0:\n        return [False], [], [0.0], [{}]\n\n    if attribute['label']:\n        if 'yes' in sentences[0].lower():\n            # Check correlation type\n            label_cols = set(map(tuple, attribute['pair']))\n            answer_cols = set()\n\n            # Split into facts\n            for fact in sentences[1].split(';'):\n                items = fact.strip().split(',')\n                if len(items) == 2:\n                    for col in cols:\n                        if match_metric_name(col, items[0].strip()):\n                            answer_cols.add((col, items[1].strip()))\n\n            if label_cols == answer_cols:\n                cate_correct = True\n    else:\n        if 'no' in sentences[0].lower():\n            cate_correct = True\n\n    num_correct = []\n    reason_correct, reason_detail = calculate_ragas_score(\n                        question='Explain why they are correlated/no correlated considering their physical meaning in one sentence.',\n                        response=sentences[-1],\n                        label=attribute['explain']\n                    )\n\n    return [cate_correct], num_correct, [reason_correct], [reason_detail]\n\ndef evaluate_shape_cluster_inductive(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = 0.0\n    num_correct = []\n\n    label_cols = set(attribute['cols'])\n    answer_cols = set()\n\n    sentences = split_period_sentences(answer)\n\n    if len(sentences) == 0:\n        return [0.0], [], [0.0], [{}]\n\n    # Split into facts\n    for fact in split_period_sentences(answer)[0].split(','):\n        fact = fact.strip()\n        for col in cols:\n            if match_metric_name(col, fact):\n                answer_cols.add(col)\n\n    # Calculate f1-score for label and answer\n    tp = len(label_cols & answer_cols)\n    fp = len(answer_cols - label_cols)\n    fn = len(label_cols - answer_cols)\n    if tp + fp + fn > 0:\n        cate_correct = 2 * tp / (2 * tp + fp + fn)\n\n    num_correct = []\n    reason_correct, reason_detail = calculate_ragas_score(\n                        question='Explain why they have similar overall trend considering their physical meaning in one sentence.',\n                        response=split_period_sentences(answer)[-1],\n                        label=attribute['explain']\n                    )\n\n    return [cate_correct], num_correct, [reason_correct], [reason_detail]\n\ndef evaluate_local_cluster_inductive(answer: str, attribute: dict, cols: List[str]):\n    cate_correct = 0.0\n    num_correct = []\n\n    label_cols = set(zip(attribute['cols'], [i[1] for i in attribute['col_idx']]))\n    answer_cols = set()\n\n    sentences = split_period_sentences(answer)\n\n    if len(sentences) == 0:\n        return [0.0], [], [0.0], [{}]\n\n    # Split into facts\n    for fact in split_period_sentences(answer)[0].split(';'):\n        items = fact.strip().split(',')\n        if len(items) == 2:\n            for col in cols:\n                if match_metric_name(col, items[0].strip()):\n                    answer_cols.add((col, items[1].strip()))\n\n    # Calculate f1-score for label and answer\n    tp = len(label_cols & answer_cols)\n    fp = len(answer_cols - label_cols)\n    fn = len(label_cols - answer_cols)\n    if tp + fp + fn > 0:\n        cate_correct = 2 * tp / (2 * tp + fp + fn)\n\n    num_correct = []\n    reason_correct, reason_detail = calculate_ragas_score(\n                        question='Explain why they have similar local fluctuations considering their physical meaning in one sentence.',\n                        response=split_period_sentences(answer)[-1],\n                        label=attribute['explain']\n                    )\n\n    return [cate_correct], num_correct, [reason_correct], [reason_detail]\n\ndef evaluate_deductive(answer: str, attribute: str, cols: List[str]):\n    labels = split_sentences(attribute)\n    sentences = split_sentences(answer)\n\n    cur_reason_correct = 1.0\n    if labels[0].lower().strip() in ['yes', 'no']:\n        if sentences[0].lower().strip() != labels[0].lower().strip():\n            cur_reason_correct = 0.0\n        ragas_detail = {\"label\": labels[0], \"response\": sentences[0]}\n    else:\n        ragas_correct, ragas_detail = calculate_ragas_score(\n                            question='According to the previous information, please answer Yes or No and explain it in detail.',\n                            response=answer,\n                            label=attribute\n                        )\n        cur_reason_correct = ragas_correct\n    return [], [], [cur_reason_correct], [ragas_detail]\n\ndef evaluate_causal(answer: str, attribute: str, cols: List[str]):\n    label = split_sentences(attribute)[0].lower().strip()\n    answer_choice = split_sentences(answer)[0].lower().strip()\n    if match_metric_name(label, answer_choice):\n        reason_correct = 1.0\n    else:\n        reason_correct = 0.0\n    return [], [], [reason_correct], [{'label': label, 'response': answer_choice}]\n\ndef evaluate_MCQ2(answer: str, attribute: str, cols: List[str]):\n    if match_metric_name(attribute, answer):\n        reason_correct = 1.0\n    else:\n        reason_correct = 0.0\n    return [], [], [reason_correct], [{'label': attribute, 'response': answer}]\n\ndef ability_type_to_func(ability_type: str):\n    return eval(\"evaluate_\" + ability_type.replace('-', '_'))\n\ndef evaluate_qa(answer: str, sample: dict):\n    answer_list = re.findall(r'(?:^|\\n).*?\\d+\\.\\s*(.*?)(?=\\n.*?\\d+\\.|$)', answer, re.MULTILINE | re.DOTALL)\n    num_questions = len(sample['attributes'])\n    ability_types = sample['ability_types']\n    matched_cnt = min(len(answer_list), num_questions)\n\n    # Try match\n    if matched_cnt < num_questions and matched_cnt == 1:\n        idx_pos = []\n        for idx in range(1, num_questions + 1):\n            sub_str = f\"{idx}. \"\n            if sub_str in answer:\n                idx_pos.append(answer.index(sub_str))\n            else:\n                break\n\n        if len(idx_pos) == num_questions:\n            # Matched\n            idx_pos.append(len(answer))\n            answer_list = [answer[idx_pos[i] + len(f\"{i+1}. \"):idx_pos[i + 1]] for i in range(num_questions)]\n            matched_cnt = min(len(answer_list), num_questions)\n            print(\"[TRY MATCH]---------------------------\")\n            print(f\"[TRY MATCH] {answer_list}\")\n            print(\"[TRY MATCH]---------------------------\")\n    elif num_questions == 1 and matched_cnt == 1 and len(answer_list[0].strip()) == 0:\n        # Empty answer\n        answer_list[0] = answer.rstrip()\n        print(\"[TRY MATCH]---------------------------\")\n        print(f\"[TRY MATCH] {answer_list}\")\n        print(\"[TRY MATCH]---------------------------\")\n\n    result = {}\n\n    for i in range(len(ability_types)):\n        ability = ability_types[i]\n        evaluate_func = ability_type_to_func(ability)\n        cur_answer = answer_list[i] if i < matched_cnt else \"\"\n        cate_correct, num_correct, reason_correct, reason_detail = evaluate_func(cur_answer, sample['attributes'][i], sample['cols'])\n\n        if ability in result:\n            # Extent current result to existed\n            cate_correct = result[ability][0] + cate_correct\n            num_correct = result[ability][1] + num_correct\n            reason_correct = result[ability][2] + reason_correct\n            reason_detail = result[ability][3] + reason_detail\n        result[ability] = (cate_correct, num_correct, reason_correct, reason_detail)  \n\n    return result\n\ndef process_sample(args):\n    idx, sample, generated_answer = args\n    try:\n        label = sample['answer']\n\n        # find idx in generated answer\n        pos = -1\n        for i, item in enumerate(generated_answer):\n            if item['idx'] == idx:\n                pos = i\n                break\n        answer = generated_answer[pos]['response']\n        evaluation_result = evaluate_qa(answer, sample)\n\n        return {\n            'idx': idx,\n            'label': label,\n            'response': answer,\n            'evaluation': evaluation_result\n        }\n    except Exception as err:\n        logger.error(err)\n        traceback.print_exc()\n        return None\n\ndef evaluate_batch_qa(dataset, generated_answer, EXP, num_workers=8):\n    detailed_result = []\n    ability_result = {'categorical': {}, 'numerical': {}, 'reason': {}}\n    overall_result = {'categorical': [], 'numerical': [], 'reason': []}\n\n    # Evaluation\n    logger.info(\"Start evaluation...\")\n\n    with Pool(processes=num_workers) as pool:\n        results = list(tqdm(pool.imap(process_sample, [(idx, dataset[idx], generated_answer) for idx in range(len(dataset))]), total=len(dataset)))\n\n    for result in results:\n        if result is None:\n            continue\n\n        detailed_result.append(result)\n        evaluation_result = result['evaluation']\n\n        # Parse naive result\n        for ability, (cate_correct, num_correct, reason_correct, reason_detail) in evaluation_result.items():\n            ability_result['categorical'].setdefault(ability, [])\n            ability_result['numerical'].setdefault(ability, [])\n            ability_result['reason'].setdefault(ability, [])\n\n            ability_result['categorical'][ability].extend(cate_correct)\n            ability_result['numerical'][ability].extend(num_correct)\n            ability_result['reason'][ability].extend(reason_correct)\n\n            overall_result['categorical'].extend(cate_correct)\n            overall_result['numerical'].extend(num_correct)\n            overall_result['reason'].extend(reason_correct)\n\n    # Calculate tokens\n    total_tokens = 0\n    for item in generated_answer:\n        total_tokens += item.get('num_tokens', 0)\n\n    logger.info(f\"[RESULT] -----------------------------------------------------------------\")\n    logger.info(f\"[RESULT] Experiment: {EXP}\")\n    logger.info(f\"[RESULT] Total: {len(dataset)}, Success Evaluation: {len(detailed_result)}\")\n    logger.info(f\"[RESULT] Detailed Categorical: {[(k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['categorical'].items()]}\")\n    logger.info(f\"[RESULT] Detailed Numerical: {[(k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['numerical'].items()]}\")\n    logger.info(f\"[RESULT] Detailed Reason: {[(k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['reason'].items()]}\")\n    logger.info(f\"[RESULT] Overall Categorical: {round(float(np.mean(overall_result['categorical'])), 4)}; Overall Numerical: {round(float(np.mean(overall_result['numerical'])), 4)}; Overall Reason: {round(float(np.mean(overall_result['reason'])), 4)}\")\n    logger.info(f\"[RESULT] Consumed tokens: {total_tokens}\")\n    logger.info(f\"[RESULT] -----------------------------------------------------------------\")\n\n    # Save Result\n    json.dump(detailed_result, open(f\"exp/{EXP}/detailed_result.json\", \"wt\"), ensure_ascii=False, indent=4)\n    json.dump({\n        'detail_categorical': dict((k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['categorical'].items()),\n        'detail_numerical': dict((k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['numerical'].items()),\n        'detail_reason': dict((k, round(float(np.mean(v)), 4)) for (k, v) in ability_result['reason'].items()),\n        'overall_categorical': round(float(np.mean(overall_result['categorical'])), 4),\n        'overall_numerical': round(float(np.mean(overall_result['numerical'])), 4),\n        'overall_reason': round(float(np.mean(overall_result['reason'])), 4),\n        'consumed_tokens': total_tokens\n    }, open(f\"exp/{EXP}/result.json\", \"wt\"), ensure_ascii=False, indent=4)\n", "blocks": []}, {"path": "evaluation/evaluate_tsmllm_models.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport openai\nimport base64\nimport matplotlib.pyplot as plt\nfrom loguru import logger\nimport numpy as np\nimport json\nimport os\nfrom tqdm import tqdm\nimport traceback\nfrom typing import *\nimport io\n\nfrom evaluation.evaluate_qa import evaluate_batch_qa\n\n# CONFIG\nEXP = 'chatts_dataset_a'\nDATASET = 'evaluation/dataset/dataset_a.json'\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    # Load from existing generation\n    generated_answer = [{} for _ in range(len(dataset))]\n    for file in os.listdir(f\"exp/{EXP}\"):\n        if 'generated_answer' in file and file.endswith('.json'):\n            cur_answer = json.load(open(os.path.join(f\"exp/{EXP}\", file)))\n            for ans in cur_answer:\n                generated_answer[ans['idx']] = ans\n    \n    # Evaluation\n    evaluate_batch_qa(dataset, generated_answer, EXP, num_workers=16)\n", "blocks": []}, {"path": "evaluation/ragas/config.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport os\nimport sys\nimport logging\nfrom pip._vendor import tomli\nfrom langchain_core.language_models import BaseLanguageModel\nfrom langchain_core.embeddings import Embeddings\n\nCONFIG_PATH = os.getenv('CONFIG_PATH', os.path.join(os.path.dirname(os.path.abspath(__file__)), './config/config.toml'))\n\nlogger = logging.getLogger(__name__)\n\n\ndef load_config() -> dict:\n    if not os.path.exists(CONFIG_PATH):\n        logger.error(f'Config file does not exist: {CONFIG_PATH}')\n        sys.exit(1)\n\n    with open(CONFIG_PATH, 'r') as f:\n        cfg = tomli.loads(f.read())\n    \n    return cfg\n\n\nconfig = load_config()\n\n\ndef load_llm() -> BaseLanguageModel:\n    models_config = config.get('models')\n    llm_type = models_config.get('llm_type', 'openai')\n    if llm_type == 'openai':\n        os.environ[\"OPENAI_API_BASE\"] = models_config.get('openai_api_base', '')\n        os.environ[\"OPENAI_API_KEY\"] = models_config.get('openai_api_key', '')\n\n        from langchain_openai.chat_models import ChatOpenAI\n\n        return ChatOpenAI(model=models_config.get('llm_model', 'gpt-3.5-turbo-16k'))\n    \n    elif llm_type == 'tongyi':\n        os.environ[\"DASHSCOPE_API_KEY\"] = models_config.get('dashscope_api_key', '')\n\n        from langchain_community.chat_models.tongyi import ChatTongyi\n\n        return ChatTongyi(model=models_config.get('llm_model', 'qwen1.5-72b-chat'))\n\n    elif llm_type == 'glm':\n        os.environ[\"OPENAI_API_BASE\"] = models_config.get('openai_api_base', '')\n        os.environ[\"OPENAI_API_KEY\"] = models_config.get('openai_api_key', '')\n        from langchain_community.chat_models import ChatZhipuAI\n\n        model = ChatZhipuAI(\n            temperature=models_config.get('temperature', 1),\n            api_key=models_config.get('openai_api_key', ''),\n            model=models_config.get('llm_model', 'gpt-3.5-turbo-16k')\n        )\n        return model\n\n    logger.error(f'Unsupported LLM model: {llm_type}')\n    sys.exit(1)\n\n\ndef load_embeddings() -> Embeddings:\n    embedding_config = config.get('embedding')\n    emb_type = embedding_config.get('emb_type', 'openai')\n    if emb_type == 'openai':\n        os.environ[\"OPENAI_API_BASE\"] = embedding_config.get('openai_api_base', '')\n        os.environ[\"OPENAI_API_KEY\"] = embedding_config.get('openai_api_key', '')\n\n        from langchain_openai.embeddings import OpenAIEmbeddings\n        \n        return OpenAIEmbeddings(model=embedding_config.get('embeddings_model', 'text-embedding-ada-002'))\n    \n    elif emb_type == 'dashscope':\n        os.environ[\"DASHSCOPE_API_KEY\"] = embedding_config.get('dashscope_api_key', '')\n\n        from langchain_community.embeddings.dashscope import DashScopeEmbeddings\n\n        return DashScopeEmbeddings(model=embedding_config.get('embeddings_model', 'text-embedding-v2'))\n    logger.error(f'Unsupported Embeddings model: {emb_type}')\n    sys.exit(1)", "blocks": []}, {"path": "evaluation/ragas/config/config.toml", "language": "ini", "note_zh": "", "note_en": "", "code": "data_dir = \"./evaluation/ragas/data\"\ndefault_quota = 150\nsubmission_interval = 10\n[judge]\nenabled = true\nmax_workers = 8\ncorrect_threshold = 0.6\nmax_retries = 3\nmax_execution_time = 60\nreport_metric = \"score\"\n[langsmith]\nenabled = false\napi_key = \"\"\nproject_name = \"\"\nendpoint = \"https://api.smith.langchain.com\"\n[models]\nllm_type = \"openai\"\nllm_model = \"gpt-4o-mini\"\nopenai_api_base = \"[YOUR_OPENAI_URL]\"\nopenai_api_key = \"[YOUR_OPENAI_APIKEY]\"\n\ndashscope_api_key = \"none\"\n\n[embedding]\nopenai_api_key = \"[YOUR_OPENAI_APIKEY]\"\nopenai_api_base = \"[YOUR_OPENAI_URL]\"\n\n[cms]\nenabled = false\ninterval = 10\ncontest_id = \"\"\nusername = \"\"\npassword = \"\"\n", "blocks": []}, {"path": "evaluation/ragas/metric.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n# Reference (RAGAS): https://github.com/explodinggradients/ragas\n\nimport logging\nimport difflib\nimport typing as t\nfrom dataclasses import dataclass, field\nimport multiprocessing\nimport numpy as np\nfrom ragas.llms.json_load import json_loader\nfrom ragas.llms.prompt import Prompt\nfrom ragas.metrics._answer_similarity import AnswerSimilarity\nfrom ragas.metrics.base import EvaluationMode, MetricWithEmbeddings, MetricWithLLM\nfrom filelock import FileLock\nfrom ragas.run_config import RunConfig\nfrom evaluation.ragas.config import config\nimport json\nimport os\n\nlogger = multiprocessing.get_logger()\n\n# Path to cache file\nDATA_DIR = config.get('data_dir', 'data').rstrip('/')\nCACHE_PATH = os.path.join(DATA_DIR, 'gt_cache.json')\nCACHE_LOCK_PATH = CACHE_PATH.replace('.json', '.lock')\n\ndef load_cache():\n    # logger.info(\"Loading cache\")\n    if os.path.exists(CACHE_PATH):\n        with FileLock(CACHE_LOCK_PATH):\n            with open(CACHE_PATH, 'r') as f:\n                return json.load(f)\n    return {}\n\ndef save_cache(cache):\n    # logger.info(\"Saving cache\")\n    with FileLock(CACHE_LOCK_PATH):\n        if os.path.exists(CACHE_PATH):\n            with open(CACHE_PATH, 'r') as f:\n                cache.update(json.load(f))\n        with open(CACHE_PATH, 'w') as f:\n            json.dump(cache, f, ensure_ascii=False, indent=4)\n\nasync def get_gt_keywords(llm, question, groundtruth, callbacks, is_async):\n    cache = load_cache()\n    cache_key = json.dumps(question, ensure_ascii=False) + '|||' + json.dumps(groundtruth, ensure_ascii=False)\n\n    if cache_key in cache:\n        return cache[cache_key]\n\n    # Use the LLM to generate gt_keywords\n    gt_keywords = await generate_gt_keywords_with_llm(llm, question, groundtruth, callbacks, is_async)\n\n    cache[cache_key] = gt_keywords\n    save_cache(cache)\n\n    return gt_keywords\n\nasync def generate_gt_keywords_with_llm(llm, question, groundtruth, callbacks, is_async):\n    prompt = GT_PROMPT.format(**{\n        \"question\": question,\n        \"ground_truth\": groundtruth\n    })\n    response = llm.generate([prompt], callbacks=callbacks)\n    response = await json_loader.safe_load(\n        response.generations[0][0].text, llm, is_async=is_async\n    )\n    if 'gt_keywords' in response and type(response['gt_keywords']) == list:\n        result = []\n        # Remove keywords from questions\n        for key in response['gt_keywords']:\n            if key.lower
