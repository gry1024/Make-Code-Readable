<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatTS · Make Code Readable</title>
<style>:root {
  --bg: #FAF9F5;
  --bg-sidebar: #F3F1EA;
  --bg-header: #F7F5EF;
  --bg-hover: #F1EDE2;
  --bg-pinned: #FDF3D7;
  --bg-block-header: #F0EEE6;
  --border: #E4E0D5;
  --text: #3B3A36;
  --text-dim: #8A8578;
  --text-faint: #B3ADA0;
  --accent: #6B5CE7;
  --accent-soft: #EEEBFB;
  --code-font-size: 13px;
  --exp-font-size: 13.5px;
  --mono: "Cascadia Code", "SF Mono", "Fira Code", "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
}
.hidden { display: none !important; }
button { font-family: var(--ui); cursor: pointer; }
.spacer { flex: 1; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 14px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#brand { font-weight: 600; font-size: 13px; letter-spacing: .2px; color: var(--text-dim); white-space: nowrap; }
#crumb {
  margin-left: 10px; font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#topbar button {
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; line-height: 1.4;
  transition: background .12s, color .12s;
}
#topbar button:hover { background: var(--bg-hover); color: var(--text); }
#sidebar-toggle { border: none !important; font-size: 15px; padding: 4px 8px; }
#lang-toggle { font-weight: 600; }

/* ---------- layout ---------- */
#main { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 264px; flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 0;
}
#sidebar.collapsed { display: none; }
#repo-name {
  font-weight: 600; font-size: 12px; color: var(--text-dim);
  padding: 0 16px 8px; text-transform: uppercase; letter-spacing: .6px;
}
#overview-btn {
  display: block; width: calc(100% - 24px); margin: 0 12px 10px;
  text-align: left; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); color: var(--accent);
  padding: 7px 12px; font-size: 12.5px; font-weight: 600;
}
#overview-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- IDE file tree ---------- */
.tree-dir, .tree-file {
  display: flex; align-items: center; width: 100%; text-align: left;
  border: none; background: none; padding: 3px 12px 3px 0;
  font-size: 12.5px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-dir { font-weight: 600; color: #6E675A; }
.tree-dir .arrow { display: inline-block; width: 14px; color: var(--text-faint); font-size: 10px; }
.tree-dir:hover, .tree-file:hover { background: var(--bg-hover); color: var(--text); }
.tree-file { font-family: var(--mono); font-size: 12px; }
.tree-file.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.tree-file.disabled { opacity: .38; cursor: default; }
.tree-file.disabled:hover { background: none; color: var(--text-dim); }
.ann-dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  margin-left: auto; flex-shrink: 0;
}

#content { flex: 1; overflow: auto; min-width: 0; }

#file-note {
  display: none;
  margin: 14px 20px 0; padding: 10px 14px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 8px; font-size: 12.5px;
}
#file-note.visible { display: block; }

/* ---------- overview ---------- */
#overview { padding: 26px 34px 60px; max-width: 1100px; }
.ov-head h2 { margin: 0 0 10px; font-size: 22px; }
.ov-summary { font-size: 14px; line-height: 1.8; color: #5B564B; max-width: 760px; }
.ov-summary code, .ov-desc code {
  font-family: var(--mono); font-size: .92em;
  background: #EDEAE0; color: var(--accent); border-radius: 4px; padding: 0 4px;
}
.ov-stats { margin: 12px 0 22px; font-size: 12px; color: var(--text-dim); }
.ov-tree { border-top: 1px solid var(--border); }
.ov-row {
  display: flex; align-items: baseline; gap: 14px;
  padding: 5px 8px; border-bottom: 1px solid #F0EDE4;
}
.ov-dir .ov-name { font-weight: 600; color: #6E675A; font-size: 13px; }
.ov-file .ov-name { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
.ov-file .ov-name.annotated { color: var(--accent); font-weight: 600; }
.ov-file.clickable { cursor: pointer; }
.ov-file.clickable:hover { background: var(--bg-hover); }
.ov-file.clickable:hover .ov-name { color: var(--accent); }
.ov-desc { font-size: 12.5px; color: #7A7263; line-height: 1.6; }

/* ---------- reading grid ---------- */
#reading { padding: 10px 0 40vh; }
.block { margin: 0 0 6px; }
.block-header {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 20px;
  background: var(--bg-block-header);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.block-header .range {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  flex-shrink: 0; min-width: 74px;
}
.block-header .summary { font-size: 12.5px; font-weight: 600; color: #6B6350; }
.block-header:hover .summary { color: var(--accent); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row .code-cell {
  display: flex; min-width: 0;
  border-right: 1px solid var(--border);
  font-family: var(--mono); font-size: var(--code-font-size); line-height: 1.65;
  font-variant-ligatures: none;
}
.row .lineno {
  flex-shrink: 0; width: 52px; padding: 1px 14px 1px 0;
  text-align: right; color: var(--text-faint); user-select: none;
  font-size: calc(var(--code-font-size) - 1.5px); line-height: inherit;
}
.row .code {
  flex: 1; min-width: 0; padding: 1px 16px 1px 0;
  white-space: pre-wrap; word-break: break-all; tab-size: 4;
}
.row .exp-cell {
  min-width: 0; padding: 1px 24px 1px 20px;
  font-size: var(--exp-font-size); line-height: 1.65; color: #4E4A40;
  overflow-wrap: break-word;
}
.row .exp-cell:empty::after { content: " "; }
.row .exp-cell code {
  font-family: var(--mono); font-size: calc(var(--exp-font-size) - 1px);
  background: #EDEAE0; color: #6B5CE7;
  border-radius: 4px; padding: 0 4px;
}
.row .exp-cell strong { color: #3B3A36; }
.block-header .summary code {
  font-family: var(--mono); font-size: 11.5px;
  background: #E7E3D8; border-radius: 4px; padding: 0 4px;
}
.row:hover { background: var(--bg-hover); }
.row:hover .lineno { color: var(--text-dim); }
.row.pinned { background: var(--bg-pinned); }
.block.focused .row { background: var(--bg-hover); }

/* raw (unannotated) file view: code takes the full width */
#reading.raw .row { grid-template-columns: minmax(0, 1fr); }
#reading.raw .row .code-cell { border-right: none; }
#reading.raw .row .exp-cell { display: none; }

/* ---------- syntax highlighting: Cursor / VS Code Light+ palette ---------- */
.hljs-comment, .hljs-quote { color: #008000; font-style: normal; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: #0000FF; }
.hljs-string, .hljs-regexp, .hljs-addition { color: #A31515; }
.hljs-number, .hljs-symbol, .hljs-bullet { color: #098658; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #795E26; }
.hljs-title.class_, .hljs-built_in { color: #267F99; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #001080; }
.hljs-name, .hljs-selector-id, .hljs-selector-class { color: #267F99; }
.hljs-meta { color: #AF00DB; }
.hljs-params { color: #3B3A36; }
.hljs-deletion { color: #C0392B; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }

/* ---------- ask AI ---------- */
#ask-panel {
  position: fixed; right: 24px; bottom: 24px; z-index: 40;
  width: 640px; max-width: calc(100vw - 48px); height: 76vh; max-height: calc(100vh - 48px);
  display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 12px 48px rgba(60, 55, 40, .18);
  overflow: hidden;
}
#ask-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-header); font-weight: 600; font-size: 13px; color: var(--accent);
}
#ask-close { border: none; background: none; font-size: 20px; color: var(--text-dim); line-height: 1; }
#ask-context {
  padding: 8px 16px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
  max-height: 110px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
#ask-messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
.msg { margin-bottom: 16px; font-size: 13.5px; line-height: 1.75; }
.msg .role { font-size: 11px; font-weight: 600; color: var(--text-faint); margin-bottom: 4px; }
.msg.user .body {
  background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
}
.msg.ai .body { white-space: normal; }
.msg.ai .body code, .msg.ai .body pre {
  font-family: var(--mono); font-size: 12px; background: var(--bg-sidebar);
  border-radius: 4px; padding: 1px 5px;
}
.msg.ai .body pre { padding: 10px 12px; overflow-x: auto; white-space: pre; }
.msg.ai .body pre code { background: none; padding: 0; }
.msg .thinking { color: var(--text-faint); font-style: italic; }
#ask-input-row {
  display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
}
#ask-input {
  flex: 1; resize: none; border: 1px solid var(--border); border-radius: 8px;
  background: #fff; color: var(--text); font-family: var(--ui); font-size: 13px;
  padding: 8px 10px; outline: none;
}
#ask-input:focus { border-color: var(--accent); }
#ask-send {
  border: none; border-radius: 8px; background: var(--accent); color: #fff;
  padding: 0 14px; font-size: 14px;
}
#ask-send:disabled { opacity: .4; cursor: default; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #D8D3C5; border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #C4BEAD; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: #D9D2F5; }

@media (max-width: 900px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .code-cell { border-right: none; }
  .row .exp-cell { padding-left: 68px; padding-bottom: 6px; color: #7A7263; }
  #sidebar { position: absolute; z-index: 10; height: 100%; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="sidebar-toggle" title="Toggle file tree">☰</button>
    <div id="brand">Make Code Readable</div>
    <div id="crumb"></div>
    <div class="spacer"></div>
    <button id="lang-toggle" title="Switch language">EN</button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
  </header>
  <div id="main">
    <nav id="sidebar">
      <div id="repo-name"></div>
      <button id="overview-btn">▦ <span id="overview-label">仓库总览</span></button>
      <div id="file-tree"></div>
    </nav>
    <div id="content">
      <div id="file-note"></div>
      <div id="overview" class="hidden"></div>
      <div id="reading"></div>
    </div>
  </div>
</div>

<div id="ask-panel" class="hidden">
  <div id="ask-header">
    <span>✦ <span class="ask-title">代码解读</span></span>
    <button id="ask-close">×</button>
  </div>
  <div id="ask-context"></div>
  <div id="ask-messages"></div>
  <div id="ask-input-row">
    <textarea id="ask-input" rows="2" placeholder=""></textarea>
    <button id="ask-send">➤</button>
  </div>
</div>

<script>window.MCR_DATA = {"repo": "ChatTS", "generated": "2026-11-25 01:53", "files": [{"path": "README.md", "language": "markdown", "note_zh": "", "note_en": "", "code": "<div align=\"center\">\n\n# ChatTS: Time Series LLM for Understanding and Reasoning\n\n[[🌐 **Web Demo**]](https://huggingface.co/spaces/xiezhe22/ChatTS) ·\n[[🤗 **ChatTS-14B Model**]](https://huggingface.co/bytedance-research/ChatTS-14B) ·\n[[📄 **Paper**]](https://www.vldb.org/pvldb/vol18/p2385-xie.pdf) ·\n[[🪧 **Slides**]](https://netman.aiops.org/wp-content/uploads/2026/04/ChatTS_VLDB25_pre.pptx) ·\n[[🌐 **Website**]](https://netmanaiops.github.io/ChatTS/)\n\n[[🧰 **Training Scripts**]](https://github.com/xiezhe-24/ChatTS-Training) ·\n[[📚 **Training Datasets**]](https://huggingface.co/datasets/ChatTSRepo/ChatTS-Training-Dataset) ·\n[[🧪 **Evaluation Datasets**]](https://doi.org/10.5281/zenodo.14349206)\n\n<\/div>\n\nThis repository provides official implementation of ChatTS, along with the training datasets and checkpoints for *[VLDB’25] paper: ChatTS: Aligning Time Series with LLMs via Synthetic Data for Enhanced Understanding and Reasoning*.\n`ChatTS` is a Time Series Multimodal LLM (TS-MLLM) with **question-answering** capabilities that focuses on native **understanding** and **reasoning** over time series, just like vision/video/audio MLLMs.\n\n![Chat](figures/chat_example.png)\n\nSee the [Case Studies](#case-studies) for more real-world applications and sample conversations.\n\n---\n\n## What ChatTS Does\n\n* ✅ **Conversational understanding + reasoning:**\n  Interactively explore structure, changes, and relationships across series.\n\n* ✅ **Native multivariate support:**\n  Works with multiple time series **of different lengths** and **flexible dimensionality** in one prompt.\n\n* ✅ **Value-related QA:**\n  ChatTS retains **raw numerical values** so the model can answer questions like\n  *“How large is the spike at timestamp *t*?”*\n\n* ✅ **Easy integration:**\n  Plug into standard LLM pipelines; supports Transformers and vLLM (see the instructions below).\n\n**Example application**\nSee `figures/chat_example.png` and the **Case Studies** section for real-world scenarios and conversation examples.\n\n---\n\n## News\n\n* **2025/11/03**: We release the new [ChatTS-8B](https://huggingface.co/bytedance-research/ChatTS-8B) model for efficient training and deployment.\n* **2025/10/23**: The [official website of ChatTS](https://netmanaiops.github.io/ChatTS/) launched.\n* **2025/08/01**: `ChatTS-14B-0801` model launched with enhanced reasoning compability and Chinese support.\n* **2025/07/24**: Web Demo launched on Hugging Face Spaces.\n* **2025/07/03**: Released `ChatTS-14B-GPTQ-Int4` on Hugging Face.\n* **2025/04/29**: Updated data generation code and released baseline implementations; see **Evaluation**.\n* **2025/04/16**: ChatTS accepted by VLDB’25 and training datasets released.\n* **2025/01/01**: New ChatTS release with enhanced CoT & QA capability.\n* **2024/12/30**: Experimental vLLM support (KV cache & `AutoProcessor` enabled).\n\n---\n\n## Quick Start\n\n### 1) Try It in the Browser (no install)\nUse the Web Demo on Hugging Face Spaces:  \n**👉 [ChatTS Web Demo](https://huggingface.co/spaces/xiezhe22/ChatTS)**  \nYou can upload your `.csv` file (example: `demo/ts_example.csv`) and chat with ChatTS-8B/14B about your data.\n\n### 2) Install & Prepare\n**Requirements (for inference):** `python==3.11` and `pip install -r requirements.txt`.  \n**Hardware:** Use a GPU with sufficient memory for 8B or 14B LLMs and ensure your GPU supports Flash-Attention (e.g., A100/A800 are recommended).\n\n**Steps**\n1. **Download model weights**: Download any one of the following models and Unzip into `./ckpt/` (files like `ckpt/config.json`, etc.):\n  - Choice 1: [ChatTS-8B on Hugging Face](https://huggingface.co/bytedance-research/ChatTS-8B)\n  - Choice 2: [ChatTS-14B on Hugging Face](https://huggingface.co/bytedance-research/ChatTS-14B)\n2. (**Optional for local evaluation**) Download evaluation datasets to `evaluation/dataset/`:  \n   - `dataset_a.json`, `dataset_b.json` from [Zenodo](https://doi.org/10.5281/zenodo.14349206).\n\n### 3) Deploy with Transformers\nChatTS supports **Value-Preserved Time Series Encoding** via `AutoProcessor` and an `sp` mask for variable-length batches.\n\n```python\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, AutoProcessor\nimport torch\nimport numpy as np\n\n# Load the model, tokenizer and processor\nMODEL_PATH = \"./ckpt\"\nmodel = AutoModelForCausalLM.from_pretrained(MODEL_PATH, trust_remote_code=True, device_map=0, torch_dtype='float16')\ntokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, trust_remote_code=True)\nprocessor = AutoProcessor.from_pretrained(MODEL_PATH, trust_remote_code=True, tokenizer=tokenizer)\n# Create batch prompts and multivariate time series\n# Note: For batch inference with multiple MTS, flatten the list of time series (concatenate lists)\ntimeseries1 = [np.random.normal(size=(100,)), np.random.normal(size=(150,))]\ntimeseries2 = [np.random.normal(size=(120,)), np.random.normal(size=(120,))]\n\nprompts = [\n    \"I have time series 1: <ts><ts/> and time series 2: <ts><ts/>. Do both the time series keep steady?\",\n    \"I have time series 3: <ts><ts/> and time series 4: <ts><ts/>. Do both the time series keep increasing?\"\n]\n\n# Apply Chat Template\nformatted_prompts = [\n    f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|>\\n<|im_start|>user\\n{p}<|im_end|>\\n<|im_start|>assistant\\n\"\n    for p in prompts\n]\n\n# Convert to tensor. Important: timeseries input is a flat list of all series in the batch\ninputs = processor(text=formatted_prompts, timeseries=timeseries1 + timeseries2, padding=True, return_tensors=\"pt\")\n\n# Move to GPU\ninputs = {k: v.to(0) for k, v in inputs.items()}\n\n# Model Generate\noutputs = model.generate(**inputs, max_new_tokens=300)\nprint(tokenizer.batch_decode(outputs[:, inputs['input_ids'].shape[1]:], skip_special_tokens=True))\n```\n\n**Notes**\n\n* Recommended time series length: **64–1024**; up to **30** series per input. Very short series (<64) may be less reliable (to be improved).\n* See `demo/demo_hf.ipynb` for more examples.\n\n### 4) vLLM Inference\n\n`vLLM` does not natively ship ChatTS support. We provide a registration patch. Refer to [demo_vllm.py](demo/demo_vllm.py) for detailed usage.\n\nBasic usage: Before loading with vLLM, **register ChatTS** with `chatts.vllm.chatts_vllm`:\n\n```python\n# (IMPORTANT) Make sure to import chatts_vllm\nimport chatts.vllm.chatts_vllm\nfrom vllm import LLM, SamplingParams\n\nMODEL_PATH = \"./ckpt\"\nlanguage_model = LLM(\n    model=MODEL_PATH,\n    trust_remote_code=True,\n    max_model_len=6000,\n    tensor_parallel_size=1,\n    gpu_memory_utilization=0.95,\n    limit_mm_per_prompt={\"timeseries\": 50}\n)\n\nts_list = [...]  # list of np.ndarray time series\nprompt = \"...(chat template applied)...\"\n\noutputs = language_model.generate([{\n  \"prompt\": prompt,\n  \"multi_modal_data\": {\"timeseries\": ts_list}\n}], sampling_params=SamplingParams(max_tokens=300))\n```\n\n**Note:** If you encounter problems when starting multiple workers with `vllm`, remember to use the environment variables: `VLLM_WORKER_MULTIPROC_METHOD=spawn VLLM_ALLOW_INSECURE_SERIALIZATION=1 python3 -m demo.demo_vllm`\n\n### 5) OpenAI API-Compatible Server (vLLM)\n\nYou can deploy an OpenAI API–compatible server using vLLM:\n\n* **(IMPORTANT)** Reinstall a modified vLLM build with the following command. Note that this will uninstall the previously installed vllm and PyTorch. You will be asked to input the path to the install location.\n```sh\nbash scripts/install_vllm_server.sh\n```\n\n* Start the server:\n\nExample command to start serving (set the correct model path and port before starting the server):\n\n```bash\nbash scripts/start_vllm_server.sh\n```\n\nWe provide a demo at [demo/vllm_api.py](demo/vllm_api.py) to show how to call the API for ChatTS.\n\n---\n\n## Training (Build Your Own)\n\nWe provide a full pipeline and **two modes** for generating data:\n\n- Before data generation, set `local_llm_path` to the path of any local LLMs (`Qwen2.5-32B-Instruct` is recommended) in `config/datagen_config.yaml`.\n\n### Data Generation Steps\n\n1. **Alignment datasets**\n\n   * Configure the backend, then run:\n\n   ```bash\n   bash scripts/generate_align_datasets.sh\n   ```\n\n2. **SFT datasets**\n\n   * LLM-generated seed QAs:\n\n   ```bash\n   python3 -m chatts.sft.generate_llm_qa\n   ```\n\n   * **TSEvol** to expand datasets (supports local LLM or remote APIs):\n\n   ```bash\n   python3 -m chatts.sft.generate_tsevol_dataset\n   ```\n\n   * **IFT (Instruction-Following)** datasets (requires alignment labels first):\n\n   ```bash\n   python3 -m chatts.sft.generate_ift_dataset\n   ```\n\n**Sequence length**: configure `SEQ_LEN` in `config/datagen_config.yaml`. ChatTS commonly uses length **256** (we also mix other lengths via `seq_len=null`).\n\n**Enhanced SFT**\n(Optional) Scripts for diversified SFT data:\n\n* `generate_uts_reason.py` (English univariate reasoning)\n* `generate_uts_reason_cn.py` (Chinese univariate reasoning w/ consistency checks)\n* `generate_mts_reason.py` (multivariate reasoning)\n* `generate_rewrite_dataset.py` (augmentation by rewriting)\n\nRun all at once:\n\n```bash\nbash scripts/generate_enhanced_sft_datasets.sh\n```\n\n### Model Training\nUse **ChatTS-Training** (modified from LLaMA-Factory):\n👉 [https://github.com/xiezhe-24/ChatTS-Training](https://github.com/xiezhe-24/ChatTS-Training) and refer to the steps in the README.\n\n---\n\n## Evaluation\n\n### Step 1: Generate Inference Outputs\n\n* **vLLM Inference**:\n\n```bash\nVLLM_WORKER_MULTIPROC_METHOD=spawn VLLM_ALLOW_INSECURE_SERIALIZATION=1 python3 -m chatts.utils.inference_tsmllm_vllm\n```\n\nOutputs are written under `exp/`.\n\n### Step 2: Compute Metrics\n\n* Install `ragas==0.1.9`.\n* Set `API_KEY` and `OPENAI_URL` in `evaluation/ragas/config/config.toml`.\n* Run:\n\n```bash\npython3 -m evaluation.evaluate_tsmllm_models\n```\n\n(We also include code to evaluate text/vision/agent LLM baselines; see `evaluation/` for details.)\n\n---\n\n## Time Series Generator\n\nA user-friendly generator produces attribute pools and corresponding series.\nSee `demo/demo_ts_generator.ipynb`.\n\n---\n\n## Resource Links\n\n| Resource                    | Link                                                                                                                                     | Description                   |\n| --------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------- | ----------------------------- |\n| **Paper (VLDB’25)**         | [https://www.vldb.org/pvldb/vol18/p2385-xie.pdf](https://www.vldb.org/pvldb/vol18/p2385-xie.pdf)                                                                     | ChatTS paper                  |\n| **ChatTS-8B-1103 Model** | [https://huggingface.co/bytedance-research/ChatTS-8B](https://huggingface.co/bytedance-research/ChatTS-8B)                             | Model weights                 |\n| **ChatTS-14B-0801 Model** | [https://huggingface.co/bytedance-research/ChatTS-14B](https://huggingface.co/bytedance-research/ChatTS-14B)                             | Model weights                 |\n| **ChatTS-8B-GPTQ-Int4**    | [https://huggingface.co/xiezhe24/ChatTS-8B-GPTQ-Int4](https://huggingface.co/xiezhe24/ChatTS-8B-GPTQ-Int4)                             | Quantized model               |\n| **ChatTS-14B-GPTQ-Int4**    | [https://huggingface.co/xiezhe24/ChatTS-14B-GPTQ-Int4](https://huggingface.co/xiezhe24/ChatTS-14B-GPTQ-Int4)                             | Quantized model               |\n| **Training Datasets**       | [https://huggingface.co/datasets/ChatTSRepo/ChatTS-Training-Dataset](https://huggingface.co/datasets/ChatTSRepo/ChatTS-Training-Dataset) | Synthetic training set        |\n| **Evaluation Datasets**     | [https://doi.org/10.5281/zenodo.14349206](https://doi.org/10.5281/zenodo.14349206)                                                       | Real & synthetic eval data    |\n| **Training Scripts**        | [https://github.com/xiezhe-24/ChatTS-Training](https://github.com/xiezhe-24/ChatTS-Training)                                             | Fine-tuning & data generation |\n\n---\n\n## Third-Party Dependencies\n\n* Qwen ([https://github.com/QwenLM/Qwen2.5](https://github.com/QwenLM/Qwen2.5))\n* DeepSpeed ([https://www.deepspeed.ai/](https://www.deepspeed.ai/))\n* RAGAS ([https://github.com/explodinggradients/ragas](https://github.com/explodinggradients/ragas))\n* vLLM ([https://github.com/vllm-project/vllm](https://github.com/vllm-project/vllm))\n* Flash-Attention ([https://github.com/Dao-AILab/flash-attention](https://github.com/Dao-AILab/flash-attention))\n\n---\n\n## ChatTS Design\n![image](figures/model_structure.png)\nChatTS is a TS-MLLM (Time Series Multimodal MLLM) built natively for Multivariate Time Series (MTS). ChatTS takes MTS and textual queries as input, first separating and processing each modality individually. The time series are split into fixed-size patches encoded via a time series encoder. The encoded time series patches are concatenated with text tokens at the token level based on their original input positions, preserving contextual relationships before being fed into the LLM for unified multimodal understanding and response generation.\n\n---\n\n## Evaluation\n![image](figures/evaluation.png)\n`ChatTS` achieves advantages over both text/vision (image)/agent-based LLMs, with up to 46–76% gains on categorical and 80–113% improvements on numerical alignment tasks compared with `GPT-4o`, while using much fewer tokens. With the native time series modality, ChatTS not only understands fine-grained temporal patterns more precisely, but also provides a far more efficient and scalable foundation for multimodal time-series analysis and reasoning.\n\n---\n\n## Case Studies\n![image](figures/case_studies.png)\nIn `ChatTS`, we mainly focus on **Understanding and Reasoning** about time series, just like what vision/video/audio-MLLMs do, rather than conducting time series prediction, anomaly detection and classification tasks.\nYou can try more application scenarios of ChatTS by modifying the time series and the text of questions in `demo_hf.ipynb`! \n\n---\n\n## Security\n\nIf you discover a potential security issue, please contact ByteDance Security via the [security center](https://security.bytedance.com/src) or email **[sec@bytedance.com](mailto:sec@bytedance.com)**.\n**Do not** open public GitHub issues for vulnerabilities.\n\n---\n\n## License\n\nThis project is licensed under the **MIT License** (see `LICENSE`).\n\n---\n\n## Cite\n\n```bibtex\n@inproceedings{xie2025chatts,\n  title={ChatTS: Aligning Time Series with LLMs via Synthetic Data for Enhanced Understanding and Reasoning},\n  author={Xie, Zhe and Li, Zeyan and He, Xiao and Xu, Longlong and Wen, Xidao and Zhang, Tieying and Chen, Jianjun and Shi, Rui and Pei, Dan},\n  booktitle={Proceedings of the VLDB Endowment, 2025},\n  year={2025}\n}\n```\n\n---\n\nPlease kindly give us a Star 🌟 if you like this repo!\n\nIf you encounter any issues, please feel free to open an issue or contact me via email: xiez22@mails.tsinghua.edu.cn\n", "blocks": []}, {"path": "chatts/align/mts_local_llm_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_time_series, generate_controlled_attributes, attribute_to_text, generate_random_attributes\nfrom chatts.utils.llm_utils import LLMClient\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nimport yaml\nimport copy\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/mts_local_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\nEVOL_LABEL_PATH = f'{OUTPUT_BASE_DIR}/evol_labels/mts_local_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nCLUSTER_LABEL_PATH = f'{OUTPUT_BASE_DIR}/labels/mts_local_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"dryrun\"]\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_llm_path\"]\n\n\n# All Config for TS Features\nall_config = {\n    \"overall_attribute\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 0.7,\n            \"periodic fluctuation\": 0.3\n        },\n        \"trend\": {\n            \"decrease\": 0.2,\n            \"increase\": 0.2,\n            \"keep steady\": 0.6\n        },\n        \"frequency\": {\n            \"high frequency\": 0.5,\n            \"low frequency\": 0.5\n        },\n        \"noise\": {\n            \"noisy\": 0.3,\n            \"almost no noise\": 0.7\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 10,\n        \"downward spike\": 6,\n        \"continuous upward spike\": 4,\n        \"continuous downward spike\": 2,\n        \"upward convex\": 2,\n        \"downward convex\": 2,\n        \"sudden increase\": 2,\n        \"sudden decrease\": 2,\n        \"rapid rise followed by slow decline\": 2,\n        \"slow rise followed by rapid decline\": 2,\n        \"rapid decline followed by slow rise\": 2,\n        \"slow decline followed by rapid rise\": 2,\n        \"decrease after upward spike\": 3,\n        \"increase after downward spike\": 3,\n        \"increase after upward spike\": 3,\n        \"decrease after downward spike\": 3,\n        \"wide upward spike\": 3,\n        \"wide downward spike\": 3\n    }\n}\n\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\nall_prompt_idx = 0\n\ndef replace_prompts(data, obj):\n    pattern = re.compile(r\"<\\|prompt(\\d+)\\|>\")\n    \n    if isinstance(obj, dict):\n        return {k: replace_prompts(data, v) for k, v in obj.items()}\n    elif isinstance(obj, list):\n        return [replace_prompts(data, item) for item in obj]\n    elif isinstance(obj, str):\n        def prompt_replacer(match):\n            i = int(match.group(1))\n            return data[i]\n        \n        return pattern.sub(prompt_replacer, obj)\n    else:\n        return obj\n\ndef attribute_pool_to_json(attribute_pool: dict) -> str:\n    for i in range(len(attribute_pool['local'])):\n        attribute_pool[\"local\"][i]['amplitude'] = round(attribute_pool[\"local\"][i]['amplitude'], 2)\n    return json.dumps(attribute_pool, ensure_ascii=False)\n\ndef generate_positive_timeseries(cnt: int, change_position: int=None, seq_len: int = 256) -> Tuple[List[np.ndarray], int, List[dict]]:\n    \"\"\"\n    Generate several time series with one change in the same position\n    Return: List of timeseries, the change position, and list of attributes.\n    \"\"\"\n    if change_position is None:\n        change_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n\n    timeseries = []\n    attributes = []\n    for _ in range(cnt):\n        while True:\n            try:\n                changes = {(int(change_position + random.uniform(-10, 10)), None)}\n                attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n                ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n                if len(attribute_pool['local']) != len(changes):\n                    raise ValueError(\"Generated attributes do not match the number of changes.\")\n            except Exception as e:\n                continue\n            break\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, change_position\n\ndef generate_negative_timeseries(cnt: int, positive_positions: List[int], seq_len: int = 256) -> Tuple[List[np.ndarray], List[dict]]:\n    \"\"\"\n    Generate several time series with random changes (their change positions should not overlap)\n    Return: List of timeseries and list of attributes.\n    \"\"\"\n    min_interval = seq_len // 6  # Minimum interval to ensure changes do not overlap significantly\n    negative_positions = set()\n    \n    timeseries = []\n    attributes = []\n    for _ in range(cnt):\n        while True:\n            if random.random() > 0.8:\n                candidate_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n                try_cnt = 0\n                flag = True\n                while any(abs(candidate_position - pos) <= min_interval for pos in positive_positions + list(negative_positions)):\n                    candidate_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n                    try_cnt += 1\n                    if try_cnt >= 10000:\n                        flag = False\n                        break\n                if flag:\n                    negative_positions.add(candidate_position)\n                    changes = {(candidate_position, None)}\n                else:\n                    changes = set()\n            else:\n                changes = set()\n            \n            attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes, seq_len)\n            ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n            if len(attribute_pool['local']) == len(changes):\n                break\n\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes\n\ndef generate_prompt_data(seq_len: int=256):\n    global all_prompt_idx\n\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        else:\n            current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Random choose a category and metric name\n    sample = random.choice(list(metric_config))\n    situation = sample['category']\n    cluster: Dict[str, List[str]] = sample['cluster']\n    metric_to_cluster = {metric: cluster_name for cluster_name, metrics in cluster.items() for metric in metrics}\n\n    # Positive metrics groups\n    num_positive_clusters = random.randint(1, 3)\n    visited_metrics, visited_clusters = set(), set()\n    positive_cluster, positive_metrics = [], []\n    for _ in range(num_positive_clusters):\n        if random.random() > 0.5:\n            # Generate from a cluster\n            candidate_clusters = [i for i in cluster if len(set(cluster[i]) - visited_metrics) > 1 and i not in visited_clusters]\n            if len(candidate_clusters) == 0:\n                continue\n            current_cluster = random.choice(candidate_clusters)\n            candidate_metrics = sorted(set(cluster[current_cluster]) - visited_metrics)\n            cur_positive_metrics = list(np.random.choice(candidate_metrics, size=random.randint(2, len(candidate_metrics)), replace=False))\n            visited_clusters.add(current_cluster)\n            visited_metrics.update(cur_positive_metrics)\n            positive_metrics.extend(cur_positive_metrics)\n            positive_cluster.append(cur_positive_metrics)\n        else:\n            # Random selection\n            candidate_metrics = [i for i in metric_to_cluster if i not in visited_metrics]\n            if len(candidate_metrics) < 2:\n                continue\n            cur_positive_metrics = list(np.random.choice(candidate_metrics, size=random.randint(2, min(len(candidate_metrics), 5)), replace=False))\n            visited_metrics.update(cur_positive_metrics)\n            positive_metrics.extend(cur_positive_metrics)\n            positive_cluster.append(cur_positive_metrics)\n        \n    # Negative metrics\n    negative_metrics = random.sample(sorted(set(metric_to_cluster) - set(positive_metrics)), random.randint(0, 5))\n\n    # Number of generated items\n    num_negative_items = len(negative_metrics)\n    \n    # Generate time series\n    positive_timeseries, positive_attributes, positive_idx_list, positive_change_position_list = [], [], [], []\n    for i in range(len(positive_cluster)):\n        while True:\n            positive_change_position = random.randint(int(0.02 * current_seq_len), int(0.95 * current_seq_len))\n            if all(abs(positive_change_position - pos) > current_seq_len // 5 for pos in positive_change_position_list):\n                break\n        cur_positive_timeseries, cur_positive_attributes, positive_change_position = generate_positive_timeseries(len(positive_cluster[i]), positive_change_position, current_seq_len)\n        positive_timeseries.extend(cur_positive_timeseries)\n        positive_attributes.extend(cur_positive_attributes)\n        positive_idx_list.extend([i] * len(positive_cluster[i]))\n        positive_change_position_list.append(positive_change_position)\n    negative_timeseries, negative_attributes = generate_negative_timeseries(num_negative_items, positive_change_position_list, current_seq_len)\n     \n    # Shuffle\n    shuffle_indices = np.random.permutation(len(positive_metrics) + num_negative_items)\n    combined_timeseries = positive_timeseries + negative_timeseries\n    combined_attributes = positive_attributes + negative_attributes\n    combined_metrics = positive_metrics + negative_metrics\n    combined_cluster_idx = positive_idx_list + [None] * num_negative_items\n\n    combined_timeseries = [combined_timeseries[i] for i in shuffle_indices]\n    combined_attributes = [combined_attributes[i] for i in shuffle_indices]\n    combined_metrics = [combined_metrics[i] for i in shuffle_indices]\n    combined_cluster_idx = [combined_cluster_idx[i] for i in shuffle_indices]\n    positive_indices_by_cluster = {\n        cluster_idx: [idx for idx, item_cluster_idx in enumerate(combined_cluster_idx) if item_cluster_idx == cluster_idx]\n        for cluster_idx in range(len(positive_cluster))\n    }\n    negative_indicies = [idx for idx, item_cluster_idx in enumerate(combined_cluster_idx) if item_cluster_idx is None]\n\n    label = {\n        'timeseries': [i.tolist() for i in combined_timeseries],\n        'label': {\n            'clusters': [],\n            'position': int(positive_change_position_list[0]),\n            'positions': [int(position) for position in positive_change_position_list],\n            'correlations': [],\n            'cols': combined_metrics,\n            'situation': situation\n        },\n        'attribute_pool': combined_attributes\n    }\n\n    # Generate attribute_pool\n    prompt = f'In a {situation} system, there are {len(shuffle_indices)} metrics:'\n    question_list = []\n    answer_list = []\n    llm_prompt_list = []\n    fields_list = []\n    corr_pool_list = [None] * len(shuffle_indices)\n    original_timeseries = copy.deepcopy(combined_timeseries)\n    emitted_cluster_labels = set()\n\n    for i in range(len(shuffle_indices)):\n        # Scalar\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(combined_timeseries[i], ENCODING_METHOD)\n        combined_timeseries[i] = scaled_timeseries\n\n        # Generate prompt\n        prompt += f\"\\n {combined_metrics[i]} is of length {current_seq_len}: {cur_ts_prompt};\"\n\n        # Generate QAs\n        # (Task 1) Describe two time series\n        cur_positive_idx = combined_cluster_idx[i] if combined_cluster_idx[i] is not None else 0\n        positive_indicies = positive_indices_by_cluster[cur_positive_idx]\n        positive_change_position = positive_change_position_list[cur_positive_idx]\n        \n        for j in range(len(shuffle_indices)):\n            # Control the number\n            if random.random() < 0.8 and not (i in positive_indicies and j in positive_indicies):\n                continue\n            if i == j:\n                continue\n            question_list.append(f\"Based on the characteristics of the time series, please describe the characteristics of {combined_metrics[i]} and {combined_metrics[j]} from the aspects of periodicity, trend, local characteristics, frequency characteristics, and noise. And analyze whether there may be a correlation of fluctuation between them around point {positive_change_position}. Conclude the physical meaning of the fluctuation correlation (or no correlation) in one sentence.\")\n            fields_list.append({\n                \"local\": [i, j],\n                \"seasonal\": [i, j],\n                \"trend\": [i, j],\n                \"noise\": [i, j],\n                \"statistic\": [i, j]\n            })\n            cur_answer = f\"{combined_metrics[i]}: \" + attribute_to_text(original_timeseries[i], combined_attributes[i], generate_values=False) + f\"; {combined_metrics[j]}: \" + attribute_to_text(original_timeseries[j], combined_attributes[j], generate_values=False)\n            if i in positive_indicies and j in positive_indicies:\n                # Similar\n                cur_answer += f\" Both metrics show sudden changes around point {positive_change_position}, indicating a possible correlation in terms of fluctuation. <|prompt{all_prompt_idx}|>\"\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"position\": int(positive_change_position),\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": True\n                })\n                all_prompt_idx += 1\n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. Near a timestamp (maybe during a failure), we found there are fluctuations in {combined_metrics[i]} and {combined_metrics[j]} that happens together. Please explain why {combined_metrics[i]} and {combined_metrics[j]} fluctuates together in their physical meaning in English in one sentence (e.g. both a and b are xxx-related metrics and xxx may cause their fluctuations / a may cause b). Make sure to keep it simple. \"\n                if metric_to_cluster[combined_metrics[i]] == metric_to_cluster[combined_metrics[j]]:\n                    cur_llm_prompt += f\"(Hint: These two metrics are both {metric_to_cluster[combined_metrics[i]]}-related.)\"\n                llm_prompt_list.append([cur_llm_prompt])\n            elif combined_cluster_idx[i] is not None and combined_cluster_idx[i] == combined_cluster_idx[j]:\n                # Similar but not around point\n                cur_answer += f\" No. Both metrics show sudden changes around point {positive_change_position_list[combined_cluster_idx[i]]}, but no sudden changes around point {positive_change_position}. <|prompt{all_prompt_idx}|>\"\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"position\": int(positive_change_position),\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": False\n                })\n                all_prompt_idx += 1\n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. Near a timestamp (maybe during a failure), we found there are **no** fluctuations in both {combined_metrics[i]} and {combined_metrics[j]}, but they fluctuated together in another time (before or after the failure). Please explain why {combined_metrics[i]} and {combined_metrics[j]} are not fluctuating together at this time in their physical meaning in English in one sentence (e.g. both a and b are xxx-related metrics and xxx may cause their fluctuations / a may cause b). Make sure to keep it simple. \"\n                if metric_to_cluster[combined_metrics[i]] == metric_to_cluster[combined_metrics[j]]:\n                    cur_llm_prompt += f\"(Hint: These two metrics are both {metric_to_cluster[combined_metrics[i]]}-related.)\"\n                llm_prompt_list.append([cur_llm_prompt])\n            elif i in positive_indicies or j in positive_indicies:\n                cur_answer += f\" These two time series do not seem to have much correlation in terms of fluctuation around point {positive_change_position}. <|prompt{all_prompt_idx}|>\"\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"position\": int(positive_change_position),\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": False\n                })\n                all_prompt_idx += 1\n                if i in positive_indicies:\n                    a, b = i, j\n                else:\n                    a, b = j, i\n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. Near a timestamp (maybe during a failure), we found there are fluctuations in {combined_metrics[a]}, but no fluctuations in {combined_metrics[b]}. Please explain why {combined_metrics[a]} and {combined_metrics[b]} are **not** fluctuating together in their physical meaning in English in one simple sentence (e.g. a is xxx-related, so xxx. But b is xxx-related, which may not affected by xxx). Make sure to keep it simple:\"\n                llm_prompt_list.append([cur_llm_prompt])\n            else:\n                cur_answer += f\" These two time series do not seem to have much correlation in terms of fluctuation around point {positive_change_position}. <|prompt{all_prompt_idx}|>\"\n                label[\"label\"][\"correlations\"].append({\n                    \"pair\": [combined_metrics[i], combined_metrics[j]],\n                    \"position\": int(positive_change_position),\n                    \"explain\": f\"<|prompt{all_prompt_idx}|>\",\n                    \"label\": False\n                })\n                all_prompt_idx += 1\n                cur_llm_prompt = f\"In a {situation} system, there are many monitoring metrics. Near a timestamp (during a failure), we found there are fluctuations in some of the metrics, but no fluctuations in both {combined_metrics[i]} and {combined_metrics[j]}. Please explain why {combined_metrics[i]} and {combined_metrics[j]} are **not** fluctuating in their physical meaning in English in one simple sentence. Make sure to keep it simple:\"\n                llm_prompt_list.append([cur_llm_prompt])\n            answer_list.append(cur_answer)\n        \n        # (Task 3) Find similar time series\n        question_list.append(f\"Based on the fluctuations in the metrics around point {positive_change_position}, please find other metric(s) that may be related to {combined_metrics[i]}, output their numbers, and explain the reasons. If related metrics are found, explain why they have similar local fluctuations considering their physical meaning in one sentence. If no related metrics are found, output that no related metrics were found.\")\n        if i in negative_indicies:\n            cur_answer = f\"Among these metrics, I did not find any other metrics that may be related to {combined_metrics[i]} in terms of fluctuation around point {positive_change_position}. It seems that {combined_metrics[i]} shows no significant fluctuation around this point.\"\n            fields_list.append({\n                \"local\": [i]\n            })\n            llm_prompt_list.append([])\n        elif i not in positive_indicies:\n            cur_answer = f\"Among these metrics, I did not find any other metrics that may be related to {combined_metrics[i]} in terms of fluctuation around point {positive_change_position}. It seems that {combined_metrics[i]} shows no significant fluctuation around this point.\"\n            fields_list.append({\n                \"local\": [i]\n            })\n            llm_prompt_list.append([])\n        else:\n            cur_answer = f'I found the following metrics that may be related to {combined_metrics[i]} in terms of fluctuation:'\n            i_change = combined_attributes[i]['local'][0]['type']\n            for j in range(len(shuffle_indices)):\n                if i == j:\n                    continue\n                if j not in positive_indicies:\n                    continue\n                j_change = combined_attributes[j]['local'][0]['type']\n                if i_change == j_change:\n                    cur_answer += f\" {combined_metrics[i]} and {combined_metrics[j]} both show {i_change} around point {positive_change_position}, indicating a possible correlation in terms of fluctuation.\"\n                else:\n                    cur_answer += f\" {combined_metrics[i]} shows {i_change} around point {positive_change_position}, while {combined_metrics[j]} shows {j_change} around this point, indicating a possible correlation in terms of fluctuation.\"\n            cur_answer += f' <|prompt{all_prompt_idx}|>'\n            fields_list.append({\n                \"local\": [j for j in positive_indicies]\n            })\n            corr_pool_list[i] = [[j for j in positive_indicies], cur_answer]\n\n            if cur_positive_idx not in emitted_cluster_labels:\n                label[\"label\"][\"clusters\"].append({\n                    'cluster_idx': int(cur_positive_idx),\n                    'position': int(positive_change_position),\n                    'col_idx': [[int(j), combined_attributes[j]['local'][0]['type']] for j in positive_indicies],\n                    'cols': [combined_metrics[j] for j in positive_indicies],\n                    'explain': f\"<|prompt{all_prompt_idx}|>\",\n                })\n                emitted_cluster_labels.add(cur_positive_idx)\n\n            all_prompt_idx += 1\n            llm_prompt_list.append([f\"In a {situation} system, there are many monitoring metrics. Near a timestamp (maybe during a failure), we found there are fluctuations in \" + ', '.join(combined_metrics[j] for j in positive_indicies) + f\". Please explain their relationship in physical meaning and simply describe what's may happening in the {situation} system in English in 1 sentence, like `these metrics are all xxx-related or xxx. {situation} may xxx.` (the format may be different, but keep simple): \"])\n        answer_list.append(cur_answer)\n    label[\"label\"][\"clusters\"].sort(key=lambda item: item[\"cluster_idx\"])\n    return original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list, label\n\ndef generate_dataset():\n    result = []\n    prompts = []\n    labels = []\n    with tqdm(total=NUM_DATA, desc='Generating prompt...') as t:\n        cnt = 0\n        while True:\n            original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list, label = generate_prompt_data(SEQ_LEN)\n            result.append((original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list))\n            labels.append(label)\n            for item in llm_prompt_list:\n                prompts.extend(item)\n                t.update()\n                cnt += 1\n            if cnt >= NUM_DATA:\n                break\n\n    print(f'Generated {len(result)} data items, with {len(prompts)} prompts. {all_prompt_idx=}')\n\n    # Use LLM to generate answer\n    if DRYRUN:\n        llm_answers = ['This is a test answer.'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm')\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    print(\"Processing generated answers...\")\n    idx = 0\n    for original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool_list in result:\n        for i in range(len(question_list)):\n            for j in range(len(llm_prompt_list[i])):\n                answer_list[i] = answer_list[i].replace(f'<|prompt{idx}|>', llm_answers[idx])\n                idx += 1\n        for i in range(len(corr_pool_list)):\n            if corr_pool_list[i] is not None:\n                corr_pool_list[i][1] = replace_prompts(llm_answers, corr_pool_list[i][1])\n\n    # Replace <|prompti|> with llm_answers in label\n    labels = replace_prompts(llm_answers, labels)\n\n    return result, labels\n\n\nif __name__ == '__main__':\n    print('Generating...')\n    result, cluster_labels = generate_dataset()\n    evol_labels = []\n\n    print(\"Writing to file...\")\n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(EVOL_LABEL_PATH), exist_ok=True)\n    os.makedirs(os.path.dirname(CLUSTER_LABEL_PATH), exist_ok=True)\n\n    with open(OUTPUT_PATH, 'wt') as f:\n        for ts_idx, (original_timeseries, combined_timeseries, combined_metrics, combined_attributes, prompt, question_list, answer_list, llm_prompt_list, fields_list, corr_pool) in enumerate(result):\n            for i in range(len(question_list)):\n                result = {\n                    'input': prompt[:-1] + '. ' + question_list[i],\n                    'output': answer_list[i],\n                    'timeseries': timeseries_to_list(combined_timeseries),\n                }\n                cur_label = {\n                    \"fields\": fields_list[i],\n                    \"metrics\": combined_metrics,\n                    \"corr_pool\": corr_pool,\n                    \"attribute_pool\": combined_attributes,\n                    \"instruction\": prompt,\n                    \"question\": question_list[i],\n                    \"ts_idx\": ts_idx\n                }\n\n                f.write(json.dumps(result, ensure_ascii=False) + '\\n')\n                evol_labels.append(cur_label)\n\n    with open(CLUSTER_LABEL_PATH, 'wt') as f:\n        json.dump(cluster_labels, f, ensure_ascii=False, indent=4)\n    with open(EVOL_LABEL_PATH, 'wt') as f:\n        json.dump(evol_labels, f, ensure_ascii=False, indent=4)\n\n    print(\"Finished.\")\n", "blocks": []}, {"path": "chatts/align/mts_local_template_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series, attribute_to_text\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nimport yaml\nimport copy\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_template_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/mts_local_template_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\n\n\n# All Config for TS Features\nall_config = {\n    \"overall_attribute\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 0.7,\n            \"periodic fluctuation\": 0.3\n        },\n        \"trend\": {\n            \"decrease\": 0.2,\n            \"increase\": 0.2,\n            \"keep steady\": 0.6\n        },\n        \"frequency\": {\n            \"high frequency\": 0.5,\n            \"low frequency\": 0.5\n        },\n        \"noise\": {\n            \"noisy\": 0.3,\n            \"almost no noise\": 0.7\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 10,\n        \"downward spike\": 6,\n        \"continuous upward spike\": 4,\n        \"continuous downward spike\": 2,\n        \"upward convex\": 2,\n        \"downward convex\": 2,\n        \"sudden increase\": 2,\n        \"sudden decrease\": 2,\n        \"rapid rise followed by slow decline\": 2,\n        \"slow rise followed by rapid decline\": 2,\n        \"rapid decline followed by slow rise\": 2,\n        \"slow decline followed by rapid rise\": 2,\n        \"decrease after upward spike\": 3,\n        \"increase after downward spike\": 3,\n        \"increase after upward spike\": 3,\n        \"decrease after downward spike\": 3,\n        \"wide upward spike\": 3,\n        \"wide downward spike\": 3\n    }\n}\n\ndef attribute_pool_to_json(attribute_pool: dict) -> str:\n    for i in range(len(attribute_pool['local'])):\n        attribute_pool[\"local\"][i]['amplitude'] = round(attribute_pool[\"local\"][i]['amplitude'], 2)\n    return json.dumps(attribute_pool, ensure_ascii=False)\n\ndef generate_positive_timeseries(cnt: int, seq_len: int = 256) -> Tuple[List[np.ndarray], int, List[dict]]:\n    \"\"\"\n    Generate several time series with one change in the same position\n    Return: List of timeseries, the change position, and list of attributes.\n    \"\"\"\n    change_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n\n    timeseries = []\n    attributes = []\n    for _ in range(cnt):\n        changes = {(int(change_position + random.uniform(-10, 10)), None)}\n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, change_position\n\ndef generate_negative_timeseries(cnt: int, positive_positions: List[int], seq_len: int = 256) -> Tuple[List[np.ndarray], List[dict]]:\n    \"\"\"\n    Generate several time series with random changes (their change positions should not overlap)\n    Return: List of timeseries and list of attributes.\n    \"\"\"\n    min_interval = seq_len // 8  # Minimum interval to ensure changes do not overlap significantly\n    negative_positions = set()\n    \n    timeseries = []\n    attributes = []\n    for _ in range(cnt):\n        if random.random() > 0.8:\n            candidate_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n            try_cnt = 0\n            flag = True\n            while any(abs(candidate_position - pos) <= min_interval for pos in positive_positions + list(negative_positions)):\n                candidate_position = random.randint(int(0.02 * seq_len), int(0.95 * seq_len))\n                try_cnt += 1\n                if try_cnt >= 10000:\n                    flag = False\n                    break\n            if flag:\n                negative_positions.add(candidate_position)\n                changes = {(candidate_position, None)}\n            else:\n                changes = set()\n        else:\n            changes = set()\n        \n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes, seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes\n\ndef generate_fluctuation_naive_mts(seq_len: int=256):\n    if SEQ_LEN is None:\n        if random.random() > 0.4:\n            current_seq_len = 256\n        else:\n            current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Number of generated items\n    num_positive_items = random.randint(2, 4)\n    num_negative_items = random.randint(0, 5)\n    num_same_items = random.randint(0, 2)\n    \n    # Generate time series\n    positive_timeseries, positive_attributes, positive_change_position = generate_positive_timeseries(num_positive_items, current_seq_len)\n    negative_timeseries, negative_attributes = generate_negative_timeseries(num_negative_items, [positive_change_position], current_seq_len)\n    same_timeseries, same_attributes = [], []\n    for _ in range(num_same_items):\n        ts, desc = generate_time_series(positive_attributes[0], current_seq_len)\n        same_timeseries.append(ts)\n        same_attributes.append(desc)\n    \n    # Shuffle\n    shuffle_indices = np.random.permutation(num_positive_items + num_negative_items + num_same_items)\n    combined_timeseries = positive_timeseries + negative_timeseries + same_timeseries\n    combined_attributes = positive_attributes + negative_attributes + same_attributes\n    combined_timeseries = [combined_timeseries[i] for i in shuffle_indices]\n    combined_attributes = [combined_attributes[i] for i in shuffle_indices]\n    shuffle_argsort = np.argsort(shuffle_indices)\n    positive_indices, negative_indices, same_indices = shuffle_argsort[:num_positive_items], shuffle_argsort[num_positive_items:num_positive_items + num_negative_items], shuffle_argsort[num_positive_items + num_negative_items:]\n    original_timeseries = copy.deepcopy(combined_timeseries)\n\n    # Generate attribute_pool\n    prompt = f'There are {len(shuffle_indices)} time series:'\n    question_list = []\n    answer_list = []\n    for i in range(len(shuffle_indices)):\n        # Scalar\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(combined_timeseries[i], ENCODING_METHOD)\n        \n        # Generate prompt\n        prompt += f\" Time series {i+1} is of length {current_seq_len}: {cur_ts_prompt};\"\n\n        # Generate QAs\n        # (Task 1) Describe the characteristic of one timeseries\n        question_list.append(f\"Based on the characteristics of the time series, please describe the characteristics of time series {i+1} from the aspects of periodicity, trend, local characteristics, frequency characteristics, and noise. Also include the approximate mean values for every 16 points, as well as the maximum and minimum values of the time series (rounded to 2 decimal places).\")\n        answer_list.append(f\"The {i+1}th \" + attribute_to_text(combined_timeseries[i], combined_attributes[i]))\n        \n        # (Task 2) Describe two time series\n        for j in range(len(shuffle_indices)):\n            # Control the number\n            if random.random() < 0.7:\n                continue\n            if i == j:\n                continue\n            question_list.append(f\"Based on the characteristics of the time series, please describe the characteristics of time series {i+1} and time series {j+1} from the aspects of periodicity, trend, local characteristics, frequency characteristics, and noise, and analyze whether there may be a correlation of fluctuation between them.\")\n            cur_answer = f\" Time series {i+1} \" + attribute_to_text(combined_timeseries[i], combined_attributes[i], generate_values=False) + f\" Time series {j+1} \" + attribute_to_text(combined_timeseries[j], combined_attributes[j], generate_values=False)\n            if (i in same_indices and shuffle_indices[j] == 0) or (j in same_indices and shuffle_indices[i] == 0) or (i in same_indices and j in same_indices):\n                # Same\n                cur_answer += f\" Both time series have very similar periodicity, trend, local characteristics, frequency characteristics, and noise characteristics, and both show sudden changes around point {positive_change_position}, indicating a strong correlation in terms of both overall trend and fluctuations.\"\n            elif (i in positive_indices and j in positive_indices) or (i in positive_indices and j in same_indices) or (j in positive_indices and i in same_indices):\n                # Similar\n                cur_answer += f\" Both time series show sudden changes around point {positive_change_position}, indicating a possible correlation in terms of fluctuation.\"\n            else:\n                cur_answer += \" These two time series do not seem to have much correlation in terms of fluctuation.\"\n            answer_list.append(cur_answer)\n        \n        # (Task 3) Find similar time series\n        question_list.append(f\"Based on the fluctuations in the time series, please find other time series that may be related to time series {i+1}, output their numbers, and explain the reasons. If no related time series are found, output that no related time series were found.\")\n        if i in negative_indices:\n            cur_answer = f\"Among these time series, I did not find any other time series that may be related to time series {i+1} in terms of fluctuation.\"\n        else:\n            cur_answer = f'I found the following time series that may be related to time series {i+1} in terms of fluctuation:'\n            i_change = combined_attributes[i]['local'][0]['type']\n            for j in range(len(shuffle_indices)):\n                if i == j:\n                    continue\n                if j in negative_indices:\n                    continue\n                j_change = combined_attributes[j]['local'][0]['type']\n                if i_change == j_change:\n                    cur_answer += f\" Time series {i+1} and time series {j+1} both show {i_change} around point {positive_change_position}, indicating a possible correlation in terms of fluctuation.\"\n                else:\n                    cur_answer += f\" Time series {i+1} shows {i_change} around point {positive_change_position}, while time series {j+1} shows {j_change} around this point, indicating a possible correlation in terms of fluctuation.\"\n        answer_list.append(cur_answer)\n        combined_timeseries[i] = scaled_timeseries\n    \n    return original_timeseries, combined_timeseries, combined_attributes, prompt, question_list, answer_list\n\n\nif __name__ == '__main__':\n    print('Generating...')\n    \n    os.makedirs(os.path.dirname(OUTPUT_PATH), exist_ok=True)\n    with open(OUTPUT_PATH, 'wt') as f:\n        with tqdm(total=NUM_DATA, desc='Generating') as t:\n            cnt = 0\n            while True:\n                try:\n                    original_timeseries, combined_timeseries, combined_attributes, prompt, question_list, answer_list = generate_fluctuation_naive_mts(SEQ_LEN)\n                except ValueError as err:\n                    continue\n                except IndexError as err:\n                    continue\n                for i in range(len(question_list)):\n                    result = {\n                        'input': prompt[:-1] + '. ' + question_list[i],\n                        'output': answer_list[i],\n                        'timeseries': timeseries_to_list(combined_timeseries),\n                    }\n                    f.write(json.dumps(result, ensure_ascii=False) + '\\n')\n                    t.update()\n                    cnt += 1\n                if cnt >= NUM_DATA:\n                    break\n", "blocks": []}, {"path": "chatts/align/mts_shape_llm_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_time_series, generate_controlled_attributes, attribute_to_text, generate_random_attributes\nfrom chatts.utils.llm_utils import LLMClient\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nfrom chatts.ts_generator.trend_utils import generate_trend_curve, generate_random_points, generate_trend_prompt\nimport copy\nimport yaml\nimport os\n\n\n# CONFIG\nNUM_DATA = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None for random length\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"encoding_method\"]\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nOUTPUT_PATH = f'{OUTPUT_BASE_DIR}/mts_shape_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.jsonl'\nEVOL_LABEL_PATH = f'{OUTPUT_BASE_DIR}/evol_labels/mts_shape_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nCLUSTER_LABEL_PATH = f'{OUTPUT_BASE_DIR}/labels/mts_shape_llm_{SEQ_LEN}_{NUM_DATA}_{ENCODING_METHOD}.json'\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"dryrun\"]\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_llm_path\"]\n\n\n# All Config for TS Features\nall_config = {\n    \"overall_attribute\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 0.9,\n            \"periodic fluctuation\": 0.1\n        },\n        \"trend\": {\n            \"keep steady\": 0.6\n        },\n        \"frequency\": {\n            \"high frequency\": 0.5,\n            \"low frequency\": 0.5\n        },\n        \"noise\": {\n            \"noisy\": 0.1,\n            \"almost no noise\": 0.9\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 10,\n        \"downward spike\": 6,\n        \"continuous upward spike\": 4,\n        \"continuous downward spike\": 2,\n        \"wide upward spike\": 3,\n        \"wide downward spike\": 3\n    }\n}\n\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\nall_prompt_idx = 0\n\ndef replace_prompts(data, obj):\n    pattern = re.compile(r\"<\\|prompt(\\d+)\\|>\")\n    \n    if isinstance(obj, dict):\n        return {k: replace_prompts(data, v) for k, v in obj.items()}\n    elif isinstance(obj, list):\n        return [replace_prompts(data, item) for item in obj]\n    elif isinstance(obj, str):\n        def prompt_replacer(match):\n            i = int(match.group(1))\n            return data[i]\n        \n        return pattern.sub(prompt_replacer, obj)\n    else:\n        return obj\n\ndef generate_positive_timeseries(cnt: int, seq_len: int = 256) -> Tuple[List[np.ndarray], int, List[dict]]:\n    timeseries = []\n    attributes = []\n\n    points, curve_type = generate_random_points(seq_len)\n\n    for _ in range(cnt):\n        if random.random() > 0.8:\n            changes = {(None, None)}\n        else:\n            changes = {}\n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n\n        # Add some changes to points\n        for i in range(len(points)):\n            new_x = min(max(0, points[i][0] + random.randint(-5, 5)), seq_len - 1)\n            new_y = points[i][1] + random.uniform(-0.05, 0.05) * (max([point[1] for point in points]) - min([point[1] for point in points]))\n            points[i] = (new_x, new_y)\n\n        # Generate trend\n        curve_x, curve_y, curve_type = generate_trend_curve(seq_len, points)\n        if curve_y.max() - curve_y.min() > 1e-3:\n            ts += curve_y / (curve_y.max() - curve_y.min()) * attribute_pool['overall_amplitude'] * random.uniform(3.0, 15.0)\n\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, points\n\ndef generate_negative_timeseries(cnt: int, positive_points: List[Tuple[int, float]], seq_len: int = 256) -> Tuple[List[np.ndarray], List[dict]]:\n    timeseries = []\n    attributes = []\n    different_type = []\n    result_points = []\n\n    for _ in range(cnt):\n        if random.random() > 0.8:\n            changes = {(None, None)}\n        else:\n            changes = {}\n        attribute_pool = generate_random_attributes(all_config['overall_attribute'], all_config['change'], changes.copy(), seq_len)\n        ts, attribute_pool = generate_time_series(attribute_pool, seq_len)\n\n        if random.random() > 0.7 or len(positive_points) <= 3:\n            # Type 1: Totally different\n            points, curve_type = generate_random_points(seq_len)\n            different_type.append(None)\n        else:\n            # Type 2: Change one point in positive_points\n            points = copy.deepcopy(positive_points)\n            i = random.choice(range(len(points)))\n            new_x = min(max(0, points[i][0] + random.randint(-5, 5)), seq_len - 1)\n            diff = random.choice([-1, 1]) * random.uniform(0.5, 1.0) * (max([point[1] for point in points]) - min([point[1] for point in points]))\n            new_y = points[i][1] + diff\n            points[i] = (new_x, new_y)\n            different_type.append((i, float(diff)))\n\n        # Generate trend\n        curve_x, curve_y, curve_type = generate_trend_curve(seq_len, points)\n        result_points.append(points)\n\n        # Add to ts\n        if curve_y.max() - curve_y.min() > 1e-3:\n            ts += curve_y / (curve_y.max() - curve_y.min()) * attribute_pool['overall_amplitude'] * random.uniform(3.0, 15.0)\n\n        timeseries.append(ts)\n        attributes.append(attribute_pool)\n    \n    return timeseries, attributes, different_type, result_points\n\ndef generate_prompt_data(seq_len: int=256):\n    global all_prompt_idx\n    if SEQ_LEN is None:\n        if random.random() > 0.4:\n            current_seq_len = 256\n        else:\n            current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Random choose a category and metric name\n    sample = random.choice(list(metric_config))\n    situation = sample['category']\n    cluster: Dict[str, List[str]] = sample['cluster']\n    metric_to_cluster = {metric: cluster_name for cluster_name, metrics in cluster.items() for metric in metrics}\n\n    # Positive metrics groups\n    num_positive_clusters = random.randint(1, 3)\n    visited_metrics, visited_clusters = set(), set()\n    positive_cluster, positive_metrics = [], []\n    for _ in range(num_positive_clusters):\n        if random.random() > 0.5:\n            # Generate from a cluster\n            candidate_clusters = [i for i in cluster if len(set(cluster[i]) - visited_metrics) > 1 and i not in visited_clusters]\n            if len(candidate_clusters) == 0:\n                continue\n            current_cluster = random.choice(candidate_clusters)\n            candidate_metrics = list(set(cluster[current_cluster]) - visited_metrics)\n            cur_positive_metrics = list(np.random.choice(candidate_metrics, size=random.randint(2, len(candidate_metrics)), replace=False))\n            visited_clusters.add(current_cluster)\n            visited_metrics.update(cur_positive_metrics)\n            positive_metrics.extend(cur_positive_metrics)\n            positive_cluster.append(cur_positive_metrics)\n        else:\n            # Random selection\n            candidate_metrics = [i for i in metric_to_cluster if i not in visited_metrics]\n            if len(candidate_metrics) < 2:\n                continue\n            cur_positive_metrics = list(np.random.choice(candidate_metrics, size=random.randint(2, min(len(candidate_metrics), 5)), replace=False))\n            visited_metrics.update(cur_positive_metrics)\n            positive_metrics.extend(cur_positive_metrics)\n            positive_cluster.append(cur_positive_metrics)\n        \n    # Negative metrics\n    negative_metrics = random.sample(sorted(set(metric_to_cluster) - set(positive_metrics)), random.randint(0, 5))\n\n    # Number of generated items\n    num_negative_items = len(negative_metrics)\n\n    # Generate time series\n    positive_timeseries, positive_attributes, positive_idx_list, cluster_points_list, positive_points_list = [], [], [], [], []\n    for i in range(len(positive_cluster)):\n        cur_pos
