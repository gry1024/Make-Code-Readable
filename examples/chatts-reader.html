evaluation/dataset/dataset_a.json'\nWORKDIR = os.path.abspath('./')\n\n# Don't change the below config\nBATCH_SIZE = 1\nENCODING_METHOD = 'sp'\n\n\n# Initialize\nlocal_rank = int(os.getenv(\"LOCAL_RANK\", \"0\"))\nworld_size = int(os.getenv(\"WORLD_SIZE\", \"1\"))\ntorch.cuda.set_device(local_rank)\ntorch.distributed.init_process_group(backend='nccl')\ndeepspeed.init_distributed()\n\nds_config = {\n    \"fp16\": {\"enabled\": True},\n    \"bf16\": {\"enabled\": False},\n    \"zero_optimization\": {\n        \"stage\": 0,\n        \"overlap_comm\": True,\n        \"contiguous_gradients\": True,\n    },\n    \"steps_per_print\": 2000,\n    \"train_batch_size\": world_size,\n    \"train_micro_batch_size_per_gpu\": 1,\n    \"wall_clock_breakdown\": False\n}\ndscfg = HfDeepSpeedConfig(ds_config)\ntokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, trust_remote_code=True)\nmodel = AutoModelForCausalLM.from_pretrained(MODEL_PATH, trust_remote_code=True)\nprocessor = AutoProcessor.from_pretrained(MODEL_PATH, trust_remote_code=True, tokenizer=tokenizer)\nds_engine = deepspeed.initialize(model=model, config=ds_config)[0]\nmodel_engine = ds_engine.module\nmodel_engine.eval()\n\ndef answer_question_list(question_list, ts_list, batch_size=BATCH_SIZE):\n    answer_dict = {}\n    total_cnt = len([i for i in range(len(question_list)) if i % world_size == local_rank])\n    \n    local_indices = [i for i in range(len(question_list)) if i % world_size == local_rank]\n    \n    for batch_start in range(0, len(local_indices), batch_size):\n        batch_end = min(batch_start + batch_size, len(local_indices))\n        batch_indices = local_indices[batch_start:batch_end]\n        \n        batch_question_list = [question_list[i] for i in batch_indices]\n        batch_ts_list = []\n        for i in batch_indices:\n            if ts_list[i] is None:\n                continue\n            for ts in ts_list[i]:\n                batch_ts_list.append(np.array(ts))\n        ts_num_tokens = []\n        for i in batch_indices:\n            if ts_list[i] is None:\n                ts_num_tokens.append(0)\n            else:\n                ts_num_tokens.append(sum([len(t) for t in ts_list[i]]) // model.config.ts['patch_size'])\n\n        print(f\"[worker {local_rank}] {len(batch_ts_list)=}, {batch_ts_list[0].shape=}, {batch_question_list=}\")\n        inputs = processor(text=batch_question_list, timeseries=batch_ts_list, padding=True, return_tensors=\"pt\")\n        inputs = {k: v.to(device=local_rank) for k, v in inputs.items()}\n        \n        print(f\"[worker {local_rank}] {inputs['input_ids'].shape=}, {inputs['attention_mask'].shape=}\")\n\n        with torch.no_grad():\n            outputs = model_engine.generate(\n                **inputs,\n                synced_gpus=False, \n                max_length=inputs['input_ids'].shape[-1] + 1024,\n                temperature=0.2\n            )\n\n        for i, idx in enumerate(batch_indices):\n            output = outputs[i]\n            input_len = inputs['attention_mask'][i].sum().item()\n            generated_output = output[input_len:]\n            text_out = tokenizer.decode(generated_output, skip_special_tokens=True)\n            print(f\"[worker {local_rank}] {idx=}, {text_out=}\")\n            answer_dict[idx] = {\n                'response': text_out,\n                'num_tokens': int(ts_num_tokens[i] + input_len)\n            }\n\n        print(f\"[worker {local_rank}] {len(answer_dict)}/{total_cnt} finished.\")\n    \n    return answer_dict\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    generated_answer = []\n    exp_dir = os.path.join(WORKDIR, f\"exp/{EXP}\")\n    print(f\"Experiment directory: {exp_dir}\")\n    os.makedirs(exp_dir, exist_ok=True)\n\n    # Generation\n    logger.info(\"Start Generation...\")\n    question_list = []\n    ts_list = []\n    for idx in range(len(dataset)):\n        sample = dataset[idx]\n        prompt = sample['question']\n        prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{prompt}<|im_end|><|im_start|>assistant\\n\"\n\n        question_list.append(prompt)\n        ts_list.append(sample['timeseries'])\n    answer = answer_question_list(question_list, ts_list)\n    for idx, ans in answer.items():\n        generated_answer.append({\n            'idx': idx,\n            'question_text': question_list[idx],\n            'response': ans['response'],\n            'num_tokens': ans['num_tokens']\n        })\n\n    # Save label\n    json.dump(generated_answer, open(os.path.join(WORKDIR, f\"exp/{EXP}/generated_answer_{world_size}_{local_rank}.json\"), \"wt\"), ensure_ascii=False, indent=4)\n", "blocks": []}, {"path": "chatts/utils/inference_tsmllm_vllm.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n# Note: You have to install `vllm==0.8.5`.\n# Note: This is a beta version, which may change in the future.\n# Note: `chatts.vllm.chatts_vllm` has to be imported here first as it will register the custom ChatTS module and the multimodal processor.\n# Note: Usage: `VLLM_WORKER_MULTIPROC_METHOD=spawn VLLM_ALLOW_INSECURE_SERIALIZATION=1 python3 -m chatts.utils.inference_tsmllm_vllm`\n\n# [Important Note] This script is still under development and may not work as expected.\n\nimport chatts.vllm.chatts_vllm\nfrom vllm import LLM, SamplingParams\nfrom chatts.utils.llm_utils import LLMClient\nimport torch\nimport os\nimport json\nfrom loguru import logger\nimport numpy as np\n\n\n# CONFIG\nEXP = 'chatts_dataset_a'\nMODEL_PATH = os.path.abspath('ckpt')\nDATASET = f'./evaluation/dataset/dataset_a.json'\nWORKDIR = os.path.abspath('./')\nNUM_GPUS = 8\nNUM_GPUS_PER_PROCESS = 2\nMAX_MM_PER_PROMPT = 50  # Maximum number of time series per prompt\n\n\n# Sampling parameters\nsampling_params = SamplingParams(\n    max_tokens=512,\n    temperature=0.2\n)\n\ndef answer_question_list(question_list, ts_list):\n    answer_dict = {}\n    llm_client = LLMClient(model_path=MODEL_PATH, engine='vllm-ts', num_gpus=NUM_GPUS, gpus_per_model=NUM_GPUS_PER_PROCESS)\n    llm_client.wait_for_ready()\n    answer_list = llm_client.llm_batch_generate(question_list, ts_list, sampling_params=sampling_params)\n    llm_client.kill()\n\n    for idx, answer in enumerate(answer_list):\n        answer_dict[idx] = {\n            \"response\": answer\n        }\n\n    return answer_dict\n\n\nif __name__ == '__main__':\n    dataset = json.load(open(DATASET))\n\n    generated_answer = []\n    exp_dir = os.path.join(WORKDIR, f\"exp/{EXP}\")\n    logger.info(f\"Experiment directory: {exp_dir}\")\n    os.makedirs(exp_dir, exist_ok=True)\n\n    # Generation\n    logger.info(\"Start Generation...\")\n    question_list = []\n    ts_list = []\n    \n    for idx in range(len(dataset)):\n        sample = dataset[idx]\n        question_list.append(sample['question'])\n        ts_list.append([np.array(item) for item in sample['timeseries']])\n    \n    # Generate answers\n    answer = answer_question_list(question_list, ts_list)\n    \n    # Prepare results\n    for idx, ans in answer.items():\n        generated_answer.append({\n            'idx': idx,\n            'question_text': question_list[idx],\n            'response': ans['response']\n        })\n\n    # Save results\n    output_file = os.path.join(exp_dir, f\"generated_answer.json\")\n    json.dump(generated_answer, open(output_file, \"wt\"), ensure_ascii=False, indent=4)\n    logger.info(f\"Results saved to {output_file}\")\n", "blocks": [{"start": 1, "end": 13, "summary_zh": "声明源码版权、MIT 许可证及按“原样”分发的免责条款。", "summary_en": "Declare copyright, the MIT License, and the as-is distribution disclaimer.", "lines": [{"n": 1, "zh": "标注 2025 年版权归清华大学与字节跳动所有。", "en": "Mark the 2025 copyright as belonging to Tsinghua University and ByteDance."}, {"n": 2, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 3, "zh": "声明采用 MIT 许可证（“License”）。", "en": "Declare use of the MIT License (the \"License\")."}, {"n": 4, "zh": "若未遵守许可证 → 不得使用本文件。", "en": "If the License is not followed → this file may not be used."}, {"n": 5, "zh": "获取许可证副本 → 参见下方地址。", "en": "Obtain a copy of the License → see the address below."}, {"n": 6, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 7, "zh": "许可证地址 → `https://opensource.org/license/mit`。", "en": "License address → `https://opensource.org/license/mit`."}, {"n": 8, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 9, "zh": "除非适用法律要求或另有书面约定，否则适用以下分发条件。", "en": "Unless required by applicable law or agreed in writing, the following distribution terms apply."}, {"n": 10, "zh": "软件按“原样”分发。", "en": "Distribute the software on an \"AS IS\" basis."}, {"n": 11, "zh": "不提供任何明示或默示的保证或条件。", "en": "Provide no warranties or conditions, express or implied."}, {"n": 12, "zh": "权限的具体措辞 → 参见许可证。", "en": "For the specific language governing permissions → see the License."}, {"n": 13, "zh": "限制的具体措辞 → 同样参见许可证。", "en": "For the specific language governing limitations → likewise see the License."}]}, {"start": 14, "end": 21, "summary_zh": "注明 vLLM 版本、模块注册要求、启动命令及开发中状态。", "summary_en": "State the vLLM version, registration requirement, launch command, and development status.", "lines": [{"n": 15, "zh": "要求安装 `vllm==0.8.5`。", "en": "Require `vllm==0.8.5` to be installed."}, {"n": 16, "zh": "标记为 beta 版本 → ms.n\n                answers = llm.generate(batch_prompts, sampling_params, use_tqdm=False)\n                if sample_n > 1:\n                    answers = [i.outputs for i in answers]\n                    answers = [[j.text for j in i] for i in answers]\n                else:\n                    answers = [i.outputs[0].text for i in answers]\n                # for ans in answers:\n                #     print('------------------------------')\n                #     print(ans)\n                # print('==================================')\n                # print(batch_prompts[0])\n                # print('----------------------------------')\n                # print(answers[0])\n                for answer, args in zip(answers, batch_args):\n                    output_queue.put((answer, *args))\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        traceback.print_exc()\n        time.sleep(5)\n\ndef worker_vllm_ts(input_queue, output_queue, gpu_id, batch_size, sample_n, finished_flag, ready_cnt, model_path=MODEL_PATH):\n    os.environ['CUDA_VISIBLE_DEVICES'] = str(gpu_id)\n\n    try:\n        from vllm import LLM, SamplingParams\n        import chatts.vllm.chatts_vllm\n        sampling_params = SamplingParams(temperature=0.5, top_p=0.95, max_tokens=CTX_LENGTH, stop_token_ids=[151643, 151645], stop=['<|endoftext|>', '<|im_end|>'], n=sample_n)\n        llm = LLM(model=model_path, trust_remote_code=True, max_model_len=CTX_LENGTH, tensor_parallel_size=len(gpu_id.split(',')), gpu_memory_utilization=0.95, limit_mm_per_prompt={\"timeseries\": 50}, enable_prefix_caching=False)\n        print(f\"[worker {gpu_id}] Initialization finished.\")\n        ready_cnt.value = ready_cnt.value + 1\n        \n        while not finished_flag.get():\n            if input_queue.empty():\n                time.sleep(1)\n                continue\n\n            batch_inputs = []\n            batch_args = []\n            for _ in range(batch_size):\n                if not input_queue.empty():\n                    try:\n                        cur_items = input_queue.get_nowait()\n                    except Exception as err:\n                        break\n                    batch_inputs.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                else:\n                    break\n            \n            if batch_inputs:\n                answers = llm.generate(batch_inputs, sampling_params, use_tqdm=False)\n                if sample_n > 1:\n                    answers = [i.outputs for i in answers]\n                    answers = [[j.text for j in i] for i in answers]\n                else:\n                    answers = [i.outputs[0].text for i in answers]\n                # print('=================================')\n                # print(answers[0])\n                for answer, args in zip(answers, batch_args):\n                    output_queue.put((answer, *args))\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        traceback.print_exc()\n        time.sleep(5)\n\ndef worker_dryrun(input_queue: multiprocessing.Queue, output_queue, gpu_id, batch_size, sample_n, finished_flag, ready_cnt, model_path=MODEL_PATH):\n    ready_cnt.value = ready_cnt.value + 1\n    try:\n        while not finished_flag.get():\n            if input_queue.empty():\n                time.sleep(1)\n                continue\n\n            batch_inputs = []\n            batch_outputs = []\n            batch_args = []\n            for _ in range(batch_size):\n                if not input_queue.empty():\n                    try:\n                        cur_items = input_queue.get_nowait()\n                    except Exception as err:\n                        break\n                    batch_inputs.append(cur_items[0])\n                    batch_args.append(cur_items[1:-1])\n                    batch_outputs.append(cur_items[-1])\n                else:\n                    break\n            \n            if batch_inputs:\n                # Sleep for 0.1 second\n                time.sleep(0.1)\n\n                for output, args in zip(batch_outputs, batch_args):\n                    output_queue.put((output, *args))\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        traceback.print_exc()\n        time.sleep(5)\n\n\n\nclass LLMClient:\n    def __init__(self, model_path=MODEL_PATH, engine=ENGINE, num_gpus=NUM_GPUS, gpu_range: Optional[List[int]]=None, gpus_per_model=GPUS_PER_MODEL, batch_size=BATCH_SIZE, sample_n: int=1, chat_template: Optional[str]=None, system_prompt: str=\"You are a helpful assistant.\"):\n        # Create clients\n        manager = multiprocessing.Manager()\n        self.input_queue = manager.Queue()\n        self.output_queue = manager.Queue()\n        self.finished_flag = manager.Value('b', False)\n        self.ready_cnt = manager.Value('i', 0)\n        self.engine = engine\n        self.sample_n = sample_n\n\n        # Apply chat template\n        self.tokenizer = AutoTokenizer.from_pretrained(model_path, trust_remote_code=True)\n        self.system_prompt = system_prompt\n\n        if chat_template:\n            self.tokenizer.chat_template = chat_template\n\n        if gpu_range is None:\n            gpu_range = list(range(num_gpus))\n        else:\n            print(f\"[LLMClient] Using GPU range: {gpu_range}\")\n\n        self.processes = []\n        for idx in range(0, len(gpu_range), gpus_per_model):\n            gpu_id_str = \",\".join(map(str, gpu_range[idx:idx+gpus_per_model]))\n            print(f\"[LLMClient] Starting worker {idx} on GPU {gpu_id_str}\")\n            if engine == 'llama':\n                p = multiprocessing.Process(target=worker_llama_cpp, args=(self.input_queue, self.output_queue, gpu_id_str, batch_size, sample_n, self.finished_flag, self.ready_cnt, model_path))\n            elif engine == 'vllm':\n                p = multiprocessing.Process(target=worker_vllm, args=(self.input_queue, self.output_queue, gpu_id_str, batch_size, sample_n, self.finished_flag, self.ready_cnt, model_path))\n            elif engine == 'vllm-ts':\n                p = multiprocessing.Process(target=worker_vllm_ts, args=(self.input_queue, self.output_queue, gpu_id_str, batch_size, sample_n, self.finished_flag, self.ready_cnt, model_path))\n            elif engine == 'dryrun':\n                p = multiprocessing.Process(target=worker_dryrun, args=(self.input_queue, self.output_queue, gpu_id_str, batch_size, sample_n, self.finished_flag, self.ready_cnt, model_path))\n            else:\n                raise NotImplementedError(f\"Unrecognized inference engine: {engine}\")\n            self.processes.append(p)\n            p.start()\n        \n        print(f\"[LLMClient] {len(self.processes)} workers started.\")\n\n    def wait_for_ready(self):\n        while self.ready_cnt.value < len(self.processes):\n            time.sleep(1)\n        print(f\"[LLMClient] All workers are ready!\")\n\n    def _apply_chat_template(self, prompt: str) -> str:\n        conversation = [\n            {\"role\": \"system\", \"content\": self.system_prompt},\n            {\"role\": \"user\", \"content\": prompt}\n        ]\n        return self.tokenizer.decode(self.tokenizer.apply_chat_template(conversation, add_generation_prompt=True))\n        \n    def llm_batch_generate(self, batch_prompts: List[str], batch_timeseries: Optional[List[List[np.ndarray]]] = None, dryrun_outputs: Optional[Union[List[str], List[List[str]]]] = None, use_chat_template=True, sampling_params=None):\n        if batch_timeseries is not None:\n            assert len(batch_prompts) == len(batch_timeseries), f\"len(batch_prompts) != len(batch_timeseries): {len(batch_prompts)} != {len(batch_timeseries)}\"\n            assert self.engine in ['vllm-ts', 'dryrun'], f\"Only vllm-ts or dryrun engine supports timeseries data.\"\n\n        while not self.output_queue.empty():\n            self.output_queue.get()\n        self.finished_flag.set(False)\n\n        total_cnt = 0\n\n        if dryrun_outputs is not None:\n            logger.warning(f\"[llm_batch_generate] Dryrun mode. {len(batch_prompts)=}, {len(dryrun_outputs)=}\")\n\n        for i, item in enumerate(batch_prompts):\n            if use_chat_template:\n                inputs = self._apply_chat_template(item)\n            else:\n                inputs = item\n            if batch_timeseries is not None:\n                inputs = {\n                    \"prompt\": inputs,\n                    \"multi_modal_data\": {\n                        \"timeseries\": batch_timeseries[i]\n                    }\n                }\n            if dryrun_outputs is not None:\n                self.input_queue.put((inputs, i, item, dryrun_outputs[i]))\n            elif sampling_params is not None:\n                self.input_queue.put((inputs, i, item, sampling_params))\n            else:\n                self.input_queue.put((inputs, i, item))\n            total_cnt += 1\n\n        answer_dict = {}\n\n        with tqdm(total=total_cnt, desc=\"Generating\") as pbar:\n            while len(answer_dict) < total_cnt:\n                line = self.output_queue.get()\n                pbar.update()\n\n                # Append to answer\n                answer_dict[line[1]] = line[0]\n        \n        answer_list = []\n        for i in range(len(batch_prompts)):\n            if i not in answer_dict:\n                answer_list.append(None)\n            else:\n                answer_list.append(answer_dict[i])\n\n        return answer_list\n\n    def kill(self):\n        self.finished_flag.set(True)\n        print(f\"[LLMClient] Killing workers...\")\n        time.sleep(5.0)\n        for p in self.processes:\n            p.join()\n        print(f\"[LLMClient] All workers have been killed!\")\n\n\ndef parse_llm_json(json_string, special_words=None):\n    json_string = json_string.replace('```json', '').replace('```', '')\n    json_string = repair_json(json_string)\n    \n    return json.loads(json_string)\n\ndef match_metric_name(metric: str, sentence: str) -> bool:\n    pattern = r'[^\\u4e00-\\u9fa5a-zA-Z]'\n    sentence = re.sub(pattern, '', sentence).lower()\n    metric = re.sub(pattern, '', metric).lower()\n\n    return metric in sentence\n", "blocks": []}, {"path": "chatts/utils/vllm_stream_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n# Note: You have to install `vllm==0.8.5`.\n# Note: This is a beta version, which may change in the future.\n# Note: `chatts.vllm.chatts_vllm` has to be imported here first as it will register the custom ChatTS module and the multimodal processor.\n# Note: Usage: `python3 -m chatts.utils.inference_tsmllm_vllm`\n\nimport asyncio\nimport time\nimport re\nimport json\nimport numpy as np\nfrom vllm import AsyncLLMEngine, AsyncEngineArgs, SamplingParams\nfrom loguru import logger\n\n# CONFIG\nMODEL_PATH = \"[CHATTS_MODEL_PATH]\"  # Replace with your model path\nENABLE_TS = True\nMAX_MODEL_LEN = 12000\nTENSOR_PARALLEL = 2\n\nif ENABLE_TS:\n    import chatts.vllm.chatts_vllm\n    engine_args = AsyncEngineArgs(model=MODEL_PATH, enforce_eager=True, gpu_memory_utilization=0.95, max_model_len=MAX_MODEL_LEN, tensor_parallel_size=TENSOR_PARALLEL,  limit_mm_per_prompt={\"timeseries\": 15}, trust_remote_code=True)\nelse:\n    engine_args = AsyncEngineArgs(model=MODEL_PATH, enforce_eager=True, gpu_memory_utilization=0.95, max_model_len=MAX_MODEL_LEN, tensor_parallel_size=TENSOR_PARALLEL, trust_remote_code=True)\nmodel = AsyncLLMEngine.from_engine_args(engine_args)\n\ndef extract_and_remove_ts(s):\n    pattern = r'(<ts>)(.*?)(<ts/>)'\n    logger.warning(f\"[extract_and_remove_ts] {s}\")\n    matches = re.findall(pattern, s)\n    extracted_lists = [json.loads(match[1]) for match in matches]\n    modified_s = re.sub(pattern, r'\\1\\3', s)\n    \n    if len(extracted_lists) == 0:\n        extracted_lists = None\n    return modified_s, extracted_lists\n\nasync def generate_streaming(prompt):\n    results_generator = model.generate(prompt, SamplingParams(max_tokens=MAX_MODEL_LEN), request_id=time.monotonic())\n    previous_text = \"\"\n    async for request_output in results_generator:\n        text = request_output.outputs[0].text\n        print(text[len(previous_text):], end=\"\", flush=True)\n        previous_text = text\n    return text\n\nasync def main():\n    history = []\n    all_timeseries = []\n    while True:\n        print(\"=\" * 80)\n\n        # Get user input\n        question = input(\"Question: \")\n        if question == 'exit':\n            break\n        elif question == 'clear':\n            history = []\n            all_timeseries = []\n            print(\"History cleared.\")\n            continue\n        elif question == 'file':\n            with open('vllm_input.txt', 'rt') as f:\n                question = f.read().rstrip()\n                logger.warning(f\"Loaded input from file.\")\n\n        input_timeseries = None\n        if ENABLE_TS:\n            question, timeseries = extract_and_remove_ts(question)\n            if timeseries is not None and len(timeseries) > 0:\n                logger.warning(f\"[Timeseries]: {len(timeseries)}\")\n                all_timeseries.extend([np.array(ts) for ts in timeseries])\n            if len(all_timeseries) > 0:\n                input_timeseries = all_timeseries.copy()\n\n        # Apply chat template\n        prompt = \"<|im_start|>system\\nYou are a helpful assistant.<|im_end|>\\n\"\n        for q, a in history:\n            prompt += f\"<|im_start|>user\\n{q}<|im_end|>\\n<|im_start|>assistant\\n{a}<|im_end|>\\n\"\n        prompt += f\"<|im_start|>user\\n{question}<|im_end|>\\n<|im_start|>assistant\\n\"\n\n        inputs = {\n            \"prompt\": prompt\n        }\n        if input_timeseries is not None:\n            inputs['multi_modal_data'] = {\n                \"timeseries\": input_timeseries\n            }\n\n        print(\"=\" * 80)\n        response = await generate_streaming(inputs)\n        print(f\"\\n[Answer]: {response}\")\n        history.append((question, response))\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n", "blocks": [{"start": 1, "end": 13, "summary_zh": "声明源码版权、MIT 许可证及按“原样”分发的免责条款。", "summary_en": "Declare copyright, the MIT License, and the as-is distribution disclaimer.", "lines": [{"n": 1, "zh": "标注 2025 年版权归清华大学与字节跳动所有。", "en": "Mark the 2025 copyright as belonging to Tsinghua University and ByteDance."}, {"n": 2, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 3, "zh": "声明采用 MIT 许可证（“License”）。", "en": "Declare use of the MIT License (the \"License\")."}, {"n": 4, "zh": "若未遵守许可证 → 不得使用本文件。", "en": "If the License is not followed → this file may not be used."}, {"n": 5, "zh": "获取许可证副本 → 参见下方地址。", "en": "Obtain a copy of the License → see the address below."}, {"n": 6, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 7, "zh": "许可证地址 → `https://opensource.org/license/mit`。", "en": "License address → `https://opensource.org/license/mit`."}, {"n": 8, "zh": "`#` 作为许可证空注释行。", "en": "`#` marks a blank license comment line."}, {"n": 9, "zh": "除非适用法律要求或另有书面约定，否则适用以下分发条件。", "en": "Unless required by applicable law or agreed in writing, the following distribution terms apply."}, {"n": 10, "zh": "软件按“原样”分发。", "en": "Distribute the software on an \"AS IS\" basis."}, {"n": 11, "zh": "不提供任何明示或默示的保证或条件。", "en": "Provide no warranties or conditions, express or implied."}, {"n": 12, "zh": "权限的具体措辞 → 参见许可证。", "en": "For the specific language governing permissions → see the License."}, {"n": 13, "zh": "限制的具体措辞 → 同样参见许可证。", "en": "For the specific language governing limitations → likewise see the License."}]}, {"start": 14, "end": 19, "summary_zh": "注明 vLLM 版本、测试状态、模块注册顺序及运行示例。", "summary_en": "State the vLLM version, beta status, module registration order, and usage example.", "lines": [{"n": 15, "zh": "要求安装 `vllm==0.8.5`。", "en": "Require `vllm==0.8.5` to be installed."}, {"n": 16, "zh": "标记为 beta 版本 → 后续可能变化。", "en": "Mark this as a beta version → it may change later."}, {"n": 17, "zh": "先导入 `chatts.vllm.chatts_vllm` → 注册自定义 ChatTS 模块与多模态处理器。", "en": "Import `chatts.vllm.chatts_vllm` first → register the custom ChatTS module and multimodal processor."}, {"n": 18, "zh": "注释给出的用法 → `python3 -m chatts.utils.inference_tsmllm_vllm`。", "en": "Usage given in the comment → `python3 -m chatts.utils.inference_tsmllm_vllm`."}]}, {"start": 20, "end": 27, "summary_zh": "导入异步执行、文本解析、数组处理与 vLLM 推理依赖。", "summary_en": "Import dependencies for async execution, text parsing, arrays, and vLLM inference.", "lines": [{"n": 20, "zh": "导入 `asyncio`。", "en": "Import `asyncio`."}, {"n": 21, "zh": "导入 `time`。", "en": "Import `time`."}, {"n": 22, "zh": "导入 `re`。", "en": "Import `re`."}, {"n": 23, "zh": "导入 `json`。", "en": "Import `json`."}, {"n": 24, "zh": "导入 `numpy` 并命名为 `np`。", "en": "Import `numpy` as `np`."}, {"n": 25, "zh": "从 `vllm` 导入 `AsyncLLMEngine`、`AsyncEngineArgs` 与 `SamplingParams`。", "en": "Import `AsyncLLMEngine`, `AsyncEngineArgs`, and `SamplingParams` from `vllm`."}, {"n": 26, "zh": "从 `loguru` 导入 `logger`。", "en": "Import `logger` from `loguru`."}]}, {"start": 28, "end": 33, "summary_zh": "配置模型路径、时间序列开关、上下文长度与张量并行度。", "summary_en": "Configure the model path, time-series switch, context length, and tensor parallelism.", "lines": [{"n": 28, "zh": "配置段开始。", "en": "Start the configuration section."}, {"n": 29, "zh": "`MODEL_PATH` ← 占位符 `'[CHATTS_MODEL_PATH]'` → 替换为实际模型路径。", "en": "Set `MODEL_PATH` ← the placeholder `'[CHATTS_MODEL_PATH]'` → replace it with the actual model path."}, {"n": 30, "zh": "`ENABLE_TS` ← `True` → 启用时间序列输入。", "en": "Set `ENABLE_TS` ← `True` → enable time-series input."}, {"n": 31, "zh": "`MAX_MODEL_LEN` ← `12000`。", "en": "Set `MAX_MODEL_LEN` ← `12000`."}, {"n": 32, "zh": "`TENSOR_PARALLEL` ← `2`。", "en": "Set `TENSOR_PARALLEL` ← `2`."}]}, {"start": 34, "end": 40, "summary_zh": "按时间序列开关注册模块、构造引擎参数并创建异步引擎。", "summary_en": "Register modules, build engine arguments, and create the async engine according to the time-series switch.", "lines": [{"n": 34, "zh": "若 `ENABLE_TS` 为真 → 启用带时间序列的配置 {", "en": "If `ENABLE_TS` is true → use the time-series-enabled configuration {"}, {"n": 35, "zh": "导入 `chatts.vllm.chatts_vllm` → 注册自定义 ChatTS 模块与多模态处理器。", "en": "Import `chatts.vllm.chatts_vllm` → register the custom ChatTS module and multimodal processor."}, {"n": 36, "zh": "`engine_args` ← 构造 `AsyncEngineArgs`，设置模型、 eager 执行、95% 显存利用、上下文长度、张量并行及远程代码信任，并令每条提示最多含 15 个 `timeseries`。", "en": "Set `engine_args` ← construct `AsyncEngineArgs` with the model, eager execution, 95% GPU-memory utilization, context length, tensor parallelism, and trusted remote code, allowing at most 15 `timeseries` items per prompt."}, {"n": 37, "zh": "否则 → 使用不带时间序列限制的配置 {", "en": "Otherwise → use the configuration without a time-series limit {"}, {"n": 38, "zh": "`engine_args` ← 构造 `AsyncEngineArgs`，设置模型、eager 执行、95% 显存利用、上下文长度、张量并行及远程代码信任。", "en": "Set `engine_args` ← construct `AsyncEngineArgs` with the model, eager execution, 95% GPU-memory utilization, context length, tensor parallelism, and trusted remote code."}, {"n": 39, "zh": "`model` ← `AsyncLLMEngine.from_engine_args(engine_args)`，按参数创建异步引擎。", "en": "Set `model` ← `AsyncLLMEngine.from_engine_args(engine_args)` to create the async engine from these arguments."}]}, {"start": 41, "end": 50, "summary_zh": "提取 `<ts>` 标签内的 JSON 序列，并移除标签间内容。", "summary_en": "Extract JSON series inside `<ts>` tags and remove the content between those tags.", "lines": [{"n": 41, "zh": "定义 `extract_and_remove_ts(s)` {", "en": "Define `extract_and_remove_ts(s)` {"}, {"n": 42, "zh": "`pattern` ← 正则 `r'(<ts>)(.*?)(<ts/>)'`，分别捕获开始标签、中间内容与结束标签。", "en": "Set `pattern` ← regex `r'(<ts>)(.*?)(<ts/>)'`, capturing the opening tag, inner content, and closing tag separately."}, {"n": 43, "zh": "`logger.warning(...)` 输出传入的原始字符串 `s`。", "en": "Log the original input string `s` with `logger.warning(...)`."}, {"n": 44, "zh": "`matches` ← `re.findall(pattern, s)`，找出全部标签匹配。", "en": "Set `matches` ← `re.findall(pattern, s)` to find all tag matches."}, {"n": 45, "zh": "循环 `matches` → 对每组第二项 `match[1]` 执行 `json.loads`，组成 `extracted_lists`。", "en": "Loop over `matches` → apply `json.loads` to each group's second item `match[1]` and build `extracted_lists`."}, {"n": 46, "zh": "`modified_s` ← `re.sub(pattern, r'\\1\\3', s)` → 保留首尾标签并删除中间内容。", "en": "Set `modified_s` ← `re.sub(pattern, r'\\1\\3', s)` → keep both tags and remove the inner content."}, {"n": 48, "zh": "若 `len(extracted_lists) == 0` → 没有提取到序列 {", "en": "If `len(extracted_lists) == 0` → no series were extracted {"}, {"n": 49, "zh": "`extracted_lists` ← `None`。", "en": "Set `extracted_lists` ← `None`."}, {"n": 50, "zh": "返回 `(modified_s, extracted_lists)`。", "en": "Return `(modified_s, extracted_lists)`."}]}, {"start": 51, "end": 59, "summary_zh": "异步消费模型输出，仅打印新增文本并返回最终回答。", "summary_en": "Consume model output asynchronously, print only new text, and return the final answer.", "lines": [{"n": 52, "zh": "定义异步 `generate_streaming(prompt)` {", "en": "Define async `generate_streaming(prompt)` {"}, {"n": 53, "zh": "`results_generator` ← `model.generate(...)`，以 `MAX_MODEL_LEN` 为最大生成 token 数，并以 `time.monotonic()` 作为 `request_id`。", "en": "Set `results_generator` ← `model.generate(...)`, using `MAX_MODEL_LEN` as the maximum generated-token count and `time.monotonic()` as `request_id`."}, {"n": 54, "zh": "`previous_text` ← 空字符串。", "en": "Set `previous_text` ← an empty string."}, {"n": 55, "zh": "异步循环 `results_generator`，逐个取 `request_output` {", "en": "Asynchronously loop over `results_generator`, taking each `request_output` {"}, {"n": 56, "zh": "`text` ← 第一个输出 `request_output.outputs[0]` 的累计文本。", "en": "Set `text` ← the cumulative text of the first output, `request_output.outputs[0]`."}, {"n": 57, "zh": "打印 `text[len(previous_text):]` → 仅输出新增片段，不换行并立即刷新。", "en": "Print `text[len(previous_text):]` → output only the new fragment, without a newline, and flush immediately."}, {"n": 58, "zh": "`previous_text` ← `text` → 保存当前累计文本。", "en": "Set `previous_text` ← `text` → save the current cumulative text."}, {"n": 59, "zh": "返回最终的 `text`。", "en": "Return the final `text`."}]}, {"start": 60, "end": 80, "summary_zh": "循环读取交互问题，处理退出、清空历史与文件输入命令。", "summary_en": "Read interactive questions in a loop and handle exit, history-clearing, and file-input commands.", "lines": [{"n": 61, "zh": "定义异步 `main()` {", "en": "Define async `main()` {"}, {"n": 62, "zh": "`history` ← 空列表。", "en": "Set `history` ← an empty list."}, {"n": 63, "zh": "`all_timeseries` ← 空列表。", "en": "Set `all_timeseries` ← an empty list."}, {"n": 64, "zh": "无限循环，直至遇到 `break` {", "en": "Loop indefinitely until `break` is reached {"}, {"n": 65, "zh": "打印 80 个 `=` 作为分隔线。", "en": "Print 80 `=` characters as a separator."}, {"n": 67, "zh": "开始获取用户输入。", "en": "Start getting user input."}, {"n": 68, "zh": "`question` ← 读取提示为 `Question: ` 的用户输入。", "en": "Set `question` ← read user input with the prompt `Question: `."}, {"n": 69, "zh": "若 `question == 'exit'` → 请求退出 {", "en": "If `question == 'exit'` → request exit {"}, {"n": 70, "zh": "`break` 结束主循环。", "en": "`break` ends the main loop."}, {"n": 71, "zh": "否则若 `question == 'clear'` → 请求清空 {", "en": "Else if `question == 'clear'` → request clearing {"}, {"n": 72, "zh": "`history` ← 空列表。", "en": "Set `history` ← an empty list."}, {"n": 73, "zh": "`all_timeseries` ← 空列表。", "en": "Set `all_timeseries` ← an empty list."}, {"n": 74, "zh": "打印 `History cleared.`。", "en": "Print `History cleared.`."}, {"n": 75, "zh": "`continue` 进入下一轮输入。", "en": "`continue` to the next input iteration."}, {"n": 76, "zh": "否则若 `question == 'file'` → 请求从文件读取 {", "en": "Else if `question == 'file'` → request file input {"}, {"n": 77, "zh": "以文本读模式打开 `vllm_input.txt` 为 `f` {", "en": "Open `vllm_input.txt` in text-read mode as `f` {"}, {"n": 78, "zh": "`question` ← 读取 `f` 的全部内容，并以 `rstrip()` 去除末尾空白。", "en": "Set `question` ← read all of `f` and remove trailing whitespace with `rstrip()`."}, {"n": 79, "zh": "`logger.warning(...)` 记录已从文件载入输入。", "en": "Log that input was loaded from the file with `logger.warning(...)`."}]}, {"start": 81, "end": 89, "summary_zh": "解析本轮时间序列，并累积为后续请求的多模态输入。", "summary_en": "Parse this turn's time series and accumulate them as multimodal input for later requests.", "lines": [{"n": 81, "zh": "`input_timeseries` ← `None`。", "en": "Set `input_timeseries` ← `None`."}, {"n": 82, "zh": "若 `ENABLE_TS` 为真 → 处理时间序列 {", "en": "If `ENABLE_TS` is true → process time series {"}, {"n": 83, "zh": "`question, timeseries` ← `extract_and_remove_ts(question)`，拆分清理后的问题与序列。", "en": "Set `question, timeseries` ← `extract_and_remove_ts(question)` to separate the cleaned question from the series."}, {"n": 84, "zh": "若 `timeseries` 非 `None` 且长度大于 `0` → 存在新序列 {", "en": "If `timeseries` is not `None` and its length is greater than `0` → new series exist {"}, {"n": 85, "zh": "`logger.warning(...)` 输出新时间序列数量。", "en": "Log the number of new time series with `logger.warning(...)`."}, {"n": 86, "zh": "循环 `timeseries` 的 `ts` → 转为 `np.array(ts)`，并扩展追加到 `all_timeseries`。", "en": "Loop over each `ts` in `timeseries` → convert it with `np.array(ts)` and extend `all_timeseries` with the results."}, {"n": 87, "zh": "若 `len(all_timeseries) > 0` → 存在累计序列 {", "en": "If `len(all_timeseries) > 0` → accumulated series exist {"}, {"n": 88, "zh": "`input_timeseries` ← `all_timeseries.copy()` → 复制当前累计序列。", "en": "Set `input_timeseries` ← `all_timeseries.copy()` → copy the currently accumulated series."}]}, {"start": 90, "end": 103, "summary_zh": "拼接系统消息、历史对话和本轮问题，并组装模型输入。", "summary_en": "Concatenate the system message, conversation history, and current question, then assemble model input.", "lines": [{"n": 90, "zh": "开始应用聊天模板。", "en": "Start applying the chat template."}, {"n": 91, "zh": "`prompt` ← 系统消息模板，包含 `<|im_start|>system`、固定助手说明和 `<|im_end|>`。", "en": "Set `prompt` ← the system-message template containing `<|im_start|>system`, the fixed assistant instruction, and `<|im_end|>`."}, {"n": 92, "zh": "循环 `history`，逐对取出 `q` 与 `a` {", "en": "Loop over `history`, taking each pair `q` and `a` {"}, {"n": 93, "zh": "向 `prompt` 追加由特殊角色标记包围的历史用户问题 `q` 与助手回答 `a`。", "en": "Append the historical user question `q` and assistant answer `a` to `prompt`, wrapped in special role markers."}, {"n": 94, "zh": "向 `prompt` 追加带用户标记的本轮 `question`，再以助手开始标记引导生成。", "en": "Append this turn's `question` with user markers to `prompt`, then add the assistant opening marker to prompt generation."}, {"n": 96, "zh": "`inputs` ← 新字典 {", "en": "Set `inputs` ← a new dictionary {"}, {"n": 97, "zh": "键 `'prompt'` ← `prompt`。", "en": "Set key `'prompt'` ← `prompt`."}, {"n": 98, "zh": "`}` 结束 `inputs` 初始字典。", "en": "`}` closes the initial `inputs` dictionary."}, {"n": 99, "zh": "若 `input_timeseries` 非 `None` → 附加多模态数据 {", "en": "If `input_timeseries` is not `None` → attach multimodal data {"}, {"n": 100, "zh": "`inputs['multi_modal_data']` ← 新字典 {", "en": "Set `inputs['multi_modal_data']` ← a new dictionary {"}, {"n": 101, "zh": "键 `'timeseries'` ← `input_timeseries`。", "en": "Set key `'timeseries'` ← `input_timeseries`."}, {"n": 102, "zh": "`}` 结束多模态数据字典。", "en": "`}` closes the multimodal-data dictionary."}]}, {"start": 104, "end": 110, "summary_zh": "流式生成并打印回答、保存对话历史，最后启动异步主程序。", "summary_en": "Stream and print the answer, save conversation history, and finally launch the async main program.", "lines": [{"n": 104, "zh": "打印 80 个 `=` 作为分隔线。", "en": "Print 80 `=` characters as a separator."}, {"n": 105, "zh": "`response` ← `await generate_streaming(inputs)` → 等待流式生成完成。", "en": "Set `response` ← `await generate_streaming(inputs)` → wait for streaming generation to finish."}, {"n": 106, "zh": "换行并打印 `[Answer]: ` 与最终 `response`。", "en": "Print a newline followed by `[Answer]: ` and the final `response`."}, {"n": 107, "zh": "将 `(question, response)` 追加到 `history`。", "en": "Append `(question, response)` to `history`."}, {"n": 109, "zh": "若 `__name__ == \"__main__\"` → 作为主脚本执行 {", "en": "If `__name__ == \"__main__\"` → execute as the main script {"}, {"n": 110, "zh": "`asyncio.run(main())` → 运行异步主函数直至结束。", "en": "Call `asyncio.run(main())` → run the async main function until completion."}]}]}, {"path": "chatts/vllm/chatts_vllm.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n# Reference: vLLM (https://github.com/vllm-project/vllm)\n# Credit: Alexander Chemeris\n\n\"\"\"Inference-only Qwen2-ChatTS model compatible with HuggingFace weights.\"\"\"\nfrom collections.abc import Iterable, Mapping, Sequence\nfrom typing import Optional, Union\n\nimport numpy as np\nimport torch\nimport torch.nn as nn\nfrom transformers import BatchFeature, PretrainedConfig, ProcessorMixin\n\nfrom vllm.config import VllmConfig\nfrom vllm.model_executor.models.interfaces import (SupportsLoRA,\n                                                   SupportsMultiModal,\n                                                   SupportsPP)\nfrom vllm.model_executor.models.utils import (AutoWeightsLoader, WeightsMapper,\n                                              init_vllm_registered_model,\n                                              maybe_prefix,\n                                              merge_multimodal_embeddings)\ntry:\n    from vllm.model_executor.sampling_metadata import SamplingMetadata\nexcept ImportError:\n    SamplingMetadata = None\n\nfrom vllm.multimodal import MULTIMODAL_REGISTRY\nfrom vllm.multimodal.inputs import NestedTensors\nfrom vllm.multimodal.parse import MultiModalDataParser, ProcessorBatchItems, EmbeddingItems\nfrom vllm.model_executor.layers.logits_processor import LogitsProcessor\nfrom vllm.multimodal.processing import (BaseMultiModalProcessor,\n                                        BaseProcessingInfo, MultiModalDataDict,\n                                        MultiModalDataItems,\n                                        MultiModalFieldConfig, PromptReplacement,\n                                        PromptUpdateDetails)\ntry:\n    from vllm.multimodal.processing import MultiModalKwargs\nexcept ImportError:\n    MultiModalKwargs = None\n\nfrom vllm.multimodal.profiling import BaseDummyInputsBuilder\nfrom vllm.sequence import IntermediateTensors\nfrom vllm.utils import is_list_of\nfrom vllm import ModelRegistry\nimport math\n\n\n########################MLP TS Embedding (20251015 Version)#####################\nclass TimeSeriesEmbedding(nn.Module):\n    def __init__(self, config):\n        super(TimeSeriesEmbedding, self).__init__()\n        self.patch_size = config['patch_size']\n        self.num_layers = config['num_layers']\n        self.hidden_size = config['hidden_size']\n        self.num_features = config['num_features']\n        self.max_sequence_length = config['max_sequence_length']  # Maximum time series length\n        self.use_position_embedding = config.get('use_position_embedding', False)\n        self.use_position_idx = config.get('use_position_idx', False)\n        self.embedding_dim = config.get('embedding_dim', 16)  # Embedding dimension\n        \n        if self.use_position_embedding:\n            # Extended vocabulary: [0, max_sequence_length) for real positions, max_sequence_length for padding\n            self.position_embedding = nn.Embedding(self.max_sequence_length + 1, self.embedding_dim)\n            self.padding_idx = self.max_sequence_length  # Special index for padding\n            input_size = 1 * self.patch_size + self.embedding_dim * self.patch_size\n        elif self.use_position_idx:\n            input_size = 2 * self.patch_size\n        else:\n            input_size = 1 * self.patch_size\n        \n        # Build MLP layers\n        layers = []\n        for _ in range(self.num_layers - 1):\n            layers.append(nn.Linear(input_size, self.hidden_size))\n            layers.append(nn.GELU())\n            input_size = self.hidden_size\n        layers.append(nn.Linear(input_size, self.hidden_size))\n\n        self.mlp = nn.Sequential(*layers)\n\n    def forward(self, x: torch.Tensor):\n        batch_size = x.size(0)\n        x = x.reshape(batch_size, -1, self.num_features)\n\n        # Extract mask and calculate valid lengths\n        mask = x[:, :, -1].long()\n        valid_lengths = mask.sum(dim=1).long()\n        patch_cnt = (valid_lengths + self.patch_size - 1) // self.patch_size\n\n        patches_list = []\n        # Collect position indices for batch embedding lookup\n        all_position_indices = []\n        patch_info_list = []  # Store metadata for each patch group\n        \n        for i in range(batch_size):\n            vl = valid_lengths[i].item()\n            pc = patch_cnt[i].item()\n            if pc == 0:\n                continue\n            \n            # Extract time series data (excluding mask)\n            xi = x[i, :vl, :1]  # Time-series data\n            total_padded_length = pc * self.patch_size\n            padding_length = total_padded_length - vl\n            \n            # Create position indices: real positions for actual data, special index for padding\n            position_indices = torch.arange(vl, device=x.device)\n            \n            if padding_length > 0:\n                # Pad with last value\n                last_value = xi[-1:, :]\n                padding = last_value.repeat(padding_length, 1)\n                xi = torch.cat([xi, padding], dim=0)\n                \n                # Use special padding index for padding positions\n                padding_positions = torch.full((padding_length,), self.padding_idx, device=x.device)\n                position_indices = torch.cat([position_indices, padding_positions], dim=0)\n\n            # Reshape to patches\n            xi = xi.reshape(pc, self.patch_size)  # (num_patches, patch_size)\n            position_indices = position_indices.reshape(pc, self.patch_size)  # (num_patches, patch_size)\n\n            if self.use_position_embedding:\n                # Collect position indices instead of calling embedding immediately\n                all_position_indices.append(position_indices)\n                patch_info_list.append({\n                    'xi': xi,\n                    'pc': pc,\n                    'sample_idx': i\n                })\n            elif self.use_position_idx:\n                # Normalize position indices\n                pos_indices = torch.arange(vl, device=x.device).unsqueeze(1)\n                pos_indices = pos_indices / max(1, valid_lengths.max().item() - 1)\n                if padding_length > 0:\n                    # Use -1 for padding positions\n                    padding_indices = torch.full((padding_length, 1), -1, device=x.device)\n                    pos_indices = torch.cat([pos_indices, padding_indices], dim=0)\n                # Combine time series data with position indices\n                xi_combined = torch.cat([xi.reshape(-1, 1), pos_indices], dim=1)\n                patch_input = xi_combined.reshape(pc, self.patch_size * 2)\n                patches_list.append(patch_input)\n            else:\n                # No position embedding, use raw patches\n                patch_input = xi\n                patches_list.append(patch_input)\n\n        # Batch process position embeddings if needed\n        if self.use_position_embedding and all_position_indices:\n            # Concatenate all position indices for batch embedding lookup\n            batch_position_indices = torch.cat(all_position_indices, dim=0)\n            # print(f\"{x.shape=}, {x.device=}, {len(all_position_indices)=}, {batch_position_indices=}\")\n            batch_pos_emb = self.position_embedding(batch_position_indices)  # Single embedding call\n            \n            # Split embeddings back and create patch inputs\n            emb_start_idx = 0\n            for patch_info in patch_info_list:\n                xi = patch_info['xi']\n                pc = patch_info['pc']\n                \n                # Extract corresponding embeddings\n                pos_emb = batch_pos_emb[emb_start_idx:emb_start_idx + pc]\n                emb_start_idx += pc\n                \n                # Flatten and concatenate\n                xi = xi.unsqueeze(-1)  # (num_patches, patch_size, 1)\n                patch_input = torch.cat([\n                    xi.flatten(1),  # (num_patches, patch_size)\n                    pos_emb.flatten(1)  # (num_patches, patch_size * embedding_dim)\n                ], dim=1)\n                patches_list.append(patch_input)\n\n        # Process all patches through MLP\n        if patches_list:\n            x_patches = torch.cat(patches_list, dim=0)\n            x = self.mlp(x_patches)\n        else:\n            # Handle empty case\n            x = torch.empty(0, self.hidden_size, device=x.device)\n\n        return x, patch_cnt\n\n\n# === TS Encoder === #\n# get_patch_cnt: From Time Series Embedding\ndef get_patch_cnt(x: torch.Tensor, ts_config: PretrainedConfig):\n    batch_size = x.shape[0]\n    x = x.reshape(batch_size, -1, ts_config['num_features'])\n\n    mask = x[:, :, -1]\n    valid_lengths = mask.sum(1).long()  # Shape: (batch_size)\n\n    patch_cnt = (valid_lengths + int(ts_config['patch_size']) - 1) // int(\n        ts_config['patch_size'])\n    return patch_cnt\n\n\n\nclass Qwen2TSProcessingInfo(BaseProcessingInfo):\n\n    def get_hf_config(self):\n        return self.ctx.get_hf_config(PretrainedConfig)\n\n    def get_hf_processor(self, **kwargs: object):\n        return self.ctx.get_hf_processor(ProcessorMixin, **kwargs)\n\n    def get_supported_mm_limits(self) -> Mapping[str, Optional[int]]:\n        return {\"timeseries\": 50}  # Allow up to 50 time series per prompt\n\n\nclass Qwen2TSDummyInputsBuilder(BaseDummyInputsBuilder[Qwen2TSProcessingInfo]):\n\n    def get_dummy_text(self, mm_counts: Mapping[str, int]) -> str:\n        return \"<ts><ts/>\" * mm_counts.get(\"timeseries\", 0)\n    \n    def _get_dummy_timeseries(\n        self,\n        *,\n        length: int,\n        num_timeseries: int,\n    ):\n        if num_timeseries == 0:\n            return []\n        timeseries = np.zeros(length)\n        return [timeseries] * num_timeseries\n\n    def get_dummy_mm_data(\n        self,\n        seq_len: int,\n        mm_counts: Mapping[str, int],\n    ) -> MultiModalDataDict:\n        hf_config = self.info.get_hf_config()\n        max_ts_length = hf_config.ts.get('max_sequence_length', hf_config.ts['max_length'])\n        ts_count = mm_counts.get(\"timeseries\", 0)\n        return {\n            \"timeseries\":\n            self._get_dummy_timeseries(length=max_ts_length,\n                                       num_timeseries=ts_count)\n        }\n\n\nHfTimeSeriesItem = Union[list[float], list[list[float]], np.ndarray,\n                                    \"torch.Tensor\"]\n\nclass TimeSeriesProcessorItems(ProcessorBatchItems[HfTimeSeriesItem]):\n    \"\"\"Class for handling time series data items.\"\"\"\n\n    def __init__(self, data: Sequence[HfTimeSeriesItem]) -> None:\n        super().__init__(data, \"timeseries\")\n\n    def get_processor_data(self) -> Mapping[str, object]:\n        # \"timeseries\" is a special case because it already ends in \"s\"\n        if self.modality == \"timeseries\":\n            return {f\"{self.modality}\": self.data}\n        else:\n            return {f\"{self.modality}s\": self.data}\n\n    def get_series_length(self, item_idx: int) -> int:\n        \"\"\"Get the length of the time series.\"\"\"\n        series = self.get(item_idx)\n        if isinstance(series, (np.ndarray, torch.Tensor)):\n            return series.shape[0]\n        elif isinstance(series, list):\n            return len(series)\n        else:\n            raise TypeError(\n                f\"Unsupported type for time series: {type(series)}\")\n\n\nclass TimeSeriesEmbeddingItems(EmbeddingItems):\n    \"\"\"Class for handling time series embedding items.\"\"\"\n\n    def __init__(self, data: Union[torch.Tensor, list[torch.Tensor]]) -> None:\n        super().__init__(data, \"timeseries\")\n\n\nclass Qwen2TSDataParser(MultiModalDataParser):\n    def _parse_timeseries_data(\n        self,\n        data\n    ):\n        \"\"\"Parse time series data.\"\"\"\n        if self._is_empty(data):\n            return None\n\n        if self._is_embeddings(data):\n            return TimeSeriesEmbeddingItems(data)\n\n        return TimeSeriesProcessorItems(\n            data if is_list_of(data, (np.ndarray, torch.Tensor,\n                                      list)) else [data])\n\n    def _get_subparsers(self):\n        return {\n            \"audio\": self._parse_audio_data,\n            \"image\": self._parse_image_data,\n            \"video\": self._parse_video_data,\n            \"timeseries\": self._parse_timeseries_data,\n        }\n    \n\nclass Qwen2TSMultiModalProcessor(BaseMultiModalProcessor[Qwen2TSProcessingInfo]\n                                 ):\n    def _get_data_parser(self) -> MultiModalDataParser:\n        return Qwen2TSDataParser()\n\n    def _call_hf_processor(\n        self,\n        prompt: str,\n        mm_data: Mapping[str, object],\n        mm_kwargs: Mapping[str, object],\n        tok_kwargs: Mapping[str, object]={},\n    ) -> BatchFeature:\n        mm_data = dict(mm_data)\n        ts = mm_data.pop(\"timeseries\", [])\n\n        if ts:\n            mm_data[\"timeseries\"] = ts\n\n        mm_kwargs = dict(mm_kwargs)\n        mm_kwargs['vllm_flag'] = True\n        try:\n            result = super()._call_hf_processor(\n                prompt=prompt,\n                mm_data=mm_data,\n                mm_kwargs=mm_kwargs,\n                tok_kwargs=tok_kwargs,\n            )\n        except TypeError:\n            result = super()._call_hf_processor(\n                prompt=prompt,\n                mm_data=mm_data,\n                mm_kwargs=mm_kwargs,\n            )\n\n        return result\n\n    def _get_mm_fields_config(\n        self,\n        hf_inputs: BatchFeature,\n        hf_processor_mm_kwargs: Mapping[str, object],\n    ) -> Mapping[str, MultiModalFieldConfig]:\n        # Define the field name and configuration for time series data\n        return {\n            \"timeseries\": MultiModalFieldConfig.batched(\"timeseries\"),\n        }\n\n    def _hf_processor_applies_updates(\n        self,\n        prompt_text: str,\n        mm_items: MultiModalDataItems,\n        hf_processor_mm_kwargs: Mapping[str, object],\n        tokenization_kwargs: Mapping[str, object]={},\n    ) -> bool:\n        return False\n\n    def _get_prompt_updates(\n        self,\n        mm_items: MultiModalDataItems,\n        hf_processor_mm_kwargs: Mapping[str, object],\n        out_mm_kwargs,\n    ) -> list[PromptReplacement]:\n        hf_config = self.info.get_hf_config()\n        placeholder = hf_config.ts_token_start_index\n\n        if 'timeseries' not in mm_items:\n            return []\n\n        if 'timeseries' not in out_mm_kwargs:\n            return []\n\n        patch_size = hf_config.ts['patch_size']\n        \n        # Check if we are using the new structure (list of items with .data) or old structure (list of tuples)\n        ts_data = out_mm_kwargs[\"timeseries\"]\n        is_new_structure = False\n        if len(ts_data) > 0:\n            first_item = ts_data[0]\n            # In new structure, items are usually dict-like or objects where we access [\"timeseries\"]\n            # In old structure, items are tuples (ts_tokens, encoded_ts_arrays)\n            if not isinstance(first_item, (list, tuple)):\n                 is_new_structure = True\n\n        if is_new_structure:\n            def get_replacement_qwen2_ts(item_idx: int):\n                # Get out item of the current modality\n                out_item = out_mm_kwargs[\"timeseries\"][item_idx]\n                # print(f\"{out_item['timeseries'].data=}\")\n                ts_tokens, encoded_ts_arrays = out_item[\"timeseries\"].data\n                patch_cnt = (encoded_ts_arrays.shape[1] // 2 + patch_size - 1) // patch_size\n\n                # Use the pre-tokenized replacements\n                tokens = ts_tokens.copy()\n                # Extend the tokens with placeholders to match the patch_cnt\n                num_placeholders = sum(1 for t in tokens if t == placeholder)\n                if num_placeholders < patch_cnt:\n                    tokens.extend([placeholder] *\n                                  (patch_cnt - num_placeholders))\n                # return tokens\n                return PromptUpdateDetails.select_token_id(\n                    tokens,\n                    embed_token_id=placeholder,\n                )\n        else:\n            # Old structure\n            ts_tokens, encoded_ts_arrays = zip(*out_mm_kwargs[\"timeseries\"])\n            patch_cnt = [\n                (encoded_ts_arrays[i].shape[1] // 2 + patch_size - 1) // patch_size\n                for i in range(len(encoded_ts_arrays))\n            ]\n\n            def get_replacement_qwen2_ts(item_idx: int):\n                # Use the pre-tokenized replacements\n                tokens = ts_tokens[item_idx].copy()\n                # Extend the tokens with placeholders to match the patch_cnt\n                num_placeholders = sum(1 for t in tokens if t == placeholder)\n                if num_placeholders < patch_cnt[item_idx]:\n                    tokens.extend([placeholder] *\n                                  (patch_cnt[item_idx] - num_placeholders))\n                # return tokens\n                return PromptUpdateDetails.select_token_id(\n                    tokens,\n                    embed_token_id=placeholder,\n                )\n\n        return [\n            PromptReplacement(\n                modality=\"timeseries\",\n                target=[placeholder, placeholder + 1],\n                replacement=get_replacement_qwen2_ts,\n            )\n        ]\n\n\n@MULTIMODAL_REGISTRY.register_processor(\n    Qwen2TSMultiModalProcessor,\n    info=Qwen2TSProcessingInfo,\n    dummy_inputs=Qwen2TSDummyInputsBuilder,\n)\nclass Qwen2TSForCausalLM(nn.Module, SupportsMultiModal, SupportsPP,\n                         SupportsLoRA):\n    packed_modules_mapping = {\n        \"qkv_proj\": [\n            \"q_proj\",\n            \"k_proj\",\n            \"v_proj\",\n        ],\n        \"gate_up_proj\": [\n            \"gate_proj\",\n            \"up_proj\",\n        ],\n    }\n\n    # To ensure correct weight loading and mapping.\n    hf_to_vllm_mapper = WeightsMapper(orig_to_new_prefix={\n        \"lm_head.\": \"language_model.lm_head.\",\n        \"model.\": \"language_model.model.\",\n    })\n\n    def __init__(self, *, vllm_config: VllmConfig, prefix: str = \"\"):\n        super().__init__()\n        config: PretrainedConfig = vllm_config.model_config.hf_config\n        quant_config = vllm_config.quant_config\n        multimodal_config = vllm_config.model_config.multimodal_config\n        self.config = config\n        self.multimodal_config = multimodal_config\n\n        self.ts_encoder = TimeSeriesEmbedding(config.ts)\n        self.quant_config = quant_config\n\n        self.language_model = init_vllm_registered_model(\n            vllm_config=vllm_config,\n            hf_config=config,\n            prefix=maybe_prefix(prefix, \"language_model\"),\n            architectures=[\"Qwen2ForCausalLM\"],\n        )\n\n        self.make_empty_intermediate_tensors = (\n            self.language_model.make_empty_intermediate_tensors)\n\n    def _parse_and_validate_ts_input(self, **kwargs: object) -> torch.Tensor:\n        timeseries = kwargs.pop('timeseries', None)\n        if timeseries is None:\n            return None\n\n        # ChatTS processor returns a list of tuples\n        \n        # timeseries (batch x (ts_tokens, num_ts x encoded_ts) or batch x num_ts x (ts_tokens, encoded_ts))\n        encoded_ts_arrays = []\n        for batch in timeseries:\n            if not isinstance(batch[0], list):\n                encoded_ts_arrays.append(batch[1])\n            else:\n                # flatten the ts first\n                for ts in batch:\n                    encoded_ts_arrays.append(ts[1])\n\n        device = encoded_ts_arrays[0].device\n\n        max_length = max(ts.shape[1] for ts in encoded_ts_arrays)\n        total_rows = sum(ts.shape[0] for ts in encoded_ts_arrays)\n        feature_dim = encoded_ts_arrays[0].shape[2] if encoded_ts_arrays else 0\n\n        # Pre-allocate the tensor with the right size\n        concatenated_ts = torch.zeros((total_rows, max_length, feature_dim),\n                                      dtype=torch.float16,\n                                      device=device)\n\n        # Copy each array to the right position\n        row_offset = 0\n        for ts in encoded_ts_arrays:\n            ts_tensor = torch.tensor(ts, dtype=torch.float16,\n                                     device=device) if isinstance(\n                                         ts, np.ndarray) else ts\n            concatenated_ts[row_offset:row_offset +\n                            ts.shape[0], :ts.shape[1], :] = ts_tensor\n            row_offset += ts.shape[0]\n\n        input_features = concatenated_ts\n\n        if not isinstance(input_features, (torch.Tensor, list)):\n            raise ValueError(\"Incorrect type of ts input features. \"\n                             f\"Got type: {type(input_features)}\")\n        return input_features\n\n    def get_multimodal_embeddings(self, **kwargs) -> Optional[NestedTensors]:\n        ts_input = self._parse_and_validate_ts_input(**kwargs)\n        if ts_input is None:\n            return None\n        ts_features, patch_cnt = self.ts_encoder(ts_input)\n\n        # Reshape ts_features into a list of 2D tensors\n        if ts_features.size(0) > 0:\n            features_list = []\n            start_idx = 0\n            for count in patch_cnt:\n                if count > 0:\n                    end_idx = start_idx + count\n                    features_list.append(ts_features[start_idx:end_idx])\n                    start_idx = end_idx\n                else:\n                    # Add empty tensor for consistency when count is 0\n                    # This ensures consistent behavior with prefix caching\n                    features_list.append(\n                        torch.zeros((0, ts_features.size(1)),\n                                    device=ts_features.device,\n                                    dtype=ts_features.dtype))\n            ts_features = features_list\n\n        return ts_features\n\n    def get_input_embeddings(\n        self,\n        input_ids: torch.Tensor,\n        multimodal_embeddings: Optional[NestedTensors] = None,\n    ) -> torch.Tensor:\n        inputs_embeds = self.language_model.get_input_embeddings(input_ids)\n        if multimodal_embeddings is not None:\n            inputs_embeds = merge_multimodal_embeddings(\n                input_ids, inputs_embeds, multimodal_embeddings,\n                self.config.ts_token_start_index)\n        return inputs_embeds\n\n    def forward(\n        self,\n        input_ids: torch.Tensor,\n        positions: torch.Tensor,\n        intermediate_tensors: Optional[IntermediateTensors] = None,\n        inputs_embeds: Optional[torch.Tensor] = None,\n        **kwargs: object,\n    ) -> Union[torch.Tensor, IntermediateTensors]:\n\n        if intermediate_tensors is not None:\n            inputs_embeds = None\n\n        # NOTE: In v1, inputs_embeds is always generated at model runner, this\n        # condition is for v0 compatibility.\n        elif inputs_embeds is None:\n            ts_features = self.get_multimodal_embeddings(**kwargs)\n            inputs_embeds = self.get_input_embeddings(input_ids, ts_features)\n            input_ids = None\n\n        hidden_states = self.language_model.model(input_ids,\n                                                  positions,\n                                                  intermediate_tensors,\n                                                  inputs_embeds=inputs_embeds)\n        return hidden_states\n\n    def compute_logits(\n        self,\n        hidden_states: torch.Tensor,\n        sampling_metadata: Optional[object] = None,\n    ) -> Optional[torch.Tensor]:\n        try:\n            return self.language_model.compute_logits(hidden_states,\n                                                      sampling_metadata)\n        except TypeError:\n            return self.language_model.compute_logits(hidden_states)\n\n    def load_weights(self, weights: Iterable[tuple[str,\n                                                   torch.Tensor]]) -> set[str]:\n        loader = AutoWeightsLoader(self)\n\n        autoloaded_weights = loader.load_weights(weights,\n                                                 mapper=self.hf_to_vllm_mapper)\n\n        # The HF config doesn't specify whether these are tied,\n        # so we detect it this way\n        if \"embed_tokens.weight\" not in autoloaded_weights:\n            self.embed_tokens = self.language_model.model.embed_tokens\n            autoloaded_weights.add(\"embed_tokens.weight\")\n\n        return autoloaded_weights\n\n\n@MULTIMODAL_REGISTRY.register_processor(\n    Qwen2TSMultiModalProcessor,\n    info=Qwen2TSProcessingInfo,\n    dummy_inputs=Qwen2TSDummyInputsBuilder,\n)\nclass Qwen3TSForCausalLM(nn.Module, SupportsMultiModal, SupportsPP,\n                         SupportsLoRA):\n    packed_modules_mapping = {\n        \"qkv_proj\": [\n            \"q_proj\",\n            \"k_proj\",\n            \"v_proj\",\n        ],\n        \"gate_up_proj\": [\n            \"gate_proj\",\n            \"up_proj\",\n        ],\n    }\n\n    # To ensure correct weight loading and mapping.\n    hf_to_vllm_mapper = WeightsMapper(orig_to_new_prefix={\n        \"lm_head.\": \"language_model.lm_head.\",\n        \"model.\": \"language_model.model.\",\n    })\n\n    def __init__(self, *, vllm_config: VllmConfig, prefix: str = \"\"):\n        super().__init__()\n        config: PretrainedConfig = vllm_config.model_config.hf_config\n        quant_config = vllm_config.quant_config\n        multimodal_config = vllm_config.model_config.multimodal_config\n        self.config = config\n        self.multimodal_config = multimodal_config\n\n        self.ts_encoder = TimeSeriesEmbedding(config.ts)\n        self.quant_config = quant_config\n\n        self.language_model = init_vllm_registered_model(\n            vllm_config=vllm_config,\n            hf_config=config,\n            prefix=maybe_prefix(prefix, \"language_model\"),\n            architectures=[\"Qwen3ForCausalLM\"],\n        )\n\n        self.make_empty_intermediate_tensors = (\n            self.language_model.make_empty_intermediate_tensors)\n\n    def _parse_and_validate_ts_input(self, **kwargs: object) -> torch.Tensor:\n        timeseries = kwargs.pop('timeseries', None)\n        if timeseries is None:\n            return None\n\n        # ChatTS processor returns a list of tuples\n        \n        # timeseries (batch x (ts_tokens, num_ts x encoded_ts) or batch x num_ts x (ts_tokens, encoded_ts))\n        encoded_ts_arrays = []\n        for batch in timeseries:\n            if not isinstance(batch[0], list):\n                encoded_ts_arrays.append(batch[1])\n            else:\n                # flatten the ts first\n                for ts in batch:\n                    encoded_ts_arrays.append(ts[1])\n\n        device = encoded_ts_arrays[0].device\n\n        max_length = max(ts.shape[1] for ts in encoded_ts_arrays)\n        total_rows = sum(ts.shape[0] for ts in encoded_ts_arrays)\n        feature_dim = encoded_ts_arrays[0].shape[2] if encoded_ts_arrays else 0\n\n        # Pre-allocate the tensor with the right size\n        concatenated_ts = torch.zeros((total_rows, max_length, feature_dim),\n                                      dtype=torch.float16,\n                                      device=device)\n\n        # Copy each array to the right position\n        row_offset = 0\n        for ts in encoded_ts_arrays:\n            ts_tensor = torch.tensor(ts, dtype=torch.float16,\n                                     device=device) if isinstance(\n                                         ts, np.ndarray) else ts\n            concatenated_ts[row_offset:row_offset +\n                            ts.shape[0], :ts.shape[1], :] = ts_tensor\n            row_offset += ts.shape[0]\n\n        input_features = concatenated_ts\n\n        if not isinstance(input_features, (torch.Tensor, list)):\n            raise ValueError(\"Incorrect type of ts input features. \"\n                             f\"Got type: {type(input_features)}\")\n        return input_features\n\n    def get_multimodal_embeddings(self, **kwargs) -> Optional[NestedTensors]:\n        ts_input = self._parse_and_validate_ts_input(**kwargs)\n        if ts_input is None:\n            return None\n        ts_features, patch_cnt = self.ts_encoder(ts_input)\n\n        # Reshape ts_features into a list of 2D tensors\n        if ts_features.size(0) > 0:\n            features_list = []\n            start_idx = 0\n            for count in patch_cnt:\n                if count > 0:\n                    end_idx = start_idx + count\n                    features_list.append(ts_features[start_idx:end_idx])\n                    start_idx = end_idx\n                else:\n                    # Add empty tensor for consistency when count is 0\n                    # This ensures consistent behavior with prefix caching\n                    features_list.append(\n                        torch.zeros((0, ts_features.size(1)),\n                                    device=ts_features.device,\n                                    dtype=ts_features.dtype))\n            ts_features = features_list\n\n        return ts_features\n\n    def get_input_embeddings(\n        self,\n        input_ids: torch.Tensor,\n        multimodal_embeddings: Optional[NestedTensors] = None,\n    ) -> torch.Tensor:\n        inputs_embeds = self.language_model.get_input_embeddings(input_ids)\n        if multimodal_embeddings is not None:\n            inputs_embeds = merge_multimodal_embeddings(\n                input_ids, inputs_embeds, multimodal_embeddings,\n                self.config.ts_token_start_index)\n        return inputs_embeds\n\n    def forward(\n        self,\n        input_ids: torch.Tensor,\n        positions: torch.Tensor,\n        intermediate_tensors: Optional[IntermediateTensors] = None,\n        inputs_embeds: Optional[torch.Tensor] = None,\n        **kwargs: object,\n    ) -> Union[torch.Tensor, IntermediateTensors]:\n\n        if intermediate_tensors is not None:\n            inputs_embeds = None\n\n        # NOTE: In v1, inputs_embeds is always generated at model runner, this\n        # condition is for v0 compatibility.\n        elif inputs_embeds is None:\n            ts_features = self.get_multimodal_embeddings(**kwargs)\n            inputs_embeds = self.get_input_embeddings(input_ids, ts_features)\n            input_ids = None\n\n        hidden_states = self.language_model.model(input_ids,\n                                                  positions,\n                                                  intermediate_tensors,\n                                                  inputs_embeds=inputs_embeds)\n        return hidden_states\n\n    def compute_logits(\n        self,\n        hidden_states: torch.Tensor,\n        sampling_metadata: Optional[object] = None,\n    ) -> Optional[torch.Tensor]:\n        try:\n            return self.language_model.compute_logits(hidden_states,\n                                                      sampling_metadata)\n        except TypeError:\n            return self.language_model.compute_logits(hidden_states)\n\n    def load_weights(self, weights: Iterable[tuple[str,\n                                                   torch.Tensor]]) -> set[str]:\n        loader = AutoWeightsLoader(self)\n\n        autoloaded_weights = loader.load_weights(weights,\n                                                 mapper=self.hf_to_vllm_mapper)\n\n        # The HF config doesn't specify whether these are tied,\n        # so we detect it this way\n        if \"embed_tokens.weight\" not in autoloaded_weights:\n            self.embed_tokens = self.language_model.model.embed_tokens\n            autoloaded_weights.add(\"embed_tokens.weight\")\n\n        return autoloaded_weights\n\n\n# Register VLLM\nModelRegistry.register_model(\"Qwen2TSForCausalLM\", Qwen2TSForCausalLM)\nprint(f\"[ChatTS VLLM] Qwen2TSForCausalLM registered in vLLM!\")\n\nModelRegistry.register_model(\"Qwen3TSForCausalLM\", Qwen3TSForCausalLM)\nprint(f\"[ChatTS VLLM] Qwen3TSForCausalLM registered in vLLM!\")\n", "blocks": []}, {"path": "config/datagen_config.yaml", "language": "yaml", "note_zh": "", "note_en": "", "code": "# ===============================Please edit the following part=============================\n# Configuration for LLM (you must set them manually)\nlocal_llm_path: \"[LOCAL_LLM_PATH]\"\nnum_gpus: 8\ngpu_per_model: 1\n\n# Output dir of the generated datasets\ndata_output_dir: \"data\"\n# ===============================Please edit the above part=================================\n\n\n# ===================================Optional Config========================================\n# Encoding Method: no (no proprocessing and encoding, do not change this) (default: no)\nencoding_method: \"no\"\n\n# Sequence length of the generated time series (set to null for random length) (default: 256)\n# Note: In ChatTS, we should generate datasets with both 256 seq length and random seq lengths for adaptation to time series with different lengths.\nseq_len: 256\n\n# Num of data to generate\nnum_data_template_qa: 20000\nnum_data_llm_qa: 15000\nnum_data_ift: 10000\nnum_data_tsevol: 10000\nnum_data_uts_reason: 10000\nnum_data_uts_reason_cn: 10000\nnum_data_mts_reason: 10000\nnum_data_rewrite: 10000\n\n# Whether to disable extreme lengths (<64, >1024) (default: false)\ndisable_extreme_lengths: false\n\n# Disable config of attributes from metrics (default: false)\ndisable_metric_config: false\n\n# Whether to output the error information in ts_generator (default: false)\nlocal_change_verbose: false\n\n# Just use the default settings below\nenable_drop_prompt: false\nenable_multiple_trend: true\nenable_multiple_seasonal: false\nenable_multiple_noise: false\n\n# Set to true for debug usage only (default: false)\ndryrun: false\n", "blocks": []}, {"path": "demo/demo_vllm.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n# Note: You have to install `vllm==0.8.5`.\n# Note: Usage: `VLLM_WORKER_MULTIPROC_METHOD=spawn VLLM_ALLOW_INSECURE_SERIALIZATION=1 python3 -m demo.demo_vllm`\n# Note: `chatts.vllm.chatts_vllm` has to be imported here first as it will rigister the custom ChatTS module and the multimodal processor.\nimport chatts.vllm.chatts_vllm\n\nfrom vllm import LLM, SamplingParams\nimport numpy as np\n\n\n# CONFIG\nMODEL_PATH = \"./ckpt\"\nctx_length = 6000\n\n\n# Load Model with vLLM\nlanguage_model = LLM(model=MODEL_PATH, trust_remote_code=True, max_model_len=ctx_length, tensor_parallel_size=1, gpu_memory_utilization=0.95, limit_mm_per_prompt={\"timeseries\": 50})\n\n# Load Time Series Data\nSEQ_LEN_1 = 256\nSEQ_LEN_2 = 1000\n\nx1 = np.arange(SEQ_LEN_1)\nx2 = np.arange(SEQ_LEN_2)\n\n# TS1: A simple sin signal with a sudden decrease\nts1 = np.sin(x1 / 10) * 5.0\nts1[103:] -= 10.0\n\n# TS2: A increasing trend with a upward spike\nts2 = x2 * 0.01\nts2[100] += 10.0\nprompt = f\"I have 2 time series. TS1 is of length {SEQ_LEN_1}: <ts><ts/>; TS2 if of length {SEQ_LEN_2}: <ts><ts/>. Please analyze the local changes in these time series first and then conclude if these time series showing local changes near the same time?\"\nprompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|>\\n<|im_start|>user\\n{prompt}<|im_end|>\\n<|im_start|>assistant\\n\"\n\nmm_data = {\"timeseries\": [ts1.tolist(), ts2.tolist()]}\ninputs = {\n    \"prompt\": prompt,\n    \"multi_modal_data\": mm_data\n}\n\n# TODO: Test batch inference speed\ninputs = [inputs] * 100\n\n# Inference\noutputs = language_model.generate(inputs, sampling_params=SamplingParams(max_tokens=300))\n\nfor o in outputs:\n    generated_text = o.outputs[0].text\n    print(generated_text)\n", "blocks": [{"start": 1, "end": 17, "summary_zh": "声明 MIT 许可证并列出本地推理的运行要求", "summary_en": "State the MIT license and list requirements for local inference.", "lines": [{"n": 1, "zh": "声明 2024 年清华大学与字节跳动的版权。", "en": "Declare the 2024 copyright of Tsinghua University and ByteDance."}, {"n": 2, "zh": "`#` 作为许可证注释的分隔线。", "en": "`#` acts as a separator in the license comment."}, {"n": 3, "zh": "声明本文件采用 MIT 许可证。", "en": "State that this file uses the MIT License."}, {"n": 4, "zh": "限制：仅可在遵守许可证时使用本文件。", "en": "Restrict use of this file to compliance with the License."}, {"n": 5, "zh": "引出许可证副本的获取地址。", "en": "Introduce where to obtain a copy of the License."}, {"n": 6, "zh": "`#` 分隔许可证说明与网址。", "en": "`#` separates the license text from its URL."}, {"n": 7, "zh": "给出许可证地址 `https://opensource.org/license/mit`。", "en": "Give the license URL `https://opensource.org/license/mit`."}, {"n": 8, "zh": "`#` 分隔许可证网址与后续条款。", "en": "`#` separates the license URL from the following terms."}, {"n": 9, "zh": "除非适用法律要求或另有书面约定：", "en": "Unless required by applicable law or agreed in writing:"}, {"n": 10, "zh": "软件按「原样」分发。", "en": "Distribute the software on an `AS IS` basis."}, {"n": 11, "zh": "不提供任何明示或默示的担保或条件。", "en": "Provide no warranties or conditions, express or implied."}, {"n": 12, "zh": "各语言下的权限以许可证为准。", "en": "Defer to the License for language-specific permissions."}, {"n": 13, "zh": "责任限制同样以许可证为准。", "en": "Defer to the License for limitations as well."}, {"n": 15, "zh": "要求安装 `vllm==0.8.5`。", "en": "Require installation of `vllm==0.8.5`."}, {"n": 16, "zh": "给出启动命令：设置多进程方式为 `spawn`、允许不安全序列化，再运行 `demo.demo_vllm`。", "en": "Give the launch command: set multiprocessing to `spawn`, allow insecure serialization, then run `demo.demo_vllm`."}, {"n": 17, "zh": "要求先导入 `chatts.vllm.chatts_vllm` → 注册 ChatTS 自定义模块与多模态处理器。", "en": "Require importing `chatts.vllm.chatts_vllm` first → register the custom ChatTS module and multimodal processor."}]}, {"start": 18, "end": 27, "summary_zh": "注册自定义模块、导入依赖并设置模型配置", "summary_en": "Register custom modules, import dependencies, and set model configuration.", "lines": [{"n": 18, "zh": "`import chatts.vllm.chatts_vllm` → 执行导入副作用以完成自定义注册。", "en": "`import chatts.vllm.chatts_vllm` → trigger import side effects to complete custom registration."}, {"n": 20, "zh": "从 `vllm` 引入 `LLM` 与 `SamplingParams`。", "en": "Import `LLM` and `SamplingParams` from `vllm`."}, {"n": 21, "zh": "`import numpy as np` → 引入数值数组工具。", "en": "`import numpy as np` → import numerical array tools."}, {"n": 24, "zh": "标记配置段。", "en": "Mark the configuration section."}, {"n": 25, "zh": "`MODEL_PATH` = `./ckpt` → 指定本地模型目录。", "en": "`MODEL_PATH` = `./ckpt` → set the local model directory."}, {"n": 26, "zh": "`ctx_length` = `6000` → 设置上下文长度。", "en": "`ctx_length` = `6000` → set the context length."}]}, {"start": 28, "end": 38, "summary_zh": "载入 vLLM 模型并准备两条序列的采样坐标", "summary_en": "Load the vLLM model and prepare sample coordinates for two series.", "lines": [{"n": 29, "zh": "标记使用 vLLM 载入模型。", "en": "Mark model loading with vLLM."}, {"n": 30, "zh": "`language_model` = 创建 `LLM`：载入 `MODEL_PATH`，信任远程代码，最大长度为 `ctx_length`；使用单卡并行、显存占比 `0.95`，每个提示最多 `50` 条时序。", "en": "`language_model` = create an `LLM`: load `MODEL_PATH`, trust remote code, and cap length at `ctx_length`; use one-way tensor parallelism, GPU memory utilization `0.95`, and at most `50` time series per prompt."}, {"n": 32, "zh": "标记时序数据载入段。", "en": "Mark the time-series data loading section."}, {"n": 33, "zh": "`SEQ_LEN_1` = `256` → 设置第一条序列长度。", "en": "`SEQ_LEN_1` = `256` → set the first series length."}, {"n": 34, "zh": "`SEQ_LEN_2` = `1000` → 设置第二条序列长度。", "en": "`SEQ_LEN_2` = `1000` → set the second series length."}, {"n": 36, "z
