t(0, len(samples) - 1)\n            sample = copy.deepcopy(samples[idx])\n            try:\n                qa = generate_qa(sample, filenames[idx])\n            except NotImplementedError as err:\n                continue\n            except Exception as err:\n                traceback.print_exc()\n                continue\n            if qa is not None:\n                result.append(qa)\n                pbar.update(1)\n    \n    print(\"Saving dataset...\")\n    with open(OUTPUT_PATH, 'wt') as f:\n        for item in result:\n            item = {\n                'input': item['question'],\n                'output': item['answer'],\n                'timeseries': timeseries_to_list(item['timeseries']),\n            }\n            f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n    print(f'Finished! {len(result)} samples saved to {OUTPUT_PATH}.')\n\n\nif __name__ == '__main__':\n    generate_dataset()\n", "blocks": []}, {"path": "chatts/sft/generate_llm_qa.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\"\"\"\n    This script is used to generate the stage-2 training data with LLMs for univariate time series, which can be further used as seed QAs for TSEvol.\n    Usage:\n        python3 -m chatts.sft.generate_llm_qa\n\"\"\"\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport json\nimport yaml\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_time_series, generate_controlled_attributes, attribute_to_text\nfrom chatts.utils.llm_utils import LLMClient, parse_llm_json\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nimport os\n\n\n# CONFIG\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))['num_data_llm_qa']\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['seq_len']  # Set to None to enable random sequence length selection\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))['data_output_dir']\nOUTPUT_DATASET = f'{OUTPUT_BASE_DIR}/llm_qa_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\nOUTPUT_LABEL = f'{OUTPUT_BASE_DIR}/evol_labels/llm_qa_{TOTAL_CNT}_{ENCODING_METHOD}.json'\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['dryrun']\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))['local_llm_path']\n\n# All Config for TS Attributes (type & probability)\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\n\n\ndef generate_prompt_data():\n    # Determine the current sequence length\n    if SEQ_LEN is None:\n        current_seq_len = random.randint(64, 1024)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Random choose a category and metric name\n    sample = random.choice(list(metric_config))\n    category = sample['category']\n    metric = random.choice(sample['metrics'])\n    fields = []\n\n    # Choose a metric and generate\n    attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Scalar\n    scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    # Generate QA\n    instruction = f\"You are a time series analysis expert. This is a metric called {metric} collected from {category} with length of {current_seq_len}: {cur_ts_prompt}.\"\n    prompts = []\n    fields = []\n\n    # Generate random task\n    task_candidates = ['stl', 'local-all', 'statistic-all', 'statistic-part']\n    tasks = list(np.random.choice(task_candidates, size=1, replace=False))\n    \n    for task in tasks:\n        prompt = f\"I am creating a dataset for a time series analysis large language model. Based on the information I provide about the time series, I need you to generate as many rich QA pairs as possible according to the specified task requirements. This will be used as training data for the large language model. Now, I have a time series named {metric} from the {category} domain.\"\n\n        if task == 'stl':\n            fields.append({'trend': [0], 'seasonal': [0], 'noise': [0]})\n            prompt += \"From the overall trend, periodicity, and noise characteristics, the description of this time series is as follows:\"\n            prompt += attribute_to_text(\n                timeseries,\n                attribute_pool,\n                include_attributes=['length', 'trend', 'periodicity', 'frequency', 'noise'],\n                generate_values=False\n            )\n            prompt += \"Now, I need you to generate some questions and answers about this time series based on the information provided above. Some optional questions include: asking about the trend, periodicity, noise, etc., in different ways, and trying to combine the metric with the environment to ask comprehensive questions (e.g., asking about the trend of CPU Usage to explain what problem it is experiencing).\"\n        elif task == 'local-all':\n            fields.append({'local': [0]})\n            if len(attribute_pool['local']) == 0:\n                continue\n            prompt += \"From the local fluctuations in ths time series, the description is as follows:\"\n            prompt += attribute_to_text(\n                timeseries,\n                attribute_pool,\n                include_attributes=['local'],\n                generate_values=False\n            )\n            prompt += \"Now, I need you to generate some questions and answers about this time series based on the information provided above. Some optional questions include: asking about the characteristics of different local features of the time series, or asking what kind of feature fluctuations occurred in a certain time interval (from point X to point Y), or asking whether a certain type of local fluctuation occurred, etc., in different ways, and trying to combine the metric with the environment to ask comprehensive questions (e.g., asking about if there is a spike in CPU Usage to explain what problem it is experiencing).\"\n        elif task == 'statistic-all':\n            fields.append({'statistic': [0]})\n            prompt += \"From the perspective of statistic, the information about this time series is:\"\n            prompt += attribute_to_text(\n                timeseries,\n                attribute_pool,\n                include_attributes=['length'],\n                generate_values=True\n            )\n            prompt += \"Some other information fyi: \" + \";\".join([f\"The value of point {int(i)} is {float(timeseries[i]):.2f}\" for i in np.random.choice(range(current_seq_len), 5)]) + '. '\n            \n            prompt += \"Now, I need you to generate some questions and answers about this time series based on the information provided above. Some optional questions include: asking about the max/min values, period values, the value of some of the data points above, etc., in different ways, and trying to combine the metric with the environment to ask comprehensive questions.\"\n        elif task == 'statistic-part':\n            fields.append({'statistic': [0]})\n            prompt += \"From the perspective of period statistic, the information about this time series is:\"\n            start_idx = random.choice(range(current_seq_len - 10))\n            end_idx = min(start_idx + random.choice(range(5, 20)), current_seq_len)\n            period_ts = timeseries[start_idx:end_idx]\n            prompt += f\"In the time series data points from {start_idx} to {end_idx}, the values are: {', '.join([f'{float(i):.2f}' for i in period_ts])}. During this period, the difference between the rightmost and leftmost values is {float(period_ts[-1] - period_ts[0]):.2f}, the maximum value is {float(np.max(period_ts)):.2f}, the minimum value is {float(np.min(period_ts)):.2f}, the average value is {float(np.mean(period_ts)):.2f}, and the standard deviation is {float(np.std(period_ts)):.2f}.\"\n            \n            prompt += f\"Now, I need you to generate some questions and answers about this period of time series (between point {start_idx} to point {end_idx}) based on the information provided above. Some optional questions include: asking about the max/min values, the shape of this period, the trend of this period, the value of some of the data points above, etc., in different ways, and trying to combine the metric with the environment to ask comprehensive questions.\"\n\n        prompt += \"\"\"Now, please strictly follow the above requirements to generate as many QA pairs as possible, and include the reference text for the answers. Output in JSON format, for example: [{\"question\": \"Strictly follow the task question 1\", \"answer\": \"Answer 1 found from the data\", \"reference\": \"Precise original text fragment for answer 1\"}, {\"question\": \"Strictly follow the task question 2\", \"answer\": \"Answer 2 found from the data\", \"reference\": \"Precise original text fragment for answer 2\"}]. Please note that you need to ask questions in as many forms as possible, such as active-passive conversion, logical reasoning, multiple-choice questions, search questions, etc. However, the features in answers must be found from the original data, and the answers must be accurate. The generated QA pairs should not be repetitive, and the answers can be relatively long and rich, leaning towards human preferences. Specific time series feature must **not** be mentioned in the question (e.g., using words like \"the spike of amplitude 50\", \"the sudden increase in the time series\") as we will provide them. Just use words like \"according to the time series\" or \"according to the values near point 50\". I hope you can ask questions by combining the physical meaning and scenarios of the metrics as much as possible, just like a professional analysis expert. \"\"\"\n\n        prompts.append(prompt)\n\n    # Generate final result\n    result = []\n    for prompt, field in zip(prompts, fields):\n        result.append({\n            'instruction': instruction,\n            'prompt': prompt,\n            'fields': field,\n            'timeseries': [scaled_timeseries],\n            'original_timeseries': [timeseries],\n            'metrics': [metric],\n            'attribute_pool': [attribute_pool],\n            'corr_pool': []\n        })\n\n    return result\n\ndef generate_dataset():\n    result = []\n    prompts = []\n    num_cnt = 0\n    with tqdm(total=TOTAL_CNT, desc='Generating prompt...') as t:\n        cnt = 0\n        while True:\n            try:\n                cur_data = generate_prompt_data()\n            except ValueError as err:\n                continue\n            except IndexError as err:\n                continue\n            for item in cur_data:\n                item['ts_idx'] = num_cnt\n                result.append(item)\n                prompts.append(item['prompt'])\n                t.update()\n                cnt += 1\n            if cnt >= TOTAL_CNT:\n                break\n            num_cnt += 1\n\n    # Use LLM to generate answer\n    if DRYRUN:\n        llm_answers = ['[{\"question\": \"This is a test question.\", \"answer\": \"This is a test answer.\"}]'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm')\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    # Parse json\n    dataset = []\n    labels = []\n    failed_cnt = 0\n    for i in tqdm(range(len(result)), desc='Parsing'):\n        try:\n            cur_qa_list = parse_llm_json(llm_answers[i])\n            for j, qa in enumerate(cur_qa_list):\n                dataset.append({\n                    'input': result[i]['instruction'] + qa['question'],\n                    'output': qa['answer'],\n                    'timeseries': timeseries_to_list(result[i]['timeseries'])\n                })\n                labels.append({\n                    'instruction': result[i]['instruction'],\n                    'question': qa['question'],\n                    'fields': result[i]['fields'],\n                    'ts_idx': result[i]['ts_idx'],\n                    'metrics': result[i]['metrics'],\n                    'corr_pool': result[i]['corr_pool'],\n                    'attribute_pool': result[i]['attribute_pool']\n                })\n        except Exception as err:\n            failed_cnt += 1\n            continue\n    print(f\"Parse finished. Failed count: {failed_cnt}, Success count: {len(dataset)}.\")\n\n    return dataset, labels\n\n\nif __name__ == '__main__':\n    # Create output directory if not exists\n    os.makedirs(os.path.dirname(OUTPUT_DATASET), exist_ok=True)\n    os.makedirs(os.path.dirname(OUTPUT_LABEL), exist_ok=True)\n\n    result, labels = generate_dataset()\n    with open(OUTPUT_DATASET, 'wt') as f:\n        for item in result:\n            f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n\n    with open(OUTPUT_LABEL, 'wt') as f:\n        json.dump(labels, f, ensure_ascii=False, indent=4)\n\n    print(f\"Finished! Saved to {OUTPUT_DATASET} and {OUTPUT_LABEL}.\")\n", "blocks": []}, {"path": "chatts/sft/generate_mts_reason.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\"\"\"\n    This script is used to generate the stage-2 training data with LLMs for multivariate time series, which can be further used as seed QAs for TSEvol.\n    Usage:\n        python3 -m chatts.sft.generate_mts_reason\n\"\"\"\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport json\nimport yaml\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_time_series, generate_controlled_attributes, attribute_to_text, generate_random_attributes, all_attribute_set\nfrom chatts.utils.llm_utils import LLMClient, parse_llm_json\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nfrom chatts.sft.generate_uts_reason import REASONING_TEMPLATES as UTS_REASONING_TEMPLATES\nimport os\nimport copy\n\n\n# CONFIG\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))['num_data_llm_qa']\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['seq_len']  # Set to None to enable random sequence length selection\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))['data_output_dir']\nOUTPUT_DATASET = f'{OUTPUT_BASE_DIR}/llm_mts_reason_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\nOUTPUT_LABEL = f'{OUTPUT_BASE_DIR}/evol_labels/llm_mts_reason_{TOTAL_CNT}_{ENCODING_METHOD}.json'\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['dryrun']\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))['local_llm_path']\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDISABLE_EXTREME_LENGTHS = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_extreme_lengths\"]\nMAX_SERIES_NUM = 6 # Max number of series in a multivariate set\n\n# All Config for TS Attributes (type & probability)\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\n\n\n# NEW: Named reasoning templates for Multivariate Time Series (MTS) analysis\nMTS_REASONING_TEMPLATES = {\n    # --- Comparative Judgment Questions ---\n    \"Correlated Trend Judgment\": {\n        \"example\": \"A 'healthy system scale-up' is defined as a scenario where an 'increase' in '{metric_A}' is matched by a corresponding 'increase' in '{metric_B}'. Analyze both time series. Based on this definition, is the system exhibiting a healthy scale-up?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Divergent Trend Judgment\": {\n        \"example\": \"An 'inefficient process' is suspected if '{metric_A}' shows a 'steep increase' while '{metric_B}' remains 'steady' or 'decreases'. Analyze the provided data for both metrics. Does the time series indicate an inefficient process?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Causal Event Judgment\": {\n        \"example\": \"A 'network-induced CPU spike' is defined as an 'upward spike' in '{metric_B}' that occurs within 15 time points *after* a 'sudden increase' in '{metric_A}'. Analyze both time series. Is there evidence of a network-induced CPU spike?\",\n        \"question_type\": \"judgment\"\n    },\n    \"System-Wide Anomaly Judgment\": {\n        \"example\": \"A 'critical failure state' is defined by the simultaneous occurrence of: '{metric_A}' is above 90, '{metric_B}' shows a 'sudden increase' of over 20, and '{metric_C}' drops to near zero. Analyze all provided time series. Does the system enter a critical failure state?\",\n        \"question_type\": \"judgment\"\n    },\n\n    # --- Comparative Multiple Choice Questions ---\n    \"Best-Fit Scenario Identification in Real-World Applications\": {\n        \"example\": \"Given the time series for '{metric_A}' and '{metric_B}', which of the following scenarios is the most likely explanation for the observed patterns? A) A large-scale data backup operation. B) A DDoS attack. C) A user-facing application experiencing a viral traffic surge. D) A hardware failure in the network card.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    # \"Root Cause Analysis\": {\n    #     \"example\": \"The '{metric_A}' shows a significant degradation (sharp increase). After analyzing the accompanying '{metric_B}' and '{metric_C}' series, what is the most probable root cause? A) The database is overloaded with slow queries. B) The application server is CPU-bound. C) High network latency. D) A recent code deployment introduced a bug. Explain your reasoning by linking the primary issue in {metric_A} to one of the other metrics.\",\n    #     \"question_type\": \"multiple_choice\"\n    # },\n\n    # --- Holistic Open-Ended Analytical Questions ---\n    \"Overall Assessment in Real-Wolrd Applications\": {\n        \"example\": \"As a DevOps engineer, you are presented with the time series for '{metric_A}', '{metric_B}', and '{metric_C}'. According to the information from all three metrics to provide an overall assessment of the server's health and performance. Are there any emerging issues or risks you would report?\",\n        \"question_type\": \"open_ended\"\n    },\n    # \"Inter-Metric Relationship Analysis\": {\n    #     \"example\": \"Analyze the relationship between '{metric_A}' and '{metric_B}'. Does an increase in one consistently lead to a change in the other? Are there any periods where this relationship breaks down? Discuss the potential business implications of your findings.\",\n    #     \"question_type\": \"open_ended\"\n    # },\n}\n\n# Example answer prompt for UTS questions\nUTS_EXAMPLE_ANSWER_PROMPT = \"\"\"\n---\n**Example Answer (for a similar question):**\n\n**Answer Example (Yes):**\nLooking at the time series data, I can identify two key components: First, the baseline response time shows a gradual upward trend from around 200ms to 350ms throughout the observation period, satisfying the 'increase' trend requirement. Second, there's a prominent spike reaching 950ms at position 210, which exceeds the 800ms threshold specified in the definition. Since both conditions are met - an increasing baseline trend and a spike above 800ms. Therefore, the answer should be: Yes, a critical server overload is present according to the given definition. \n\n**Answer Example (No):**\nLooking at the time series data, I can identify two key components: First, the baseline response time remains relatively stable around 250-280ms throughout the observation period, showing a 'keep steady' trend rather than the required 'increase' trend. Second, while there is a notable spike reaching 920ms at position 180, this spike occurs during a stable baseline period, not during an increasing trend. Since the first condition is not met - the baseline trend is not increasing as required by the definition. Therefore, the answer should be: No, a critical server overload is not present according to the given definition.\n\n**Answer Example (Open-Ended):**\nLooking at the time series data, the server exhibits a concerning performance degradation pattern. The baseline response time shows a gradual upward trend from around 200ms to 350ms, indicating the system is under increasing stress or resource constraints. More critically, there's a severe spike reaching 950ms at position 210, which represents a nearly 3x increase from the baseline. This pattern suggests the server is approaching its capacity limits and experiencing intermittent overload conditions. My primary concerns would be user experience degradation and potential system instability. I would recommend immediate actions including: monitoring resource utilization to identify bottlenecks, implementing load balancing or scaling solutions, and setting up alerts for response times exceeding 500ms to prevent future incidents. \\n\\n\"\"\"\n\n# NEW: Example answer prompt for MTS questions\nMTS_EXAMPLE_ANSWER_PROMPT = \"\"\"\n---\n**Example Answer (for a similar comparative question):**\n\n**Answer Example (Judgment - Yes):**\nAfter analyzing both time series, I can confirm that the system is exhibiting a healthy scale-up. The CPU usage data shows a clear 'increase' trend, rising from 20 to 60 over the period. Concurrently, the Memory usage also shows a corresponding 'increase' trend, moving from 4GB to 12GB. The trends are positively correlated.\n\nBecause both metrics are increasing together as per the definition, my conclusion is: Yes, the system is demonstrating a healthy scale-up.\n\n**Answer Example (Judgment - No):**\nAfter analyzing both time series, I see a clear divergence. The CPU usage data shows a steep 'increase' trend, climbing from 1,000 to 8,000 requests per second. However, the Memory usage remains 'steady' at around 500 transactions per second, failing to keep pace.\n\nSince the throughput does not increase with the request load, this signals a bottleneck. Therefore, my conclusion is: No, this pattern indicates an inefficient process, not a healthy one.\n\n**Answer Example (Open-Ended):**\nBased on a holistic analysis of the provided metrics, the server's health is poor and at immediate risk. While CPU usage is fluctuating within a normal range, Memory usage shows a steady, non-stop increase, which is a classic symptom of a memory leak. This is corroborated by the API Latency, which shows intermittent, severe spikes that align with periods of high memory consumption.\n\nMy primary concern is an imminent application crash due to memory exhaustion. I would recommend an immediate application restart to temporarily resolve the issue, followed by a thorough investigation of recent code changes to identify and fix the memory leak. \\n\\n\"\"\"\n\n\ndef generate_prompt_data():\n    # Determine sequence length\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        elif p > 0.1 or DISABLE_EXTREME_LENGTHS:\n            current_seq_len = random.randint(64, 1024)\n        elif p > 0.05:\n            current_seq_len = random.randint(5, 64)\n        else:\n            current_seq_len = random.randint(1024, 4096)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Randomly choose a category with enough metrics for MTS\n    possible_categories = [s for s in metric_config if len(s['metrics']) >= 2]\n    if not possible_categories:\n        raise ValueError(\"No categories found with 2 or more metrics for MTS generation.\")\n    sample_category = random.choice(possible_categories)\n    category = sample_category['category']\n    \n    # Determine number of series to generate and sample metrics\n    max_num = min(MAX_SERIES_NUM, len(sample_category['metrics']))\n    num_series = random.randint(2, max_num)\n    metrics = list(np.random.choice(sample_category['metrics'], size=num_series, replace=False))\n\n    all_timeseries, all_attribute_pools, all_scaled_timeseries, all_ts_prompts = [], [], [], []\n\n    # Generate each time series\n    for metric in metrics:\n        # Generate attribute_pool and time series\n        if DISABLE_METRIC_CONFIG:\n            attribute_pool = generate_random_attributes(all_attribute_set['overall_attribute'], all_attribute_set['change'], seq_len=current_seq_len)\n        else:\n            attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n\n        attribute_pool['metric_name'] = metric\n        attribute_pool['situation'] = category\n\n        timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n        scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n        \n        all_timeseries.append(timeseries)\n        all_attribute_pools.append(attribute_pool)\n        all_scaled_timeseries.append(scaled_timeseries)\n        all_ts_prompts.append(f\"'{metric}': {cur_ts_prompt}\")\n\n    # Combine prompts for all time series\n    metric_names = \", \".join([f\"'{m}'\" for m in metrics])\n    combined_ts_prompt = \"\\n - \".join(all_ts_prompts)\n    \n    # Decide whether to ask a UTS or MTS question\n    # Ask a UTS question if there's only one series or by random chance\n    is_uts_question = (num_series == 1) or (random.random() < 0.4) \n\n    instruction = f\"I have a set of {num_series} metrics from {category}: \\n - {combined_ts_prompt}\\n\\n\"\n    analyzed_idx_list = []\n\n    if is_uts_question:\n        # --- Generate a UTS-style question about one of the series ---\n        idx = random.randint(0, num_series - 1)\n        analyzed_idx_list.append(idx)\n        chosen_metric = metrics[idx]        \n        template_name = random.choice(list(UTS_REASONING_TEMPLATES.keys()))\n        template_info = UTS_REASONING_TEMPLATES[template_name]\n        example_question = template_info[\"example\"]\n        example_answer_prompt = UTS_EXAMPLE_ANSWER_PROMPT\n        \n        prompt = f\"I am creating a dataset for a time series analysis model. Based on the provided time series, generate rich QA pairs. Now, I have a time series named '{chosen_metric}' from the {category} domain.\"\n        prompt += f\"The features of the '{chosen_metric}' series are as follows: \"\n        prompt += attribute_to_text(\n            all_timeseries[idx],\n            all_attribute_pools[idx],\n            include_attributes=['length', 'trend', 'periodicity', 'frequency', 'noise', 'local', 'statistic'],\n            generate_values=False\n        )\n        prompt += f\"Generate QA pairs about the reasoning concept: **{template_name}**. Here is a high-quality example question: '{example_question}'\"\n    \n    else:\n        # --- Generate an MTS-style question comparing multiple series ---\n        template_name = random.choice(list(MTS_REASONING_TEMPLATES.keys()))\n        template_info = copy.deepcopy(MTS_REASONING_TEMPLATES[template_name])\n        \n        # Dynamically select metrics for the question and fill placeholders\n        metric_placeholders = ['{metric_A}', '{metric_B}', '{metric_C}']\n        num_metrics_needed = sum(1 for p in metric_placeholders if p in template_info['example'])\n        \n        if num_series < num_metrics_needed:\n            # Fallback to a simpler template if not enough metrics are available\n            simple_templates = {k: v for k, v in MTS_REASONING_TEMPLATES.items() if '{metric_C}' not in v['example']}\n            template_name = random.choice(list(simple_templates.keys()))\n            template_info = copy.deepcopy(MTS_REASONING_TEMPLATES[template_name])\n            num_metrics_needed = sum(1 for p in metric_placeholders if p in template_info['example'])\n\n        selected_metrics = random.sample(metrics, k=num_metrics_needed)\n        analyzed_idx_list.extend([metrics.index(m) for m in selected_metrics])\n        \n        format_dict = {}\n        for i, placeholder in enumerate(metric_placeholders):\n            if i < len(selected_metrics):\n                format_dict[placeholder.strip('{}')] = selected_metrics[i]\n        \n        example_question = template_info[\"example\"].format(**format_dict)\n        example_answer_prompt = MTS_EXAMPLE_ANSWER_PROMPT\n\n        prompt = f\"I am creating a dataset for a time series analysis model. Based on the provided multivariate time series, generate rich QA pairs that compare or synthesize information across them. Now, I have a set of time series from the {category} domain: {metric_names}.\"\n        prompt += f\"Generate QA pairs about the reasoning concept: **{template_name}**. Here is a high-quality example question: '{example_question}'\"\n\n    # Common part of the prompt\n    prompt += example_answer_prompt\n    prompt += f\"\"\"\nNow, create new, diverse reasoning questions about the given time series. The questions must be self-contained, set in a realistic scenario, and provide all necessary definitions for the user to make a judgment.\n\n**Key Requirements:**\n0. **Explicitly give the target metric name**: Always include the target metric name in the question, e.g., \"the CPU usage of the server\" or \"the memory usage of the application\". Do not use generic terms like \"the time series\" or \"the data\".\n1.  **Question Diversity**: Create a mix of questions with different question formats and expressions. You should **rewrite** the initial question and answers into **multiple questions and answers with different format, word orders and expressions**. Some are simple questions, while some questions are not in well-formed format. For example, some questions may use only simple words with no requirements about the answer format, and some questions should be as detailed as possible, raising lots of requirements about the answer. The output list must include Q&As in **different question formats and types.**\n2.  **Self-Contained & Realistic**: Ensure every question is set in a real-world context (e.g., IT, finance, e-commerce) and clearly defines the criteria for judgment.\n3.  **Focus on Core Scenarios**: For single-series questions, focus on trend/local feature interactions. For multi-series questions, focus on correlation, causation, and divergence.\n4.  **Demand Deep Reasoning**: Answers must follow the format of deep reasoning in the example, which is as detailed as possible.\n5. **QAs with different answers:** For yes/no and multi-choice questions, generate questions and answers with different final answers (e.g., \"Yes\", \"No\", \"A\", \"B\"). For Yes/No questions, ensure you have clearly conclude the answer and explictly state the \"Yes\" or \"No\" at the end of the reasoning part. For multi-choice questions, ensure the answer is one of the options (e.g., \"A\", \"B\", \"C\", \"D\") and clearly state the answer at the end of the reasoning part.\n\n**CRITICAL: MAXIMIZE FORMAT DIVERSITY**\nCreate varied question and answer formats (Direct, Scenario-based, Conversational, Diagnostic, etc.). Mix confident/uncertain tones, and technical/business language.\n\n**Question Style Examples:**\n- \"As a network security engineer monitoring this traffic data over the past 6 hours. The company defines a 'coordinated attack' as sustained traffic increases of 300 above baseline lasting more than 15 minutes, combined with connection timeout spikes. Based on this definition and the observed data patterns, is the system currently under a coordinated attack?\"\n- \"You're consulting for an e-commerce platform experiencing customer complaints about checkout delays. The platform considers 'critical performance degradation' as any period where both: (1) response times exceed 2 seconds for more than 5 consecutive minutes, AND (2) the baseline shows deteriorating trends. What's your professional assessment of the current system health?\"\n\nThe answer should be **as detailed and long as possible**, following this structure:\n[Initial observation of data] → [Specific evidence from patterns] → [Technical reasoning] → [Clear conclusion]\n\nNote that you should **rewrite** the initial question and answers into **multiple questions and answers with different format, word orders and expressions**! For Yes/No questions, ensure you have clearly conclude the answer and explictly state the \"Yes\" or \"No\" at the end of the reasoning part. For multi-choice questions, ensure the answer is one of the options (e.g., \"A\", \"B\", \"C\", \"D\") and clearly state the answer at the end of the reasoning part.\n\n**Note:** If the given time series cannot support the targeted QA pairs, return an empty list.\\n\\n\"\"\"\n    prompt += \"\"\"Now, please strictly follow the above requirements to generate as many QA pairs as possible (if can), and include the reference text for the answers. Output in JSON format, for example: [{\"question\": \"Strictly follow the task question 1 of different format and expressions\", \"answer\": \"Answer 1 found from the data, which is in reasoning format and as detailed as possible, with different expressions\", \"reference\": \"Precise original text fragment for answer 1\"}, ...]. The included attributes in answers **must be found** from the given time series, and the answers must be accurate. The generated QA pairs should not be repetitive. Specific time series features must **not** be mentioned in the question (e.g., \"the spike of amplitude 50\") as we will provide them. Just use words like \"according to the time series\" or \"based on the provided data\".\"\"\"\n\n    # Generate final result\n    result = {\n        'instruction': instruction,\n        'prompt': prompt,\n        'fields': {'trend': analyzed_idx_list, 'seasonal': analyzed_idx_list, 'noise': analyzed_idx_list, 'local': analyzed_idx_list, 'statistic': analyzed_idx_list},\n        'timeseries': all_scaled_timeseries,\n        'original_timeseries': all_timeseries,\n        'metrics': metrics,\n        'attribute_pool': all_attribute_pools,\n        'corr_pool': []\n    }\n\n    return [result]\n\n\ndef generate_dataset():\n    \"\"\"Main function to generate the entire dataset.\"\"\"\n    result_data = []\n    prompts = []\n    num_cnt = 0\n    with tqdm(total=TOTAL_CNT, desc='Generating MTS prompts...') as t:\n        while len(result_data) < TOTAL_CNT:\n            try:\n                cur_data_list = generate_prompt_data()\n            except (ValueError, IndexError) as err:\n                # print(f\"Skipping due to data generation error: {err}\")\n                continue\n            \n            for item in cur_data_list:\n                item['ts_idx'] = num_cnt\n                result_data.append(item)\n                prompts.append(item['prompt'])\n                t.update(1)\n                if len(result_data) >= TOTAL_CNT:\n                    break\n            num_cnt += 1\n            if len(result_data) >= TOTAL_CNT:\n                break\n\n    # Use LLM to generate answers\n    if DRYRUN:\n        llm_answers = ['[{\"question\": \"This is a test MTS question.\", \"answer\": \"This is a test MTS answer.\"}]'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm', batch_size=8)\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    # Parse JSON and create final dataset\n    dataset = []\n    labels = []\n    failed_cnt = 0\n    for i in tqdm(range(len(result_data)), desc='Parsing LLM outputs'):\n        try:\n            cur_qa_list = parse_llm_json(llm_answers[i])\n            for j, qa in enumerate(cur_qa_list):\n                if 'question' in qa and 'answer' in qa:\n                    dataset.append({\n                        'input': result_data[i]['instruction'] + qa['question'],\n                        'output': qa['answer'],\n                        'timeseries': timeseries_to_list(result_data[i]['timeseries'])\n                    })\n                    labels.append({\n                        'instruction': result_data[i]['instruction'],\n                        'question': qa['question'],\n                        'fields': result_data[i]['fields'],\n                        'ts_idx': result_data[i]['ts_idx'],\n                        'metrics': result_data[i]['metrics'],\n                        'corr_pool': result_data[i]['corr_pool'],\n                        'attribute_pool': result_data[i]['attribute_pool']\n                    })\n                else:\n                    failed_cnt += 1\n        except Exception as err:\n            # print(f\"Failed to parse LLM output at index {i}: {err}\")\n            failed_cnt += 1\n            continue\n    print(f\"Parse finished. Failed count: {failed_cnt}, Success count: {len(dataset)}.\")\n\n    return dataset, labels\n\n\nif __name__ == '__main__':\n    # Create output directory if not exists\n    os.makedirs(os.path.dirname(OUTPUT_DATASET), exist_ok=True)\n    os.makedirs(os.path.dirname(OUTPUT_LABEL), exist_ok=True)\n\n    result, labels = generate_dataset()\n    with open(OUTPUT_DATASET, 'wt', encoding='utf-8') as f:\n        for item in result:\n            f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n\n    with open(OUTPUT_LABEL, 'wt', encoding='utf-8') as f:\n        json.dump(labels, f, ensure_ascii=False, indent=4)\n\n    print(f\"Finished! Saved {len(result)} QA pairs to {OUTPUT_DATASET} and {OUTPUT_LABEL}.\")\n", "blocks": []}, {"path": "chatts/sft/generate_rewrite_dataset.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n\"\"\"\n    Main function for time series rewrite.\n    Usage:\n        1. Set MODEL_PATH to the path of the model and set num_gpus, gpu_per_model accordingly.\n        2. Run `python3 -m chatts.sft.generate_rewrite_dataset`.\n        3. The output will be saved to the file specified in OUTPUT_FILE.\n\"\"\"\n\nimport multiprocessing\nfrom tqdm import tqdm\nimport json\nimport os\nfrom loguru import logger\nimport re\nimport numpy as np\nimport random\nimport time\nimport yaml\nfrom typing import *\nfrom chatts.utils.llm_utils import parse_llm_json\nfrom chatts.sft.utils.rewrite_prompt import RewritePrompt\nimport copy\n\n\n# Config\nMODEL_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_llm_path\"]\nnum_gpus = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_gpus\"]\ngpu_per_model = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"gpu_per_model\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None to enable random sequence length selection\nDATA_OUTPUT_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\n\nctx_length = 8000\nbatch_size = 16\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"dryrun\"]\nENGINE = 'dryrun' if DRYRUN else 'vllm'\nMULTIPROCESS = True\nDFS_K = 3\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_rewrite\"]\nNUM_DATA_LLM = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\nNUM_DATA_UTS_REASON = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_uts_reason\"]\nNUM_DATA_UTS_REASON_CN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_uts_reason_cn\"]\nNUM_DATA_MTS_REASON = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_mts_reason\"]\n\nINPUT_FILES = [\n    # (f'{DATA_OUTPUT_DIR}/llm_qa_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/llm_qa_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    # (f'{DATA_OUTPUT_DIR}/mts_local_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/mts_local_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    # (f'{DATA_OUTPUT_DIR}/mts_shape_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/mts_shape_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    # (f'{DATA_OUTPUT_DIR}/uts_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/uts_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/llm_uts_reason_{NUM_DATA_UTS_REASON}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/llm_uts_reason_{NUM_DATA_UTS_REASON}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/llm_mts_reason_{NUM_DATA_MTS_REASON}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/llm_mts_reason_{NUM_DATA_MTS_REASON}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/llm_uts_reason_cn_{NUM_DATA_UTS_REASON_CN}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/llm_uts_reason_cn_{NUM_DATA_UTS_REASON_CN}_{ENCODING_METHOD}.json'),\n]\nOUTPUT_FILE = f'{DATA_OUTPUT_DIR}/rewrite_reason_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\n\n\ndef worker_vllm(input_queue, validation_queue, input_response, validation_response, gpu_id, batch_size, finished_flag, model_path=MODEL_PATH):\n    os.environ['CUDA_VISIBLE_DEVICES'] = str(gpu_id)\n\n    try:\n        from vllm import LLM, SamplingParams\n        sampling_params = SamplingParams(temperature=0.5, top_p=0.95, max_tokens=ctx_length, stop_token_ids=[151643, 151645], stop=['<|endoftext|>', '<|im_end|>'])\n        llm = LLM(model=model_path, trust_remote_code=True, max_model_len=ctx_length, tensor_parallel_size=gpu_per_model, gpu_memory_utilization=0.96)\n        \n        while not finished_flag.value:\n            batch_prompts = []\n            batch_args = []\n            batch_flag = []\n\n            for _ in range(batch_size):\n                if not validation_queue.empty():\n                    cur_items = validation_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('validation')\n                elif not input_queue.empty():\n                    cur_items = input_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('input')\n                else:\n                    break\n            \n            if batch_prompts:\n                # Don't check finished_flag during processing - let the batch complete\n                answers = llm.generate(batch_prompts, sampling_params, use_tqdm=False)\n                answers = [i.outputs[0].text for i in answers]\n\n                for i in range(len(answers)):\n                    # Don't check finished_flag during result processing - complete the batch\n                    if batch_flag[i] == 'input':\n                        input_response.put((answers[i], *batch_args[i]))\n                    else:\n                        validation_response.append((answers[i], *batch_args[i]))\n            else:\n                time.sleep(1.0)\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        time.sleep(5)\n\ndef worker_dryrun(input_queue, validation_queue, input_response, validation_response, gpu_id, batch_size, finished_flag, model_path=MODEL_PATH):\n    try:\n        while not finished_flag.value:\n            batch_prompts = []\n            batch_args = []\n            batch_flag = []\n\n            for _ in range(batch_size):\n                if not validation_queue.empty():\n                    cur_items = validation_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('validation')\n                elif not input_queue.empty():\n                    cur_items = input_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('input')\n                else:\n                    break\n\n            if batch_prompts:\n                for i in range(len(batch_prompts)):\n                    time.sleep(0.05)\n                    print('==================================================================================')\n                    print(f\"[INPUT] {batch_prompts[i]}\")\n                    if batch_flag[i] == 'input':\n                        input_response.put((json.dumps({\n                            'question': 'This is a test question.',\n                            'answer': 'This is a test answer.'\n                        }), *batch_args[i]))\n                    else:\n                        validation_response.append(('valid', *batch_args[i]))\n            else:\n                time.sleep(1.0)\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        time.sleep(5)\n\ndef llm_batch_generate(seed_prompts: List[RewritePrompt], use_chat_template=True, num_gpus=num_gpus, batch_size=batch_size, model_path=MODEL_PATH, engine=ENGINE):\n    manager = multiprocessing.Manager()\n    input_queue = manager.Queue()\n    input_response = manager.Queue()\n    validation_queue = manager.Queue()\n    output_list = manager.list()\n    finished_flag = manager.Value('b', False)  # Boolean flag for graceful shutdown\n    for i, item in enumerate(seed_prompts):\n        for _ in range(DFS_K):\n            cur_item = copy.deepcopy(item)\n            cur_item.rewrite()\n            cur_prompt = cur_item.generate_prompt()\n            if use_chat_template:\n                prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_prompt}<|im_end|><|im_start|>assistant\\n\"\n            else:\n                prompt = cur_prompt\n            input_queue.put((prompt, cur_item))\n\n    if MULTIPROCESS:\n        processes: List[multiprocessing.Process] = []\n        for gpu_id in range(0, num_gpus, gpu_per_model):\n            gpu_id_str = \",\".join(map(str, range(gpu_id, gpu_id + gpu_per_model)))\n            if engine == 'vllm':\n                p = multiprocessing.Process(target=worker_vllm, args=(input_queue, validation_queue, input_response, output_list, gpu_id_str, batch_size, finished_flag, model_path))\n            elif engine == 'dryrun':\n                p = multiprocessing.Process(target=worker_dryrun, args=(input_queue, validation_queue, input_response, output_list, gpu_id_str, batch_size, finished_flag, model_path))\n            else:\n                raise NotImplementedError(f\"Unrecognized inference engine: {engine}\")\n            processes.append(p)\n            p.start()\n\n        os.makedirs('result', exist_ok=True)\n        with tqdm(total=TOTAL_CNT) as pbar_input, tqdm(total=TOTAL_CNT) as pbar_validation, open(OUTPUT_FILE, 'wt') as fo:\n            previous_output_len = 0\n            parse_failed = 0\n            validation_failed = 0\n            success_cnt = 0\n            while success_cnt < TOTAL_CNT:\n                # Append to validation\n                while not input_response.empty():\n                    cur_items = input_response.get()\n                    try:\n                        cur_qa = parse_llm_json(cur_items[0])\n                        cur_seed_prompt: RewritePrompt = copy.deepcopy(cur_items[-1])\n                        cur_validation_prompt = cur_seed_prompt.generate_comparison_prompt(cur_qa['question'], cur_qa['answer'])\n                        cur_seed_prompt.push(cur_qa['question'], cur_qa['answer'])\n\n                        if use_chat_template:\n                            cur_validation_prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_validation_prompt}<|im_end|><|im_start|>assistant\\n\"\n                        validation_queue.put((cur_validation_prompt, cur_seed_prompt))\n                        pbar_input.update()\n                    except Exception as err:\n                        parse_failed += 1\n                        continue\n\n                current_output_len = len(output_list)\n                for line in output_list[previous_output_len:current_output_len]:\n                    # Check validation result\n                    if 'valid' in line[0].lower() and 'invalid' not in line[0].lower():\n                        pbar_validation.update()\n                        fo.write(json.dumps(line[-1].to_dataset()) + '\\n')\n                        success_cnt += 1\n\n                        # Push to input queue\n                        for _ in range(DFS_K):\n                            item: RewritePrompt = copy.deepcopy(line[-1])\n                            item.rewrite()\n                            cur_prompt = item.generate_prompt()\n                            if use_chat_template:\n                                prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_prompt}<|im_end|><|im_start|>assistant\\n\"\n                            else:\n                                prompt = cur_prompt\n                            input_queue.put((prompt, item))\n                    else:\n                        validation_failed += 1\n                previous_output_len = current_output_len\n\n                pbar_input.set_description(f'[REWRITE] fail={parse_failed}')\n                pbar_validation.set_description(f'[VALID] fail={validation_failed}')\n\n        # Signal workers to finish gracefully\n        finished_flag.value = True\n        \n        # Wait for processes to finish gracefully\n        for p in processes:\n            p.join(timeout=20)  # Wait up to 10 seconds for graceful shutdown\n            if p.is_alive():\n                logger.warning(f\"Process {p.pid} did not finish gracefully, terminating...\")\n                p.terminate()\n                p.join(timeout=5)\n                if p.is_alive():\n                    logger.warning(f\"Process {p.pid} did not terminate, killing...\")\n                    p.kill()\n    else:\n        pass\n\n\ndef evol_instruct():\n    # Load files\n    input_list: List[RewritePrompt] = []\n\n    print(\"Loading files...\")\n    for input_file, label_file in INPUT_FILES:\n        print(f\"Loading {input_file} and {label_file}...\")\n        qa_dataset = [json.loads(line.rstrip()) for line in tqdm(open(input_file))]\n        labels = json.load(open(label_file))\n\n        for data, label in zip(qa_dataset, labels):\n            input_list.append(RewritePrompt(\n                ts_idx=label['ts_idx'],\n                seed_q=label['question'],\n                seed_a=data['output'],\n                seed_fields=label['fields'],\n                instruction=label['instruction'],\n                timeseries=np.array(data['timeseries']),\n                attribute_pool=label['attribute_pool'],\n                corr_pool=label['corr_pool'],\n                metrics=label['metrics']\n            ))\n\n    # Randomly shuffle input_list\n    random.shuffle(input_list)\n\n    print(f\"{len(input_list)} seed QAs loaded from file.\")\n\n    # Run llm inference\n    llm_batch_generate(input_list)\n\n    print(f\"-------------------------------------------\")\n    print(f\"Finished! File saved to {OUTPUT_FILE}.\")\n\nif __name__ == '__main__':\n    evol_instruct()\n", "blocks": []}, {"path": "chatts/sft/generate_tsevol_dataset.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n\"\"\"\n    Main function for time series evol-instruct.\n    Usage:\n        1. Set MODEL_PATH to the path of the model and set num_gpus, gpu_per_model accordingly.\n        2. Run `python3 -m chatts.sft.generate_tsevol_dataset`.\n        3. The output will be saved to the file specified in OUTPUT_FILE.\n\"\"\"\n\nimport multiprocessing\nfrom tqdm import tqdm\nimport json\nimport os\nfrom loguru import logger\nimport re\nimport numpy as np\nimport random\nimport time\nimport yaml\nfrom typing import *\nfrom json_repair import repair_json\nfrom chatts.sft.utils.evol_prompt import EvolPrompt\nimport copy\n\n\n# Config\nMODEL_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_llm_path\"]\nnum_gpus = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_gpus\"]\ngpu_per_model = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"gpu_per_model\"]\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"seq_len\"]  # Set to None to enable random sequence length selection\nDATA_OUTPUT_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"data_output_dir\"]\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\n\nctx_length = 4096\nbatch_size = 32\nENGINE = 'vllm'\nMULTIPROCESS = True\nDFS_K = 3\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_tsevol\"]\nNUM_DATA_LLM = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"num_data_llm_qa\"]\n\nINPUT_FILES = [\n    (f'{DATA_OUTPUT_DIR}/llm_qa_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/llm_qa_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/mts_local_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/mts_local_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/mts_shape_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/mts_shape_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json'),\n    (f'{DATA_OUTPUT_DIR}/uts_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.jsonl', f'{DATA_OUTPUT_DIR}/evol_labels/uts_llm_{SEQ_LEN}_{NUM_DATA_LLM}_{ENCODING_METHOD}.json')\n]\nOUTPUT_FILE = f'{DATA_OUTPUT_DIR}/evol_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\n\n\ndef worker_vllm(input_queue, validation_queue, input_response, validation_response, gpu_id, batch_size, model_path=MODEL_PATH):\n    os.environ['CUDA_VISIBLE_DEVICES'] = str(gpu_id)\n\n    try:\n        from vllm import LLM, SamplingParams\n        sampling_params = SamplingParams(temperature=0.5, top_p=0.95, max_tokens=ctx_length, stop_token_ids=[151643, 151645], stop=['<|endoftext|>', '<|im_end|>'])\n        llm = LLM(model=model_path, trust_remote_code=True, max_model_len=ctx_length, tensor_parallel_size=gpu_per_model, gpu_memory_utilization=0.96)\n        \n        while True:\n            batch_prompts = []\n            batch_args = []\n            batch_flag = []\n\n            for _ in range(batch_size):\n                if not validation_queue.empty():\n                    cur_items = validation_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('validation')\n                elif not input_queue.empty():\n                    cur_items = input_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('input')\n                else:\n                    break\n            \n            if batch_prompts:\n                answers = llm.generate(batch_prompts, sampling_params, use_tqdm=False)\n                answers = [i.outputs[0].text for i in answers]\n\n                for i in range(len(answers)):\n                    if batch_flag[i] == 'input':\n                        input_response.put((answers[i], *batch_args[i]))\n                    else:\n                        validation_response.append((answers[i], *batch_args[i]))\n            else:\n                time.sleep(1.0)\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        time.sleep(5)\n\ndef worker_dryrun(input_queue, validation_queue, input_response, validation_response, gpu_id, batch_size, model_path=MODEL_PATH):\n    try:\n        while True:\n            batch_prompts = []\n            batch_args = []\n            batch_flag = []\n\n            for _ in range(batch_size):\n                if not validation_queue.empty():\n                    cur_items = validation_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('validation')\n                elif not input_queue.empty():\n                    cur_items = input_queue.get()\n                    batch_prompts.append(cur_items[0])\n                    batch_args.append(cur_items[1:])\n                    batch_flag.append('input')\n                else:\n                    break\n            \n            if batch_prompts:\n                for i in range(len(batch_prompts)):\n                    time.sleep(0.05)\n                    print('==================================================================================')\n                    print(f\"[INPUT] {batch_prompts[i]}\")\n                    if batch_flag[i] == 'input':\n                        input_response.put((json.dumps({\n                            'question': 'This is a test question.',\n                            'answer': 'This is a test answer.'\n                        }), *batch_args[i]))\n                    else:\n                        validation_response.append(('valid', *batch_args[i]))\n            else:\n                time.sleep(1.0)\n    except Exception as err:\n        logger.error(f\"[worker {gpu_id}] {err}\")\n        time.sleep(5)\n\ndef llm_batch_generate(seed_prompts: List[EvolPrompt], use_chat_template=True, num_gpus=num_gpus, batch_size=batch_size, model_path=MODEL_PATH, engine=ENGINE):\n    manager = multiprocessing.Manager()\n    input_queue = manager.Queue()\n    input_response = manager.Queue()\n    validation_queue = manager.Queue()\n    output_list = manager.list()\n    for i, item in enumerate(seed_prompts):\n        for _ in range(DFS_K):\n            cur_item = copy.deepcopy(item)\n            cur_item.evol()\n            cur_prompt = cur_item.generate_prompt()\n            if use_chat_template:\n                prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_prompt}<|im_end|><|im_start|>assistant\\n\"\n            else:\n                prompt = cur_prompt\n            input_queue.put((prompt, cur_item))\n\n    if MULTIPROCESS:\n        processes: List[multiprocessing.Process] = []\n        for gpu_id in range(0, num_gpus, gpu_per_model):\n            gpu_id_str = \",\".join(map(str, range(gpu_id, gpu_id + gpu_per_model)))\n            if engine == 'vllm':\n                p = multiprocessing.Process(target=worker_vllm, args=(input_queue, validation_queue, input_response, output_list, gpu_id_str, batch_size, model_path))\n            elif engine == 'dryrun':\n                p = multiprocessing.Process(target=worker_dryrun, args=(input_queue, validation_queue, input_response, output_list, gpu_id_str, batch_size, model_path))\n            else:\n                raise NotImplementedError(f\"Unrecognized inference engine: {engine}\")\n            processes.append(p)\n            p.start()\n\n        os.makedirs('result', exist_ok=True)\n        with tqdm(total=TOTAL_CNT) as pbar_input, tqdm(total=TOTAL_CNT) as pbar_validation, open(OUTPUT_FILE, 'wt') as fo:\n            previous_output_len = 0\n            parse_failed = 0\n            validation_failed = 0\n            success_cnt = 0\n            while success_cnt < TOTAL_CNT:\n                # Append to validation\n                while not input_response.empty():\n                    cur_items = input_response.get()\n                    try:\n                        cur_qa = json.loads(repair_json(cur_items[0]))\n                        cur_seed_prompt: EvolPrompt = copy.deepcopy(cur_items[-1])\n                        cur_validation_prompt = cur_seed_prompt.generate_comparison_prompt(cur_qa['question'], cur_qa['answer'])\n                        cur_seed_prompt.push(cur_qa['question'], cur_qa['answer'])\n\n                        if use_chat_template:\n                            cur_validation_prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_validation_prompt}<|im_end|><|im_start|>assistant\\n\"\n                        validation_queue.put((cur_validation_prompt, cur_seed_prompt))\n                        pbar_input.update()\n                    except Exception as err:\n                        parse_failed += 1\n                        continue\n\n                current_output_len = len(output_list)\n                for line in output_list[previous_output_len:current_output_len]:\n                    # Check validation result\n                    if 'valid' in line[0].lower() and 'invalid' not in line[0].lower():\n                        pbar_validation.update()\n                        fo.write(json.dumps(line[-1].to_dataset()) + '\\n')\n                        success_cnt += 1\n\n                        # Push to input queue\n                        for _ in range(DFS_K):\n                            item: EvolPrompt = copy.deepcopy(line[-1])\n                            item.evol()\n                            cur_prompt = item.generate_prompt()\n                            if use_chat_template:\n                                prompt = f\"<|im_start|>system\\nYou are a helpful assistant.<|im_end|><|im_start|>user\\n{cur_prompt}<|im_end|><|im_start|>assistant\\n\"\n                            else:\n                                prompt = cur_prompt\n                            input_queue.put((prompt, item))\n                    else:\n                        validation_failed += 1\n                previous_output_len = current_output_len\n\n                pbar_input.set_description(f'[EVOL]fail={parse_failed}')\n                pbar_validation.set_description(f'[VALID]fail={validation_failed}')\n\n        for p in processes:\n            p.terminate()\n            p.kill()\n    else:\n        pass\n\n\ndef evol_instruct():\n    # Load files\n    input_list: List[EvolPrompt] = []\n\n    print(\"Loading files...\")\n    for input_file, label_file in INPUT_FILES:\n        print(f\"Loading {input_file} and {label_file}...\")\n        qa_dataset = [json.loads(line.rstrip()) for line in tqdm(open(input_file))]\n        labels = json.load(open(label_file))\n\n        for data, label in zip(qa_dataset, labels):\n            input_list.append(EvolPrompt(\n                ts_idx=label['ts_idx'],\n                seed_q=label['question'],\n                seed_a=data['output'],\n                seed_fields=label['fields'],\n                instruction=label['instruction'],\n                timeseries=np.array(data['timeseries']),\n                attribute_pool=label['attribute_pool'],\n                corr_pool=label['corr_pool'],\n                metrics=label['metrics']\n            ))\n\n    # Randomly shuffle input_list\n    random.shuffle(input_list)\n\n    print(f\"{len(input_list)} seed QAs loaded from file.\")\n\n    # Run llm inference\n    llm_batch_generate(input_list)\n\n    print(f\"-------------------------------------------\")\n    print(f\"Finished! File saved to {OUTPUT_FILE}.\")\n\nif __name__ == '__main__':\n    evol_instruct()\n", "blocks": []}, {"path": "chatts/sft/generate_uts_reason.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\"\"\"\n    This script is used to generate the stage-2 training data with LLMs for univariate time series, which can be further used as seed QAs for TSEvol.\n    Usage:\n        python3 -m chatts.sft.generate_uts_reason\n\"\"\"\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport json\nimport yaml\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series, generate_controlled_attributes, attribute_to_text, all_attribute_set\nfrom chatts.utils.llm_utils import LLMClient, parse_llm_json\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nimport os\n\n\n# CONFIG\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))['num_data_llm_qa']\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['seq_len']  # Set to None to enable random sequence length selection\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))['data_output_dir']\nOUTPUT_DATASET = f'{OUTPUT_BASE_DIR}/llm_uts_reason_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\nOUTPUT_LABEL = f'{OUTPUT_BASE_DIR}/evol_labels/llm_uts_reason_{TOTAL_CNT}_{ENCODING_METHOD}.json'\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['dryrun']\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))['local_llm_path']\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDISABLE_EXTREME_LENGTHS = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_extreme_lengths\"]\n\n# All Config for TS Attributes (type & probability)\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\n\n# Named reasoning templates with example questions\n# Named reasoning templates with placeholders\nREASONING_TEMPLATES = {\n    # --- Judgment Questions (If-Then) ---\n    # These questions are self-contained and require detailed explanation.\n    \"Multi-Trend Anomaly Judgment\": {\n        \"example\": \"If an anomaly is defined as a time series that first shows an 'increase' trend and is immediately followed by a 'decrease' trend, analyze this time series. Based on this definition, does the segment from point 0 to 256 contain an anomaly?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Trend-Local Interaction Judgment\": {\n        \"example\": \"A 'critical event' is defined as an 'upward spike' with an amplitude greater than 30 occurring during an overall 'increase' trend. Analyze this time series. Based on this rule, is there a critical event present?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Sequential Local Feature Judgment\": {\n        \"example\": \"If a 'system fault' is defined as a 'sudden increase' with amplitude > 20 followed within 15 points by a 'downward spike' with amplitude > 15, does this time series exhibit a system fault?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Stable Trend Disruption Judgment\": {\n        \"example\": \"A 'destabilization event' is defined as a 'sudden decrease' with an amplitude of 25 or more that occurs within a long-term 'keep steady' trend. Analyze the time series from point 0 to 200. Does it contain a destabilization event according to this definition?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Multi-Phase Trend Progression Judgment\": {\n        \"example\": \"If a 'normal growth cycle' is defined by three phases in order: 'increase', then 'keep steady', then 'increase' again, does this time series follow the normal growth cycle pattern?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Contradictory Signal Judgment\": {\n        \"example\": \"If a 'conflicting signal' is defined as observing a 'continuous downward spike' with total amplitude change > 40 during a period otherwise identified as a general 'increase' trend, is there a conflicting signal in this data?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Noise Threshold Judgment\": {\n        \"example\": \"If a time series is classified as having a 'noisy' environment (noise std > 0.2), while the trend is labeled as 'keep steady', does the noise level invalidate the steady trend classification?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Seasonal Stability Judgment\": {\n        \"example\": \"A 'stable seasonal pattern' is defined as a 'sin periodic fluctuation' with amplitude > 1.0 over time. Analyze the time series. Does the seasonal pattern meet the stability criteria?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Statistical Judgment\": {\n        \"example\": \"If any data point lower than 10 is considered an 'outlier'. Should this time series be considered anomalous?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Long-Term Statistical Judgment\": {\n        \"example\": \"If lower than 10 and last for more than 20 data points is considered as anomalous. Should this time series be considered anomalous?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Long-Term Statistical with Recovery Judgment\": {\n        \"example\": \"If data point lower than 10 and not recovery to the original state is considered as anomalous. Is there any anomalies in the time series?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Multi-Trend Anomaly Judgment in Real-World Application\": {\n        \"example\": \"For a new mobile app, an 'unsuccessful launch' is defined as user engagement that initially increases but then begins to decline within the first week. Based on this definition, does the app's user engagement data from the past 7 days indicate an unsuccessful launch?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Trend-Local Interaction Judgment in Real-World Application\": {\n        \"example\": \"A 'critical server overload' is defined as an API response time 'upward spike' exceeding 800ms occurring during a period where the baseline response time is already showing a gradual 'increase' trend. Analyze the server's performance data. Based on this rule, is a critical server overload present?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Sequential Local Feature Judgment in Real-World Application\": {\n        \"example\": \"A 'memory leak crash' in an application is identified by its memory usage 'suddenly increasing' by over 200MB, followed within 10 minutes by a sharp 'downward spike' of over 150MB (indicating a crash and restart). Does this application's memory usage data exhibit a memory leak crash?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Stable Trend Disruption Judgment in Real-World Application\": {\n        \"example\": \"A 'supply chain disruption' for an e-commerce product is defined as a 'sudden decrease' in hourly sales of 50 units or more that occurs during a period where sales have otherwise been stable ('keep steady' trend). Analyze the sales data from the last 24 hours. Does it contain a supply chain disruption according to this definition?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Multi-Phase Trend Progression Judgment in Real-World Application\": {\n        \"example\": \"A 'standard market adoption cycle' for a new financial product is defined by three phases in order: initial slow 'increase' in trading volume, followed by a period of 'keep steady' consolidation, and then another phase of 'increase'. Does the trading volume for this product follow the standard market adoption cycle?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Contradictory Signal Judgment in Real-World Application\": {\n        \"example\": \"For a factory production line, a 'machine health alert' is triggered if a 'continuous downward spike' in output (total drop > 40 units/hour) is observed during a shift that is otherwise showing a general 'increase' in production. Is there a machine health alert in this data?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Noise Threshold Judgment in Real-World Application\": {\n        \"example\": \"An IoT temperature sensor for a chemical process should remain steady. If 'unreliable data' is defined as sensor readings having a standard deviation greater than 2°C due to environmental noise, does this condition invalidate the conclusion that the underlying process temperature is stable ('keep steady')?\",\n        \"question_type\": \"judgment\"\n    },\n    \"Seasonal Stability Judgment in Real-World Application\": {\n        \"example\": \"A 'stable daily traffic pattern' for an e-commerce site is defined as having a predictable 'sin periodic fluctuation' where the peak traffic consistently exceeds 1000 users per hour. Analyze the site's traffic data. Does the daily pattern meet this criterion for being considered stable and significant?\",\n        \"question_type\": \"judgment\"\n    },\n\n    # --- Multiple Choice Questions ---\n    # These questions offer clear options and require justification.\n\n    \"Multi-Trend Pattern Identification\": {\n        \"example\": \"A server's CPU utilization data is provided. Analyze the time series and determine: This pattern is most indicative of which scenario? A) A critical system failure. B) The server reaching its processing capacity limit under heavy load. C) A normal daily cycle. D) A software bug causing random spikes. Explain your choice based on the observed trend progression.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    \"Local Feature Interpretation in Context\": {\n        \"example\": \"A stock's price data over one month is provided. The stock has been in a general decline. If you observe any significant upward price movements, what is the most likely interpretation? A) A fundamental reversal of the stock's downward trend. B) A brief, speculative event, possibly due to a news announcement, with no long-term impact. C) The start of a seasonal rally. D) A data reporting error. Justify your selection based on your analysis.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    \"Best-Fit Scenario for Combined Features\": {\n        \"example\": \"A system's network traffic data at 2:00 AM is provided. Analyze the overall patterns and any anomalous events. Which scenario does this pattern best represent? A) A planned data migration or system backup. B) A Distributed Denial-of-Service (DDoS) attack. C) Normal user growth. D) A network hardware malfunction. Provide reasoning based on your analysis.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    \"Multi-Trend Pattern Identification in Real-World Application\": {\n        \"example\": \"A server's CPU utilization data over several hours is provided. Analyze the pattern and determine: This behavior is most indicative of which scenario? A) A critical system failure. B) The server reaching its processing capacity limit under heavy load. C) A normal daily cycle. D) A software bug causing random spikes. Explain your choice.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    \"Local Feature Interpretation in Context in Real-World Application\": {\n        \"example\": \"A stock's price data over one month is provided. Analyze the time series for any significant events or anomalies. If you find notable price movements against the general trend, what is the most likely interpretation? A) A fundamental reversal of the trend. B) A brief, speculative event with no long-term impact. C) The start of a seasonal pattern. D) A data reporting error. Justify your selection.\",\n        \"question_type\": \"multiple_choice\"\n    },\n    \"Best-Fit Scenario for Combined Features in Real-World Application\": {\n        \"example\": \"A system's network traffic data during early morning hours is provided. Analyze the patterns and identify any significant events. Which scenario does this pattern best represent? A) A planned data migration or system backup. B) A Distributed Denial-of-Service (DDoS) attack. C) Normal user growth. D) A network hardware malfunction. Provide reasoning.\",\n        \"question_type\": \"multiple_choice\"\n    },\n\n    # --- Open-Ended Analytical Questions ---\n\n    \"Multi-Trend Impact Analysis\": {\n        \"example\": \"A patient's blood sugar monitoring data over 4 hours is provided. Analyze the pattern and discuss what this behavior could signify for the patient's health. What would be your primary concern as a healthcare provider?\",\n        \"question_type\": \"open_ended\"\n    },\n    \"Trend and Local Feature Synthesis\": {\n        \"example\": \"Network latency monitoring data is provided. Analyze the overall trend and any fluctuations. How do any observed variations affect your confidence in the network's stability? Explain your analytical thinking.\",\n        \"question_type\": \"open_ended\"\n    },\n    \"Positional Significance Analysis\": {\n        \"example\": \"A power grid's output data throughout a day is provided. Analyze any significant events and their timing. Why is the timing of any major events particularly important for your overall assessment of the grid's stability?\",\n        \"question_type\": \"open_ended\"\n    },\n    \"Multi-Trend Impact Analysis in Real-World Application\": {\n        \"example\": \"A patient's blood sugar level monitoring data over several hours is provided. Analyze the pattern and discuss what this behavior could signify for the patient's health. What would be the primary concern for a healthca
