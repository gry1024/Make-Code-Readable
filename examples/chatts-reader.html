e * np.sin(2 * np.pi * base_frequency * n * t + phase)\n    elif wave_type == 'square':\n        start = np.random.uniform(0, 0.3)\n        duration = np.random.uniform(0.1, 0.3)\n        for i in range(seq_len):\n            cycle_pos = (t[i] % period) / period\n            if start <= cycle_pos < start + duration:\n                data[i] = amplitude_series[i]\n            else:\n                data[i] = 0.0\n    else:\n        start = np.random.uniform(0, 0.3)\n        duration = np.random.uniform(0.1, 0.6)\n        end = start + duration\n        for i in range(seq_len):\n            cycle_pos = (t[i] % period) / period\n            if start <= cycle_pos < end:\n                if cycle_pos < (start + end) / 2:\n                    data[i] = amplitude_series[i] * 2 * (cycle_pos - start) / duration\n                else:\n                    data[i] = amplitude_series[i] * 2 * (end - cycle_pos) / duration\n            else:\n                data[i] = 0.0\n\n    # normalize to amplitude\n    data = data / (data.max() - data.min() + 1e-7) * max(amplitude_list)\n    data -= np.mean(data)\n\n    return data\n\ndef generate_sin_noise(amplitude, seq_len):\n    # Time array\n    t = np.linspace(0, seq_len, seq_len)\n    data = np.zeros(seq_len)\n\n    num_harmonics = 200\n    for n in range(1, num_harmonics + 1):\n        phase = np.random.uniform(0, 2 * np.pi)\n        cur_freq = np.random.uniform(50 / seq_len, 200 / seq_len)\n        data += np.sin(cur_freq * t + phase) * np.random.uniform(0.3, 1.0)\n\n    # normalize to amplitude\n    data = data / (data.max() - data.min() + 1e-7) * amplitude\n    data -= np.mean(data)\n\n    return data\n\ndef generate_noise(attribute_pool, y, overall_amplitude, seq_len):\n    max_change = np.abs(np.max(y) - np.min(y))\n    noise_level = attribute_pool[\"noise\"]['type']\n    if noise_level == \"noisy\":\n        if random.random() > 0.5 and max_change > overall_amplitude / 2 and attribute_pool[\"frequency\"]['type'] == \"no periodicity\":\n            # Generate a sin type noise\n            noise = generate_sin_noise(0.2 * overall_amplitude, seq_len)\n            noise += np.random.normal(0, 0.03 * overall_amplitude, seq_len)\n            std = round(float(np.std(noise)), 3)\n            attribute_pool[\"noise\"][\"detail\"] = f\"There is a irregular fluctuating noise, indicating a noisy curve: \"\n        else:\n            # Generate random type noise\n            std = np.random.uniform(0.03, 0.15) * overall_amplitude\n            noise = np.random.normal(0, std, seq_len)\n            attribute_pool[\"noise\"][\"detail\"] = f\"There is a random noise, indicating a noisy curve: \"\n\n        # Apply noise segments\n        num_noise_segments = 1\n        if ENABLE_MULTIPLE_NOISE:\n            num_noise_segments = random.randint(1, 3)\n        \n            # Choose segments to apply noise\n            attribute_pool[\"noise\"][\"segments\"] = []\n            noise_segments = generate_split_points(seq_len, num_noise_segments)\n            for i in range(num_noise_segments):\n                noise_start = noise_segments[i]\n                noise_end = noise_segments[i + 1]\n                noise_public_end = _inclusive_segment_end(noise_end, seq_len)\n                noise_std_amp = np.random.uniform(0.1, 5.0)\n                noise[noise_start:noise_end] *= noise_std_amp\n                attribute_pool[\"noise\"][\"segments\"].append({\n                    \"position_start\": noise_start,\n                    \"position_end\": noise_public_end,\n                    \"amplitude\": round(noise_std_amp * std, 2),\n                    \"description\": f\"the noise std is {noise_std_amp * std:.2f} between point {noise_start} and point {noise_public_end}\"\n                })\n                attribute_pool[\"noise\"][\"detail\"] += f\"the noise std is {noise_std_amp * std:.2f} between point {noise_start} and point {noise_public_end}, \"\n            attribute_pool[\"noise\"][\"detail\"] = attribute_pool[\"noise\"][\"detail\"][:-2] + \". \"\n        else:\n            noise_std_amp = np.random.uniform(0.1, 5.0)\n            noise *= noise_std_amp\n            attribute_pool[\"noise\"][\"std\"] = round(noise_std_amp * std, 2)\n            attribute_pool[\"noise\"][\"detail\"] = f\"The overall noise standard deviation is around {noise_std_amp * std:.2f}, indicating a large noisy curve.\"\n    elif noise_level == \"almost no noise\":\n        if max_change > overall_amplitude / 2:\n            std = np.random.uniform(0.0, 0.001) * overall_amplitude\n        else:\n            std = 0.0\n        noise = np.random.normal(0, std, seq_len)\n        attribute_pool[\"noise\"][\"std\"] = round(std, 3)\n        attribute_pool[\"noise\"][\"detail\"] = f\"The overall noise standard deviation is around {std:.2f}, very small compared the overall change of the curve. The curve is overall smooth with almost no noise. \"\n    \n    return noise\n\ndef generate_seasonal(attribute_pool, overall_amplitude, seq_len):\n        y = np.zeros(seq_len)\n        if \"no period\" not in attribute_pool[\"seasonal\"]['type']:\n            if attribute_pool[\"seasonal\"]['type'] == \"periodic fluctuation\":\n                wave_type = None\n            else:\n                wave_type = attribute_pool[\"seasonal\"][\"type\"].split(\" \")[0]\n            if 'amplitude' not in attribute_pool['seasonal']:\n                # Many periods of seasonal amplitudes\n                num_seasonal = 1\n                if ENABLE_MULTIPLE_SEASONAL:\n                    num_seasonal = random.randint(1, 3)\n                amp = []\n                for _ in range(num_seasonal):\n                    amp.append(random.uniform(1.0, 2.0) * overall_amplitude)\n                split_points = generate_split_points(seq_len, num_seasonal)\n            else:\n                # Only one period of seasonal amplitudes\n                amp = [attribute_pool['seasonal']['amplitude']]\n                split_points = [0, seq_len]\n            y += generate_seasonal_wave(attribute_pool['frequency']['period'], amp, split_points, seq_len, wave_type)\n\n            attribute_pool[\"seasonal\"]['detail'] = f\"The time series is showing {attribute_pool['seasonal']['type']}: \"\n            attribute_pool[\"seasonal\"][\"segments\"] = []\n            for i in range(len(amp)):\n                seasonal_public_end = _inclusive_segment_end(split_points[i + 1], seq_len)\n                attribute_pool[\"seasonal\"][\"segments\"].append({\n                    \"amplitude\": round(amp[i], 2),\n                    \"position_start\": split_points[i],\n                    \"position_end\": seasonal_public_end,\n                    \"description\": f\"the amplitude of the periodic fluctuation is {amp[i]:.1f} between point {split_points[i]} and point {seasonal_public_end}\"\n                })\n                attribute_pool[\"seasonal\"]['detail'] += f\"the amplitude of the periodic fluctuation is {amp[i]:.1f} between point {split_points[i]} and point {seasonal_public_end}, \"\n            attribute_pool[\"seasonal\"]['detail'] = attribute_pool[\"seasonal\"]['detail'][:-2] + \". \"\n        elif attribute_pool[\"seasonal\"]['type'] == \"no periodic fluctuation\":\n            y += 0.0\n            attribute_pool[\"seasonal\"][\"segments\"] = []\n            attribute_pool[\"seasonal\"]['detail'] = f\"No periodic fluctuations observed, showing {attribute_pool['seasonal']['type']}. \"\n        return y\n\ndef generate_trend(attribute_pool, y, overall_amplitude, overall_bias, seq_len):\n    # Apply trend attribute\n    trend = attribute_pool[\"trend\"][\"type\"]\n\n    if 'amplitude' in attribute_pool['trend']:\n        amplitude = attribute_pool['trend']['amplitude']\n    else:\n        amplitude = random.uniform(0.8, 3.0) * overall_amplitude\n    if 'start' in attribute_pool['trend']:\n        bias = attribute_pool['trend']['start']\n    else:\n        bias = overall_bias\n\n    if trend == \"decrease\":\n        cur_value = generate_ts_change(seq_len, -amplitude, add_random_noise=False) + bias\n        y += cur_value\n        attribute_pool[\"trend\"][\"detail\"] = f\"From the perspective of the slope, the overall trend is decreasing. \"\n        attribute_pool[\"trend\"][\"trend_list\"] = [(\"decrease\", 0, seq_len - 1)]\n    elif trend == \"increase\":\n        cur_value = generate_ts_change(seq_len, amplitude, add_random_noise=False) + bias\n        y += cur_value\n        attribute_pool[\"trend\"][\"detail\"] = f\"From the perspective of the slope, the overall trend is increasing. \"\n        attribute_pool[\"trend\"][\"trend_list\"] = [(\"increase\", 0, seq_len - 1)]\n    elif trend == \"multiple\":\n        # Ensure the generated trend has more than one type\n        while True:\n            points = generate_random_points(seq_len=seq_len)[0]\n            if len(generate_trend_list(points, seq_len)) > 1:\n                break\n        trend_ts = generate_trend_curve(seq_len=seq_len, points=points)[1]\n        y += trend_ts * amplitude\n        attribute_pool[\"trend\"][\"detail\"] = \"From the perspective of the slope, the overall trend contains multiple different segments: \" + generate_trend_prompt(points)\n        attribute_pool[\"trend\"][\"trend_list\"] = generate_trend_list(points, seq_len)\n    elif trend == \"keep steady\":\n        y += bias\n        attribute_pool[\"trend\"][\"detail\"] = f\"From the perspective of the slope, the overall trend is steady. \"\n        attribute_pool[\"trend\"][\"trend_list\"] = [(\"keep steady\", 0, seq_len - 1)]\n\n    # Find increase or decrease in local char\n    local_phase_change = [i['type'] for i in attribute_pool[\"local\"] if 'increase' in i['type'] or 'decrease' in i['type']]\n    if len(local_phase_change):\n        attribute_pool[\"trend\"][\"detail\"] += f\"However, local phase changes were observed, including: {', '.join(local_phase_change)}. \"\n    attribute_pool[\"trend\"][\"start\"] = round(float(y[0]), 2)\n    attribute_pool[\"trend\"][\"amplitude\"] = round(float(y[-1] - y[0]), 2)\n    attribute_pool[\"trend\"][\"detail\"] += f\"The value of time series starts from around {float(y[0]):.2f} and ends at around {float(y[-1]):.2f}, with an overall amplitude of {float(y[-1] - y[0]):.2f}. \"\n    return y\n\ndef generate_split_points(seq_len: int, num_segments: int) -> list:\n    if num_segments < 1:\n        raise ValueError(\"Number of segments must be at least 1.\")\n    if seq_len < num_segments:\n        raise ValueError(\"Sequence length must be at least equal to the number of segments.\")\n\n    min_segment_len = seq_len / num_segments / 2  # Minimum segment length\n    split_points = [0]  # Start with the first point\n    \n    for _ in range(num_segments - 1):\n        # Determine the valid range for the next split point\n        min_point = split_points[-1] + min_segment_len\n        max_point = seq_len - (num_segments - len(split_points)) * min_segment_len\n        if min_point >= max_point:\n            raise ValueError(\"Cannot generate split points satisfying the constraints.\")\n        \n        # Randomly select a split point within the valid range\n        split_points.append(int(random.uniform(min_point, max_point)))\n    split_points.append(seq_len)\n    \n    return split_points\n\ndef generate_time_series(attribute_pool, seq_len=512):\n    \"\"\"\n    Generate a time series based on the given attribute pool and sequence length.\n    Parameters:\n    attribute_pool (dict): A dictionary containing attributes that define the characteristics of the time series.\n    seq_len (int, optional): The length of the generated time series. Default is 512.\n    Returns:\n    tuple: A tuple containing the generated time series (numpy array) and the updated attribute pool (dict).\n    The attribute_pool dictionary can contain the following keys:\n    - \"seasonal\": A dictionary with a \"type\" key that defines the type of seasonal pattern.\n    - \"trend\": A dictionary with a \"type\" key that defines the type of trend.\n    - \"frequency\": A dictionary with \"type\" and \"period\" keys that define the frequency characteristics.\n    - \"overall_amplitude\": A float that defines the overall amplitude of the time series.\n    - \"overall_bias\": A float that defines the overall bias of the time series.\n    - \"local\": A list of dictionaries that define local characteristics of the time series.\n    - \"statistics\": A dictionary that will be populated with statistical information about the generated time series.\n    The function performs the following steps:\n    1. Adapts to legacy behavior by modifying the attribute pool based on certain conditions.\n    2. Generates the base time series using a linear space.\n    3. Adjusts the period based on the frequency attribute.\n    4. Sets an overall amplitude and bias for the time series.\n    5. Applies seasonal attributes to the time series.\n    6. Applies local changes to the time series.\n    7. Applies trend attributes to the time series.\n    8. Replaces details in local characteristics with actual values from the time series.\n    9. Adds noise to the time series.\n    10. Adds statistical information to the attribute pool.\n    Returns the generated time series and the updated attribute pool.\n    \"\"\"\n    # Adapt to legacy behavior\n    if not ENABLE_MULTIPLE_TREND:\n        # (Step 1) Remove seasonal type\n        if \"no period\" not in attribute_pool[\"seasonal\"]['type']:\n            attribute_pool[\"seasonal\"][\"type\"] = \"periodic fluctuation\"\n\n        # (Step 2) Remove multiple trend\n        if attribute_pool[\"trend\"][\"type\"] == \"multiple\":\n            attribute_pool[\"trend\"][\"type\"] = random.choice([\"increase\", \"decrease\", \"keep steady\"])\n\n    # Generate timeseries\n    x = np.linspace(0, 10 * np.pi, seq_len)\n    y = np.zeros_like(x)\n    \n    period = seq_len\n    if \"frequency\" in attribute_pool:\n        if period not in attribute_pool[\"frequency\"]:\n            if attribute_pool[\"frequency\"]['type'] == \"high frequency\":\n                max_period = seq_len // 8\n                min_period = max(seq_len // 16, 6)\n                period = random.uniform(min_period, max_period)\n            elif attribute_pool[\"frequency\"]['type'] == \"low frequency\":\n                max_period = seq_len // 3\n                min_period = max(seq_len // 8, 6)\n                period = random.uniform(min_period, max_period)\n\n        if attribute_pool[\"frequency\"]['type'] == \"no periodicity\":\n            attribute_pool[\"frequency\"]['period'] = 0.0\n            attribute_pool[\"frequency\"]['detail'] = \"No significant periodic fluctuations observed, overall almost no periodicity. \"\n        else:\n            attribute_pool[\"frequency\"]['period'] = round(period, 1)\n            attribute_pool[\"frequency\"]['detail'] = f\"Each fluctuation period is approximately {period:.1f} points, thus the overall fluctuation is {attribute_pool['frequency']['type']}. \"\n\n    # Set an overall amplitude for all attributes (to ensure the time series is not too flat)\n    if 'overall_amplitude' in attribute_pool and 'overall_bias' in attribute_pool:\n        overall_amplitude = attribute_pool['overall_amplitude']\n        overall_bias = attribute_pool['overall_bias']\n    else:\n        overall_amplitude_e = np.random.choice([-2, -1, 0, 1, 2, 3, 4, 5, 6, 7], p=[0.1, 0.2, 0.2, 0.3, 0.1, 0.04, 0.03, 0.02, 0.008, 0.002])\n        overall_amplitude = round(np.random.uniform(10.0 ** (overall_amplitude_e - 1), 10.0 ** (overall_amplitude_e + 1)), 2)\n        overall_bias = round(np.random.uniform(-(10.0 ** (overall_amplitude_e + 1)), 10.0 ** (overall_amplitude_e + 1)), 2)\n        attribute_pool['overall_amplitude'] = round(overall_amplitude, 2)\n        attribute_pool['overall_bias'] = round(overall_bias, 2)\n\n    # Apply Seasonal Feature\n    y += generate_seasonal(attribute_pool, overall_amplitude, seq_len)\n\n    # Apply local changes\n    y += generate_local_chars(attribute_pool, overall_amplitude, seq_len)\n\n    # Apply trend attribute\n    y = generate_trend(attribute_pool, y, overall_amplitude, overall_bias, seq_len)\n\n    # Replace detail in local_chars\n    for local_char in attribute_pool[\"local\"]:\n        pattern = re.compile(r'<\\|(-?\\d+)\\|>')\n\n        def replacer(match):\n            n = int(match.group(1))\n            if n < 0 or n >= seq_len:\n                raise ValueError(f\"Invalid point placeholder <|{n}|> for sequence length {seq_len}: {local_char['detail']}\")\n            return f\"{y[n]:.2f}\"\n        local_char['detail'] = pattern.sub(replacer, local_char['detail'])\n\n    # Add noise\n    y += generate_noise(attribute_pool, y, overall_amplitude, seq_len)\n\n    # Add statistic information to description\n    attribute_pool[\"statistics\"] = {\n        \"mean\": round(float(np.mean(y)), 2),\n        \"std\": round(float(np.std(y)), 2),\n        \"max\": round(float(np.max(y)), 2),\n        \"min\": round(float(np.min(y)), 2),\n        \"max_pos\": int(np.argmax(y)),\n        \"min_pos\": int(np.argmin(y))\n    }\n    attribute_pool[\"seq_len\"] = seq_len\n\n    return y, attribute_pool\n\ndef attribute_to_text(time_series: np.ndarray, attribute_pool: dict, generate_values: bool=True, include_attributes: List[str] = ['length', 'trend', 'periodicity', 'frequency', 'noise', 'local', 'statistic']) -> str:\n    \"\"\"\n    Generates a textual description of a time series based on various attributes and attributes.\n    Args:\n        time_series (np.ndarray): The time series data as a numpy array.\n        attribute_pool (dict): A dictionary containing attribute details for the time series.\n        generate_values (bool, optional): Deprecated. Use 'statistic' in include_attributes instead. Defaults to True.\n        include_attributes (List[str], optional): A list of attributes to include in the description. Defaults to ['length', 'trend', 'periodicity', 'frequency', 'noise', 'local', 'statistic'].\n    Returns:\n        str: A detailed textual description of the time series.\n    \"\"\"\n    # Adapt to legacy parameters\n    if not generate_values and 'statistic' in include_attributes:\n        include_attributes.remove('statistic')\n    elif generate_values and 'statistic' not in include_attributes:\n        include_attributes.append('statistic')\n\n    seq_len = len(time_series)\n    max_value = round(np.max(time_series), 2)\n    min_value = round(np.min(time_series), 2)\n\n    detailed_description = ''\n    if 'length' in include_attributes:\n        detailed_description += f\"The length of the time series is {seq_len}. \"\n    if 'trend' in include_attributes:\n        detailed_description += f\"{attribute_pool['trend']['detail']}\"\n    if 'periodicity' in include_attributes:\n        detailed_description += attribute_pool['seasonal']['detail']\n    if \"no\" not in attribute_pool['seasonal']['type'] and 'frequency' in include_attributes:\n        detailed_description += attribute_pool['frequency']['detail']\n    if 'noise' in include_attributes:\n        detailed_description += attribute_pool['noise']['detail']\n    if 'local' in include_attributes:\n        if len(attribute_pool[\"local\"]):\n            detailed_description += 'In terms of local characteristics, ' + \";\".join([f\"{i['detail']}, forming a {i['type']}\" for i in attribute_pool['local']]) + '. '\n        else:\n            detailed_description += 'No local characteristics are found. '\n    if 'statistic' in include_attributes:\n        if seq_len >= 64:\n            segments = 32\n        elif seq_len >= 32:\n            segments = 16\n        else:\n            segments = seq_len\n\n        segment_mean = [round(np.mean(time_series[i:i + seq_len // segments]), 2) for i in range(0, seq_len, seq_len // segments)]\n        detailed_description += f\"Specific data details: The time series is divided into {segments} segments, with the approximate mean values for each {seq_len // segments}-point interval being: {segment_mean}. The maximum value of the entire series is {max_value}, and the minimum value is {min_value}.\"\n\n    return detailed_description\n\n\ndef attribute_to_caption(time_series: np.ndarray, attribute_pool: dict, generate_values: bool=True) -> str:\n    \"\"\"\n        Compared with text, caption is in a more natural and fluent way that combines the trend with the local flucations.\n    \"\"\"\n    seq_len = len(time_series)\n    if seq_len >= 64:\n        segments = 32\n    elif seq_len >= 32:\n        segments = 16\n    else:\n        segments = seq_len\n\n    segment_mean = [round(np.mean(time_series[i:i + seq_len // segments]), 2) for i in range(0, seq_len, seq_len // segments)]\n    max_value = round(np.max(time_series), 2)\n    min_value = round(np.min(time_series), 2)\n\n    # Some basic attribute_pool\n    detailed_description = ''\n    detailed_description += f\"The length of the time series is {seq_len}. \"\n    detailed_description += attribute_pool['seasonal']['detail']\n    if \"no\" not in attribute_pool['seasonal']['type']:\n        detailed_description += attribute_pool['frequency']['detail']\n    detailed_description += attribute_pool['noise']['detail']\n\n    # Combine the multiple attribute_pool\n    detailed_description += \"In terms of the trend and changes of this time series: At the beginning, \"\n    all_local_changes = dict((int(v['position_start']), v) for v in attribute_pool['local'])\n    cur_pos = 0\n    while True:\n        if cur_pos >= seq_len - 1:\n            break\n\n        # Find the next local change\n        later_changes = sorted(k for k in all_local_changes if k >= cur_pos)\n        later_trend = sorted(k[1] for k in attribute_pool[\"trend\"][\"trend_list\"] if k[1] > cur_pos)\n        cur_trend = [k for k in attribute_pool[\"trend\"][\"trend_list\"] if (k[1] <= cur_pos < k[2])][0]\n\n        if (len(later_changes) > 0 and len(later_trend) > 0 and later_changes[0] < later_trend[0]) or (len(later_changes) > 0 and len(later_trend) == 0):\n            # Later is a change\n            nxt_pos = later_changes[0]\n            cur_change = [k for k in attribute_pool[\"local\"] if k['position_start'] == nxt_pos][0]\n            if nxt_pos > cur_pos:\n                detailed_description += f\"from point {cur_pos} to {nxt_pos}, the time series {cur_trend[0]} with values from {float(time_series[cur_pos]):.2f} to {float(time_series[nxt_pos]):.2f}; \"\n            detailed_description += f\"from point {cur_change['position_start']} to point {cur_change['position_end']}, {cur_change['detail']}, forming a {cur_change['type']}; \"\n            cur_pos = cur_change['position_end']\n        elif (len(later_changes) > 0 and len(later_trend) > 0 and later_changes[0] >= later_trend[0]) or (len(later_trend) > 0 and len(later_changes) == 0):\n            # Later is a trend\n            nxt_pos = later_trend[0]\n            nxt_trend = [k for k in attribute_pool[\"trend\"][\"trend_list\"] if k[1] == nxt_pos]\n            if nxt_pos > cur_pos:\n                detailed_description += f\"from point {cur_pos} to {nxt_pos}, the time series {cur_trend[0]} with values from {float(time_series[cur_pos]):.2f} to {float(time_series[nxt_pos]):.2f}, and then the trend of the time series changes to {nxt_trend[0][0]}; \"\n            cur_pos = nxt_pos\n        else:\n            # Later is the end\n            nxt_pos = seq_len - 1\n            if nxt_pos > cur_pos:\n                detailed_description += f\"finally, from point {cur_pos} to {nxt_pos}, the time series {cur_trend[0]} with values from {float(time_series[cur_pos]):.2f} to {float(time_series[nxt_pos]):.2f}. \"\n            break\n    \n    if generate_values:\n        detailed_description += f\"Specific data details: The time series is divided into {segments} segments, with the approximate mean values for each {seq_len // segments}-point interval being: {segment_mean}. The maximum value of the entire series is {max_value}, and the minimum value is {min_value}. The start value is {float(time_series[0]):.2f}, the end value if {float(time_series[-1]):.2f}. \"\n        \n        # Random choose some points\n        for _ in range(5):\n            cur_pos = random.choice(list(range(seq_len)))\n            detailed_description += f\"The value of point {cur_pos} is {float(time_series[cur_pos]):.2f}. \"\n\n    return detailed_description\n\ndef prompt_to_inference(timeseries: np.ndarray, prompt: str) -> str:\n    prompt_list = prompt.split(\"<ts><ts/>\")\n    result = prompt_list[0]\n\n    for i in range(len(prompt_list) - 1):\n        cur_ts = timeseries[i]\n        if type(cur_ts) == np.ndarray:\n            cur_ts = cur_ts.tolist()\n        cur_ts = [[round(float(v), 4) for v in item] for item in cur_ts]\n        result += f\"<ts>{cur_ts}<ts/>\" + prompt_list[i + 1]\n\n    return result\n", "blocks": []}, {"path": "chatts/ts_generator/local_changes.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nfrom abc import abstractmethod\nimport numpy as np\nimport random\nfrom chatts.ts_generator.change_utils import generate_ts_change, generate_spike\nimport traceback\nfrom typing import List\nimport yaml\n\n\n# Basic Config\nENABLE_DROP_PROMPT = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"enable_drop_prompt\"]  # Enable or disable drop prompt in SuddenChange\nLOCAL_CHANGE_VERBOSE = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"local_change_verbose\"]\n\n\ndef _clamp_raw_point(point: int, seq_len: int) -> int:\n    return max(0, min(int(point), seq_len - 1))\n\n\ndef _previous_raw_point(point: int) -> int:\n    return max(0, int(point) - 1)\n\n\ndef _inclusive_end_point(exclusive_end: int, seq_len: int) -> int:\n    return _clamp_raw_point(int(exclusive_end) - 1, seq_len)\n\n\ndef _value_ref(point: int, seq_len: int) -> str:\n    return f\"<|{_clamp_raw_point(point, seq_len)}|>\"\n\n\nclass BaseChange:\n    \"\"\"Base class for all local changes in time series\"\"\"\n    \n    def __init__(self, change_type: str, position_start: int = None, amplitude: float = None):\n        self.change_type = change_type\n        self.position_start = position_start\n        self.amplitude = amplitude\n        self.position_end = None\n        self.detail = \"\"\n    \n    @abstractmethod\n    def get_min_length(self) -> int:\n        \"\"\"Return minimum length required for this change type\"\"\"\n        pass\n    \n    @abstractmethod\n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        \"\"\"Apply the change to the time series and return modified array\"\"\"\n        pass\n    \n    def set_position_if_none(self, seq_len: int, existing_objs: List['BaseChange']):\n        \"\"\"Set position if not provided, ensuring minimum length requirement\"\"\"\n        min_length = self.get_min_length()\n        max_start_pos = seq_len - min_length\n        if max_start_pos < 0:\n            raise KeyError(f\"Cannot set position for {self.change_type} with sequence length {seq_len} as it is shorter than minimum length {min_length}.\")\n        if self.position_start is not None:\n            self.position_start = max(0, min(int(self.position_start), max_start_pos))\n            return\n\n        if self.position_start is None:\n            min_interval = max(seq_len / 8, min_length, 20)\n\n            cnt = 0\n            while True:\n                self.position_start = random.randint(0, max_start_pos)\n                cnt += 1\n\n                if cnt > 1000:\n                    raise KeyError(f\"Cannot find a valid position for {self.change_type} after 1000 attempts.\")\n                \n                flag = True\n                for obj in existing_objs:\n                    if self.position_start >= obj.position_start and self.position_start < obj.position_end:\n                        flag = False\n                        break\n                    if abs(self.position_start + min_length - obj.position_start) < min_interval or abs(self.position_start - obj.position_end) < min_interval:\n                        flag = False\n                        break\n                    if self.position_start + min_length > seq_len:\n                        flag = False\n                        break\n    \n                if flag:\n                    break\n\n    def get_remaining_length(self, seq_len: int) -> int:\n        \"\"\"Get remaining length from current position to end of sequence\"\"\"\n        return seq_len - self.position_start\n    \n    def set_amplitude_if_none(self, overall_amplitude: float, base_factor: float = 0.8, variance: float = 2.0):\n        \"\"\"Set amplitude if not provided\"\"\"\n        if self.amplitude is None:\n            self.amplitude = (base_factor + np.abs(random.normalvariate(0.0, variance))) * overall_amplitude\n\n\nclass ShakeChange(BaseChange):\n    \"\"\"Represents a shake/vibration change\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 8\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        \n        peak_start = self.position_start\n        remaining_length = self.get_remaining_length(seq_len)\n        peak_length = min(random.randint(8, max(int(seq_len * 0.15), 16)), remaining_length)\n        \n        func = random.choice([\n            lambda: np.random.uniform(-1, 1, peak_length) * self.amplitude / 2,\n            # lambda: np.sin(np.linspace(0, 5.0, peak_length)) * self.amplitude / 2\n        ])\n        \n        y[peak_start:peak_start + peak_length] += func()\n        self.position_end = peak_start + peak_length\n        peak_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = f\"shake with an amplitude of about {self.amplitude:.2f} occurred between point {peak_start} and point {peak_end}\"\n        \n        return y\n\n\nclass SpikeChange(BaseChange):\n    \"\"\"Base class for spike changes\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 3\n    \n    def _generate_spike_detail(self, peak_start: int, peak_end: int, spike_top_idx: int, direction: str, seq_len: int):\n        \"\"\"Generate detail description for spike\"\"\"\n        public_peak_end = _inclusive_end_point(peak_end, seq_len)\n        if direction == \"upward\":\n            self.detail = f\"an upward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {public_peak_end}, with the time series value rapidly rising from around {_value_ref(peak_start, seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and then quickly falling back to around {_value_ref(public_peak_end, seq_len)}\"\n        else:\n            self.detail = f\"a downward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {public_peak_end}, with the time series value rapidly falling from around {_value_ref(peak_start, seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and then quickly rising back to around {_value_ref(public_peak_end, seq_len)}\"\n\n\nclass UpwardSpikeChange(SpikeChange):\n    \"\"\"Represents an upward spike change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        peak_start = self.position_start\n        remaining_length = self.get_remaining_length(seq_len)\n        spike = generate_spike(self.amplitude, remaining_length)\n        actual_length = min(len(spike), remaining_length)\n        \n        y[peak_start:peak_start + actual_length] += spike[:actual_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:actual_length]))\n        self.position_end = peak_start + actual_length\n        self._generate_spike_detail(peak_start, self.position_end, spike_top_idx, \"upward\", seq_len)\n        \n        return y\n\n\nclass DownwardSpikeChange(SpikeChange):\n    \"\"\"Represents a downward spike change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        peak_start = self.position_start\n        remaining_length = self.get_remaining_length(seq_len)\n        spike = generate_spike(-self.amplitude, remaining_length)\n        actual_length = min(len(spike), remaining_length)\n        \n        y[peak_start:peak_start + actual_length] += spike[:actual_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:actual_length]))\n        self.position_end = peak_start + actual_length\n        self._generate_spike_detail(peak_start, self.position_end, spike_top_idx, \"downward\", seq_len)\n        \n        return y\n\n\nclass ContinuousSpikeChange(BaseChange):\n    \"\"\"Base class for continuous spike changes\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 10\n    \n    def _apply_continuous_spikes(self, y: np.ndarray, seq_len: int, direction: int):\n        \"\"\"Apply multiple consecutive spikes\"\"\"\n        peak_region_start = self.position_start\n        remaining_length = self.get_remaining_length(seq_len)\n        num_peaks = min(random.randint(2, 5), remaining_length // 3)\n        \n        peaks = []\n        spike_top_ids = []\n        all_amplitudes = []\n        current_pos = peak_region_start\n        \n        for i in range(num_peaks):\n            if remaining_length - (current_pos - self.position_start) < 3:\n                break\n            \n            peak_start = current_pos + random.randint(0, min(3, remaining_length - (current_pos - self.position_start) - 3))\n            cur_amplitude = random.uniform(self.amplitude * 0.6, self.amplitude * 1.5)\n            all_amplitudes.append(cur_amplitude)\n            peaks.append(f\"point {peak_start}\")\n            \n            spike = generate_spike(direction * cur_amplitude, self.get_remaining_length(seq_len) - (peak_start - self.position_start))\n            actual_length = min(len(spike), seq_len - peak_start)\n            y[peak_start:peak_start + actual_length] += spike[:actual_length]\n            current_pos = peak_start + actual_length\n            spike_top_ids.append(peak_start + np.argmax(np.abs(spike[:actual_length])))\n        \n        self.position_end = current_pos\n        self.amplitude = float(np.mean(all_amplitudes)) if all_amplitudes else self.amplitude\n        \n        direction_word = \"upward\" if direction > 0 else \"downward\"\n        action_word = \"rising\" if direction > 0 else \"falling\"\n        public_end = _inclusive_end_point(current_pos, seq_len)\n        \n        self.detail = f\"at {' and '.join(peaks)}, there were {len(all_amplitudes)} consecutive {direction_word} spikes with amplitudes ranging from {min(all_amplitudes):.2f} to {max(all_amplitudes):.2f}, with the time series value repeatedly {action_word} sharply from around {_value_ref(self.position_start, seq_len)} to around \" + ' and '.join(_value_ref(i, seq_len) for i in spike_top_ids) + f\", and then quickly falling back to around {_value_ref(public_end, seq_len)}\"\n        \n        return y\n\n\nclass ContinuousUpwardSpikeChange(ContinuousSpikeChange):\n    \"\"\"Represents continuous upward spikes\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        return self._apply_continuous_spikes(y, seq_len, 1)\n\n\nclass ContinuousDownwardSpikeChange(ContinuousSpikeChange):\n    \"\"\"Represents continuous downward spikes\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        return self._apply_continuous_spikes(y, seq_len, -1)\n\n\nclass ConvexChange(BaseChange):\n    \"\"\"Base class for convex changes\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 15\n    \n    def _apply_convex(self, y: np.ndarray, seq_len: int, direction: int):\n        \"\"\"Apply convex change (upward or downward)\"\"\"\n        convex_start = self.position_start\n        remaining_length = self.get_remaining_length(seq_len)\n        \n        start_length = min(random.randint(1, 4), remaining_length // 3)\n        end_length = min(random.randint(1, 4), (remaining_length - start_length) // 2)\n        convex_length = min(random.randint(max(int(seq_len * 0.03), 6), max(int(seq_len * 0.2), 16)), \n                          remaining_length - start_length - end_length)\n        convex_length = max(1, convex_length)\n        \n        # Apply changes\n        y[convex_start:convex_start + start_length] += generate_ts_change(start_length, direction * self.amplitude)\n        y[convex_start + start_length:convex_start + start_length + convex_length] += direction * self.amplitude\n        y[convex_start + start_length + convex_length:convex_start + start_length + convex_length + end_length] += generate_ts_change(end_length, -direction * self.amplitude) + direction * self.amplitude\n        \n        self.position_end = convex_start + start_length + convex_length + end_length\n        \n        # Add some noise occasionally\n        x = np.arange(seq_len)\n        if random.random() > 0.7:\n            y[convex_start + start_length:convex_start + start_length + convex_length] += np.sin((0.8 + np.abs(random.normalvariate(0.0, 2.0))) * x)[convex_start + start_length:convex_start + start_length + convex_length]\n        if random.random() > 0.7:\n            y[convex_start + start_length:convex_start + start_length + convex_length] += np.random.uniform(-1.0, 1.0, convex_length) * np.random.uniform(0.1, 0.5) * self.amplitude\n        \n        direction_word = \"upward\" if direction > 0 else \"downward\"\n        action_words = (\"rises\", \"falls\") if direction > 0 else (\"falls\", \"rises\")\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        \n        self.detail = f\"starting from point {convex_start}, the time series value {action_words[0]} from around {_value_ref(convex_start, seq_len)} to around {_value_ref(convex_start + start_length - 1, seq_len)}, forms a {direction_word} convex with an amplitude of about {self.amplitude:.2f}, and then {action_words[1]} back to around {_value_ref(public_end, seq_len)}\"\n        \n        return y\n\n\nclass UpwardConvexChange(ConvexChange):\n    \"\"\"Represents an upward convex change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        return self._apply_convex(y, seq_len, 1)\n\n\nclass DownwardConvexChange(ConvexChange):\n    \"\"\"Represents a downward convex change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        return self._apply_convex(y, seq_len, -1)\n\n\nclass SuddenChange(BaseChange):\n    \"\"\"Base class for sudden changes\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 2\n    \n    def _apply_sudden_change(self, y: np.ndarray, seq_len: int, direction: int):\n        \"\"\"Apply sudden increase or decrease\"\"\"\n        remaining_length = self.get_remaining_length(seq_len)\n        drop_length = min(random.randint(1, 10), remaining_length)\n        \n        y[self.position_start:self.position_start + drop_length] += generate_ts_change(drop_length, direction * self.amplitude)\n        y[self.position_start + drop_length:] += direction * self.amplitude\n        self.position_end = self.position_start + drop_length\n        \n        action_word = \"increase\" if direction > 0 else \"decrease\"\n        movement_word = \"rising\" if direction > 0 else \"falling\"\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        start_value_point = _previous_raw_point(self.position_start)\n        \n        self.detail = f\"a sudden {action_word} with an amplitude of {self.amplitude:.2f} occurred between point {self.position_start} and point {public_end}, with the time series value {movement_word} from around {_value_ref(start_value_point, seq_len)} to around {_value_ref(public_end, seq_len)}\"\n        \n        # Add recovery with some probability\n        if random.random() < 0.5:\n            recover_length = min(random.randint(1, 10), seq_len - self.position_start - drop_length)\n            if recover_length > 0:\n                recover_amplitude = random.uniform(0, self.amplitude / 3)\n                y[self.position_start + drop_length:self.position_start + drop_length + recover_length] += generate_ts_change(recover_length, -direction * recover_amplitude)\n                y[self.position_start + drop_length + recover_length:] -= direction * recover_amplitude\n                \n                if ENABLE_DROP_PROMPT:\n                    recovery_word = \"drop\" if direction > 0 else \"rise\"\n                    recovery_movement = \"falling\" if direction > 0 else \"rising\"\n                    recovery_start = self.position_start + drop_length\n                    recovery_end = _inclusive_end_point(recovery_start + recover_length, seq_len)\n                    self.detail += f\", then a {recovery_word} with an amplitude of {recover_amplitude:.2f} occurred between point {recovery_start} and point {recovery_end}, with the time series value {recovery_movement} back to around {_value_ref(recovery_end, seq_len)}\"\n        \n        return y\n\n\nclass SuddenIncreaseChange(SuddenChange):\n    \"\"\"Represents a sudden increase change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        return self._apply_sudden_change(y, seq_len, 1)\n\n\nclass SuddenDecreaseChange(SuddenChange):\n    \"\"\"Represents a sudden decrease change\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        return self._apply_sudden_change(y, seq_len, -1)\n\n\nclass TwoPhaseChange(BaseChange):\n    \"\"\"Base class for two-phase changes (e.g., rapid rise followed by slow decline)\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 10\n\n\nclass RapidRiseSlowDeclineChange(TwoPhaseChange):\n    \"\"\"Represents rapid rise followed by slow decline\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        rise_length = min(random.randint(1, 5), remaining_length // 2)\n        fall_length = min(random.randint(max(int(seq_len * 0.05), 8), max(int(seq_len * 0.15), 20)), remaining_length - rise_length)\n        \n        y[self.position_start:self.position_start + rise_length] += generate_ts_change(rise_length, self.amplitude)\n        y[self.position_start + rise_length:self.position_start + rise_length + fall_length] += generate_ts_change(fall_length, -self.amplitude) + self.amplitude\n        \n        self.position_end = self.position_start + rise_length + fall_length\n        rise_end = _inclusive_end_point(self.position_start + rise_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a rapid rise with an amplitude of {self.amplitude:.2f} occurred between point {self.position_start} and point {rise_end}, \"\n            f\"with the time series value rising from around {_value_ref(_previous_raw_point(self.position_start), seq_len)} to around {_value_ref(rise_end, seq_len)}, \"\n            f\"followed by a slow decline between point {self.position_start + rise_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass SlowRiseRapidDeclineChange(TwoPhaseChange):\n    \"\"\"Represents slow rise followed by rapid decline\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        rise_length = min(random.randint(max(int(seq_len * 0.05), 8), max(int(seq_len * 0.15), 20)), remaining_length // 2)\n        fall_length = min(random.randint(1, 5), remaining_length - rise_length)\n        \n        y[self.position_start:self.position_start + rise_length] += generate_ts_change(rise_length, self.amplitude)\n        y[self.position_start + rise_length:self.position_start + rise_length + fall_length] += generate_ts_change(fall_length, -self.amplitude) + self.amplitude\n        \n        self.position_end = self.position_start + rise_length + fall_length\n        rise_end = _inclusive_end_point(self.position_start + rise_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"starting from point {self.position_start}, the time series value slowly rises, \"\n            f\"reaching a peak at point {rise_end}, followed by a rapid decline between point {self.position_start + rise_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass RapidDeclineSlowRiseChange(TwoPhaseChange):\n    \"\"\"Represents rapid decline followed by slow rise\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        drop_length = min(random.randint(1, 5), remaining_length // 2)\n        rise_length = min(random.randint(max(int(seq_len * 0.05), 8), max(int(seq_len * 0.15), 20)), remaining_length - drop_length)\n        \n        y[self.position_start:self.position_start + drop_length] += generate_ts_change(drop_length, -self.amplitude)\n        y[self.position_start + drop_length:self.position_start + drop_length + rise_length] += generate_ts_change(rise_length, self.amplitude) - self.amplitude\n        \n        self.position_end = self.position_start + drop_length + rise_length\n        drop_end = _inclusive_end_point(self.position_start + drop_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a rapid decline with an amplitude of {self.amplitude:.2f} occurred between point {self.position_start} and point {drop_end}, \"\n            f\"with the time series value falling from around {_value_ref(_previous_raw_point(self.position_start), seq_len)} to around {_value_ref(drop_end, seq_len)}, \"\n            f\"followed by a slow rise between point {self.position_start + drop_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass SlowDeclineRapidRiseChange(TwoPhaseChange):\n    \"\"\"Represents slow decline followed by rapid rise\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        drop_length = min(random.randint(max(int(seq_len * 0.05), 8), max(int(seq_len * 0.15), 20)), remaining_length // 2)\n        rise_length = min(random.randint(1, 5), remaining_length - drop_length)\n        \n        y[self.position_start:self.position_start + drop_length] += generate_ts_change(drop_length, -self.amplitude)\n        y[self.position_start + drop_length:self.position_start + drop_length + rise_length] += generate_ts_change(rise_length, self.amplitude) - self.amplitude\n        \n        self.position_end = self.position_start + drop_length + rise_length\n        drop_end = _inclusive_end_point(self.position_start + drop_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"starting from point {self.position_start}, the time series value slowly declines, \"\n            f\"reaching a low point at point {drop_end}, followed by a rapid rise between point {self.position_start + drop_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass SpikeFollowedByChange(BaseChange):\n    \"\"\"Base class for spike followed by another change\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 8\n\n\nclass DecreaseAfterUpwardSpikeChange(SpikeFollowedByChange):\n    \"\"\"Represents decrease after upward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        fall_amplitude = random.uniform(0.1, 0.7) * self.amplitude\n        peak_start = self.position_start\n        \n        spike = generate_spike(self.amplitude, remaining_length)\n        peak_length = min(len(spike), remaining_length // 2)\n        fall_length = min(random.randint(2, max(int(seq_len * 0.05), 12)), remaining_length - peak_length)\n        \n        y[peak_start:peak_start + peak_length] += spike[:peak_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:peak_length]))\n        y[peak_start + peak_length:peak_start + peak_length + fall_length] += generate_ts_change(fall_length, -fall_amplitude)\n        y[peak_start + peak_length + fall_length:] -= fall_amplitude\n        \n        self.position_end = peak_start + peak_length + fall_length\n        peak_end = _inclusive_end_point(peak_start + peak_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"an upward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {peak_end}, \"\n            f\"with the time series value rapidly rising from around {_value_ref(_previous_raw_point(peak_start), seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and quickly falling back, \"\n            f\"followed by a further decline between point {peak_start + peak_length} and point {public_end} to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass IncreaseAfterDownwardSpikeChange(SpikeFollowedByChange):\n    \"\"\"Represents increase after downward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        rise_amplitude = random.uniform(0.1, 0.7) * self.amplitude\n        peak_start = self.position_start\n        \n        spike = generate_spike(-self.amplitude, remaining_length)\n        peak_length = min(len(spike), remaining_length // 2)\n        rise_length = min(random.randint(2, max(int(seq_len * 0.05), 12)), remaining_length - peak_length)\n        \n        y[peak_start:peak_start + peak_length] += spike[:peak_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:peak_length]))\n        y[peak_start + peak_length:peak_start + peak_length + rise_length] += generate_ts_change(rise_length, rise_amplitude)\n        y[peak_start + peak_length + rise_length:] += rise_amplitude\n        \n        self.position_end = peak_start + peak_length + rise_length\n        peak_end = _inclusive_end_point(peak_start + peak_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a downward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {peak_end}, \"\n            f\"with the time series value rapidly falling from around {_value_ref(peak_start, seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and quickly rising back, \"\n            f\"followed by a further rise between point {peak_start + peak_length} and point {public_end} to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass IncreaseAfterUpwardSpikeChange(SpikeFollowedByChange):\n    \"\"\"Represents increase after upward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        rise_amplitude = random.uniform(0.1, 0.7) * self.amplitude\n        peak_start = self.position_start\n        \n        spike = generate_spike(self.amplitude, remaining_length)\n        peak_length = min(len(spike), remaining_length // 2)\n        rise_length = min(random.randint(2, max(int(seq_len * 0.05), 12)), remaining_length - peak_length)\n        \n        y[peak_start:peak_start + peak_length] += spike[:peak_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:peak_length]))\n        y[peak_start + peak_length:peak_start + peak_length + rise_length] += generate_ts_change(rise_length, rise_amplitude)\n        y[peak_start + peak_length + rise_length:] += rise_amplitude\n        \n        self.position_end = peak_start + peak_length + rise_length\n        peak_end = _inclusive_end_point(peak_start + peak_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"an upward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {peak_end}, \"\n            f\"with the time series value rapidly rising from around {_value_ref(_previous_raw_point(peak_start), seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and quickly falling back, \"\n            f\"followed by a further rise between point {peak_start + peak_length} and point {public_end} to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass DecreaseAfterDownwardSpikeChange(SpikeFollowedByChange):\n    \"\"\"Represents decrease after downward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        fall_amplitude = random.uniform(0.1, 0.7) * self.amplitude\n        peak_start = self.position_start\n        \n        spike = generate_spike(-self.amplitude, remaining_length)\n        peak_length = min(len(spike), remaining_length // 2)\n        fall_length = min(random.randint(2, max(int(seq_len * 0.05), 12)), remaining_length - peak_length)\n        \n        y[peak_start:peak_start + peak_length] += spike[:peak_length]\n        spike_top_idx = peak_start + np.argmax(np.abs(spike[:peak_length]))\n        y[peak_start + peak_length:peak_start + peak_length + fall_length] += generate_ts_change(fall_length, -fall_amplitude)\n        y[peak_start + peak_length + fall_length:] -= fall_amplitude\n        \n        self.position_end = peak_start + peak_length + fall_length\n        peak_end = _inclusive_end_point(peak_start + peak_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a downward spike with an amplitude of {self.amplitude:.2f} occurred between point {peak_start} and point {peak_end}, \"\n            f\"with the time series value rapidly falling from around {_value_ref(peak_start, seq_len)} to around {_value_ref(spike_top_idx, seq_len)} and quickly rising back, \"\n            f\"followed by a further decline between point {peak_start + peak_length} and point {public_end} to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass WideSpikeChange(BaseChange):\n    \"\"\"Base class for wide spike changes\"\"\"\n    \n    def get_min_length(self) -> int:\n        return 16\n\n\nclass WideUpwardSpikeChange(WideSpikeChange):\n    \"\"\"Represents a wide upward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        \n        # Define longer rise and fall lengths\n        rise_length = min(random.randint(max(int(seq_len * 0.02), 4), max(int(seq_len * 0.08), 8)), remaining_length // 3)\n        peak_length = min(random.randint(1, 3), (remaining_length - rise_length) // 2)\n        fall_length = min(random.randint(max(int(seq_len * 0.02), 4), max(int(seq_len * 0.08), 8)), remaining_length - rise_length - peak_length)\n\n        # Slow rise\n        y[self.position_start:self.position_start + rise_length] += generate_ts_change(rise_length, self.amplitude)\n        # Short peak\n        y[self.position_start + rise_length:self.position_start + rise_length + peak_length] += self.amplitude\n        # Slow decline\n        y[self.position_start + rise_length + peak_length:self.position_start + rise_length + peak_length + fall_length] += generate_ts_change(fall_length, -self.amplitude) + self.amplitude\n        \n        self.position_end = self.position_start + rise_length + peak_length + fall_length\n        rise_end = _inclusive_end_point(self.position_start + rise_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a slow rise from around {_value_ref(self.position_start, seq_len)} to around {_value_ref(rise_end, seq_len)} occurred between point {self.position_start} and point {rise_end}, \"\n            f\"forming a short peak with an amplitude of {self.amplitude:.2f}, \"\n            f\"followed by a slow decline between point {self.position_start + rise_length + peak_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\nclass WideDownwardSpikeChange(WideSpikeChange):\n    \"\"\"Represents a wide downward spike\"\"\"\n    \n    def apply_change(self, y: np.ndarray, seq_len: int, overall_amplitude: float) -> np.ndarray:\n        self.set_amplitude_if_none(overall_amplitude, variance=6.0)\n        \n        remaining_length = self.get_remaining_length(seq_len)\n        \n        # Define longer decline and rise lengths\n        drop_length = min(random.randint(max(int(seq_len * 0.02), 4), max(int(seq_len * 0.08), 8)), remaining_length // 3)\n        peak_length = min(random.randint(1, 3), (remaining_length - drop_length) // 2)\n        rise_length = min(random.randint(max(int(seq_len * 0.02), 4), max(int(seq_len * 0.08), 8)), remaining_length - drop_length - peak_length)\n\n        # Slow decline\n        y[self.position_start:self.position_start + drop_length] += generate_ts_change(drop_length, -self.amplitude)\n        # Short trough\n        y[self.position_start + drop_length:self.position_start + drop_length + peak_length] -= self.amplitude\n        # Slow rise\n        y[self.position_start + drop_length + peak_length:self.position_start + drop_length + peak_length + rise_length] += generate_ts_change(rise_length, self.amplitude) - self.amplitude\n        \n        self.position_end = self.position_start + drop_length + peak_length + rise_length\n        drop_end = _inclusive_end_point(self.position_start + drop_length, seq_len)\n        public_end = _inclusive_end_point(self.position_end, seq_len)\n        self.detail = (\n            f\"a slow decline from around {_value_ref(self.position_start, seq_len)} to around {_value_ref(drop_end, seq_len)} occurred between point {self.position_start} and point {drop_end}, \"\n            f\"forming a short trough with an amplitude of {self.amplitude:.2f}, \"\n            f\"followed by a slow rise between point {self.position_start + drop_length + peak_length} and point {public_end} back to around {_value_ref(public_end, seq_len)}\"\n        )\n        \n        return y\n\n\n# Factory class to create appropriate change objects\nclass ChangeFactory:\n    \"\"\"Factory class to create change objects based on change type\"\"\"\n    \n    _change_classes = {\n        \"shake\": ShakeChange,\n        \"upward spike\": UpwardSpikeChange,\n        \"downward spike\": DownwardSpikeChange,\n        \"continuous upward spike\": ContinuousUpwardSpikeChange,\n        \"continuous downward spike\": ContinuousDownwardSpikeChange,\n        \"upward convex\": UpwardConvexChange,\n        \"downward convex\": DownwardConvexChange,\n        \"sudden increase\": SuddenIncreaseChange,\n        \"sudden decrease\": SuddenDecreaseChange,\n        \"rapid rise followed by slow decline\": RapidRiseSlowDeclineChange,\n        \"slow rise followed by rapid decline\": SlowRiseRapidDeclineChange,\n        \"rapid decline followed by slow rise\": RapidDeclineSlowRiseChange,\n        \"slow decline followed by rapid rise\": SlowDeclineRapidRiseChange,\n        \"decrease after upward spike\": DecreaseAfterUpwardSpikeChange,\n        \"increase after downward spike\": IncreaseAfterDownwardSpikeChange,\n        \"increase after upward spike\": IncreaseAfterUpwardSpikeChange,\n        \"decrease after downward spike\": DecreaseAfterDownwardSpikeChange,\n        \"wide upward spike\": WideUpwardSpikeChange,\n        \"wide downward spike\": WideDownwardSpikeChange,\n    }\n    \n    @classmethod\n    def create_change(self, change_type: str, position_start: int = None, amplitude: float = None) -> BaseChange:\n        \"\"\"Create a change object based on change type\"\"\"\n        if change_type not in self._change_classes:\n            raise ValueError(f\"Unknown change type: {change_type}\")\n        \n        return self._change_classes[change_type](change_type, position_start, amplitude)\n    \n    @classmethod\n    def get_supported_types(self) -> list:\n        \"\"\"Get list of supported change types\"\"\"\n        return list(self._change_classes.keys())\n\n\ndef generate_local_chars(attribute_pool, overall_amplitude, seq_len):\n    \"\"\"\n    Generate a time series with local characteristics using object-oriented approach.\n    \n    Args:\n        attribute_pool (dict): Pool of attributes containing local characteristics\n        overall_amplitude (float): Overall amplitude for scaling\n        seq_len (int): Length of the time series\n    \n    Returns:\n        np.ndarray: Modified time series with local changes applied\n    \"\"\"\n    y = np.zeros(seq_len)\n    existing_objs = []\n    \n    # Create change objects and set positions\n    updated_local = []\n    for local_char in attribute_pool[\"local\"]:\n        try:\n            change_obj = ChangeFactory.create_change(\n                local_char[\"type\"], \n                local_char.get(\"position_start\"), \n                local_char.get(\"amplitude\")\n            )\n            change_obj.set_position_if_none(seq_len, existing_objs)\n            existing_objs.append(change_obj)\n\n            # Apply the current change\n            y = change_obj.apply_change(y, seq_len, overall_amplitude)\n            if change_obj.position_end > seq_len:\n                raise ValueError(f\"Change exceeds sequence length: {change_obj.position_end} >= {seq_len}. This should never happend! ({change_obj.type=}, {change_obj.position_start=}, {change_obj.amplitude=})\")\n            local_char.update({\n                \"position_start\": change_obj.position_start,\n                \"position_end\": _inclusive_end_point(change_obj.position_end, seq_len),\n                \"amplitude\": change_obj.amplitude,\n                \"detail\": change_obj.detail\n            })\n            updated_local.append(local_char)\n        except KeyError as e:\n            if LOCAL_CHANGE_VERBOSE:\n                print(f\"Warning ({seq_len=}): {e}. Skipping this change.\")\n            continue\n        except Exception as e:\n            if LOCAL_CHANGE_VERBOSE:\n                traceback.print_exc()\n                print(f\"Error ({seq_len=}): {e}. Skipping this change.\")\n            continue\n    \n    # Order of position\n    updated_local.sort(key=lambda x: x[\"position_start\"])\n    attribute_pool[\"local\"] = updated_local\n    \n    return y\n", "blocks": []}, {"path": "chatts/ts_generator/trend_utils.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport math\nimport random\nimport numpy as np\nfrom scipy.interpolate import make_interp_spline, PchipInterpolator\n\n\ndef generate_random_points(seq_len):\n    \"\"\"\n    Generates random key points for the curve based on the sequence length.\n\n    Parameters:\n        seq_len (int): The total number of points on the x-axis (from 0 to seq_len-1).\n\n    Returns:\n        points (list of tuples): The list of generated key points as (x, y) tuples.\n        curve_type (str): The type of curve used ('Bezier' or 'Straight Line').\n    \"\"\"\n    min_distance = math.ceil(seq_len / 8)\n    \n    num_turning_points = random.randint(0, 3)\n    \n    total_key_points = 2 + num_turning_points\n    \n    total_min_distance = (total_key_points - 1) * min_distance\n    \n    total_distance = seq_len - 1\n    \n    extra_distance = total_distance - total_min_distance\n    \n    while extra_distance < 0 and num_turning_points > 0:\n        num_turning_points -= 1\n        total_key_points = 2 + num_turning_points\n        total_min_distance = (total_key_points - 1) * min_distance\n        extra_distance = total_distance - total_min_distance\n    \n    if extra_distance < 0:\n        raise ValueError(\"seq_len is too small\")\n    \n    gaps = [min_distance] * (total_key_points - 1)\n    \n    for _ in range(extra_distance):\n        idx = random.randint(0, total_key_points - 2)\n        gaps[idx] += 1\n    \n    key_x = [0]\n    for gap in gaps:\n        key_x.append(key_x[-1] + gap)\n    \n    y_positions = np.random.uniform(-1, 1, total_key_points)\n    \n    points = list(zip(key_x, y_positions))\n    \n    if random.random() < 0.99:\n        curve_type = \"Bezier\"\n    else:\n        curve_type = \"Straight Line\"\n    \n    return points, curve_type\n\ndef generate_trend_curve(seq_len, points):\n    \"\"\"\n    Generates the curve based on the key points.\n\n    Parameters:\n        seq_len (int): The total number of points on the x-axis (from 0 to seq_len-1).\n        points (list of tuples): The list of generated key points as (x, y) tuples.\n\n    Returns:\n        curve_x (np.ndarray): The x-coordinates of the generated curve (0 to seq_len-1).\n        curve_y (np.ndarray): The y-coordinates of the generated curve.\n        curve_type (str): The type of curve used ('Bezier' or 'Straight Line').\n    \"\"\"\n    # Extract x and y from points\n    key_x = [point[0] for point in points]\n    key_y = [point[1] for point in points]\n    \n    # Decide whether to use Bezier curves or straight lines\n    curve_x = np.arange(seq_len)\n    if random.random() < 0.99:\n        curve_type = \"Bezier\"\n        interpolator = PchipInterpolator(key_x, key_y)\n        curve_y = interpolator(curve_x)\n    else:\n        curve_type = \"Straight Line\"\n        curve_y = np.interp(np.arange(seq_len), key_x, key_y)\n    \n    return curve_x, curve_y, curve_type\n\ndef generate_trend_prompt(points):\n    \"\"\"\n    Generates an English prompt describing the trend between each pair of adjacent points.\n    If consecutive trends are the same, merges them into a single description with a note\n    about some variation in the trend.\n\n    Parameters:\n        points (list of tuples): The list of key points as (x, y) tuples.\n\n    Returns:\n        prompt (str): The generated English prompt describing the trends.\n    \"\"\"\n    if not points or len(points) < 2:\n        return \"Insufficient points to determine trends.\"\n\n    # Extract y-values\n    y_values = [y for _, y in points]\n\n    # Calculate the curve range\n    curve_range = max(y_values) - min(y_values)\n\n    if curve_range == 0:\n        # All y-values are the same\n        curve_range = 1  # To avoid division by zero\n\n    # Determine trends between each pair of points\n    trends = []\n    for i in range(len(points) - 1):\n        _, y_left = points[i]\n        _, y_right = points[i + 1]\n        delta_y = y_right - y_left\n\n        if delta_y > 0.1 * curve_range:\n            trend = \"increasing\"\n        elif delta_y < -0.1 * curve_range:\n            trend = \"decreasing\"\n        else:\n            trend = \"stable\"\n\n        trends.append(trend)\n\n    # Merge consecutive same trends\n    merged_trends = []\n    current_trend = trends[0]\n    start_idx = 0\n\n    for i in range(1, len(trends)):\n        if trends[i] != current_trend:\n            merged_trends.append((current_trend, start_idx, i))\n            current_trend = trends[i]\n            start_idx = i\n    # Append the last trend\n    merged_trends.append((current_trend, start_idx, len(trends)))\n\n    # Generate the prompt\n    prompt_segments = []\n    for trend, start, end in merged_trends:\n        # Determine the starting and ending points of the merged segment\n        point_start = points[start]\n        point_end = points[end]\n\n        # Determine the article based on the trend\n        if trend == \"increasing\":\n            article = \"an increasing trend\"\n        elif trend == \"decreasing\":\n            article = \"a decreasing trend\"\n        else:\n            article = \"a stable trend\"\n\n        # If the segment spans multiple trends of the same type, mention variation\n        if end - start > 1:\n            variation_note = \"with some variation in slope\"\n        else:\n            variation_note = \"\"\n\n        # Construct the sentence\n        if variation_note:\n            sentence = (f\"From point {point_start[0]} \"\n                        f\"to point {point_end[0]}, \"\n                        f\"there is {article} {variation_note}.\")\n        else:\n            sentence = (f\"From point {point_start[0]} \"\n                        f\"to point {point_end[0]}, \"\n                        f\"there is {article}.\")\n\n        prompt_segments.append(sentence)\n\n    # Combine all segments into a single prompt\n    prompt = \" \".join(prompt_segments)\n\n    return prompt\n\ndef generate_trend_list(points, seq_len):\n    \"\"\"\n    Generates an English trend list describing the trend between each pair of adjacent points.\n    If consecutive trends are the same, merges them into a single description with a note\n    about some variation in the trend.\n\n    Parameters:\n        points (list of tuples): The list of key points as (x, y) tuples.\n\n    Returns:\n        trend_list: [(increase/decrease, start_point, end_point)]\n    \"\"\"\n    if not points or len(points) < 2:\n        return \"Insufficient points to determine trends.\"\n\n    # Extract y-values\n    y_values = [y for _, y in points]\n\n    # Calculate the curve range\n    curve_range = max(y_values) - min(y_values)\n\n    if curve_range == 0:\n        # All y-values are the same\n        curve_range = 1  # To avoid division by zero\n\n    # Determine trends between each pair of points\n    trends = []\n    for i in range(len(points) - 1):\n        _, y_left = points[i]\n        _, y_right = points[i + 1]\n        delta_y = y_right - y_left\n\n        if delta_y > 0.1 * curve_range:\n            trend = \"increase\"\n        elif delta_y < -0.1 * curve_range:\n            trend = \"decrease\"\n        else:\n            trend = \"steady\"\n\n        trends.append(trend)\n\n    # Merge consecutive same trends\n    merged_trends = []\n    current_trend = trends[0]\n    start_idx = 0\n\n    for i in range(1, len(trends)):\n        if trends[i] != current_trend:\n            merged_trends.append((current_trend, points[start_idx][0], points[i][0]))\n            current_trend = trends[i]\n            start_idx = i\n    # Append the last trend\n    merged_trends.append((current_trend, points[start_idx][0], seq_len - 1))\n\n    return merged_trends\n", "blocks": []}, {"path": "chatts/utils/attribute_utils.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport json\n\n\n# Config\nCONFIG_PATH = 'config/metric_set.json'\n\n# Load json\ncontrol_attribute_data = json.load(open(CONFIG_PATH))\nmetric_to_attributes = {}\n\nfor category in control_attribute_data:\n    for k, v in category['attributes'].items():\n        metric_to_attributes[k] = v\n\ndef metric_to_controlled_attributes(metric: str):\n    return metric_to_attributes.get(metric, None)\n", "blocks": []}, {"path": "chatts/utils/encoding_utils.py", "language": "python", "note_zh": "", "note_en": "", "code": "\"\"\"\n    Scripts for encoding time series into TS-MLLM Format.\n\"\"\"\nimport numpy as np\nimport re\nimport copy\nfrom typing import *\n\n\ndef minmax_scale_encoding(timeseries: np.ndarray):\n    # Scalar\n    mean = np.mean(timeseries)\n    scaled_timeseries = timeseries - mean\n    scale_factor = 1.0\n    if np.any(np.abs(scaled_timeseries) >= 3.0):\n        # Scale\n        scale_factor = np.max(np.abs(scaled_timeseries)) / 3.0\n        scaled_timeseries /= scale_factor\n    prompt = f\"[Offset: {-mean:.4f}|Scaled by: {scale_factor:.4f}]<ts><ts/>\"\n\n    return scaled_timeseries[:, np.newaxis], prompt, {'offset': float(-mean), 'scale_factor': float(scale_factor)}\n\ndef sp_encoding(timeseries: np.ndarray):\n    # Scalar\n    mean = np.mean(timeseries)\n    scaled_timeseries = timeseries - mean\n    scale_factor = 1.0\n    if np.any(np.abs(scaled_timeseries) >= 3.0):\n        # Scale\n        scale_factor = np.max(np.abs(scaled_timeseries)) / 3.0\n        scaled_timeseries /= scale_factor\n\n    prompt = f\"[Value Offset: {-mean:.4f}|Value Scaling: {scale_factor:.4f}]<ts><ts/>\"\n\n    result_timeseries = np.stack([scaled_timeseries, np.ones_like(scaled_timeseries)], axis=-1).reshape(-1, 1)\n\n    return result_timeseries, prompt, {'offset': float(-mean), 'scale_factor': float(scale_factor)}\n\ndef no_encoding(timeseries: np.ndarray):\n    return np.array(timeseries), \"<ts><ts/>\", {}\n\ndef timeseries_encoding(timeseries: np.ndarray, method: str):\n    if method == 'minmax_scale':\n        return minmax_scale_encoding(timeseries)\n    elif method == 'sp':\n        return sp_encoding(timeseries)\n    elif method == 'no':\n        return no_encoding(timeseries)\n    else:\n        raise NotImplementedError(f\"Timeseries encoding method: {method} not implemented!\")\n\ndef timeseries_prompt(prompt: str, timeseries: np.ndarray):\n    if type(timeseries) == np.ndarray:\n        timeseries = timeseries.tolist()\n\n    prompt_list = prompt.split('<ts><ts/>')\n    result = prompt_list[0]\n    assert len(timeseries) == len(prompt_list) - 1\n\n    for i in range(len(timeseries)):\n        result += f\"<ts>{[[round(k, 3) for k in j] for j in list(timeseries[i])]}<ts/>\" + prompt_list[i + 1]\n\n    return result\n\ndef eval_prompt_to_encoding(prompt: str, timeseries: list, method: str) -> Tuple[str, np.ndarray]:\n    prompt_list = prompt.split('<ts><ts/>')\n    result_prompt = prompt_list[0]\n    assert len(timeseries) == len(prompt_list) - 1\n\n    # Convert time series and pad\n    scaled_timeseries: List[np.ndarray] = []\n    \n    for i in range(len(timeseries)):\n        cur_ts, cur_prompt, _ = timeseries_encoding(np.array(timeseries[i]), method)\n        result_prompt += f\"{cur_prompt}\" + prompt_list[i + 1]\n        scaled_timeseries.append(np.array([cur_ts]))\n\n    # Pad batch ts\n    max_length = max(arr.shape[1] for arr in scaled_timeseries)\n    padded_time_series_attributes = [\n        np.pad(arr, ((0, 0), (0, max_length - arr.shape[1]), (0, 0)), mode='constant', constant_values=0)\n        for arr in scaled_timeseries\n    ]\n    concatenated_time_series = np.concatenate(padded_time_series_attributes, axis=0)\n\n    return result_prompt, concatenated_time_series\n\ndef timeseries_to_list(timeseries, digits: int=6, cp=True):\n    if cp:\n        result = copy.deepcopy(timeseries)\n    else:\n        result = timeseries\n    if type(result) == np.ndarray:\n        result = result.tolist()\n    \n    if type(result[0]) == float:\n        for i in range(len(result)):\n            result[i] = round(float(result[i]), 6)\n    else:\n        for i in range(len(result)):\n            result[i] = timeseries_to_list(result[i], digits, cp=False)\n\n    return result\n", "blocks": []}, {"path": "chatts/utils/inference_tsmllm_deepspeed.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, AutoProcessor\nimport torch\nimport os\nimport deepspeed\nfrom transformers.integrations import HfDeepSpeedConfig\nimport json\nfrom loguru import logger\nimport numpy as np\n\n\n# CONFIG\nEXP = 'chatts_dataset_a'\nMODEL_PATH = os.path.abspath('ckpt')\nDATASET = f'./
