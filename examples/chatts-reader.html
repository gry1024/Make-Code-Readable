re provider?\",\n        \"question_type\": \"open_ended\"\n    },\n    \"Trend and Local Feature Synthesis in Real-World Application\": {\n        \"example\": \"Network latency monitoring data over time is provided. Analyze the overall patterns and any fluctuations. How do these observations affect your confidence in the network's stability? Explain your analytical thinking.\",\n        \"question_type\": \"open_ended\"\n    },\n    \"Positional Significance Analysis in Real-World Application\": {\n        \"example\": \"A power grid's output data throughout the day is provided, with focus on evening hours. Analyze the data and explain why the timing of any significant events is particularly important for assessing grid stability.\",\n        \"question_type\": \"open_ended\"\n    }\n}\n\n\ndef generate_prompt_data():\n    # Determine sequence length\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        elif p > 0.1 or DISABLE_EXTREME_LENGTHS:\n            current_seq_len = random.randint(64, 1024)\n        elif p > 0.05:\n            current_seq_len = random.randint(5, 64)\n        else:\n            current_seq_len = random.randint(1024, 4096)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Random choose a category and metric name\n    sample = random.choice(list(metric_config))\n    category = sample['category']\n    metric = random.choice(sample['metrics'])\n    fields = []\n\n    # Choose a metric and generate\n    # Generate attribute_pool and time series\n    if DISABLE_METRIC_CONFIG:\n        attribute_pool = generate_random_attributes(all_attribute_set['overall_attribute'], all_attribute_set['change'], seq_len=current_seq_len)\n    else:\n        attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n\n    attribute_pool['metric_name'] = metric\n    attribute_pool['situation'] = category\n\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Scalar\n    scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    # Generate QA\n    instruction = f\"This is a metric called {metric} collected from {category} with length of {current_seq_len}: {cur_ts_prompt}. \"\n    prompts = []\n    fields = []\n\n    # Generate random task\n    task_candidates = ['reason']\n    tasks = list(np.random.choice(task_candidates, size=1, replace=False))\n    \n    for task in tasks:\n        prompt = f\"I am creating a dataset for a time series analysis large language model. Based on the information I provide about the time series, I need you to generate as many rich QA pairs as possible according to the specified task requirements. This will be used as training data for the large language model. Now, I have a time series named {metric} from the {category} domain.\"\n\n        if task == 'reason':\n            fields.append({'trend': [0], 'seasonal': [0], 'noise': [0], 'local': [0], 'statistic': [0]})\n            prompt += \"The features of the given time series are as follows: \"\n            prompt += attribute_to_text(\n                timeseries,\n                attribute_pool,\n                include_attributes=['length', 'trend', 'periodicity', 'frequency', 'noise', 'local', 'statistic'],\n                generate_values=False\n            )\n            \n            # Randomly select a named reasoning template.\n            template_name = random.choice(list(REASONING_TEMPLATES.keys()))\n            template_info = REASONING_TEMPLATES[template_name]\n            \n            # The example is a complete, self-contained, high-quality real-world question.\n            example_question = template_info[\"example\"]\n\n            # This is the new part: a high-quality example of a QA pair.\n            example_answer_prompt = \"\"\"\n---\n**Example Answer (for a similar question):**\n\n**Answer Example (Yes):**\nLooking at the time series data, I can identify two key components: First, the baseline response time shows a gradual upward trend from around 200ms to 350ms throughout the observation period, satisfying the 'increase' trend requirement. Second, there's a prominent spike reaching 950ms at position 210, which exceeds the 800ms threshold specified in the definition. Since both conditions are met - an increasing baseline trend and a spike above 800ms. Therefore, the answer should be: Yes, a critical server overload is present according to the given definition. \n\n**Answer Example (No):**\nLooking at the time series data, I can identify two key components: First, the baseline response time remains relatively stable around 250-280ms throughout the observation period, showing a 'keep steady' trend rather than the required 'increase' trend. Second, while there is a notable spike reaching 920ms at position 180, this spike occurs during a stable baseline period, not during an increasing trend. Since the first condition is not met - the baseline trend is not increasing as required by the definition. Therefore, the answer should be: No, a critical server overload is not present according to the given definition.\n\n**Answer Example (Open-Ended):**\n\nLooking at the time series data, the server exhibits a concerning performance degradation pattern. The baseline response time shows a gradual upward trend from around 200ms to 350ms, indicating the system is under increasing stress or resource constraints. More critically, there's a severe spike reaching 950ms at position 210, which represents a nearly 3x increase from the baseline. This pattern suggests the server is approaching its capacity limits and experiencing intermittent overload conditions. My primary concerns would be user experience degradation and potential system instability. I would recommend immediate actions including: monitoring resource utilization to identify bottlenecks, implementing load balancing or scaling solutions, and setting up alerts for response times exceeding 500ms to prevent future incidents. \\n\\n\"\"\"\n\n            prompt += f\"Generate QA pairs about the reasoning concept: **{template_name}**. Here is a high-quality example question: '{example_question}'\"\n            prompt += example_answer_prompt\n            prompt += f\"\"\"\nNow, create new, diverse reasoning questions about the given time series. The questions must be self-contained, set in a realistic scenario, and provide all necessary definitions for the user to make a judgment.\n\n**Key Requirements:**\n1.  **Question Diversity**: Create a mix of questions with different question formats and expressions. Some are simple questions, while some questions are not in well-formed format. For example, some questions may use only simple words with no requirements about the answer format, and some questions should be as detailed as possible, raising lots of requirements about the answer. The output list must include Q&As in **different question formats and types.**\n2.  **Self-Contained & Realistic**: Ensure every question is set in a real-world context (e.g., IT, finance, e-commerce) and clearly defines the criteria for judgment (what constitutes an \"anomaly\", \"overload\", etc.). For multiple choice questions, provide **clear options** that reflect realistic scenarios. For open-ended questions, ensure they require deep analysis and reasoning.\n3.  **Focus on Core Scenarios**: Questions should primarily explore interactions between overall trends (including multi-phase trends) and local features (like spikes, drops, or sudden changes).\n4.  **Demand Deep Reasoning**: Answers must follow the structured format shown in the example answer above: **Analysis** -> **Evidence** -> **Reasoning** -> **Conclusion**. They must explain the 'why' behind the conclusion, not just state it. The answer should be rich and detailed, providing a comprehensive analysis of the time series data.\n5. **QAs with different answers:** For yes/no questions and multi-choice questions, you should generate questions and answers with different answers, such as \"Yes\", \"No\", \"A\", \"B\", etc. For open-ended questions, you should generate questions and answers with different perspectives and conclusions. For Yes/No questions, ensure you have clearly conclude the answer and explictly state the \"Yes\" or \"No\" at the end of the reasoning part. For multi-choice questions, ensure the answer is one of the options (e.g., \"A\", \"B\", \"C\", \"D\") and clearly state the answer at the end of the reasoning part.\n\n**CRITICAL: MAXIMIZE FORMAT DIVERSITY**\nCreate varied question and answer formats:\n\n**Question Style Examples:**\n- \"As a network security engineer monitoring this traffic data over the past 6 hours. The company defines a 'coordinated attack' as sustained traffic increases of 300 above baseline lasting more than 15 minutes, combined with connection timeout spikes. Based on this definition and the observed data patterns, is the system currently under a coordinated attack?\"\n- \"You're consulting for an e-commerce platform experiencing customer complaints about checkout delays. The platform considers 'critical performance degradation' as any period where both: (1) response times exceed 2 seconds for more than 5 consecutive minutes, AND (2) the baseline shows deteriorating trends. What's your professional assessment of the current system health?\"\n\n**Answer Format Guide** (use natural language, don't include these labels):\nThe answer should be **as detailed and long as possible**, following this structure:\n[Initial observation of data] → [Specific evidence from patterns] → [Technical reasoning] → [Clear conclusion]\n\nMix confident/uncertain tones, quantitative/qualitative reasoning, technical/business language, brief/comprehensive responses. The responses should be very rich and detailed, providing a comprehensive analysis of the time series data.\n\nNote that you should **rewrite** the initial question and answers into **multiple questions and answers with different format, word orders and expressions**! For Yes/No questions, ensure you have clearly conclude the answer and explictly state the \"Yes\" or \"No\" at the end of the reasoning part. For multi-choice questions, ensure the answer is one of the options (e.g., \"A\", \"B\", \"C\", \"D\") and clearly state the answer at the end of the reasoning part.\n\n**Note:** If the given time series is not able to generate the targeted QA pairs, just return a empty list.\\n\\n\"\"\"\n        else:\n            raise ValueError(f\"Unknown task: {task}\")\n\n        prompt += \"\"\"Now, please strictly follow the above requirements to generate as many QA pairs as possible (if can), and include the reference text for the answers. Output in JSON format, for example: [{\"question\": \"Strictly follow the task question 1\", \"answer\": \"Answer 1 found from the data\", \"reference\": \"Precise original text fragment for answer 1\"}, {\"question\": \"Strictly follow the task question 2\", \"answer\": \"Answer 2 found from the data\", \"reference\": \"Precise original text fragment for answer 2\"}]. The included attributes in answers **must be found** from the given time series, and the answers must be accurate. The generated QA pairs should not be repetitive, and the answers can be **very detailed**. Specific time series feature must **not** be mentioned in the question (e.g., using words like \"the spike of amplitude 50\", \"the sudden increase in the time series\") as we will provide them. Just use words like \"according to the time series\" or \"according to the values near point 50\".\"\"\"\n\n        prompts.append(prompt)\n\n    # Generate final result\n    result = []\n    for prompt, field in zip(prompts, fields):\n        result.append({\n            'instruction': instruction,\n            'prompt': prompt,\n            'fields': field,\n            'timeseries': [scaled_timeseries],\n            'original_timeseries': [timeseries],\n            'metrics': [metric],\n            'attribute_pool': [attribute_pool],\n            'corr_pool': []\n        })\n\n    return result\n\ndef generate_dataset():\n    result = []\n    prompts = []\n    num_cnt = 0\n    with tqdm(total=TOTAL_CNT, desc='Generating prompt...') as t:\n        cnt = 0\n        while True:\n            try:\n                cur_data = generate_prompt_data()\n            except ValueError as err:\n                continue\n            except IndexError as err:\n                continue\n            for item in cur_data:\n                item['ts_idx'] = num_cnt\n                result.append(item)\n                prompts.append(item['prompt'])\n                t.update()\n                cnt += 1\n            if cnt >= TOTAL_CNT:\n                break\n            num_cnt += 1\n\n    # Use LLM to generate answer\n    if DRYRUN:\n        llm_answers = ['[{\"question\": \"This is a test question.\", \"answer\": \"This is a test answer.\"}]'] * len(prompts)\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm', batch_size=8)\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    # Parse json\n    dataset = []\n    labels = []\n    failed_cnt = 0\n    for i in tqdm(range(len(result)), desc='Parsing'):\n        try:\n            cur_qa_list = parse_llm_json(llm_answers[i])\n            for j, qa in enumerate(cur_qa_list):\n                dataset.append({\n                    'input': result[i]['instruction'] + qa['question'],\n                    'output': qa['answer'],\n                    'timeseries': timeseries_to_list(result[i]['timeseries'])\n                })\n                labels.append({\n                    'instruction': result[i]['instruction'],\n                    'question': qa['question'],\n                    'fields': result[i]['fields'],\n                    'ts_idx': result[i]['ts_idx'],\n                    'metrics': result[i]['metrics'],\n                    'corr_pool': result[i]['corr_pool'],\n                    'attribute_pool': result[i]['attribute_pool']\n                })\n        except Exception as err:\n            failed_cnt += 1\n            continue\n    print(f\"Parse finished. Failed count: {failed_cnt}, Success count: {len(dataset)}.\")\n\n    return dataset, labels\n\n\nif __name__ == '__main__':\n    # Create output directory if not exists\n    os.makedirs(os.path.dirname(OUTPUT_DATASET), exist_ok=True)\n    os.makedirs(os.path.dirname(OUTPUT_LABEL), exist_ok=True)\n\n    result, labels = generate_dataset()\n    with open(OUTPUT_DATASET, 'wt') as f:\n        for item in result:\n            f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n\n    with open(OUTPUT_LABEL, 'wt') as f:\n        json.dump(labels, f, ensure_ascii=False, indent=4)\n\n    print(f\"Finished! Saved to {OUTPUT_DATASET} and {OUTPUT_LABEL}.\")\n", "blocks": []}, {"path": "chatts/sft/generate_uts_reason_cn.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\"\"\"\n    This script is used to generate the stage-2 training data with LLMs for univariate time series, which can be further used as seed QAs for TSEvol.\n    Usage:\n        python3 -m chatts.sft.generate_uts_reason\n\"\"\"\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport json\nimport yaml\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series, generate_controlled_attributes, attribute_to_text, all_attribute_set\nfrom chatts.utils.llm_utils import LLMClient, parse_llm_json\nfrom chatts.utils.encoding_utils import timeseries_encoding, timeseries_to_list\nfrom chatts.utils.attribute_utils import metric_to_controlled_attributes\nfrom loguru import logger\nimport os\n\n\n# CONFIG\nTOTAL_CNT = yaml.safe_load(open(\"config/datagen_config.yaml\"))['num_data_llm_qa']\nSEQ_LEN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['seq_len']  # Set to None to enable random sequence length selection\nENCODING_METHOD = yaml.safe_load(open(\"config/datagen_config.yaml\"))['encoding_method']\nOUTPUT_BASE_DIR = yaml.safe_load(open(\"config/datagen_config.yaml\"))['data_output_dir']\nOUTPUT_DATASET = f'{OUTPUT_BASE_DIR}/llm_uts_reason_cn_{TOTAL_CNT}_{ENCODING_METHOD}.jsonl'\nOUTPUT_LABEL = f'{OUTPUT_BASE_DIR}/evol_labels/llm_uts_reason_cn_{TOTAL_CNT}_{ENCODING_METHOD}.json'\nDRYRUN = yaml.safe_load(open(\"config/datagen_config.yaml\"))['dryrun']\nLOCAL_LLM_PATH = yaml.safe_load(open(\"config/datagen_config.yaml\"))['local_llm_path']\nDISABLE_METRIC_CONFIG = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_metric_config\"]\nDISABLE_EXTREME_LENGTHS = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"disable_extreme_lengths\"]\n\n# All Config for TS Attributes (type & probability)\nmetric_config = json.load(open('config/metric_set.json', 'rt'))\n\n# 命名推理模板及示例问题\n# 带占位符的命名推理模板\nREASONING_TEMPLATES = {\n    # --- 判断问题 (如果-那么) ---\n    # 这些问题是自包含的，需要详细的解释。\n    \"多趋势异常判断\": {\n        \"example\": \"如果异常定义为时间序列首先显示'上升'趋势，然后紧接着出现'下降'趋势，请分析这个时间序列。基于这个定义，从第0点到第256点的片段是否包含异常？\",\n        \"question_type\": \"judgment\"\n    },\n    # \"趋势-局部交互判断\": {\n    #     \"example\": \"'关键事件'定义为在整体'上升'趋势期间出现振幅大于30的'向上尖峰'。分析这个时间序列。基于这个规则，是否存在关键事件？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    \"连续局部特征判断\": {\n        \"example\": \"如果'系统故障'定义为振幅>20的'突然增加'，在15个点内紧跟着振幅>15的'向下尖峰'，这个时间序列是否显示系统故障？\",\n        \"question_type\": \"judgment\"\n    },\n    # \"稳定趋势扰动判断\": {\n    #     \"example\": \"'失稳事件'定义为在长期'保持稳定'趋势中出现振幅为25或更大的'突然下降'。分析从第0点到第200点的时间序列。根据这个定义，它是否包含失稳事件？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    # \"多阶段趋势进展判断\": {\n    #     \"example\": \"如果'正常增长周期'定义为按顺序的三个阶段：'上升'，然后'保持稳定'，然后再次'上升'，这个时间序列是否遵循正常增长周期模式？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    # \"矛盾信号判断\": {\n    #     \"example\": \"如果'冲突信号'定义为在被识别为总体'上升'趋势的时期内观察到总振幅变化>40的'连续向下尖峰'，这个数据中是否存在冲突信号？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    # \"噪声阈值判断\": {\n    #     \"example\": \"如果时间序列被分类为具有'噪声'环境（噪声标准差>0.2），而趋势被标记为'保持稳定'，噪声水平是否使稳定趋势分类失效？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    # \"季节性稳定性判断\": {\n    #     \"example\": \"'稳定的季节性模式'定义为随时间变化振幅>1.0的'正弦周期性波动'。分析时间序列。季节性模式是否满足稳定性标准？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    \"统计判断\": {\n        \"example\": \"如果任何低于10的数据点都被认为是'离群值'。这个时间序列是否应该被认为是异常的？\",\n        \"question_type\": \"judgment\"\n    },\n    \"长期统计判断\": {\n        \"example\": \"如果低于10且持续超过20个数据点被认为是异常的。这个时间序列是否应该被认为是异常的？\",\n        \"question_type\": \"judgment\"\n    },\n    \"带恢复的长期统计判断\": {\n        \"example\": \"如果数据点低于10且不恢复到原始状态被认为是异常的。时间序列中是否存在任何异常？\",\n        \"question_type\": \"judgment\"\n    },\n    # \"实际应用中的多趋势异常判断\": {\n    #     \"example\": \"对于一个新的移动应用，'失败的启动'定义为用户参与度最初增加但在第一周内开始下降。基于这个定义，应用在过去7天的用户参与度数据是否表明启动失败？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    # \"实际应用中的趋势-局部交互判断\": {\n    #     \"example\": \"'关键服务器过载'定义为API响应时间'向上尖峰'超过800毫秒，发生在基线响应时间已显示渐进'上升'趋势的时期。分析服务器的性能数据。基于这个规则，是否存在关键服务器过载？\",\n    #     \"question_type\": \"judgment\"\n    # },\n    \"实际应用中的连续局部特征判断\": {\n        \"example\": \"应用程序中的'内存泄漏崩溃'通过其内存使用量'突然增加'超过200MB，然后在10分钟内出现超过150MB的急剧'向下尖峰'（表示崩溃和重启）来识别。这个应用程序的内存使用数据是否显示内存泄漏崩溃？\",\n        \"question_type\": \"judgment\"\n    },\n    \"简单阈值判断\": {\n        \"example\": \"低于10认为是异常的。判断这个时间序列里面有没有异常值？给出异常的区间\",\n        \"question_type\": \"judgment\"\n    },\n    \"局部波动的简单阈值判断\": {\n        \"example\": \"高于10的突刺认为是异常的。判断这个时间序列里面有没有异常值？\",\n        \"question_type\": \"judgment\"\n    },\n    \"局部波动的最大/最小值判断\": {\n        \"example\": \"如果出现了突降，并且降到了10以下，认为是异常的。判断这个时间序列里面有没有异常值？\",\n        \"question_type\": \"judgment\"\n    },\n    \"振幅阈值异常判断\": {\n        \"example\": \"如果时间序列中任何点的振幅变化超过5，就认为是异常波动。分析这个时间序列是否存在异常波动？\",\n        \"question_type\": \"judgment\"\n    },\n    \"最大值阈值判断\": {\n        \"example\": \"当时间序列的最大值超过50时，认为系统处于过载状态。根据数据判断系统是否过载？\",\n        \"question_type\": \"judgment\"\n    },\n    \"最小值阈值判断\": {\n        \"example\": \"如果时间序列的最小值低于5，认为系统运行异常。判断系统是否运行正常？\",\n        \"question_type\": \"judgment\"\n    },\n    \"连续超阈值判断\": {\n        \"example\": \"连续3个或以上数据点超过30的情况被认为是持续异常。这个时间序列中是否存在持续异常？\",\n        \"question_type\": \"judgment\"\n    },\n    \"双阈值区间判断\": {\n        \"example\": \"正常运行范围定义为15-25之间，超出此范围的数据点视为异常。分析时间序列是否有异常数据点？\",\n        \"question_type\": \"judgment\"\n    },\n    \"变化率阈值判断\": {\n        \"example\": \"相邻两点间的变化率超过20%被认为是剧烈波动。判断时间序列中是否存在剧烈波动？\",\n        \"question_type\": \"judgment\"\n    },\n    \"峰值持续时间判断\": {\n        \"example\": \"峰值（高于40）持续超过5个时间点被认为是异常峰值事件。时间序列中是否有异常峰值事件？\",\n        \"question_type\": \"judgment\"\n    },\n    \"谷值深度判断\": {\n        \"example\": \"谷值低于8且持续时间超过3个点被认为是深度下跌。判断是否存在深度下跌现象？\",\n        \"question_type\": \"judgment\"\n    },\n    \"突增幅度判断\": {\n        \"example\": \"单次突增幅度超过15的情况被认为是突发事件。时间序列中是否存在突发事件？\",\n        \"question_type\": \"judgment\"\n    },\n    \"突降幅度判断\": {\n        \"example\": \"单次突降幅度超过12的情况被认为是系统故障。判断是否存在系统故障？\",\n        \"question_type\": \"judgment\"\n    },\n    \"平均值偏离判断\": {\n        \"example\": \"偏离整体平均值超过2倍标准差的数据点被认为是离群值。时间序列中是否存在离群值？\",\n        \"question_type\": \"judgment\"\n    },\n    \"累积超阈值判断\": {\n        \"example\": \"累积超过阈值35的总时长超过10个时间点被认为是长期超负荷。判断是否存在长期超负荷？\ 最佳匹配场景\": {\n    #     \"example\": \"提供了凌晨2:00系统的网络流量数据。分析整体模式和任何异常事件。这种模式最能代表哪种情况？A）计划的数据迁移或系统备份。B）分布式拒绝服务（DDoS）攻击。C）正常的用户增长。D）网络硬件故障。基于您的分析提供推理。\",\n    #     \"question_type\": \"multiple_choice\"\n    # },\n    # \"实际应用中的多趋势模式识别\": {\n    #     \"example\": \"提供了几小时内服务器的CPU利用率数据。分析模式并确定：这种行为最能表明哪种情况？A）关键系统故障。B）服务器在重负载下达到处理能力极限。C）正常的日常周期。D）导致随机尖峰的软件错误。解释您的选择。\",\n    #     \"question_type\": \"multiple_choice\"\n    # },\n    # \"实际应用中上下文的局部特征解释\": {\n    #     \"example\": \"提供了一个月内股票的价格数据。分析时间序列中的任何重要事件或异常。如果您发现与总趋势相反的显著价格移动，最可能的解释是什么？A）趋势的根本性逆转。B）对长期无影响的简短投机事件。C）季节性模式的开始。D）数据报告错误。证明您的选择。\",\n    #     \"question_type\": \"multiple_choice\"\n    # },\n    # \"实际应用中组合特征的最佳匹配场景\": {\n    #     \"example\": \"提供了清晨时间系统的网络流量数据。分析模式并识别任何重要事件。这种模式最能代表哪种情况？A）计划的数据迁移或系统备份。B）分布式拒绝服务（DDoS）攻击。C）正常的用户增长。D）网络硬件故障。提供推理。\",\n    #     \"question_type\": \"multiple_choice\"\n    # },\n\n    # --- 开放式分析问题 ---\n\n    # \"多趋势影响分析\": {\n    #     \"example\": \"提供了患者4小时内的血糖监测数据。分析模式并讨论这种行为对患者健康可能意味着什么。作为医疗保健提供者，您主要关心什么？\",\n    #     \"question_type\": \"open_ended\"\n    # },\n    # \"趋势和局部特征综合\": {\n    #     \"example\": \"提供了网络延迟监测数据。分析整体趋势和任何波动。任何观察到的变化如何影响您对网络稳定性的信心？解释您的分析思路。\",\n    #     \"question_type\": \"open_ended\"\n    # },\n    # \"位置重要性分析\": {\n    #     \"example\": \"提供了一天中电网的输出数据。分析任何重要事件及其时间。为什么任何重大事件的时间对您对电网稳定性的整体评估特别重要？\",\n    #     \"question_type\": \"open_ended\"\n    # },\n    # \"实际应用中的多趋势影响分析\": {\n    #     \"example\": \"提供了患者几小时内的血糖水平监测数据。分析模式并讨论这种行为对患者健康可能意味着什么。医疗保健提供者的主要关注点是什么？\",\n    #     \"question_type\": \"open_ended\"\n    # },\n    # \"实际应用中的趋势和局部特征综合\": {\n    #     \"example\": \"提供了随时间变化的网络延迟监测数据。分析整体模式和任何波动。这些观察如何影响您对网络稳定性的信心？解释您的分析思路。\",\n    #     \"question_type\": \"open_ended\"\n    # },\n    # \"实际应用中的位置重要性分析\": {\n    #     \"example\": \"提供了全天的电网输出数据，重点关注晚间时段。分析数据并解释为什么任何重要事件的时间对评估电网稳定性特别重要。\",\n    #     \"question_type\": \"open_ended\"\n    # }\n}\n\n\ndef generate_prompt_data():\n    # Determine sequence length\n    if SEQ_LEN is None:\n        p = random.random()\n        if p > 0.4:\n            current_seq_len = 256\n        elif p > 0.1 or DISABLE_EXTREME_LENGTHS:\n            current_seq_len = random.randint(64, 1024)\n        elif p > 0.05:\n            current_seq_len = random.randint(5, 64)\n        else:\n            current_seq_len = random.randint(1024, 4096)\n    else:\n        current_seq_len = SEQ_LEN\n\n    # Random choose a category and metric name\n    sample = random.choice(list(metric_config))\n    category = sample['category']\n    metric = random.choice(sample['metrics'])\n    fields = []\n\n    # Choose a metric and generate\n    # Generate attribute_pool and time series\n    if DISABLE_METRIC_CONFIG:\n        attribute_pool = generate_random_attributes(all_attribute_set['overall_attribute'], all_attribute_set['change'], seq_len=current_seq_len)\n    else:\n        attribute_pool = generate_controlled_attributes(metric_to_controlled_attributes(metric), seq_len=current_seq_len)\n\n    attribute_pool['metric_name'] = metric\n    attribute_pool['situation'] = category\n\n    timeseries, attribute_pool = generate_time_series(attribute_pool, current_seq_len)\n\n    # Scalar\n    scaled_timeseries, cur_ts_prompt, _ = timeseries_encoding(timeseries, ENCODING_METHOD)\n\n    # Generate QA\n    instruction = f\"这是一个名为{metric}的指标，来自{category}，长度为{current_seq_len}：{cur_ts_prompt}。\"\n    prompts = []\n    fields = []\n\n    # Generate random task\n    task_candidates = ['reason']\n    tasks = list(np.random.choice(task_candidates, size=1, replace=False))\n    \n    for task in tasks:\n        prompt = f\"我正在为时间序列分析大语言模型创建数据集。基于我提供的时间序列信息，我需要您根据指定的任务要求生成尽可能多的丰富问答对。这将用作大语言模型的训练数据。现在，我有一个来自{category}领域的名为{metric}的时间序列。\"\n\n        if task == 'reason':\n            fields.append({'trend': [0], 'seasonal': [0], 'noise': [0], 'local': [0], 'statistic': [0]})\n            prompt += \"给定时间序列的特征如下：\"\n            prompt += attribute_to_text(\n                timeseries,\n                attribute_pool,\n                include_attributes=['length', 'trend', 'periodicity', 'frequency', 'noise', 'local', 'statistic'],\n                generate_values=False\n            )\n            \n            # Randomly select a named reasoning template.\n            template_name = random.choice(list(REASONING_TEMPLATES.keys()))\n            template_info = REASONING_TEMPLATES[template_name]\n            \n            # The example is a complete, self-contained, high-quality real-world question.\n            example_question = template_info[\"example\"]\n\n            # 这是新部分：高质量问答对示例。\n            example_answer_prompt = \"\"\"\n---\n**示例答案（针对类似问题）：**\n\n**答案示例（是）：**\n观察时间序列数据，我可以识别两个关键组成部分：首先，基线响应时间在整个观察期内显示从约200毫秒到350毫秒的渐进上升趋势，满足'上升'趋势要求。其次，在第210个位置有一个达到950毫秒的突出尖峰，超过了定义中指定的800毫秒阈值。由于两个条件都满足——基线趋势上升且尖峰超过800毫秒。因此，答案应该是：是的，根据给定定义存在关键服务器过载。\n\n**答案示例（否）：**\n观察时间序列数据，我可以识别两个关键组成部分：首先，基线响应时间在整个观察期内保持在250-280毫秒相对稳定，显示'保持稳定'趋势而不是所需的'上升'趋势。其次，虽然在第180个位置有一个达到920毫秒的显著尖峰，但这个尖峰发生在稳定基线期间，而不是在上升趋势期间。由于第一个条件未满足——基线趋势没有按定义要求上升。因此，答案应该是：否，根据给定定义不存在关键服务器过载。\n\n**答案示例（开放式）：**\n\n观察时间序列数据，服务器表现出令人担忧的性能下降模式。基线响应时间显示从约200毫秒到350毫秒的渐进上升趋势，表明系统承受日益增加的压力或资源约束。更关键的是，在第210个位置有一个达到950毫秒的严重尖峰，这代表了基线的近3倍增长。这种模式表明服务器正在接近其容量极限并经历间歇性过载情况。我主要关心的是用户体验下降和潜在的系统不稳定性。我建议立即采取行动，包括：监控资源利用率以识别瓶颈，实施负载均衡或扩展解决方案，以及设置响应时间超过500毫秒的警报以防止未来事故。\\n\\n\"\"\"\n\n            prompt += f\"生成关于推理概念的问答对：**{template_name}**。这里是一个高质量的示例问题：'{example_question}'\"\n            prompt += example_answer_prompt\n            prompt += f\"\"\"\n现在，创建关于给定时间序列的新的、多样化的推理问题。问题必须是自包含的，设置在现实场景中，并为用户做出判断提供所有必要的定义。\n\n**关键要求：**\n1. **问题多样性**：创建具有不同问题格式和表达方式的混合问题。有些是简单问题，有些问题格式不规范。例如，有些问题可能只使用简单词汇，对答案格式没有要求，有些问题应该尽可能详细，对答案提出很多要求。输出列表必须包括**不同问题格式和类型**的问答对。\n2. **自包含且现实**：确保每个问题都设置在真实世界背景下（如IT、金融、电子商务），并清楚定义判断标准（什么构成\"异常\"、\"过载\"等）。对于多选题，提供反映现实场景的**明确选项**。对于开放式问题，确保它们需要深入分析和推理。\n3. **关注核心场景**：问题应主要探索整体趋势（包括多阶段趋势）和局部特征（如尖峰、下降或突然变化）之间的交互。\n4. **要求深度推理**：答案必须遵循上述示例答案中显示的结构化格式：**分析** -> **证据** -> **推理** -> **结论**。它们必须解释结论背后的\"为什么\"，而不仅仅是陈述结论。答案应该丰富详细，提供对时间序列数据的全面分析。\n5. **不同答案的问答对：** 对于是/否问题和多选题，您应该生成具有不同答案的问题和答案，如\"是\"、\"否\"、\"A\"、\"B\"等。对于开放式问题，您应该生成具有不同观点和结论的问题和答案。对于是/否问题，确保您清楚地得出答案并在推理部分末尾明确说明\"是\"或\"否\"。对于多选题，确保答案是选项之一（如\"A\"、\"B\"、\"C\"、\"D\"），并在推理部分末尾清楚说明答案。\n\n**关键：最大化格式多样性**\n创建多样化的问题和答案格式：\n\n**问题风格示例：**\n- \"作为网络安全工程师监控过去6小时的流量数据。公司将'协调攻击'定义为持续15分钟以上、基线以上300的持续流量增长，结合连接超时尖峰。基于这个定义和观察到的数据模式，系统当前是否受到协调攻击？\"\n- \"您正在为一个遇到结账延迟客户投诉的电子商务平台提供咨询。该平台将'关键性能下降'定义为：(1) 响应时间连续5分钟以上超过2秒，且 (2) 基线显示恶化趋势的任何时期。您对当前系统健康状况的专业评估是什么？\"\n\n**答案格式指南**（使用自然语言，不包括这些标签）：\n答案应该**尽可能详细和长**，遵循这种结构：\n[数据的初始观察] → [模式的具体证据] → [技术推理] → [明确结论]\n\n混合自信/不确定语调、定量/定性推理、技术/商业语言、简洁/全面回应。回应应该非常丰富详细，提供对时间序列数据的全面分析。\n\n注意您应该将初始问题和答案**重写**为**具有不同格式、词序和表达的多个问题和答案**！对于是/否问题，确保您清楚地得出答案并在推理部分末尾明确说明\"是\"或\"否\"。对于多选题，确保答案是选项之一（如\"A\"、\"B\"、\"C\"、\"D\"），并在推理部分末尾清楚说明答案。\n\n**注意：** 如果给定的时间序列无法生成目标问答对，只需返回空列表。\\n\\n\"\"\"\n        else:\n            raise ValueError(f\"Unknown task: {task}\")\n\n        prompt += \"\"\"现在，请严格按照上述要求生成尽可能多的问答对（如果可以），并包含答案的参考文本。以JSON格式输出，例如：[{\"question\": \"严格遵循任务问题1\", \"answer\": \"从数据中找到的答案1\", \"reference\": \"答案1的精确原始文本片段\"}, {\"question\": \"严格遵循任务问题2\", \"answer\": \"从数据中找到的答案2\", \"reference\": \"答案2的精确原始文本片段\"}]。答案中包含的属性**必须从**给定的时间序列中找到，答案必须准确。生成的问答对不应重复，答案可以**非常详细**。在问题中**不得**提及具体的时间序列特征（例如，使用\"振幅50的尖峰\"、\"时间序列中的突然增加\"等词语），因为我们会提供这些信息。只使用\"根据时间序列\"或\"根据第50点附近的值\"等词语。\"\"\"\n\n        prompts.append(prompt)\n\n    # Generate final result\n    result = []\n    for prompt, field in zip(prompts, fields):\n        result.append({\n            'instruction': instruction,\n            'prompt': prompt,\n            'fields': field,\n            'timeseries': [scaled_timeseries],\n            'original_timeseries': [timeseries],\n            'metrics': [metric],\n            'attribute_pool': [attribute_pool],\n            'corr_pool': []\n        })\n\n    return result\n\ndef check_answer_consistency(question: str, answer: str) -> str:\n    \"\"\"\n    生成答案一致性检查的提示\n    返回检查提示文本\n    \"\"\"\n    consistency_prompt = f\"\"\"请仔细检查以下问答对中的答案是否存在逻辑矛盾或错误，特别注意数字比较错误。\n\n问题：{question}\n\n答案：{answer}\n\n请检查答案中是否存在以下类型的错误：\n1. **数字比较错误**：例如声称-13 > -10，或者5 < 3等明显错误的数字比较。注意结合语境仔细判断，发现其中的明显错误。\n2. **结论与证据矛盾**：例如证据显示数值超过阈值，但结论说未超过阈值\n\n如果答案中**没有发现**任何逻辑矛盾或明显错误，请回答\"pass\"。\n如果答案中**存在**逻辑矛盾或明显错误，请回答\"fail\"。\n\n只需回答\"pass\"或\"fail\"，不需要其他解释。\"\"\"\n    \n    return consistency_prompt\n\ndef generate_dataset():\n    result = []\n    prompts = []\n    num_cnt = 0\n    with tqdm(total=TOTAL_CNT, desc='生成提示中...') as t:\n        cnt = 0\n        while True:\n            try:\n                cur_data = generate_prompt_data()\n            except ValueError as err:\n                continue\n            except IndexError as err:\n                continue\n            for item in cur_data:\n                item['ts_idx'] = num_cnt\n                result.append(item)\n                prompts.append(item['prompt'])\n                t.update()\n                cnt += 1\n            if cnt >= TOTAL_CNT:\n                break\n            num_cnt += 1\n\n    # Use LLM to generate answer\n    if DRYRUN:\n        llm_answers = ['[{\"question\": \"这是一个测试问题。\", \"answer\": \"这是一个测试答案。\"}]'] * len(prompts)\n        llm_client = None\n    else:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm', batch_size=8)\n        llm_client.wait_for_ready()\n        llm_answers = llm_client.llm_batch_generate(prompts, use_chat_template=True)\n        llm_client.kill()\n\n    # Parse json and collect all QA pairs for consistency check\n    all_qa_pairs = []  # 存储所有解析出的QA对及其索引信息\n    failed_cnt = 0\n    \n    for i in tqdm(range(len(result)), desc='解析中'):\n        try:\n            cur_qa_list = parse_llm_json(llm_answers[i])\n            for j, qa in enumerate(cur_qa_list):\n                if 'question' in qa and 'answer' in qa:\n                    all_qa_pairs.append({\n                        'qa': qa,\n                        'result_idx': i,\n                        'qa_idx': j\n                    })\n                else:\n                    failed_cnt += 1\n        except Exception as err:\n            failed_cnt += 1\n            continue\n    \n    # 批量进行一致性检查\n    consistency_failed_cnt = 0\n    valid_qa_pairs = []\n    \n\n    # Start a new llm_client\n    if not DRYRUN and len(all_qa_pairs) > 0:\n        llm_client = LLMClient(model_path=LOCAL_LLM_PATH, engine='vllm', batch_size=16)\n        # 生成所有一致性检查的提示\n        consistency_prompts = []\n        for qa_pair in all_qa_pairs:\n            consistency_prompt = check_answer_consistency(qa_pair['qa']['question'], qa_pair['qa']['answer'])\n            consistency_prompts.append(consistency_prompt)\n        \n        # 批量调用LLM进行一致性检查\n        try:\n            consistency_results = llm_client.llm_batch_generate(consistency_prompts, use_chat_template=True)\n            \n            # 处理一致性检查结果\n            for i, qa_pair in enumerate(all_qa_pairs):\n                try:\n                    result_text = consistency_results[i].strip().lower()\n                    is_consistent = \"pass\" in result_text and \"fail\" not in result_text\n                    \n                    if is_consistent:\n                        valid_qa_pairs.append(qa_pair)\n                    else:\n                        consistency_failed_cnt += 1\n                        logger.warning(f\"答案存在逻辑矛盾，已删除 - 问题: {qa_pair['qa']['question'][:100]}... 答案: {qa_pair['qa']['answer'][:200]}...\")\n                except Exception as e:\n                    logger.warning(f\"处理一致性检查结果时出错: {e}, 默认通过\")\n                    valid_qa_pairs.append(qa_pair)  # 出错时默认通过\n                    \n        except Exception as e:\n            logger.warning(f\"批量一致性检验过程中出现错误: {e}, 跳过一致性检查\")\n            valid_qa_pairs = all_qa_pairs  # 出错时使用所有QA对\n    else:\n        # DRYRUN模式或没有LLM客户端时，直接使用所有QA对\n        valid_qa_pairs = all_qa_pairs\n\n    # 构建最终的数据集\n    dataset = []\n    labels = []\n    \n    for qa_pair in valid_qa_pairs:\n        qa = qa_pair['qa']\n        result_idx = qa_pair['result_idx']\n        \n        dataset.append({\n            'input': result[result_idx]['instruction'] + qa['question'],\n            'output': qa['answer'],\n            'timeseries': timeseries_to_list(result[result_idx]['timeseries'])\n        })\n        labels.append({\n            'instruction': result[result_idx]['instruction'],\n            'question': qa['question'],\n            'fields': result[result_idx]['fields'],\n            'ts_idx': result[result_idx]['ts_idx'],\n            'metrics': result[result_idx]['metrics'],\n            'corr_pool': result[result_idx]['corr_pool'],\n            'attribute_pool': result[result_idx]['attribute_pool']\n        })\n    \n    # 关闭LLM客户端\n    if llm_client is not None:\n        llm_client.kill()\n        \n    print(f\"解析完成。解析失败次数：{failed_cnt}，一致性检验失败次数：{consistency_failed_cnt}，最终成功次数：{len(dataset)}。\")\n\n    return dataset, labels\n\n\nif __name__ == '__main__':\n    # Create output directory if not exists\n    os.makedirs(os.path.dirname(OUTPUT_DATASET), exist_ok=True)\n    os.makedirs(os.path.dirname(OUTPUT_LABEL), exist_ok=True)\n\n    result, labels = generate_dataset()\n    with open(OUTPUT_DATASET, 'wt') as f:\n        for item in result:\n            f.write(json.dumps(item, ensure_ascii=False) + '\\n')\n\n    with open(OUTPUT_LABEL, 'wt') as f:\n        json.dump(labels, f, ensure_ascii=False, indent=4)\n\n    print(f\"完成！已保存到 {OUTPUT_DATASET} 和 {OUTPUT_LABEL}。\")\n", "blocks": []}, {"path": "chatts/sft/utils/evol_attributes.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nfrom chatts.ts_generator.generate import attribute_to_text\nimport numpy as np\n\nfrom typing import *\n\n\ndef trend_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], *kargs):\n    result = 'The trend information of some time series are as follows: '\n    \n    for i in idx:\n        result += f\"In {metrics[i]}, \" + attribute_to_text(timeseries[i], attribute_pool[i], generate_values=False, include_attributes=['trend']).rstrip().rstrip('.') + '; '\n    result = result[:-1]\n\n    return result\n\ndef seasonal_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], *kargs):\n    result = 'The seasonal information of some time series are as follows: '\n    \n    for i in idx:\n        result += f\"In {metrics[i]}, \" + attribute_to_text(timeseries[i], attribute_pool[i], generate_values=False, include_attributes=['periodicity', 'frequency']).rstrip().rstrip('.') + '; '\n    result = result[:-1]\n\n    return result\n\ndef noise_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], *kargs):\n    result = 'The noise information of some time series are as follows: '\n    \n    for i in idx:\n        result += f\"In {metrics[i]}, \" + attribute_to_text(timeseries[i], attribute_pool[i], generate_values=False, include_attributes=['noise']).rstrip().rstrip('.') + '; '\n    result = result[:-1]\n\n    return result\n\ndef local_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], *kargs):\n    result = 'The local change information of some time series are as follows: '\n    \n    for i in idx:\n        result += f\"\\n - In {metrics[i]}: \" + attribute_to_text(timeseries[i], attribute_pool[i], generate_values=False, include_attributes=['local']).rstrip().rstrip('.')\n\n    return result\n\ndef statistic_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], *kargs):\n    result = 'The statistic information of some time series are as follows: '\n    \n    for i in idx:\n        cur_mean = round(float(attribute_pool[i]['statistics']['mean']), 2)\n        cur_min = round(float(np.min(attribute_pool[i]['statistics']['max'])), 2)\n        cur_max = round(float(np.max(attribute_pool[i]['statistics']['min'])), 2)\n        cur_min_pos = attribute_pool[i]['statistics']['min_pos']\n        cur_max_pos = attribute_pool[i]['statistics']['max_pos']\n        \n        result += f\"In {metrics[i]}, the mean value is {cur_mean}, the minimum value is {cur_min} (around point {cur_min_pos}), and the maximum value is {cur_max} (around point {cur_max_pos}); \"\n    result = result[:-1]\n\n    return result\n\ndef correlation_attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], idx: List[int], corr_pool: List[Tuple[List[int], str]], *kargs):\n    result = f'The correlation information of some time series are as follows: '\n    corr_attribute_pool = []\n    for i in idx:\n        if i >= len(corr_pool):\n            break\n        if corr_pool[i] is None:\n            continue\n        corr_attribute_pool.append(\" - \" + corr_pool[i][1])\n    result += '\\n'.join(corr_attribute_pool)\n    return result\n\ndef attribute_prompt(timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], required_fields: Dict[str, List[int]], corr_pool: List[Tuple[List[int], str]]):\n    cur_func_dict = {\n        'trend': trend_attribute_prompt,\n        'seasonal': seasonal_attribute_prompt,\n        'noise': noise_attribute_prompt,\n        'local': local_attribute_prompt,\n        'statistic': statistic_attribute_prompt,\n        'correlation': correlation_attribute_prompt,\n    }\n    \n    result = f'There are {len(timeseries)} timeseries with length of {len(timeseries[0])}: '\n    \n    for i in range(len(timeseries)):\n        result += f\"the {i + 1}-th timeseries is {metrics[i]}; \"\n    result = result[:-2] + '.\\n'\n    \n    for field, idx in required_fields.items():\n        if field == 'correlation':\n            result += cur_func_dict[field](timeseries, attribute_pool, metrics, idx, corr_pool) + '\\n'\n        else:\n            result += cur_func_dict[field](timeseries, attribute_pool, metrics, idx) + '\\n'\n\n    return result\n", "blocks": []}, {"path": "chatts/sft/utils/evol_prompt.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport json\n\nfrom chatts.sft.utils.evol_attributes import attribute_prompt\nfrom typing import *\n\n\ndepth_instruction = \"\"\"You will act as a Q&A Rewriter for a time series question-answering system.\n\nObjective: Rewrite the provided Q&A to increase complexity and nuance, creating a challenge for advanced AI systems by using CONTEXT information related to the time series. The rewritten Q&A should remain logical, understandable, and respondable by humans.\n\nInstructions:\n- **Time Series Attributes**: Only use information from CONTEXT; do not invent additional details outside of this context.\n- **Non-Text Elements**: Retain any non-text parts in #The Given Q&A#, including tables, charts, or code.\n- **Input Integrity**: Ensure all inputs from #The Given Q&A# are included in the rewrite.\n\nYou SHOULD add complexity by:\n{} \nLimit additional words in #Generated Q&A# to 10-20 beyond #The Given Q&A#.\nDo not use terms like '#The Given Q&A#', '#Generated Q&A#', 'given q&a', or 'rewritten q&a' in #Generated Q&A#.\"\"\"\n\n\nbreadth_instruction = \"\"\"You will act as a Q&A Creator for a time series question-answering system.\n\nObjective: Create a new Q&A inspired by #Given Q&A#, aligning with the CONTEXT section. This new Q&A should explore the same domain but focus on a rarer, distinctive aspect within that context.\n\nInstructions:\n- **Time Series Attributes**: Reference only CONTEXT attributes; avoid adding details not explicitly provided.\n- **Domain Consistency with Rarity**: Keep the new Q&A in the same domain, but make it unique by focusing on rare scenarios, events, or relationships.\n\nYou SHOULD create the Q&A by:\n{} \nThe #Generated Q&A# must be reasonable and human-readable.\nDo not use terms like '#Given Q&A#', '#Generated Q&A#', 'given q&a', or 'created q&a' in #Generated Q&A#.\"\"\"\n\nconstraints_instruction = \"\"\"\n- **Logical Consistency**: Ensure the answer logically follows the question and aligns with CONTEXT.\n- **No time series details in Questions**: In the questions, use general language about the time series without mentioning specific attributes (e.g., avoid specifics like \"noise of 0.5\" or \"spike near position 100\"). Specific details can **only** appear in the answer, drawing directly from CONTEXT.\n- **Cross-Verification**: Verify all details against CONTEXT to ensure accuracy.\n- **No New Features or Names**: Use only attributes and names defined in CONTEXT.\n- **One Question, One Answer**: Limit to a single question and answer; keep it clear and concise.\n- **Unit and Start Information**: If specific time series units or starting values are provided, ensure the question includes this information (e.g., unit is days, start time is October 1, 2024, at 15:00).\n- **Output Format**: Respond in JSON only: {\"question\": \"your question (strictly following the format in the question format)\", \"answer\": \"your answer\"}. Do not include task labels like '#Given Q&A#' or '#Generated Q&A#'.\"\"\"\n\n\ncomparison_instruction = \"\"\"Here are two Instructions to ChatGPT AI, do you think they are equal to each other, which meet any one of the following requirements:\n    1. Their questions and answers are almost the same, with only minor modification in terms of the order of the sequences.\n    2. The second QA is an simple and obvious inference from the first QA\n    3. No difference between the breadths or depths of the two QAs\n\nIf you think they are equal, then just answer Equal.\nIf they are not equal, then do you think it is a valid Q&A that meets all of the below requirements:\n    1. All information about the time series in the **second** Q&A can be sourced from the CONTEXT section and not generated without CONTEXT.\n    2. The question should not reveal specific time series attributes (e.g., avoid terms like \"noise of 0.5\" or \"spike near position 100\"), as these details are intended to appear **only** in the answer based on CONTEXT.\n\n\nThe First Q&A: <Here is first instruction.>\nThe Second Q&A: <Here is second instruction.>\n\nYour Judgement (Just answer: Equal/Invalid/Valid. No need to explain the reason.):\"\"\"\n\n\ndef createSituationPrompt():\n    prompt = breadth_instruction.format(\"\"\"Based on the time series data in CONTEXT, create a virtual scenario with:\n\nReal-World Context: Set a realistic scenario (e.g., specific industry, system, environment) relevant to the time series data.\nDetailed Questions: Generate questions (multiple-choice or Q&A) about one of the timeseries or compare many of them.\n                                        \nRequirements:\nOnly use time series attributes provided in CONTEXT.\nMake questions concrete and specific to the scenario.\nOutput Format: JSON only: {\"question\": \"your question\", \"answer\": \"your answer\"}\n\nExamples:\nE-commerce Holiday Sales:\nQuestion: \"The sales data starts from June 7th, and each point represent a day. A E-commerce Holiday Sales is happend every year. During this time, the sales will be higher than the normal times. How many holiday sales peaks are present?\"\nAnswer: \"In the timeseries, I've found 3 upward spikes compared to the original timeseries. Therefore, the time series shows 3 additional peaks in May, November, and December.\"\nManufacturing Plant Energy Usage:\nQuestion: \"The energy usage data starts from Jan 1, and each point is a day. During this period, energy saving may conduct in some of the days, when the energy consumption may drop. In the time series, on how many days did energy consumption drop by over 20%?\"\nAnswer: \"In the timeseries, I've found that there are lower values near point xxx, xxx, xxx. Therefore, Energy consumption decreased by over 20% on 5 days: January 15, February 20, March 5, April 18, and May 12.\"\n\"\"\")\n    question_format = \"The question format: a description of the current situation (the generated virtual scenario, like a event or holiday or some special things, etc), specifying its unit and start point (e.g. The energy usage data starts from Jan 1, and each point is a day), along with background context relevant to the question (some special settings in your virtual scenario, like there are sales / holiday / weekends, etc), as shown in the example. Finally, the question should directly relate to the timeseries, and all elements must be included exactly as instructed, with no omissions or deviations. The question could be a multiple-choice question (preferred), or just a general q&a question with detailed explaination. \"\n    return prompt, question_format\n\ndef createDeductivePrompt():\n    prompt = breadth_instruction.format(\"\"\"\n\"\"\")\n    question_format = \"\"\"\"\"\"\n    return prompt, question_format\n\ndef createConstraintsPrompt():\n    prompt = depth_instruction.format(\"Please add one more constraints/requirements into #The Given Q&A# according to the time series attributes provided in CONTEXT.\")\n    question_format = \"The question format should be like: Your generated condition, the question about timeseries.\"\n    return prompt, question_format\n\ndef createDeepenPrompt():\n    prompt = depth_instruction.format(\n        \"If #The Given Q&A# contains inquiries about certain issues, the depth and breadth of the inquiry can be increased.\")\n    question_format = \"The question format should be similar with the given qa, but the depth and breadth of the inquiry can be increased.\"\n    return prompt, question_format\n\ndef createConcretizingPrompt():\n    prompt = depth_instruction.format(\"Please replace general concepts with more specific concepts.\")\n    question_format = \"The question format should be similar with the given qa, but should replace general concepts with more specific concepts.\"\n    return prompt, question_format\n\ndef createComplexReasoningPrompt():\n    prompt = breadth_instruction.format(\n        \"If #The Given Q&A# can be solved with just a few simple thinking processes, you can rewrite it to explicitly request multiple-step reasoning.\")\n    question_format = \"The question format should be like a hard math problem or other complex reasoning problem, which may be different from the original Q&A. \"\n    return prompt, question_format\n\ndef createDeductiveReasoningPrompt():\n    prompt = \"\"\"\nBased on the time series in CONTEXT, create deductive reasoning Q&A. Each question includes a condition and asks if the behavior aligns with it. Use Yes/No format and provide reasoning.\n\nKey Points:\n- Conditions can be rules (e.g., thresholds), contexts, or patterns.\n- Avoid specific details from the time series (e.g., \"spike at point X\").\n- Provide both positive (Yes) and negative (No) examples.\n\nExample:\nQuestion: If CPU usage above 50 is abnormal, should the current usage be treated as abnormal?\nAnswer: No, because the usage did not exceed the threshold of 50.\n\"\"\"\n    question_format = \"\"\"\n- Yes/No question based on a condition.\n- Avoid specific time series details.\n- Answer starts with Yes/No, followed by reasoning.\n\"\"\"\n    return prompt, question_format\n\ndef createCausalReasoningPrompt():\n    prompt = \"\"\"\nCreate causal reasoning Q&A for time series. Questions prompt the model to infer causes or effects using multiple-choice answers.\n\nKey Points:\n- Categories: Cause Identification, Effect Prediction, Anomaly Explanation, Temporal Correlation.\n- Avoid specific details from the time series (e.g., \"spike at point X\").\n- Include detailed reasoning for the answers.\n\nExample:\nQuestion: What likely caused the observed pattern? Choose from: load increase, maintenance, stable operations.\nAnswer: Load increase. The spikes suggest unexpected surges in system load.\n\"\"\"\n    question_format = \"\"\"\n- Multiple-choice question about causes or effects.\n- Categories: Cause Identification, Effect Prediction, Anomaly Explanation, Temporal Correlation.\n- Answer includes choice and reasoning.\n\"\"\"\n    return prompt, question_format\n\ndef createComparisonEliminatorPrompt(before, after):\n    prompt = comparison_instruction\n    prompt = prompt.replace(\"<Here is first instruction.>\", before)\n    prompt = prompt.replace(\"<Here is second instruction.>\", after)\n    return prompt\n\n\nclass EvolPrompt:\n    def __init__(self, ts_idx: int, seed_q: str, seed_a: str, seed_fields: Dict[str, List[int]], instruction: str, timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], corr_pool: List[Tuple[List[int], str]]):\n        self.ts_idx = ts_idx\n        self.timeseries = timeseries\n        self.description = attribute_pool\n        self.instruction = instruction\n        self.metrics = metrics\n        self.corr_pool = corr_pool\n\n        self.all_fields = {\"trend\": range(len(timeseries)), \"seasonal\": range(len(timeseries)), \"noise\": range(len(timeseries)), \"local\": range(len(timeseries)), \"statistic\": range(len(timeseries)), \"correlation\": range(len(corr_pool))}\n        self.fields = seed_fields\n        self.qa_history = [(seed_q, seed_a)]\n\n    def evol(self):\n        # Get diff between fields and seed_fields\n        diff_fields = {}\n        for field in self.all_fields:\n            if field not in self.fields:\n                if len(self.all_fields[field]) > 0:\n                    diff_fields[field] = self.all_fields[field]\n            elif len(set(self.all_fields[field]) - set(self.fields[field])) > 0:\n                diff_fields[field] = list(set(self.all_fields[field]) - set(self.fields[field]))\n        \n        # Random choose a field not in self.fields and add it\n        if len(diff_fields) > 0:\n            field = np.random.choice(list(diff_fields.keys()))\n            self.fields.setdefault(field, [])\n            self.fields[field].append(np.random.choice(diff_fields[field]))\n    \n    def push(self, q: str, a: str):\n        self.qa_history.append((q, a))\n        if len(self.qa_history) > 2:\n            self.qa_history.pop(0)\n\n    def generate_prompt(self):\n        # Randomly choose a prompt\n        all_prompts = [createSituationPrompt, createConstraintsPrompt, createDeepenPrompt, createConcretizingPrompt, createComplexReasoningPrompt, createDeductiveReasoningPrompt, createCausalReasoningPrompt]\n        prompt, question_format = np.random.choice(all_prompts)()\n        given_qa = json.dumps({\n            'question': self.qa_history[-1][0],\n            'answer': self.qa_history[-1][1]\n        })\n\n        result = f\"\"\"{prompt}\n\n        #Context#\n        {attribute_prompt(self.timeseries, self.description, self.metrics, self.fields, self.corr_pool)}\n\n        #Contraints#\n        {constraints_instruction}\n\n        #The Given Q&A#\n        {given_qa}\n\n        #Question Format#\n        {question_format}\n\n        #Generated Q&A#:\"\"\"\n\n        return result\n    \n    def generate_comparison_prompt(self, q: str, a: str):\n        given_qa = json.dumps({\n            'question': self.qa_history[-1][0],\n            'answer': self.qa_history[-1][1]\n        })\n\n        generated_qa = json.dumps({\n            'question': q,\n            'answer': a\n        })\n\n        result = f\"\"\"#Context#\n        {attribute_prompt(self.timeseries, self.description, self.metrics, self.fields, self.corr_pool)}\n\n        #Your Task#\n        {createComparisonEliminatorPrompt(given_qa, generated_qa)}\"\"\"\n\n        return result\n\n    def to_dataset(self):\n        return {\n            \"input\": self.instruction + ' ' + self.qa_history[-1][0],\n            \"output\": self.qa_history[-1][1],\n            \"timeseries\": self.timeseries.tolist() if type(self.timeseries) == np.ndarray else self.timeseries,\n            \"ts_idx\": self.ts_idx,\n            \"fields\": sorted(self.fields)\n        }\n", "blocks": []}, {"path": "chatts/sft/utils/rewrite_prompt.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport json\n\nfrom chatts.sft.utils.evol_attributes import attribute_prompt\nfrom typing import *\n\n\nrewrite_instruction = \"\"\"You will act as a Q&A Rewriter for a time series question-answering system.\n\nObjective: Rewrite the provided Q&A using the specified rewrite method while maintaining the core meaning and accuracy. The rewritten Q&A should remain logical, understandable, and aligned with the CONTEXT information.\n\nInstructions:\n- **Time Series Attributes**: Only use information from CONTEXT; do not invent additional details outside of this context.\n- **Non-Text Elements**: Retain any non-text parts in #The Given Q&A#, including tables, charts, or code.\n- **Content Integrity**: Ensure all essential information from #The Given Q&A# is preserved in the rewrite.\n\nYou SHOULD rewrite the Q&A by:\n{} \nThe #Generated Q&A# must be reasonable and human-readable.\nDo not use terms like '#The Given Q&A#', '#Generated Q&A#', 'given q&a', or 'rewritten q&a' in #Generated Q&A#.\"\"\"\n\nconstraints_instruction = \"\"\"\n- **Logical Consistency**: Ensure the answer logically follows the question and aligns with CONTEXT.\n- **No time series details in Questions**: In the questions, use general language about the time series without mentioning specific features (e.g., avoid specifics like \"noise of 0.5\" or \"spike near position 100\"). Specific details can **only** appear in the answer, drawing directly from CONTEXT.\n- **Cross-Verification**: Verify all details against CONTEXT to ensure accuracy.\n- **No New Features or Names**: Use only features and names defined in CONTEXT.\n- **Unit and Start Information**: If specific time series units or starting values are provided, ensure the question includes this information (e.g., unit is days, start time is October 1, 2024, at 15:00).\n- **Preserve Core Meaning**: The rewritten Q&A must maintain the essential meaning and information of the original Q&A.\n- **Output Format**: Respond in JSON only: {\"question\": \"your rewritten question\", \"answer\": \"your rewritten answer\"}. Do not include task labels like '#Given Q&A#' or '#Generated Q&A#'.\n- **No Additional Prompts in Question**: **Do not** use words like \"Please justify your answer\", \"Please analyze step by step\", \"Please give the answer by analyzing the trend of the time series\", \"Please provide detailed analysis\", etc in the question. The question should be straightforward and **not** include any additional prompts or instructions.\"\"\"\n\n\ncomparison_instruction = \"\"\"Here are two Q&A pairs, please evaluate if the second Q&A is a valid rewrite of the first Q&A.\n\nA valid rewrite should meet the following requirements:\n    1. All information about the time series in the **second** Q&A can be sourced from the CONTEXT section and not generated without CONTEXT.\n    2. The question itself should not reveal any time series features. Avoid terms like noise of 0.5/spike near position 100/given the downward spike/etc **in the question** (but it can be in the answer), as these details are intended to appear **only** in the answer based on CONTEXT.\n    3. The core meaning and essential information from the first Q&A should be preserved in the second Q&A.\n    4. The second Q&A **should not** containing any additional prompts or instructions in the last part of the question, such as \"Please justify your answer\", \"Please analyze step by step\", or \"Please give the answer by analyzing the trend of the time series\", \"please provide detailed analysis\". The question should be straightforward and not include any additional prompts or instructions.\n\nThe First Q&A: <Here is first instruction.>\nThe Second Q&A: <Here is second instruction.>\n\nYour Judgement (Just answer: Invalid(out of context)/Invalid(reveal information)/Invalid(meaning changed)/Invalid(additional prompt)/Valid. No need to explain the reason.):\"\"\"\n\n\ndef createWordOrderPrompt():\n    prompt = rewrite_instruction.format(\"Rearrange the word order and sentence structure of both the question and answer while maintaining the original meaning. Change the sequence of phrases, clauses, or sentences to create a different flow. The answer should be in detail, in a step-by-step manner.\")\n    question_format = \"The question format should maintain the same information but with rearranged word order and sentence structure.\"\n    return prompt, question_format\n\ndef createExpansionPrompt():\n    prompt = rewrite_instruction.format(\"Expand the given Q&A by adding more detailed descriptions, explanations, and context. Provide richer background information and more comprehensive answers based on the CONTEXT provided. The answer should be in very detail, in a step-by-step manner.\")\n    question_format = \"The question format should be expanded with more detailed descriptions and context while keeping the core question intact.\"\n    return prompt, question_format\n\ndef createCompressionPrompt():\n    prompt = rewrite_instruction.format(\"Simplify and compress ONLY the question to simulate a user who is not skilled in prompt engineering. Make the question more concise and straightforward. IMPORTANT: Keep the answer unchanged - only compress the question. The answer should be in very detail, in a step-by-step manner.\")\n    question_format = \"The question format should be simplified and compressed, using simpler language and shorter sentences, as if written by someone not skilled in prompt engineering.\"\n    return prompt, question_format\n\ndef createTranslationPrompt():\n    prompt = rewrite_instruction.format(\"Translate both the question and answer. If the current language is English, translate to Chinese. If the current language is Chinese, then keep it as Chinese but do some changes in its order. Maintain the technical accuracy and meaning. The answer should be in very detail in Chinese, in a step-by-step manner, from reasoning to answer.\")\n    question_format = \"The question format should be translated to the target language while preserving all technical details and meaning.\"\n    return prompt, question_format\n\ndef createScenarioPrompt():\n    prompt = rewrite_instruction.format(\"Change the scenario/context of the Q&A while keeping the time series analysis content the same. For example, if the current scenario is IT operations, change it to manufacturing, finance, healthcare, or any other domain that fits the time series data in CONTEXT. The answer should be in detail, in a step-by-step manner.\")\n    question_format = \"The question format should present the same time series analysis in a different real-world scenario or domain context.\"\n    return prompt, question_format\n\ndef createComparisonEliminatorPrompt(before, after):\n    prompt = comparison_instruction\n    prompt = prompt.replace(\"<Here is first instruction.>\", before)\n    prompt = prompt.replace(\"<Here is second instruction.>\", after)\n    return prompt\n\n\nclass RewritePrompt:\n    def __init__(self, ts_idx: int, seed_q: str, seed_a: str, seed_fields: Dict[str, List[int]], instruction: str, timeseries: np.ndarray, attribute_pool: List[dict], metrics: List[str], corr_pool: List[Tuple[List[int], str]]):\n        self.ts_idx = ts_idx\n        self.timeseries = timeseries\n        self.description = attribute_pool\n        self.instruction = instruction\n        self.metrics = metrics\n        self.corr_pool = corr_pool\n\n        self.all_fields = {\"trend\": range(len(timeseries)), \"seasonal\": range(len(timeseries)), \"noise\": range(len(timeseries)), \"local\": range(len(timeseries)), \"statistic\": range(len(timeseries)), \"correlation\": range(len(corr_pool))}\n        self.fields = seed_fields\n        self.qa_history = [(seed_q, seed_a)]\n\n    def rewrite(self):\n        # For rewrite functionality, we don't need to evolve fields\n        # We keep the existing fields as they are\n        pass\n    \n    def push(self, q: str, a: str):\n        self.qa_history.append((q, a))\n        if len(self.qa_history) > 2:\n            self.qa_history.pop(0)\n\n    def generate_prompt(self):\n        # Randomly choose a rewrite method\n        all_prompts = [createWordOrderPrompt, createExpansionPrompt, createCompressionPrompt, createTranslationPrompt, createScenarioPrompt]\n        random_p = [0.1, 0.1, 0.2, 0.5, 0.1]\n        prompt, question_format = np.random.choice(all_prompts, p=random_p)()\n        given_qa = json.dumps({\n            'question': self.qa_history[-1][0],\n            'answer': self.qa_history[-1][1]\n        })\n\n        result = f\"\"\"{prompt}\n\n        #Context#\n        {attribute_prompt(self.timeseries, self.description, self.metrics, self.fields, self.corr_pool)}\n\n        #Constraints#\n        {constraints_instruction}\n\n        #The Given Q&A#\n        {given_qa}\n\n        #Question Format#\n        {question_format}\n\n        #Generated Q&A#:\"\"\"\n\n        return result\n    \n    def generate_comparison_prompt(self, q: str, a: str):\n        given_qa = json.dumps({\n            'question': self.qa_history[-1][0],\n            'answer': self.qa_history[-1][1]\n        })\n\n        generated_qa = json.dumps({\n            'question': q,\n            'answer': a\n        })\n\n        result = f\"\"\"#Context#\n        {attribute_prompt(self.timeseries, self.description, self.metrics, self.fields, self.corr_pool)}\n\n        #Your Task#\n        {createComparisonEliminatorPrompt(given_qa, generated_qa)}\"\"\"\n\n        return result\n\n    def to_dataset(self):\n        return {\n            \"input\": self.instruction + ' ' + self.qa_history[-1][0],\n            \"output\": self.qa_history[-1][1],\n            \"timeseries\": self.timeseries.tolist() if type(self.timeseries) == np.ndarray else self.timeseries,\n            \"ts_idx\": self.ts_idx,\n            \"fields\": sorted(self.fields)\n        }\n", "blocks": []}, {"path": "chatts/ts_generator/change_utils.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2025 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\n\n\ndef generate_ts_change(length: int, amplitude: float, add_random_noise: bool=True):\n    x = np.arange(length) / length\n    func = random.choice([\n        lambda x: x ** 2,\n        lambda x: np.sin(x * np.pi / 2),\n        lambda x: x,\n        lambda x: 1.0 - (1.0 - x) ** 2\n    ])\n    cur_value = func(x)\n\n    if add_random_noise:\n        # Randomly add noise\n        if random.random() > 0.8 and length > 3:\n            cur_value += np.random.uniform(-1.0, 1.0, length) * np.random.uniform(0.1, 0.3)\n\n    cur_value = cur_value / (cur_value.max() - cur_value.min() + 1e-7) * amplitude\n\n    return cur_value\n\ndef generate_spike(amplitude: float, max_length: int=None):\n    assert max_length is None or max_length >= 2\n    while True:\n        rise_length = np.random.choice([1, 2, 3], p = [0.96, 0.03, 0.01])\n        fall_length = np.random.choice([1, 2, 3], p = [0.96, 0.03, 0.01])\n        peak_length = np.random.choice([0, 1, 2], p = [0.99, 0.005, 0.005])\n\n        if max_length is None or (rise_length + fall_length + peak_length) <= max_length:\n            break\n\n    result = np.zeros(rise_length + fall_length + peak_length, dtype=np.float32)\n    result[:rise_length] += generate_ts_change(rise_length, amplitude)\n    result[rise_length:] += amplitude\n    result[rise_length + peak_length:] += generate_ts_change(fall_length, -amplitude)\n    \n    return result\n", "blocks": []}, {"path": "chatts/ts_generator/generate.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nfrom typing import *\nfrom chatts.ts_generator.trend_utils import generate_random_points, generate_trend_prompt, generate_trend_curve, generate_trend_list\nfrom chatts.ts_generator.local_changes import generate_local_chars\nfrom chatts.ts_generator.change_utils import generate_ts_change\nimport yaml\n\n\n# Config\nENABLE_MULTIPLE_TREND = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"enable_multiple_trend\"]  # Enable or disable multiple trend types\nENABLE_MULTIPLE_SEASONAL = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"enable_multiple_seasonal\"]  # Enable or disable multiple seasonal types\nENABLE_MULTIPLE_NOISE = yaml.safe_load(open(\"config/datagen_config.yaml\"))[\"enable_multiple_noise\"]  # Enable or disable multiple noise types\n\n# All Config for TS Attributes\n# Notes\n# 1. Seaonal and Frequency can be combined (e.g., high frequency-sin periodic fluctuation, so there should be 7 types of seasonal attributes)\n# 2. We implemented 2 types of noise types (e.g., random noise, sin noise), see the codes below for more information\n# 3. The value following the overall attribute is the probability of the attribute to be selected\n# All Attribute Set\nall_attribute_set = {\n    \"overall_attribute\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 0.7,\n            \"sin periodic fluctuation\": 0.25,\n            \"square periodic fluctuation\": 0.02,\n            \"triangle periodic fluctuation\": 0.03\n        },\n        \"trend\": {\n            \"decrease\": 0.3,\n            \"increase\": 0.3,\n            \"keep steady\": 0.3,\n            \"multiple\": 0.1\n        },\n        \"frequency\": {\n            \"high frequency\": 0.5,\n            \"low frequency\": 0.5\n        },\n        \"noise\": {\n            \"noisy\": 0.2,\n            \"almost no noise\": 0.8\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 12,\n        \"downward spike\": 10,\n        \"continuous upward spike\": 3,\n        \"continuous downward spike\": 3,\n        \"upward convex\": 2,\n        \"downward convex\": 2,\n        \"sudden increase\": 10,\n        \"sudden decrease\": 10,\n        \"rapid rise followed by slow decline\": 2,\n        \"slow rise followed by rapid decline\": 2,\n        \"rapid decline followed by slow rise\": 2,\n        \"slow decline followed by rapid rise\": 2,\n        \"decrease after upward spike\": 1,\n        \"increase after downward spike\": 1,\n        \"increase after upward spike\": 1,\n        \"decrease after downward spike\": 1,\n        \"wide upward spike\": 2,\n        \"wide downward spike\": 2\n    }\n}\n\n\ndef _clamp_raw_point(point: int, seq_len: int) -> int:\n    return max(0, min(int(point), seq_len - 1))\n\n\ndef _inclusive_segment_end(exclusive_end: int, seq_len: int) -> int:\n    return _clamp_raw_point(int(exclusive_end) - 1, seq_len)\n\n\ndef generate_random_attributes(overall_attribute: Dict[str, Dict[str, float]] = all_attribute_set[\"overall_attribute\"], change_attribute: Dict[str, float] = all_attribute_set[\"change\"], change_positions: Optional[List[Tuple[Optional[int], Optional[float]]]] = None, seq_len: int = 512):\n    if change_positions is None:\n        change_positions = [(None, None) for _ in range(random.randint(0, 3))]\n    attribute_pool = {}\n\n    if seq_len >= 24:\n        attribute_pool[\"seasonal\"] = {\n            \"type\": np.random.choice(list(overall_attribute['seasonal']), p=np.array(list(overall_attribute['seasonal'].values()))/sum(list(overall_attribute['seasonal'].values())))\n        }\n    else:\n        # The length is too short, we can only use no periodic fluctuation\n        attribute_pool[\"seasonal\"] = {\n            \"type\": \"no periodic fluctuation\"\n        }\n\n    trend_candidates = overall_attribute['trend'].copy()\n    if not ENABLE_MULTIPLE_TREND and \"multiple\" in trend_candidates:\n        trend_candidates.pop(\"multiple\")\n    trend_char = np.random.choice(list(trend_candidates), p=np.array(list(trend_candidates.values()))/sum(list(trend_candidates.values())))\n    \n    attribute_pool[\"trend\"] = {\n        \"type\": trend_char\n    }\n\n    num_local_chars = len(change_positions)\n\n    # If the length is too short (<=64 and the trend is multiple, we should omit some types of local changes)\n    if seq_len <= 64 and trend_char == \"multiple\":\n        change_attribute = change_attribute.copy()\n        change_attribute.pop(\"upward convex\", None)\n        change_attribute.pop(\"downward convex\", None)\n        change_attribute.pop(\"rapid rise followed by slow decline\", None)\n        change_attribute.pop(\"slow rise followed by rapid decline\", None)\n        change_attribute.pop(\"rapid decline followed by slow rise\", None)\n        change_attribute.pop(\"slow decline followed by rapid rise\", None)\n        change_attribute.pop(\"decrease after upward spike\", None)\n        change_attribute.pop(\"increase after downward spike\", None)\n        change_attribute.pop(\"increase after upward spike\", None)\n        change_attribute.pop(\"decrease after downward spike\", None)\n        change_attribute.pop(\"wide upward spike\", None)\n        change_attribute.pop(\"wide downward spike\", None)\n    if seq_len <= 8:\n        change_attribute.pop(\"shake\", None)\n        change_attribute.pop(\"sudden increase\", None)\n        change_attribute.pop(\"sudden decrease\", None)\n\n    local_chars = list(np.random.choice(list(change_attribute), size=num_local_chars, p=np.array(list(change_attribute.values()))/sum(list(change_attribute.values()))))\n    \n    attribute_pool[\"local\"] = []\n    for char in local_chars:\n        local_position, local_amplitude = change_positions.pop()\n        attribute_pool[\"local\"].append({\n            \"type\": char,\n            \"position_start\": local_position,\n            \"amplitude\": local_amplitude\n        })\n\n    if 'no periodic fluctuation' not in attribute_pool[\"seasonal\"]['type'] and seq_len >= 24:\n        # If the seq_len is too short (<64, we can only use low frequency)\n        if seq_len <= 64:\n            attribute_pool[\"frequency\"] = {'type': 'low frequency'}\n        else:\n            attribute_pool[\"frequency\"] = {'type': np.random.choice(list(overall_attribute['frequency']), p=np.array(list(overall_attribute['frequency'].values()))/sum(list(overall_attribute['frequency'].values())))}\n    else:\n        attribute_pool[\"frequency\"] = {'type': 'no periodicity'}\n    \n    # If the seq_len is too short (<=32, the noise is of no meaning, we just use no noise)\n    if seq_len <= 32:\n        attribute_pool[\"noise\"] = {'type': 'almost no noise'}\n    else:\n        attribute_pool[\"noise\"] = {'type': np.random.choice(list(overall_attribute['noise']), p=np.array(list(overall_attribute['noise'].values()))/sum(list(overall_attribute['noise'].values())))}\n    attribute_pool[\"seq_len\"] = seq_len\n\n    return attribute_pool\n\ndef generate_controlled_attributes(attribute_set, change_positions: Optional[List[Tuple[Optional[int], Optional[float]]]] = None, seq_len: int = 512):\n    if change_positions is None:\n        change_positions = [(None, None) for _ in range(random.randint(0, 3))]\n    description = {}\n\n    seasonal_p = [all_attribute_set['overall_attribute']['seasonal'][i] for i in attribute_set['seasonal']['attributes']]\n    description[\"seasonal\"] = {\n        \"type\": np.random.choice(list(attribute_set['seasonal']['attributes']), p=np.array(seasonal_p)/sum(seasonal_p)),\n        \"amplitude\": random.uniform(attribute_set['seasonal']['amplitude']['min'], attribute_set['seasonal']['amplitude']['max'])\n    }\n    \n    if not ENABLE_MULTIPLE_TREND:\n        if \"multiple\" in attribute_set['trend']['attributes']:\n            attribute_set['trend']['attributes'].remove(\"multiple\")\n            if len(attribute_set['trend']['attributes']) == 0:\n                attribute_set['trend']['attributes'] = ['increase', 'decrease', 'keep steady']\n    trend_p = [all_attribute_set['overall_attribute']['trend'][i] for i in attribute_set['trend']['attributes']]\n    description[\"trend\"] = {\n        \"type\": np.random.choice(list(attribute_set['trend']['attributes']), p=np.array(trend_p)/sum(trend_p)),\n        \"start\": random.uniform(attribute_set['trend']['start']['min'], attribute_set['trend']['start']['max']),\n        \"amplitude\": random.uniform(attribute_set['trend']['amplitude']['min'], attribute_set['trend']['amplitude']['max'])\n    }\n\n    num_local_chars = len(change_positions)\n    change_p = [all_attribute_set['change'][i] for i in attribute_set['change']['attributes']]\n    local_chars = list(np.random.choice(list(attribute_set['change']['attributes']), size=num_local_chars, p=np.array(change_p)/sum(change_p)))\n    \n    description[\"local\"] = []\n    for char in local_chars:\n        description[\"local\"].append({\n            \"type\": char,\n            \"position_start\": None,\n            \"amplitude\": random.uniform(attribute_set['change']['amplitude']['min'], attribute_set['change']['amplitude']['max'])\n        })\n\n    if 'no periodic fluctuation' not in description[\"seasonal\"]['type']:\n        # Generate period and then determine type\n        period = max(random.uniform(attribute_set['seasonal']['period']['min'], attribute_set['seasonal']['period']['max']), 6)\n        if period < seq_len // 8:\n            description[\"frequency\"] = {'type': 'high frequency', 'period': round(period, 1)}\n        else:\n            description[\"frequency\"] = {'type': 'low frequency', 'period': round(period, 1)}\n    else:\n        description[\"frequency\"] = {'type': 'no periodicity'}\n        \n    noise_p = [all_attribute_set['overall_attribute']['noise'][i] for i in attribute_set['noise']['attributes']]\n    description[\"noise\"] = {'type': np.random.choice(list(attribute_set['noise']['attributes']), p=np.array(noise_p)/sum(noise_p))}\n    description[\"seq_len\"] = seq_len\n\n    return description\n\ndef generate_seasonal_wave(period, amplitude_list, split_points, seq_len, wave_type=None):\n    # Time array\n    t = np.linspace(0, seq_len, seq_len)\n    data = np.zeros(seq_len)\n    base_frequency = 1 / period\n\n    # Amplitude series\n    amplitude_series = np.zeros(seq_len)\n    for i in range(len(amplitude_list)):\n        amplitude_series[split_points[i]:split_points[i + 1]] = amplitude_list[i]\n\n    # Smoothing amplitude_series with window size\n    sliding_window = 5\n    for i in range(seq_len - sliding_window):\n        amplitude_series[i + sliding_window // 2] = np.mean(amplitude_series[i:i + sliding_window])\n\n    if wave_type is None:\n        wave_type = str(np.random.choice(['sin', 'square', 'triangle'], p=[0.7, 0.15, 0.15]))\n\n    if wave_type == 'sin':\n        num_harmonics = np.random.randint(1, max(2, min(period // 6, 10)))\n        for n in range(1, num_harmonics + 1):\n            phase = np.random.uniform(0, 2 * np.pi)\n            harmonic_amplitude = amplitude_series / n * (1 + np.random.uniform(0, 0.05) * np.sin(np.random.uniform(1, 3) * np.pi * t / seq_len + np.random.uniform(0, 2 * np.pi)))\n            data += harmonic_amplitud
