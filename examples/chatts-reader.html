() not in question.lower() or key.lower() in groundtruth.lower():\n                result.append(key)\n        return result\n    else:\n        return []\n\nGT_PROMPT = Prompt(\n    name=\"gt_keywords\",\n    instruction=\"\"\"Given a question and the ground truth, extract the following information:\n            \"gt_keywords\": Identify and return a list of keywords or phrases contained in the ground_truth. This list should only include the minimal combination of key points that directly answer the question, avoiding words unrelated to the question as much as possible. Only **1 or 2** keywords are needed in each list, and the keywords should be as concise as possible and **as short as possible**.\n            \"\"\",\n    examples=[\n        {\n            \"question\": \"\"\"What protocol does AMF use to ensure correct time?\"\"\",\n            \"ground_truth\": \"\"\"The role of NTP is to synchronize the time of all clocked devices within the network, ensuring that the clock times of all devices in the network remain basically consistent, so that the devices can provide various applications based on unified time. Possible applicable network elements: AMF, MME, SGSN\"\"\",\n            \"Extracted statements\": {\n                \"gt_keywords\": [\"NTP\"]\n            },\n        },\n        {\n            \"question\": \"\"\"What is the purpose of MME assigning a TA List to UE?\"\"\",\n            \"ground_truth\": \"\"\"The purpose of MME assigning a TA List to UE is to manage the location of idle UEs. After MME assigns a TA List to UE, the UE will not initiate a TA update to MME when moving within this TA List. When the UE moves out of the TA List range, it will initiate a TA update, and the MME will know that the location of the idle UE is within the TA List range. When paging is needed, it can be done within the TA List range.\"\"\",\n            \"Extracted statements\": {\n                \"gt_keywords\": [\"manage the location of idle UEs\"]\n            },\n        }\n    ],\n    input_keys=[\"question\", \"ground_truth\"],\n    output_key=\"Extracted statements\",\n    output_type=\"json\",\n)\n\n\nANSWER_PROMPT = Prompt(\n    name=\"answer_correctness_step_2\",\n    instruction=\"\"\"Given a question, an answer generated by the model, and the list of ground truth keywords (gt_keywords), extract the following information:\n        \"overlapping_keywords\": From the list of \"gt_keywords\", identify any terms or phrases that also appear in the model's answer. These overlapping keywords indicate the points of agreement or coverage between the model's answer and the ground truth.\"\"\",\n    examples=[\n        {\n            \"question\": \"What powers the sun and what is its primary function?\",\n            \"gt_keywords\": [\"nuclear fusion\", \"energy\", \"light\", \"essential for life\", \"climate system\", \"weather\", \"ocean currents\"],\n            \"answer\": \"The sun is powered by nuclear fission, similar to nuclear reactors on Earth, and its primary function is to provide light to the solar system.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"light\"]\n            }\n        },\n        {\n            \"question\": \"What is the boiling point of water?\",\n            \"gt_keywords\": [\"100 degrees Celsius\", \"212 degrees Fahrenheit\", \"sea level\", \"change with altitude\"],\n            \"answer\": \"The boiling point of water is 100 degrees Celsius at sea level.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"100 degrees Celsius\", \"sea level\"]\n            }\n        },\n        {\n            \"question\": \"What information should be submitted when contacting technical support for a communication technology company?\",\n            \"gt_keywords\": [\"fault details\", \"log files and alarm query results\", \"steps taken to address the issue\", \"commands executed\", \"results of those actions\", \"remote access details\", \"contact information for relevant personnel\"],\n            \"answer\": \"When contacting technical support for a communication technology company, the following information should be provided: 1. Fault details: Time, location, and event description.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"fault details\"]\n            }\n        },\n        {\n            \"question\": \"What are the benefits of a balanced diet?\",\n            \"gt_keywords\": [\"provides essential nutrients\", \"maintains a healthy weight\", \"reduces risk of chronic diseases\", \"supports overall health\"],\n            \"answer\": \"A balanced diet helps maintain a healthy weight and supports overall health.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"maintain a healthy weight\", \"supports overall health\"]\n            }\n        },\n        {\n            \"question\": \"What is the capital of France?\",\n            \"gt_keywords\": [\"Paris\"],\n            \"answer\": \"The capital of France is Paris.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"Paris\"]\n            }\n        },\n        {\n            \"question\": \"How does photosynthesis work?\",\n            \"gt_keywords\": [\"process by which plants convert sunlight into energy\", \"involves chlorophyll\", \"produces oxygen\", \"occurs in the chloroplasts\"],\n            \"answer\": \"Photosynthesis is the process by which plants use sunlight to produce energy and oxygen.\",\n            \"Extracted statements\": {\n                \"overlapping_keywords\": [\"process by which plants convert sunlight into energy\", \"produces oxygen\"]\n            }\n        },\n    ],\n    input_keys=[\"question\", \"gt_keywords\", \"answer\"],\n    output_key=\"Extracted statements\",\n    output_type=\"json\",\n)\n\n\n@dataclass\nclass AnswerCorrectness(MetricWithLLM, MetricWithEmbeddings):\n    name: str = \"answer_correctness\"  # type: ignore[reportIncompatibleMethodOverride]\n    evaluation_mode: EvaluationMode = EvaluationMode.qga  # type: ignore[reportIncompatibleMethodOverride]\n    answer_prompt: Prompt = field(default_factory=lambda: ANSWER_PROMPT)\n    weights: list[float] = field(default_factory=lambda: [1.0, 0.0])\n    keyword_matching_threshold: float = field(default_factory=lambda: 0.6)\n    answer_similarity: AnswerSimilarity | None = None\n\n    def __post_init__(self):\n        if len(self.weights) != 2:\n            raise ValueError(\n                \"Expects a list of two weights. First for factuality, second for semantic similarity\"\n            )\n        if all([w == 0 for w in self.weights]):\n            raise ValueError(\"At least one weight must be non-zero\")\n        if not all([w >= 0 for w in self.weights]):\n            raise ValueError(\"Weights must be non-negative\")\n\n    def init(self, run_config: RunConfig):\n        super().init(run_config)\n        if self.answer_similarity is None and self.weights[1] != 0:\n            self.answer_similarity = AnswerSimilarity(\n                llm=self.llm, embeddings=self.embeddings\n            )\n        self.answer_detail = {}\n\n    def _compute_statement_presence(self, gt_keywords, prediction: t.Any, question: str) -> float:\n        assert self.llm is not None, \"LLM must be set\"\n\n        key_map = [\n            \"overlapping_keywords\",\n        ]\n        if prediction:\n            try:\n                prediction = [prediction.get(k, np.nan) for k in key_map]\n                overlapping_keywords = [\n                    item if isinstance(item, list) else np.nan for item in prediction\n                ][0]\n                if gt_keywords is None or (type(gt_keywords) == float and np.isnan(gt_keywords)):\n                    logger.warning('[gt_keywords] gt_keywords is nan!')\n                    gt_keywords = []\n                gt_keywords = [k.lower() for k in gt_keywords]\n                overlapping_keywords = [k.lower() for k in overlapping_keywords]\n                self.answer_detail[question] = {'answer_keywords': '|'.join(overlapping_keywords)}\n                overlapping_keywords = [k for k in overlapping_keywords if self.match(gt_keywords, k)]\n                num_ok = len(overlapping_keywords)\n                num_all = len(gt_keywords)\n                self.answer_detail[question].update({\n                    'gt_keywords': '|'.join(gt_keywords),\n                    'overlapping_keywords': '|'.join(overlapping_keywords),\n                    'num_ok': int(num_ok),\n                    'num_all': int(num_all)\n                })\n                if any([np.isnan(i) for i in [num_ok, num_all]]):\n                    score = np.nan\n                    logger.warning(\n                        \"Invalid prediction format. Expected a list of dictionaries with keys 'gt_keywords', 'overlapping_keywords'\"\n                    )\n                else:\n                    score = min(num_ok / num_all, 1.0) if num_all > 0 else np.nan\n            except:\n                score = np.nan\n        else:\n            score = np.nan\n\n        return score\n\n    def match(self, arr, k):\n        for item in arr:\n            if difflib.SequenceMatcher(None, item, k).ratio() >= self.keyword_matching_threshold:\n                return True\n        return False\n\n    async def _ascore(self, row: dict, callbacks: t.Any, is_async: bool) -> float:\n        assert self.llm is not None, \"LLM must be set\"\n\n        q, a, g = row[\"question\"], row[\"answer\"], row[\"ground_truth\"]\n\n        if len(row[\"answer\"].strip('\"')) == 0:\n            return 0.0\n\n        gt_keywords = await get_gt_keywords(self.llm, q, g, callbacks, is_async=is_async)\n \n        prompt_input = {\n            \"question\": q,\n            \"gt_keywords\": gt_keywords,\n            \"answer\": a\n        }\n        \n        p_value = self.answer_prompt.format(**prompt_input)\n\n        is_statement_present = self.llm.generate(\n            [p_value], callbacks=callbacks\n        )\n\n        prediction = await json_loader.safe_load(\n            is_statement_present.generations[0][0].text, self.llm, is_async=is_async\n        )\n        f1_score = self._compute_statement_presence(gt_keywords, prediction, q)\n\n        if self.weights[1] == 0:\n            similarity_score = 0\n        else:\n            assert self.answer_similarity is not None, \"AnswerSimilarity must be set\"\n\n            callbacks = []\n            similarity_score = await self.answer_similarity.ascore(\n                row, callbacks=callbacks, is_async=is_async\n            )\n        if q not in self.answer_detail:\n            self.answer_detail[q] = {}\n        self.answer_detail[q]['answer_similarity'] = float(similarity_score)\n        self.answer_detail[q]['keywords_prediction'] = str(is_statement_present.generations[0][0].text)\n        score = np.average(\n            [f1_score, similarity_score],\n            weights=self.weights,\n        )\n\n        return float(score)\n\n    def adapt(self, language: str, cache_dir: t.Optional[str] = None) -> None:\n        assert self.llm is not None, \"llm must be set to compute score\"\n\n        logger.info(f\"Adapting AnswerCorrectness metric to {language}\")\n        self.correctness_prompt = self.answer_prompt.adapt(\n            language, self.llm, cache_dir\n        )\n\n    def save(self, cache_dir: t.Optional[str] = None) -> None:\n        self.answer_prompt.save(cache_dir)\n\n\nanswer_correctness = AnswerCorrectness()\n", "blocks": []}, {"path": "evaluation/ragas/score.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n# Reference (RAGAS): https://github.com/explodinggradients/ragas\n\nfrom evaluation.ragas.metric import AnswerCorrectness\nfrom evaluation.ragas.config import load_llm, load_embeddings, config\nfrom ragas import RunConfig\nfrom loguru import logger\nimport copy\n\ndef calculate_ragas_score(question: str, response: str, label: str):\n    try:\n        answer_correctness = AnswerCorrectness(\n            embeddings=load_embeddings(),\n            llm=load_llm(),\n            weights=[1.0, 0.0]\n        )\n        answer_correctness.answer_detail = {}\n\n        score = answer_correctness.score(\n            row={\n                'question': question,\n                'answer': response,\n                'ground_truth': label\n            }\n        )\n    except Exception as e:\n        logger.error(f\"Error calculating RAGAS score: {e}. Please make sure that you have set the correct API key!\")\n        return 0.0, {}\n\n    return float(score), copy.deepcopy(answer_correctness.answer_detail)\n", "blocks": []}, {"path": "evaluation/react_agent.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport openai\nimport numpy as np\nimport os\nimport json\nfrom statsmodels.tsa.seasonal import STL\nfrom scipy.signal import find_peaks, correlate\nfrom evaluation.evaluate_qa import match_metric_name\nfrom typing import *\nfrom sktime.classification.kernel_based import RocketClassifier\nfrom evaluation.train_rocket_tsc import change_type_list\nfrom adtk.detector import AutoregressionAD\nimport pandas as pd\n\n\ndef parse_latest_plugin_call(text: str):\n    i = text.rfind('\\nAction:')\n    j = text.rfind('\\nAction Input:')\n    k = text.rfind('\\nObservation:')\n    if 0 <= i < j:  # If the text has `Action` and `Action input`,\n        if k < j:  # but does not contain `Observation`,\n            # then it is likely that `Observation` is ommited by the LLM,\n            # because the output text may have discarded the stop word.\n            text = text.rstrip() + '\\nObservation:'  # Add it back.\n            k = text.rfind('\\nObservation:')\n    if 0 <= i < j < k:\n        plugin_name = text[i + len('\\nAction:'):j].strip()\n        plugin_args = text[j + len('\\nAction Input:'):k].strip()\n        return plugin_name, plugin_args\n    return '', ''\n\ndef parse_json(plugin_args: str):\n    plugin_args = plugin_args.replace('```json', '').replace('```', '')\n    return json.loads(plugin_args)\n\ndef stl_tool(timeseries: np.ndarray) -> str:\n    def find_period(signal, min_period=10, amplitude_threshold=0.1):\n        acf = np.correlate(signal, signal, 'full')[-len(signal):]\n        inflection = np.diff(np.sign(np.diff(acf)))\n        peaks = (inflection < 0).nonzero()[0] + 1\n\n        if len(peaks) == 0:\n            return None\n\n        max_acf_value = acf[peaks].max()\n        valid_peaks = [p for p in peaks if acf[p] >= amplitude_threshold * max_acf_value]\n\n        valid_peaks = [p for p in valid_peaks if p >= min_period]\n\n        if len(valid_peaks) == 0:\n            return None\n\n        return valid_peaks[acf[valid_peaks].argmax()]\n\n    period = find_period(timeseries)\n    if period is None:\n        stl_period = 20\n    else:\n        stl_period = period\n\n    stl = STL(timeseries, period=stl_period, robust=True)\n    result = stl.fit()\n\n    # Generate prompt\n    prompt = f\"The STL decomposition of the time series is as follows: \"\n    prompt += f\"From the trend perspective, the difference between the rightmost and leftmost points is {round(float(result.trend[-1] - result.trend[0]), 2)}, the start point of the trend is around {round(float(result.trend[0]), 2)}.\"\n    prompt += f\"The 10 equal parts of the trend are as follows: {[round(float(result.trend[i]), 2) for i in range(0, len(result.trend), len(result.trend) // 10)]}. \"\n    prompt += \"Please analyze the trend characteristics of the time series considering the overall changes in the time series. \"\n    if period is not None:\n        prompt += f\"From the seasonal perspective, the period is around {period}, the maximum seasonal value is {round(float(np.max(result.seasonal)), 2)}, the minimum seasonal value is {round(float(np.min(result.seasonal)), 2)}. \"\n    else:\n        prompt += f\"From the seasonal perspective, no significant seasonal fluctuation is found. \"\n    prompt += f\"From the noise perspective, the standard deviation is {round(float(np.std(result.resid)), 3)}. \"\n\n    return prompt\n\ndef anomaly_detection_tool(timeseries: np.ndarray) -> str:\n    # Do anomaly detection with adtk\n    autoregression_ad = AutoregressionAD()\n    s = pd.Series(timeseries, index=pd.date_range('2021-01-01', periods=len(timeseries), freq='s'))\n    anomalies = autoregression_ad.fit_detect(s)\n\n    # Find start points of each anomaly blocks\n    anomalous_points = []\n    for i in range(len(anomalies.values)):\n        if np.isnan(anomalies.values[i]):\n            continue\n        if anomalies.values[i] == True and (i == 0 or anomalies.values[i - 1] == False):\n            anomalous_points.append(i)\n\n    # Generate prompt\n    if len(anomalous_points) > 0:\n        prompt = f\"The anomalous points are {anomalous_points}.\"\n    else:\n        prompt = \"No anomaly is detected.\"\n    return prompt\n\ndef classification_tool(timeseries: np.ndarray) -> str:\n    timeseries = np.array(timeseries)\n    clf = RocketClassifier.load_from_path('result/rocket.zip')\n    assert len(timeseries) == 64, f\"Time series length should be 64 for classification, but got {len(timeseries)}\"\n    \n    print(f\"[CLASSIFICATION] {timeseries.shape=}\")\n    result = clf.predict(timeseries[np.newaxis, np.newaxis, :])[0]\n    prompt = \"The classification result is \" + change_type_list[result]\n    \n    return prompt\n\ndef correlation_tool(timeseries: list, src_idx: int, cols: List[str]) -> str:\n    min_ts_len = min([len(i) for i in timeseries])\n    timeseries = [np.array(i)[:min_ts_len] for i in timeseries]\n    timeseries = np.stack(timeseries, axis=0)\n\n    prompt = f'The pearson correlation between {cols[src_idx]} and other metrics are as follows: '\n\n    for target_idx in range(len(cols)):\n        if target_idx == src_idx:\n            continue\n        correlation = np.corrcoef(timeseries[src_idx], timeseries[target_idx])[0, 1]\n        prompt += f\"The correlation between {cols[src_idx]} and {cols[target_idx]} is {correlation:.3f}. \"\n    \n    return prompt\n\ndef anomaly_detection_multi_tool(timeseries: list, cols: List[str]) -> str:\n    results = []\n    for i, col in enumerate(cols):\n        ts = np.array(timeseries[i])\n        s = pd.Series(ts, index=pd.date_range('2021-01-01', periods=len(ts), freq='s'))\n        detector = AutoregressionAD()\n        anomalies = detector.fit_detect(s)\n        \n        anomalous_points = []\n        for idx in range(1, len(anomalies)):\n            if anomalies[idx] and not anomalies[idx-1]:\n                anomalous_points.append(idx)\n\n        # Generate prompt\n        if len(anomalous_points) > 0:\n            prompt = f\"- For {col}, the anomalous points are {anomalous_points}.\"\n        else:\n            prompt = f\"- For {col}, no anomaly is detected.\"\n\n        results.append(prompt)\n\n    return \"The detection results are: \\n\" + \"\\n\".join(results)\n\ndef classification_multi_tool(timeseries: list, position: int, cols: List[str]) -> str:\n    \"\"\"Batch process multivariate time series classification with optimized model loading\"\"\"\n    # Load model once at the beginning\n    clf = RocketClassifier.load_from_path('result/rocket.zip')\n    \n    # Prepare batch input\n    batch_windows = []\n    valid_indices = []\n    results = [\"\"] * len(cols)\n    \n    # Preprocess all windows first\n    for i, (col, ts) in enumerate(zip(cols, timeseries)):\n        ts = np.array(ts)\n        start_pos = max(0, position - 32)\n        end_pos = start_pos + 64\n        \n        if end_pos > len(ts):\n            end_pos = len(ts)\n            start_pos = max(0, end_pos - 64)\n        \n        window = ts[start_pos:end_pos]\n        \n        if len(window) != 64:\n            results[i] = f\"- {col}: Invalid window position\"\n            continue\n            \n        batch_windows.append(window[np.newaxis, np.newaxis, :])  # Add channel and sample dimensions\n        valid_indices.append(i)\n\n    # Batch predict for all valid windows\n    if batch_windows:\n        X = np.vstack(batch_windows)\n        predictions = clf.predict(X)\n        \n        # Map predictions to results\n        for idx, pred in zip(valid_indices, predictions):\n            results[idx] = f\"- {cols[idx]}: {change_type_list[pred]}\"\n\n    return \"Classification results:\\n\" + \"\\n\".join(results)\n\ndef trend_correlation_tool(timeseries: list, src_idx: int, cols: List[str]) -> str:\n    def find_period(signal, min_period=10, amplitude_threshold=0.1):\n        acf = np.correlate(signal, signal, 'full')[-len(signal):]\n        inflection = np.diff(np.sign(np.diff(acf)))\n        peaks = (inflection < 0).nonzero()[0] + 1\n\n        if len(peaks) == 0:\n            return None\n\n        max_acf_value = acf[peaks].max()\n        valid_peaks = [p for p in peaks if acf[p] >= amplitude_threshold * max_acf_value]\n\n        valid_peaks = [p for p in valid_peaks if p >= min_period]\n\n        if len(valid_peaks) == 0:\n            return None\n\n        return valid_peaks[acf[valid_peaks].argmax()]\n\n    min_len = min(len(ts) for ts in timeseries)\n    aligned_series = [np.array(ts)[:min_len] for ts in timeseries]\n    \n    trends = []\n    for ts in aligned_series:\n        period = find_period(ts)\n        if period is None:\n            stl_period = 20\n        else:\n            stl_period = period\n        stl = STL(ts, period=stl_period, robust=True)\n        res = stl.fit()\n        trends.append(res.trend)\n    \n    prompt = f\"Trend correlations for {cols[src_idx]}:\\n\"\n    src_trend = trends[src_idx]\n\n    high_corr_cols = []\n\n    for i, trend in enumerate(trends):\n        corr = np.corrcoef(src_trend, trend)[0,1]\n        prompt += f\"- {cols[i]}: {corr:.3f}\\n\"\n\n        if corr > 0.7:\n            high_corr_cols.append(cols[i])\n\n    prompt += f\"Therefore, time series with high correlation (>0.7) are: \" + ', '.join(high_corr_cols)\n\n    return prompt\n\ndef fluctuation_correlation_tool(timeseries: list, src_idx: int, cols: List[str]) -> str:\n    \"\"\"\n    Calculate fluctuation correlation based on anomaly position matching with 5% sequence length tolerance.\n    \"\"\"\n    # Align time series length\n    seq_len = min(len(ts) for ts in timeseries)\n    aligned_series = [np.array(ts)[:seq_len] for ts in timeseries]\n    tolerance = int(seq_len * 0.05)  # 5% tolerance window\n    \n    # Get anomaly positions for all series\n    anomaly_positions = []\n    for ts in aligned_series:\n        s = pd.Series(ts, index=pd.date_range('2021-01-01', periods=seq_len, freq='s'))\n        detector = AutoregressionAD()\n        anomalies = detector.fit_detect(s)\n        anomaly_positions.append(np.where(anomalies)[0].tolist())\n    \n    # Find matching anomalies between src and target series\n    src_anomalies = set(anomaly_positions[src_idx])\n    matches = {}\n    \n    for target_idx, target_anomalies in enumerate(anomaly_positions):\n        if target_idx == src_idx:\n            continue\n            \n        matched = 0\n        target_anomaly_set = set(target_anomalies)\n        \n        # Check for matches within tolerance window\n        for pos in src_anomalies:\n            # Create tolerance range [pos-tolerance, pos+tolerance]\n            lower = max(0, pos - tolerance)\n            upper = min(seq_len-1, pos + tolerance)\n            \n            # Check if any target anomaly falls in this range\n            if any(lower <= t_pos <= upper for t_pos in target_anomaly_set):\n                matched += 1\n                \n        # Calculate match ratio\n        total_src = len(src_anomalies) if len(src_anomalies) > 0 else 1\n        match_ratio = matched / total_src\n        matches[cols[target_idx]] = match_ratio\n    \n    # Generate report\n    prompt = f\"Fluctuation correlation for {cols[src_idx]}:\\n\"\n    for col, ratio in sorted(matches.items(), key=lambda x: -x[1]):\n        if ratio > 0:\n            prompt += f\"- {col}: has matching fluctuations, may be correlated with {cols[src_idx]}\\n\"\n        else:\n            prompt += f\"- {col}: no matching fluctuations found, may be not correlated with {cols[src_idx]}\\n\"\n    \n    return prompt\n\ndef col_idx(name: str, cols: List[str]) -> int:\n    for i, col in enumerate(cols):\n        if match_metric_name(col, name):\n            return i\n    raise RuntimeError(f\"Metric: {name} not found\")\n\ndef call_plugin(plugin_name: str, plugin_args: str, timeseries: list, cols: List[str]) -> str:\n    try:\n        if plugin_name == 'datapoint_value':\n            name = parse_json(plugin_args)['name']\n            position = parse_json(plugin_args)['position']\n            return f\"The value of datapoint {position} in {name} is {float(timeseries[col_idx(name, cols)][position]):.2f}\"\n        elif plugin_name == 'datarange_value':\n            name = parse_json(plugin_args)['name']\n            cur_idx = col_idx(name, cols)\n            position_start = parse_json(plugin_args)['position_start']\n            position_end = parse_json(plugin_args)['position_end']\n            return f\"The value between datapoint {position_start} and datapoint {position_end} in {name} is {[round(float(timeseries[cur_idx][pos]), 3) for pos in range(position_start, position_end)]}\"\n        elif plugin_name == 'stl_decomposition':\n            name = parse_json(plugin_args)['name']\n            return stl_tool(np.array(timeseries[col_idx(name, cols)]))\n        elif plugin_name == 'anomaly_detection':\n            name = parse_json(plugin_args)['name']\n            return anomaly_detection_tool(np.array(timeseries[col_idx(name, cols)]))\n        elif plugin_name == 'anomaly_detection_multi':\n            return anomaly_detection_multi_tool(timeseries, cols)\n        elif plugin_name == 'classification':\n            name = parse_json(plugin_args)['name']\n            position = parse_json(plugin_args)['position']\n            cur_idx = col_idx(name, cols)\n            # Set start and end position\n            start_pos = min(max(0, position - 32), len(timeseries[cur_idx]) - 64)\n            end_pos = start_pos + 64\n            # print(f\"{start_pos=}, {end_pos=}\")\n            return classification_tool(np.array(timeseries[cur_idx])[start_pos:end_pos])\n        elif plugin_name == 'classification_multi':\n            position = parse_json(plugin_args)['position']\n            return classification_multi_tool(timeseries, position, cols)\n        elif plugin_name == 'similarity':\n            name = parse_json(plugin_args)['name']\n            return correlation_tool(timeseries, col_idx(name, cols), cols)\n        elif plugin_name == 'trend_correlation':\n            name = parse_json(plugin_args)['name']\n            return trend_correlation_tool(timeseries, col_idx(name, cols), cols)\n        elif plugin_name == 'fluctuation_correlation':\n            name = parse_json(plugin_args)['name']\n            return fluctuation_correlation_tool(timeseries, col_idx(name, cols), cols)\n        else:\n            return f\"plugin: {plugin_name} not found! You have to strictly format your Action (just put tool name here) and Action Input (just put the json format input here) to use the tools. If you want to output the final answer, strictly it format to: Final Answer: the final answer to the original input question.\"\n    except Exception as err:\n        return f\"Error when calling {plugin_name}: {str(err)}\"\n\n\ndef answer_question_react(question, timeseries, cols, model, client):\n    TOOLS = [\n        {\n            'name_for_human':\n                'Datapoint Value',\n            'name_for_model':\n                'datapoint_value',\n            'description_for_model':\n                'Output the value of a time series datapoint according to the input position.',\n            'parameters': [{\n                'name': 'position',\n                'description': 'The position of the point to query (0 to seq_len - 1).',\n                'required': True,\n                'schema': {\n                    'type': 'int'\n                },\n            }, {\n                'name': 'name',\n                'description': 'The name of the time series to query.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        },\n        {\n            'name_for_human':\n                'Datarange Value',\n            'name_for_model':\n                'datarange_value',\n            'description_for_model':\n                'Output the values (in list format) of the datapoints between the range [position_start, position_end).',\n            'parameters': [{\n                'name': 'position_start',\n                'description': 'The start position of the data range',\n                'required': True,\n                'schema': {\n                    'type': 'int'\n                },\n            }, {\n                'name': 'position_end',\n                'description': 'The end position of the data range',\n                'required': True,\n                'schema': {\n                    'type': 'int'\n                },\n            }, {\n                'name': 'name',\n                'description': 'The name of the time series to query.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'STL Decomposition',\n            'name_for_model': 'stl_decomposition',\n            'description_for_model': 'Output the trend values, seasonal (period and max/min values), and residual (std) values after stl decomposition.',\n            'parameters': [{\n                'name': 'name',\n                'description': 'The name of the time series to do the stl decomposition.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'Anomaly Detection',\n            'name_for_model': 'anomaly_detection',\n            'description_for_model': 'Output the anomaly detection result (which points are anomalous) of the given time series. When determin the local fluctuations, always use this tool first to get the accurate position of local fluctuations. ',\n            'parameters': [{\n                'name': 'name',\n                'description': 'The name of the time series to do the anomaly detection.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'Anomaly Detection for Multivariate Timeseries',\n            'name_for_model': 'anomaly_detection_multi',\n            'description_for_model': 'Output the anomaly detection result (which points are anomalous) for all the time series (MTS version of anomaly_detection)',\n            'parameters': [],\n        },\n        {\n            'name_for_human': 'Local Fluctuation Classification',\n            'name_for_model': 'classification',\n            'description_for_model': 'Output the classification result (including type and amplitude) of the local fluctuations in a given time series window (the window size if 64).',\n            'parameters': [{\n                'name': 'name',\n                'description': 'The name of the time series to do the anomaly detection.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }, {\n                'name': 'position',\n                'description': 'The middle point of the window for time series classification (the window size is 64).',\n                'required': True,\n                'schema': {\n                    'type': 'int'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'Local Fluctuation Classification for Multivariate Timeseries',\n            'name_for_model': 'classification_multi',\n            'description_for_model': 'Output the classification result (including type and amplitude) of the local fluctuations in a given time series window (the window size if 64) for all the time series (MTS version of classification).',\n            'parameters': [{\n                'name': 'position',\n                'description': 'The middle point of the window for time series classification (the window size is 64).',\n                'required': True,\n                'schema': {\n                    'type': 'int'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'Trend Correlation',\n            'name_for_model': 'trend_correlation',\n            'description_for_model': 'Output the correlated time series of the given time series in terms of trend similarity.',\n            'parameters': [{\n                'name': 'name',\n                'description': 'The name of the given time series.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        },\n        {\n            'name_for_human': 'Fluctuation Correlation',\n            'name_for_model': 'fluctuation_correlation',\n            'description_for_model': 'Output the correlated time series of the given time series in terms of the similarity of local fluctuations.',\n            'parameters': [{\n                'name': 'name',\n                'description': 'The name of the given time series.',\n                'required': True,\n                'schema': {\n                    'type': 'string'\n                },\n            }],\n        }\n    ]\n\n    TOOL_DESC = \"\"\"{name_for_model}: Call this tool to interact with the {name_for_human} API. The {name_for_human} API is useful for: {description_for_model} Parameters: {parameters}. Format the arguments as a JSON object.\"\"\"\n\n    REACT_PROMPT = \"\"\"Answer the following questions as best you can. You have access to the following tools:\n\n    {tool_descs}\n\n    You can use the tools provided to access the timeseries. When outputing Final Answer, please strictly format your answer according to the requirement and use English. Your output should be in plain text **without** MarkDown. Note that if you find the final answer, you should strictly format it as \"Final Answer: the final answer to the original input question\".\n    Use the following format:\n\n    Question: the input question you must answer\n    Thought: you should always think about what to do\n    Action: the action to take, should be one of [{tool_names}]\n    Action Input: the input to the action\n    Observation: the result of the action\n    ... (this Thought/Action/Action Input/Observation can be repeated zero or more times, as needed but no more than 10 times)\n    Thought: I now know the final answer\n    Final Answer: the final answer to the original input question\n\n    Begin!\n\n    Question: {query}\n    \"\"\"\n\n    import json\n    tool_descs = []\n    tool_names = []\n    for info in TOOLS:\n        tool_descs.append(\n            TOOL_DESC.format(\n                name_for_model=info['name_for_model'],\n                name_for_human=info['name_for_human'],\n                description_for_model=info['description_for_model'],\n                parameters=json.dumps(\n                    info['parameters'], ensure_ascii=False),\n            )\n        )\n        tool_names.append(info['name_for_model'])\n    tool_descs = '\\n\\n'.join(tool_descs)\n    tool_names = ','.join(tool_names)\n\n    # Reformat question\n    question = question.replace(': <ts><ts/>', '. ')\n    question += f' The names of the give time series are (you can use those for query): {cols}'\n    prompt = REACT_PROMPT.format(tool_descs=tool_descs, tool_names=tool_names, query=question)\n    # prompt = REACT_PROMPT.format(tool_descs=tool_descs, tool_names=tool_names)\n    total_prompt_tokens = 0\n    cot_length = 0\n\n    while True:\n        timeout_cnt = 0\n        while True:\n            if timeout_cnt > 10:\n                print(\"Too many timeout!\")\n                raise RuntimeError(\"Too many timeout!\")\n            try:\n                out_put = client.chat.completions.create(\n                    model=model,\n                    messages=[\n                        {\n                            \"role\": \"user\",\n                            \"content\": [\n                                {\"type\": \"text\", \"text\": prompt},\n                            ]\n                        }\n                    ],\n                    stop=\"\\nObservation\"\n                )\n                break\n            except Exception as err:\n                print(err)\n                print(\"API timeout, trying again...\")\n                timeout_cnt += 1\n\n        total_prompt_tokens += out_put.usage.prompt_tokens\n        out_put = out_put.choices[0].message.content\n        out_put = out_put.replace('**', '')\n        # print(\"out_put:\", out_put)\n        import re\n        if re.search('final answer:', out_put, re.IGNORECASE):\n            final_answer = re.search('final answer:(.*)', out_put, re.DOTALL | re.IGNORECASE).group(1).strip()\n            return final_answer, total_prompt_tokens, prompt\n        plugin_name, plugin_args = parse_latest_plugin_call(out_put)\n        print(\"[PLUGIN] Plugin Name: \", plugin_name, \"Plugin Args: \", plugin_args)\n        plugin_res = call_plugin(plugin_name, plugin_args, timeseries, cols)\n\n        prompt += \"\\n\"\n        prompt += out_put\n        Observation_res = \"\\nObservation:\" + json.dumps(plugin_res, ensure_ascii=False)\n        prompt += Observation_res\n        print(\"==========================\")\n        print(prompt)\n\n        cot_length += 1\n        if cot_length > 20:\n            return \"ReAct failed: too much interaction\", total_prompt_tokens, prompt\n\nif __name__ == '__main__':\n    # idx = 1\n    # dataset = json.load(open(f\"result/evaluation_100_1012.json\"))\n    # sample = dataset[idx]\n    # timeseries = np.array(sample['timeseries'])\n    # cols = sample['cols']\n    # question_text = sample['question']\n    # label = sample['answer']\n\n    # print(\"===ReAct Begin===\")\n    # output, total_tokens = answer_question_react(question_text, timeseries, cols, 'gpt-4o-mini')\n    # print(\"===ReAct End===\")\n    # print(output)\n    # print(f\"{total_tokens=}\")\n\n    # print(call_plugin('classification', '{\"name\": \"' + cols[0] + '\", \"position\": 100}', timeseries, cols))\n\n    timeseries1 = [0.01 * i for i in range(256)]\n    timeseries2 = [0.02 * i for i in range(300)]\n\n    timeseries1[100] = 100.0\n    timeseries2[105] = -50.0\n\n    timeseries = [timeseries1, timeseries2]\n    cols = ['ts1', 'ts2']\n    # plugin = 'classification_multi'\n    # plugin_args = '{\"position\": 100}'\n    # plugin = 'anomaly_detection_multi'\n    # plugin_args = '{}'\n    # plugin = 'trend_correlation'\n    # plugin_args = '{\"name\": \"ts1\"}'\n    plugin = 'fluctuation_correlation'\n    plugin_args = '{\"name\": \"ts1\"}'\n    print(call_plugin(plugin, plugin_args, timeseries, cols))\n", "blocks": []}, {"path": "evaluation/train_rocket_tsc.py", "language": "python", "note_zh": "", "note_en": "", "code": "# Copyright 2024 Tsinghua University and ByteDance.\n#\n# Licensed under the MIT License (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://opensource.org/license/mit\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\nimport numpy as np\nimport random\nfrom tqdm import tqdm\nimport re\nimport json\nimport copy\nfrom typing import *\nfrom chatts.ts_generator.generate import generate_random_attributes, generate_time_series\nfrom sktime.classification.kernel_based import RocketClassifier\n\n\n# CONFIG\nNUM_DATA = 3000\nSEQ_LEN = 256\nWINDOW_SIZE = 64\nOUTPUT_PATH = \"result/rocket\"\n\n# All Config for TS Features\nall_config = {\n    \"overall_feature\": {\n        \"seasonal\": {\n            \"no periodic fluctuation\": 1.0\n        },\n        \"trend\": {\n            \"keep steady\": 1.0\n        },\n        \"frequency\": {\n            \"low frequency\": 1.0\n        },\n        \"noise\": {\n            \"almost no noise\": 1.0\n        }\n    },\n    \"change\": {\n        \"shake\": 2,\n        \"upward spike\": 10,\n        \"downward spike\": 6,\n        \"continuous upward spike\": 4,\n        \"continuous downward spike\": 2,\n        \"upward convex\": 2,\n        \"downward convex\": 2,\n        \"sudden increase\": 2,\n        \"sudden decrease\": 2,\n        \"rapid rise followed by slow decline\": 2,\n        \"slow rise followed by rapid decline\": 2,\n        \"rapid decline followed by slow rise\": 2,\n        \"slow decline followed by rapid rise\": 2,\n        \"decrease after upward spike\": 3,\n        \"increase after downward spike\": 3,\n        \"increase after upward spike\": 3,\n        \"decrease after downward spike\": 3,\n        \"wide upward spike\": 3,\n        \"wide downward spike\": 3\n    }\n}\n\n# Change type list\nchange_type_list = sorted(all_config['change'].keys())\n\ndef description_to_json(description: dict) -> str:\n    result = copy.deepcopy(description)\n    for i in range(len(result['local'])):\n        result[\"local\"][i]['amplitude'] = round(result[\"local\"][i]['amplitude'], 2)\n    if 'overall_amplitude' in result:\n        del result['overall_amplitude']\n    if 'overall_bias' in result:\n        del result['overall_bias']\n    return json.dumps(result, ensure_ascii=False)\n\ndef generate_single_dataset(window_size=64):\n    # Choose a metric and generate\n    description = generate_random_attributes(all_config['overall_feature'], all_config['change'], seq_len=SEQ_LEN, change_positions=[(None, None)])\n    timeseries, description = generate_time_series(description, SEQ_LEN)\n    \n    # Pad around\n    local = description['local'][0]\n    start_pad = (window_size - local['position_start'] + local['position_end']) // 2\n\n    if start_pad < 0:\n        raise ValueError('Invalid start pad')\n\n    start_position = local['position_start'] - start_pad\n    end_position = start_position + window_size\n\n    if start_position < 0 or end_position > SEQ_LEN:\n        raise IndexError('Out of range')\n\n    # Return result\n    value = timeseries[start_position:end_position]\n    class_label = change_type_list.index(local['type'])\n\n    return value, class_label\n\n\nif __name__ == '__main__':\n    # Generate data\n    print(\"Generating training data for rocket...\")\n    timeseries = []\n    labels = []\n\n    for _ in tqdm(range(NUM_DATA)):\n        try:\n            ts, label = generate_single_dataset(window_size=WINDOW_SIZE)\n            timeseries.append(ts)\n            labels.append(label)\n        except Exception as err:\n            continue\n\n    print(f\"Generated {len(timeseries)} samples\")\n    timeseries = np.stack(timeseries, axis=0)[:, np.newaxis, :]\n    labels = np.array(labels)\n\n    # Train a model\n    print(\"Training classifier...\")\n    clf = RocketClassifier()\n    clf.fit(timeseries, labels)\n\n    # Save model\n    print(\"Saving model...\")\n    clf.save(OUTPUT_PATH)\n", "blocks": []}, {"path": "scripts/generate_align_datasets.sh", "language": "bash", "note_zh": "", "note_en": "", "code": "echo \"Make sure to run this script from the root of the repository.\"\necho \"Make sure that you have set up the correct local_llm_path in config/datagen_config.json!!!\"\n\necho \"------------------------------\"\necho \"[1/6] UTS Template\"\npython3 -m chatts.align.uts_template_qa\n\necho \"------------------------------\"\necho \"[2/6] MTS-Shape Template\"\npython3 -m chatts.align.mts_shape_template_qa\n\necho \"------------------------------\"\necho \"[3/6] MTS-Local Template\"\npython3 -m chatts.align.mts_local_template_qa\n\necho \"------------------------------\"\necho \"[4/6] UTS LLM\"\npython3 -m chatts.align.uts_llm_qa\n\necho \"------------------------------\"\necho \"[5/6] MTS-Shape LLM\"\npython3 -m chatts.align.mts_shape_llm_qa\n\necho \"------------------------------\"\necho \"[6/6] MTS-Local LLM\"\npython3 -m chatts.align.mts_local_llm_qa\n\necho \"===============================\"\necho \"All datasets have been generated.\"\necho \"You can find them in the data folder.\"\necho \"===============================\"\n", "blocks": []}, {"path": "scripts/generate_enhanced_sft_datasets.sh", "language": "bash", "note_zh": "", "note_en": "", "code": "echo \"Make sure to run this script from the root of the repository.\"\necho \"Make sure that you have set up the correct local_llm_path in config/datagen_config.yaml!!!\"\n\necho \"------------------------------\"\necho \"[1/4] UTS Reasoning (English)\"\npython3 -m chatts.sft.generate_uts_reason\n\necho \"------------------------------\"\necho \"[2/4] UTS Reasoning (Chinese)\"\npython3 -m chatts.sft.generate_uts_reason_cn\n\necho \"------------------------------\"\necho \"[3/4] MTS Reasoning (Multivariate)\"\npython3 -m chatts.sft.generate_mts_reason\n\necho \"------------------------------\"\necho \"[4/4] TSRewrite Dataset\"\npython3 -m chatts.sft.generate_rewrite_dataset\n\necho \"===============================\"\necho \"All enhanced SFT datasets have been generated.\"\necho \"You can find them in the data folder.\"\necho \"===============================\"\n", "blocks": [{"start": 1, "end": 3, "summary_zh": "提示从仓库根目录运行，并先配置本地大模型路径。", "summary_en": "Remind the user to run from the repository root and configure the local LLM path first.", "lines": [{"n": 1, "zh": "输出提示：必须从仓库根目录运行本脚本 → 因为后续使用相对配置路径。", "en": "Print a reminder to run this script from the repository root → because later commands use relative config paths."}, {"n": 2, "zh": "输出警告：先在 `config/datagen_config.yaml` 设置正确的 `local_llm_path`。", "en": "Print a warning to set the correct `local_llm_path` in `config/datagen_config.yaml` first."}]}, {"start": 4, "end": 7, "summary_zh": "运行第一阶段，生成英文单变量时间序列推理数据。", "summary_en": "Run stage one to generate English univariate time-series reasoning data.", "lines": [{"n": 4, "zh": "输出分隔线 `------------------------------`。", "en": "Print the separator `------------------------------`."}, {"n": 5, "zh": "输出阶段标题：第 1/4 步，英文 UTS 推理。", "en": "Print the stage heading: step 1/4, English UTS reasoning."}, {"n": 6, "zh": "以模块方式运行 `chatts.sft.generate_uts_reason`，生成英文单变量推理数据。", "en": "Run `chatts.sft.generate_uts_reason` as a module to generate English univariate reasoning data."}]}, {"start": 8, "end": 11, "summary_zh": "运行第二阶段，生成中文单变量时间序列推理数据。", "summary_en": "Run stage two to generate Chinese univariate time-series reasoning data.", "lines": [{"n": 8, "zh": "输出分隔线 `------------------------------`。", "en": "Print the separator `------------------------------`."}, {"n": 9, "zh": "输出阶段标题：第 2/4 步，中文 UTS 推理。", "en": "Print the stage heading: step 2/4, Chinese UTS reasoning."}, {"n": 10, "zh": "以模块方式运行 `chatts.sft.generate_uts_reason_cn`，生成中文单变量推理数据。", "en": "Run `chatts.sft.generate_uts_reason_cn` as a module to generate Chinese univariate reasoning data."}]}, {"start": 12, "end": 15, "summary_zh": "运行第三阶段，生成多变量时间序列推理数据。", "summary_en": "Run stage three to generate multivariate time-series reasoning data.", "lines": [{"n": 12, "zh": "输出分隔线 `------------------------------`。", "en": "Print the separator `------------------------------`."}, {"n": 13, "zh": "输出阶段标题：第 3/4 步，多变量 MTS 推理。", "en": "Print the stage heading: step 3/4, multivariate MTS reasoning."}, {"n": 14, "zh": "以模块方式运行 `chatts.sft.generate_mts_reason`，生成多变量推理数据。", "en": "Run `chatts.sft.generate_mts_reason` as a module to generate multivariate reasoning data."}]}, {"start": 16, "end": 19, "summary_zh": "运行第四阶段，生成时间序列描述改写数据集。", "summary_en": "Run stage four to generate the time-series description rewrite dataset.", "lines": [{"n": 16, "zh": "输出分隔线 `------------------------------`。", "en": "Print the separator `------------------------------`."}, {"n": 17, "zh": "输出阶段标题：第 4/4 步，TSRewrite 数据集。", "en": "Print the stage heading: step 4/4, TSRewrite dataset."}, {"n": 18, "zh": "以模块方式运行 `chatts.sft.generate_rewrite_dataset`，生成描述改写数据。", "en": "Run `chatts.sft.generate_rewrite_dataset` as a module to generate description-rewrite data."}]}, {"start": 20, "end": 23, "summary_zh": "输出生成完成信息，并指出数据位于 data 目录。", "summary_en": "Print completion messages and point to the data directory for generated datasets.", "lines": [{"n": 20, "zh": "输出结束分隔线 `===============================`。", "en": "Print the closing separator `===============================`."}, {"n": 21, "zh": "输出消息：所有增强版 SFT 数据集均已生成。", "en": "Print a message that all enhanced SFT datasets have been generated."}, {"n": 22, "zh": "输出消息：可在 `data` 目录中找到生成的数据集。", "en": "Print a message that the generated datasets can be found in the `data` folder."}, {"n": 23, "zh": "再次输出结束分隔线 `===============================`。", "en": "Print the closing separator `===============================` again."}]}]}, {"path": "scripts/install_vllm_server.sh", "language": "bash", "note_zh": "", "note_en": "", "code": "pip3 uninstall -y vllm flash-attn\n\necho \">>> Reinstalling modified vLLM build...\"\nORIGINAL_DIR=\"$(pwd)\"\necho \"Please enter the absolute path where the vLLM repository should be cloned.\" \\\n     \"Press Enter to accept the default location under your home directory.\" \\\n     \"The directory will be created if it does not exist.\"\nread -r -p \"Clone destination [default: $HOME]: \" USER_CLONE_ROOT\nCLONE_ROOT=\"${USER_CLONE_ROOT:-$HOME}\"\nif [[ \"$CLONE_ROOT\" == ~* ]]; then\n    CLONE_ROOT=\"${CLONE_ROOT/#\\~/$HOME}\"\nfi\necho \">>> Cloning vLLM into: $CLONE_ROOT/vllm\"\nmkdir -p \"$CLONE_ROOT\"\ncd \"$CLONE_ROOT\" || exit 1\nif [[ -d vllm ]]; then\n    echo \">>> Existing directory detected at $CLONE_ROOT/vllm; removing it before cloning.\"\n    rm -rf vllm\nfi\ngit clone https://github.com/xiez22/vllm.git\ncd vllm || exit 1\ngit checkout timeseries\n\n# Check the python version (3.11 or 3.12) and install the corresponding flash-attn wheel\nif python3 -c \"import sys; exit(0) if sys.version_info[:2] == (3, 11) else exit(1)\"; then\n    FLASH_ATTN_WHL_URL=\"https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiFALSE-cp311-cp311-linux_x86_64.whl\"\nelif python3 -c \"import sys; exit(0) if sys.version_info[:2] == (3, 12) else exit(1)\"; then\n    FLASH_ATTN_WHL_URL=\"https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiFALSE-cp312-cp312-linux_x86_64.whl\"\nelse\n    echo \"Unsupported Python version. Please use Python 3.11 or 3.12.\"\n    exit 1\nfi\n\necho \">>> Installing Flash Attention from: $FLASH_ATTN_WHL_URL\"\npip3 install \"$FLASH_ATTN_WHL_URL\"\npip3 install setuptools_scm pandas\nVLLM_USE_PRECOMPILED=1 pip install -vvv -e \"$CLONE_ROOT/vllm\" --no-build-isolation\ncd \"$ORIGINAL_DIR\" || exit 1\npip install transformers==4.52.4 \"numpy<2.0.0\"\n\necho \">>> Verifying vLLM installation...\"\npython3 -c \"import vllm\" || {\n    echo \">>> vLLM installation failed! Please check the error messages above or open an issue at GitHub.\"\n    exit 1\n}\n\necho \">>> vLLM installation completed!\"\n", "blocks": []}, {"path": "scripts/start_vllm_server.sh", "language": "bash", "note_zh": "", "note_en": "", "code": "python3 -c \"import vllm\"\nVLLM_ALLOW_INSECURE_SERIALIZATION=1 vllm serve ./ckpt \\\n  --served-model-name chatts \\\n  --trust-remote-code \\\n  --hf-overrides '{\"model_type\":\"chatts\"}' \\\n  --max-model-len 6000 \\\n  --gpu-memory-utilization 0.97 \\\n  --limit-mm-per-prompt timeseries=15 \\\n  --allowed-local-media-path $(pwd) \\\n  --host 0.0.0.0 \\\n  --port 12345 \\\n  --uvicorn-log-level debug\n", "blocks": []}, {"path": "tests/test_datagen_localization.py", "language": "python", "note_zh": "", "note_en": "", "code": "import copy\nimport importlib\nimport re\nimport sys\nimport types\nimport unittest\nfrom unittest.mock import patch\n\nimport numpy as np\n\nfrom chatts.ts_generator.generate import generate_time_series\nfrom chatts.ts_generator.local_changes import ChangeFactory\n\n\nPLACEHOLDER_RE = re.compile(r\"<\\|-?\\d+\\|>\")\nPOINT_RE = re.compile(r\"\\bpoint (-?\\d+)\\b\")\n\n\ndef _base_attribute_pool(change_type, position_start, seq_len=256):\n    return {\n        \"seasonal\": {\"type\": \"no periodic fluctuation\"},\n        \"trend\": {\"type\": \"keep steady\"},\n        \"frequency\": {\"type\": \"no periodicity\"},\n        \"noise\": {\"type\": \"almost no noise\"},\n        \"local\": [\n            {\n                \"type\": change_type,\n                \"position_start\": position_start,\n                \"amplitude\": 10.0,\n            }\n        ],\n        \"overall_amplitude\": 10.0,\n        \"overall_bias\": 0.0,\n        \"seq_len\": seq_len,\n    }\n\n\nclass DatagenLocalizationAuditTests(unittest.TestCase):\n    def assert_text_uses_raw_points(self, text, seq_len):\n        self.assertNotRegex(text, PLACEHOLDER_RE)\n        for point in POINT_RE.findall(text):\n            point = int(point)\n            self.assertGreaterEqual(point, 0, text)\n            self.assertLess(point, seq_len, text)\n\n    def test_all_local_changes_use_valid_raw_points_at_boundaries(self):\n        seq_len = 256\n        for change_type in ChangeFactory.get_supported_types():\n            min_length = ChangeFactory.create_change(change_type).get_min_length()\n            starts = [0, seq_len - min_length]\n            for position_start in starts:\n                with self.subTest(change_type=change_type, position_start=position_start):\n                    np.random.seed(7)\n                    import random\n\n                    random.seed(7)\n                    _, attribute_pool = generate_time_series(\n                        copy.deepcopy(_base_attribute_pool(change_type, position_start, seq_len)),\n                        seq_len,\n                    )\n                    self.assertEqual(len(attribute_pool[\"local\"]), 1)\n                    local = attribute_pool[\"local\"][0]\n                    self.assertGreaterEqual(local[\"position_start\"], 0)\n                    self.assertLess(local[\"position_start\"], seq_len)\n                    self.assertGreaterEqual(local[\"position_end\"], local[\"position_start\"])\n                    self.assertLess(local[\"position_end\"], seq_len)\n                    self.assert_text_uses_raw_points(local[\"detail\"], seq_len)\n\n    def test_uts_template_clamps_question_points_and_keeps_raw_length_with_sp_encoding(self):\n        import chatts.align.uts_template_qa as uts\n\n        seq_len = 256\n        raw_timeseries = np.arange(seq_len, dtype=float)\n        generated_pool = _base_attribute_pool(\"sudden increase\", 0, seq_len)\n        generated_pool[\"local\"][0].update(\n            {\n                \"position_end\": 1,\n                \"detail\": \"a sudden increase occurred between point 0 and point 1\",\n            }\n        )\n\n        randint_values = iter([-5, 255, 255, 255])\n\n        def fake_randint(_low, _high):\n            return next(randint_values)\n\n        with patch.object(uts, \"SEQ_LEN\", seq_len), patch.object(uts, \"ENCODING_METHOD\", \"sp\"):\n            with patch.object(uts, \"generate_random_attributes\", return_value={}):\n                with patch.object(uts, \"generate_time_series\", return_value=(raw_timeseries, generated_pool)):\n                    with patch.object(uts, \"attribute_to_text\", return_value=\"summary\"):\n                        with patch.object(uts.random, \"randint\", side_effect=fake_randint):\n                            rows = uts.generate_single_dataset()\n\n        self.assertIn(f\"length {seq_len}\", rows[0][\"instruction\"])\n        self.assertEqual(rows[0][\"timeseries\"][0].shape[0], seq_len * 2)\n        for row in rows:\n            self.assert_text_uses_raw_points(row[\"question\"], seq_len)\n            self.assert_text_uses_raw_points(row[\"answer\"], seq_len)\n\n    def test_mts_local_llm_preserves_each_positive_cluster_position(self):\n        fake_llm_utils = types.ModuleType(\"chatts.utils.llm_utils\")\n        fake_llm_utils.LLMClient = object\n\n        with patch.dict(sys.modules, {\"chatts.utils.llm_utils\": fake_llm_utils}):\n            import chatts.align.mts_local_llm_qa as mts\n\n            mts = importlib.reload(mts)\n\n        for cluster_count in [1, 2, 3]:\n            with self.subTest(cluster_count=cluster_count):\n                self._assert_mts_cluster_case(mts, cluster_count)\n\n    def _assert_mts_cluster_case(self, mts, cluster_count):\n        seq_len = 256\n        positions = [40, 120, 210][:cluster_count]\n        position_iter = iter(positions)\n\n        mts.metric_config = [\n            {\n                \"category\": \"database\",\n                \"cluster\": {\n                    \"cluster_a\": [\"a0\", \"a1\", \"a2\"],\n                    \"cluster_b\": [\"b0\", \"b1\", \"b2\"],\n                    \"cluster_c\": [\"c0\", \"c1\", \"c2\"],\n                    \"unused\": [\"n0\", \"n1\", \"n2\", \"n3\"],\n                },\n            }\n        ]\n        mts.all_prompt_idx = 0\n\n        def fake_randint(low, high):\n            if low == 1 and high == 3:\n                return cluster_count\n            if low == 0 and high == 5:\n                return 0\n            if low == 2:\n                return 2\n            return next(position_iter)\n\n        def fake_np_choice(values, size=None, replace=True, p=None):\n            values = sorted(list(values))\n            if size is None:\n                return values[0]\n            return np.array(values[:size])\n\n        def fake_positive_timeseries(cnt, change_position=None, seq_len=256):\n            timeseries = [np.full(seq_len, change_position + offset, dtype=float) for offset in range(cnt)]\n            attributes = []\n            for _ in range(cnt):\n                pool = _base_attribute_pool(\"sudden increase\", change_position, seq_len)\n                pool[\"local\"][0].update(\n                    {\n                        \"type\": f\"change_at_{change_position}\",\n                        \"position_end\": change_position + 1,\n                        \"detail\": f\"change around point {change_position}\",\n                    }\n                )\n                attributes.append(pool)\n            return timeseries, attributes, change_position\n\n        def fake_negative_timeseries(cnt, positive_positions, seq_len=256):\n            self.assertEqual(cnt, 0)\n            return [], []\n\n        with patch.object(mts, \"SEQ_LEN\", seq_len), patch.object(mts, \"ENCODING_METHOD\", \"no\"):\n            with patch.object(mts.random, \"random\", return_value=0.9):\n                with patch.object(mts.random, \"choice\", side_effect=lambda seq: list(seq)[0]):\n                    with patch.object(mts.random, \"randint\", side_effect=fake_randint):\n                        with patch.object(mts.random, \"sample\", side_effect=lambda population, k: list(population)[:k]):\n                            with patch.object(mts.np.random, \"choice\", side_effect=fake_np_choice):\n                                with patch.object(mts.np.random, \"permutation\", side_effect=lambda n: np.arange(n)):\n                                    with patch.object(mts, \"generate_positive_timeseries\", side_effect=fake_positive_timeseries):\n                                        with patch.object(mts, \"generate_negative_timeseries\", side_effect=fake_negative_timeseries):\n                                            with patch.object(mts, \"timeseries_encoding\", side_effect=lambda ts, _method: (ts[:, None], \"<ts><ts/>\", {})):\n                                                with patch.object(mts, \"attribute_to_text\", return_value=\"description\"):\n                                                    (\n                                                        _original_timeseries,\n                                                        _combined_timeseries,\n                                                        combined_metrics,\n                                                        _combined_attributes,\n                                                        _prompt,\n                                                        _questions,\n                                                        _answers,\n                                                        _llm_prompts,\n                                                        _fields,\n                                                        _corr_pool,\n                                                        label,\n                                                    ) = mts.generate_prompt_data(seq_len)\n\n        clusters = label[\"label\"][\"clusters\"]\n        self.assertEqual(len(clusters), cluster_count)\n        self.assertEqual(label[\"label\"][\"positions\"], positions)\n        self.assertEqual([cluster[\"cluster_idx\"] for cluster in clusters], list(range(cluster_count)))\n        self.assertEqual([cluster[\"position\"] for cluster in clusters], positions)\n\n        prefix_to_position = {\"a\": 40, \"b\": 120, \"c\": 210}\n        for correlation in label[\"label\"][\"correlations\"]:\n            if correlation[\"label\"]:\n                prefixes = {metric[0] for metric in correlation[\"pair\"]}\n                self.assertEqual(len(prefixes), 1, correlation)\n                self.assertEqual(correlation[\"position\"], prefix_to_position[prefixes.pop()])\n                for metric in correlation[\"pair\"]:\n                    self.assertIn(metric, combined_metrics)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "blocks": []}], "tree": [".gitignore", "LICENSE", "README.md", "chatts/align/mts_local_llm_qa.py", "chatts/align/mts_local_template_qa.py", "chatts/align/mts_shape_llm_qa.py", "chatts/align/mts_shape_template_qa.py", "chatts/alig         btn.textContent = p.split("/").pop();
        btn.title = p;
        if (f && f.blocks.length) {
          var dot = document.createElement("span");
          dot.className = "ann-dot";
          dot.title = state.lang === "zh" ? "已生成注释" : "Annotated";
          btn.appendChild(dot);
        }
        if (idx !== undefined) btn.onclick = function () { selectFile(idx); };
        container.appendChild(btn);
      });
    }
    walk(nested, tree, 0);
  }

  function selectFile(i) {
    state.fileIndex = i;
    state.view = "reader";
    $("overview").classList.add("hidden");
    $("reading").classList.remove("hidden");
    renderTree();
    renderFile();
    $("content").scrollTop = 0;
  }

  function showOverview() {
    state.view = "overview";
    renderTree();
    $("reading").classList.add("hidden");
    $("file-note").classList.remove("visible");
    $("overview").classList.remove("hidden");
    $("crumb").textContent = t("overviewCrumb");
    renderOverview();
    $("content").scrollTop = 0;
  }

  function renderOverview() {
    var ov = $("overview");
    ov.innerHTML = "";
    var s = DATA.structure || {};
    var key = state.lang;
    var dirInfo = s.dirs || {};
    var fileInfo = s.files || {};
    var annotated = DATA.files.filter(function (f) { return f.blocks.length; }).length;

    var head = document.createElement("div");
    head.className = "ov-head";
    var title = document.createElement("h2");
    title.textContent = DATA.repo;
    head.appendChild(title);
    if (s["repo_" + key]) {
      var p = document.createElement("p");
      p.className = "ov-summary";
      p.innerHTML = renderMarkdownLite(s["repo_" + key]);
      head.appendChild(p);
    }
    var stats = document.createElement("div");
    stats.className = "ov-stats";
    stats.textContent = t("annotatedStats").replace("{a}", annotated).replace("{b}", DATA.files.length);
    head.appendChild(stats);
    ov.appendChild(head);

    var paths = (DATA.tree && DATA.tree.length) ? DATA.tree : DATA.files.map(function (f) { return f.path; });
    var nested = buildNested(paths);
    var list = document.createElement("div");
    list.className = "ov-tree";

    function walk(node, depth) {
      Object.keys(node.dirs).sort().forEach(function (name) {
        var d = node.dirs[name];
        var row = document.createElement("div");
        row.className = "ov-row ov-dir";
        row.style.paddingLeft = (depth * 22) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = name + "/";
        row.appendChild(nm);
        var info = dirInfo[d.path];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        list.appendChild(row);
        walk(d, depth + 1);
      });
      node.files.forEach(function (p) {
        var idx = fileIndexByPath[p];
        var row = document.createElement("div");
        row.className = "ov-row ov-file" + (idx !== undefined ? " clickable" : "");
        row.style.paddingLeft = (depth * 22 + 18) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = p.split("/").pop();
        if (idx !== undefined && DATA.files[idx].blocks.length) nm.classList.add("annotated");
        row.appendChild(nm);
        var info = fileInfo[p];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        if (idx !== undefined) {
          row.title = p;
          row.onclick = function () { selectFile(idx); };
        }
        list.appendChild(row);
      });
    }
    walk(nested, 0);
    ov.appendChild(list);
  }

  function renderFile() {
    var f = DATA.files[state.fileIndex];
    if (!f) { $("reading").innerHTML = ""; return; }
    $("crumb").textContent = f.path + "  ·  " + f.language;
    var note = $("file-note");
    var isRaw = !f.blocks.length;
    var noteText = state.lang === "zh" ? f.note_zh : f.note_en;
    if (isRaw) noteText = noteText || t("noAnnotation");
    note.textContent = noteText || "";
    note.classList.toggle("visible", !!noteText);

    var rawLines = f.code.replace(/\t/g, "    ").split("\n");
    var codeLines = highlightLines(f.code.replace(/\t/g, "    "), f.language);
    var reading = $("reading");
    reading.innerHTML = "";
    reading.classList.toggle("raw", isRaw);
    var key = state.lang;

    var blocks = isRaw
      ? [{ start: 1, end: rawLines.length, lines: [] }]
      : f.blocks;
    blocks.forEach(function (b) {
      if (isRaw && b.end - b.start < 1) return;
      var block = document.createElement("div");
      block.className = "block";

      var header = document.createElement("div");
      header.className = "block-header";
      if (isRaw) header.style.display = "none";
      var range = document.createElement("span");
      range.className = "range";
      range.textContent = "L" + b.start + "–" + b.end;
      var summary = document.createElement("span");
      summary.className = "summary";
      summary.innerHTML = b["summary_" + key] ? renderMarkdownLite(b["summary_" + key]) : "";
      header.appendChild(range);
      header.appendChild(summary);
      header.onclick = function () { block.classList.toggle("focused"); };
      block.appendChild(header);

      var expByLine = {};
      (b.lines || []).forEach(function (ln) { expByLine[ln.n] = ln[key]; });

      for (var n = b.start; n <= b.end; n++) {
        var row = document.createElement("div");
        row.className = "row";
        row.dataset.line = n;
        var codeCell = document.createElement("div");
        codeCell.className = "code-cell";
        var lineno = document.createElement("span");
        lineno.className = "lineno";
        lineno.textContent = n;
        var code = document.createElement("code");
        code.className = "code hljs";
        var idx = n - 1;
        code.innerHTML = (idx < codeLines.length && codeLines[idx]) || " ";
        codeCell.appendChild(lineno);
        codeCell.appendChild(code);

        var expCell = document.createElement("div");
        expCell.className = "exp-cell";
        var exp = expByLine[n] || "";
        if (exp) expCell.innerHTML = renderMarkdownLite(exp);
        // Mirror the code's indentation so the right pane reads like
        // natural-language pseudocode with the same nesting structure.
        var raw = rawLines[idx] || "";
        var spaces = (raw.match(/^ */) || [""])[0].length;
        var level = Math.min(Math.floor(spaces / 4), 10);
        expCell.style.paddingLeft = (20 + level * 18) + "px";

        row.appendChild(codeCell);
        row.appendChild(expCell);
        row.onclick = function () {
          var wasPinned = document.querySelector(".row.pinned");
          if (wasPinned) wasPinned.classList.remove("pinned");
          if (wasPinned !== this) this.classList.add("pinned");
        };
        block.appendChild(row);
      }
      reading.appendChild(block);
    });
  }

  function applyLang() {
    localStorage.setItem("mcr.lang", state.lang);
    document.documentElement.lang = state.lang === "zh" ? "zh" : "en";
    $("lang-toggle").textContent = state.lang === "zh" ? "EN" : "中";
    document.querySelector("#ask-panel .ask-title").textContent = t("askTitle");
    $("ask-input").placeholder = t("placeholder");
    $("overview-label").textContent = t("overview");
    if (state.view === "overview") {
      $("crumb").textContent = t("overviewCrumb");
      renderOverview();
    } else {
      renderFile();
    }
  }

  // ---------- selection → instant AI explanation ----------

  document.addEventListener("mouseup", function (e) {
    if ($("ask-panel").contains(e.target)) return;
    setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
      var anchor = sel.anchorNode;
      if (!anchor) return;
      var el = anchor.nodeType === 3 ? anchor.parentElement : anchor;
      var codeCell = el.closest ? el.closest(".code-cell") : null;
      if (!codeCell) return;

      var f = DATA.files[state.fileIndex];
      var startRow = codeCell.closest(".row");
      var focusEl = sel.focusNode && sel.focusNode.nodeType === 3
        ? sel.focusNode.parentElement : sel.focusNode;
      var endCell = focusEl && focusEl.closest ? focusEl.closest(".code-cell") : null;
      var endRow = endCell ? endCell.closest(".row") : startRow;
      var l1 = startRow ? parseInt(startRow.dataset.line, 10) : null;
      var l2 = endRow ? parseInt(endRow.dataset.line, 10) : l1;
      var text = sel.toString();
      if (l1 && l2 && l1 !== l2) {
        // A cross-row DOM selection also captures the right-pane explanation
        // cells. Rebuild the snippet from the actual source lines instead.
        var lo = Math.min(l1, l2), hi = Math.max(l1, l2);
        text = f.code.split("\n").slice(lo - 1, hi).join("\n");
      }
      if (text.length > 8000) text = text.slice(0, 8000);
      state.askContext = {
        file: f.path,
        language: f.language,
        selection: text,
        line: l1 && l2 ? Math.min(l1, l2) : l1,
        lineEnd: l1 && l2 ? Math.max(l1, l2) : l2
      };
      openAsk();
      if (state.serverAvailable) {
        askModel(t("autoExplain"), t("autoPrompt"));
      }
    }, 10);
  });

  function openAsk() {
    state.askSession++;
    state.busy = false;
    $("ask-send").disabled = false;
    $("ask-panel").classList.remove("hidden");
    var ctx = state.askContext;
    var ctxEl = $("ask-context");
    if (ctx) {
      var range = ctx.line ? (ctx.lineEnd && ctx.lineEnd !== ctx.line
        ? " · L" + ctx.line + "–" + ctx.lineEnd : " · L" + ctx.line) : "";
      ctxEl.textContent = ctx.file + range + "\n" +
        (ctx.selection.length > 600 ? ctx.selection.slice(0, 600) + " …" : ctx.selection);
      ctxEl.classList.remove("hidden");
    } else {
      ctxEl.classList.add("hidden");
    }
    $("ask-messages").innerHTML = "";
    state.history = [];
    if (!state.serverAvailable) {
      addMessage("ai", t("noServer"), true);
    }
  }

  function addMessage(role, text, raw) {
    var wrap = $("ask-messages");
    var div = document.createElement("div");
    div.className = "msg " + role;
    var label = document.createElement("div");
    label.className = "role";
    label.textContent = role === "user" ? (state.lang === "zh" ? "你" : "You") : "AI";
    var body = document.createElement("div");
    body.className = "body";
    if (raw) body.textContent = text; else body.innerHTML = renderMarkdownLite(text);
    div.appendChild(label);
    div.appendChild(body);
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return body;
  }

  function askModel(displayQuestion, prompt) {
    if (state.busy) return;
    state.busy = true;
    var session = state.askSession;
    addMessage("user", displayQuestion, true);
    var aiBody = addMessage("ai", t("thinking"), true);
    aiBody.classList.add("thinking");
    $("ask-send").disabled = true;
    var ctx = state.askContext || {};

    function scrollBottom() { $("ask-messages").scrollTop = $("ask-messages").scrollHeight; }

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        file: ctx.file || "",
        language: ctx.language || "",
        selection: ctx.selection || "",
        line: ctx.line || null,
        line_end: ctx.lineEnd || null,
        question: prompt,
        lang: state.lang,
        history: state.history
      })
    }).then(function (r) {
      var ctype = r.headers.get("Content-Type") || "";
      if (!r.ok || ctype.indexOf("text/plain") === -1 || !r.body) {
        return r.json().then(function (data) {
          throw new Error(data.error || ("HTTP " + r.status));
        });
      }
      // Streamed plain-text answer: render tokens as they arrive.
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var acc = "";
      var started = false;
      function pump() {
        return reader.read().then(function (res) {
          if (session !== state.askSession) { reader.cancel(); return null; }
          if (res.done) {
            state.history.push({ role: "user", content: prompt });
            state.history.push({ role: "assistant", content: acc });
            return null;
          }
          acc += decoder.decode(res.value, { stream: true });
          if (!started && acc.trim()) {
            started = true;
            aiBody.classList.remove("thinking");
          }
          if (started) {
            aiBody.innerHTML = renderMarkdownLite(acc);
            scrollBottom();
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      if (session !== state.askSession) return;
      aiBody.classList.remove("thinking");
      aiBody.textContent = t("error") + err.message;
    }).finally(function () {
      if (session !== state.askSession) return;
      state.busy = false;
      $("ask-send").disabled = false;
      $("ask-input").focus();
      scrollBottom();
    });
  }

  function sendQuestion() {
    var input = $("ask-input");
    var q = input.value.trim();
    if (!q || !state.serverAvailable || state.busy) return;
    input.value = "";
    askModel(q, q);
  }

  function checkServer() {
    if (location.protocol === "file:") return;
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (d) {
      state.serverAvailable = !!(d && d.ok && d.llm);
    }).catch(function () { state.serverAvailable = false; });
  }

  // ---------- wire up ----------

  $("sidebar-toggle").onclick = function () { $("sidebar").classList.toggle("collapsed"); };
  $("overview-btn").onclick = showOverview;
  $("lang-toggle").onclick = function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    applyLang();
  };
  $("font-dec").onclick = function () { state.fontSize = Math.max(10, state.fontSize - 1); applyFontSize(); };
  $("font-inc").onclick = function () { state.fontSize = Math.min(22, state.fontSize + 1); applyFontSize(); };
  $("ask-close").onclick = function () {
    state.askSession++;
    state.busy = false;
    $("ask-panel").classList.add("hidden");
  };
  $("ask-send").onclick = sendQuestion;
  $("ask-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendQuestion();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      state.askSession++;
      state.busy = false;
      $("ask-panel").classList.add("hidden");
    }
  });

  applyFontSize();
  renderTree();
  applyLang();
  checkServer();
})();
</script>
</body>
</html>
