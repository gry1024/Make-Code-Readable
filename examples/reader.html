<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-project · Make Code Readable</title>
<style>:root {
  --bg: #FCFCFC;
  --bg-sidebar: #F3F3F3;
  --bg-header: #F3F3F3;
  --bg-hover: #EBEBEB;
  --bg-pinned: #DBEAF7;
  --bg-block-header: #F5F5F5;
  --border: #DEDEDE;
  --text: #141414;
  --text-dim: #565656;
  --text-faint: #969696;
  --accent: #005293;
  --accent-soft: #E5EFF7;
  --code-font-size: 13px;
  --exp-font-size: 13.5px;
  --mono: Consolas, Menlo, Monaco, "Courier New", monospace;
  --ui: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
}
.hidden { display: none !important; }
button { font-family: var(--ui); cursor: pointer; }
.spacer { flex: 1; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 14px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#brand { font-weight: 600; font-size: 13px; letter-spacing: .2px; color: var(--text-dim); white-space: nowrap; }
#crumb {
  margin-left: 10px; font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#topbar button {
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; line-height: 1.4;
  transition: background .12s, color .12s;
}
#topbar button:hover { background: var(--bg-hover); color: var(--text); }
#sidebar-toggle { border: none !important; font-size: 15px; padding: 4px 8px; }
#lang-toggle { font-weight: 600; }

/* ---------- layout ---------- */
#main { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 264px; flex-shrink: 0;
  background: var(--bg-sidebar);
  order: 1; border-left: 1px solid var(--border);
  overflow-y: auto; padding: 12px 0;
}
#sidebar.collapsed { display: none; }
#repo-name {
  font-weight: 600; font-size: 12px; color: var(--text-dim);
  padding: 0 16px 8px; text-transform: uppercase; letter-spacing: .6px;
}
#overview-btn {
  display: block; width: calc(100% - 24px); margin: 0 12px 10px;
  text-align: left; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); color: var(--accent);
  padding: 7px 12px; font-size: 12.5px; font-weight: 600;
}
#overview-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- IDE file tree ---------- */
.tree-dir, .tree-file {
  display: flex; align-items: center; width: 100%; text-align: left;
  border: none; background: none; padding: 3px 12px 3px 0;
  font-size: 12.5px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-dir { font-weight: 500; color: #464646; }
.tree-dir .arrow { display: inline-block; width: 14px; color: var(--text-faint); font-size: 10px; }
.tree-dir:hover, .tree-file:hover { background: var(--bg-hover); color: var(--text); }
.tree-file { font-family: var(--ui); font-size: 13px; }
.tree-file.active { color: var(--text); background: #E1E1E1; }
.tree-file.disabled { opacity: .38; cursor: default; }
.tree-file.disabled:hover { background: none; color: var(--text-dim); }
.ann-dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  margin-left: auto; flex-shrink: 0;
}

#content { flex: 1; overflow: auto; min-width: 0; }

/* ---------- overview ---------- */
#overview { padding: 26px 34px 60px; max-width: 1100px; }
.ov-head h2 { margin: 0 0 10px; font-size: 22px; }
.ov-summary { font-size: 14px; line-height: 1.8; color: #414141; max-width: 760px; }
.ov-summary code, .ov-desc code {
  font-family: var(--mono); font-size: .92em;
  background: #EFEFEF; color: var(--accent); border-radius: 4px; padding: 0 4px;
}
.ov-stats { margin: 12px 0 22px; font-size: 12px; color: var(--text-dim); }
.ov-tree { border-top: 1px solid var(--border); }
.ov-row {
  display: flex; align-items: baseline; gap: 14px;
  padding: 5px 8px; border-bottom: 1px solid #EAEAEA;
}
.ov-dir .ov-name { font-weight: 500; color: #464646; font-size: 13px; }
.ov-file .ov-name { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
.ov-file .ov-name.annotated { color: var(--accent); font-weight: 600; }
.ov-file.clickable { cursor: pointer; }
.ov-file.clickable:hover { background: var(--bg-hover); }
.ov-file.clickable:hover .ov-name { color: var(--accent); }
.ov-desc { font-size: 12.5px; color: #555555; line-height: 1.6; }

/* ---------- reading grid ---------- */
#reading { padding: 10px 0 40vh; }
.block { margin: 0 0 6px; }
.block-header {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 20px;
  background: var(--bg-block-header);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.block-header .range {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  flex-shrink: 0; min-width: 74px;
}
.block-header .summary { font-size: 12.5px; font-weight: 600; color: #474747; }
.block-header:hover .summary { color: var(--accent); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row .code-cell {
  display: flex; min-width: 0;
  border-right: 1px solid var(--border);
  font-family: var(--mono); font-size: var(--code-font-size); line-height: 1.65;
  font-variant-ligatures: none;
}
.row .lineno {
  flex-shrink: 0; width: 52px; padding: 1px 14px 1px 0;
  text-align: right; color: var(--text-faint); user-select: none;
  font-size: calc(var(--code-font-size) - 1.5px); line-height: inherit;
}
.row .code {
  font-family: var(--mono); color: #141414;
  flex: 1; min-width: 0; padding: 1px 16px 1px 0;
  white-space: pre-wrap; word-break: break-all; tab-size: 4;
}
.row .exp-cell {
  min-width: 0; padding: 1px 24px 1px 20px;
  font-size: var(--exp-font-size); line-height: 1.65; color: #323232;
  overflow-wrap: break-word;
}
.row .exp-cell:empty::after { content: " "; }
.row .exp-cell code {
  font-family: var(--mono); font-size: calc(var(--exp-font-size) - 1px);
  background: #EFEFEF; color: #005293;
  border-radius: 4px; padding: 0 4px;
}
.row .exp-cell strong { color: #141414; }
.block-header .summary code {
  font-family: var(--mono); font-size: 11.5px;
  background: #EBEBEB; border-radius: 4px; padding: 0 4px;
}
.row:hover { background: var(--bg-hover); }
.row:hover .lineno { color: var(--text-dim); }
.row.pinned { background: var(--bg-pinned); }
.block.focused .row { background: var(--bg-hover); }

/* raw (unannotated) file view: code takes the full width */
#reading.raw .row { grid-template-columns: minmax(0, 1fr); }
#reading.raw .row .code-cell { border-right: none; }
#reading.raw .row .exp-cell { display: none; }

/* ---------- syntax highlighting: Cursor / VS Code Light+ palette ---------- */
.hljs-comment, .hljs-quote { color: #14141499; font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: #A30034; }
.hljs-string, .hljs-regexp, .hljs-addition { color: #7565CC; }
.hljs-number, .hljs-symbol, .hljs-bullet { color: #92156A; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #CD4500; }
.hljs-title.class_, .hljs-built_in { color: #005293; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #005293; }
.hljs-name, .hljs-selector-id, .hljs-selector-class { color: #005293; }
.hljs-meta { color: #A30034; }
.hljs-params { color: #141414; }
.hljs-deletion { color: #C0392B; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }

/* ---------- ask AI ---------- */
#ask-panel {
  position: fixed; right: 24px; bottom: 24px; z-index: 40;
  width: 640px; max-width: calc(100vw - 48px); height: 76vh; max-height: calc(100vh - 48px);
  display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 12px 48px rgba(60, 55, 40, .18);
  overflow: hidden;
}
#ask-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-header); font-weight: 600; font-size: 13px; color: var(--accent);
}
#ask-close { border: none; background: none; font-size: 20px; color: var(--text-dim); line-height: 1; }
#ask-context {
  padding: 8px 16px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
  max-height: 110px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
#ask-messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
.msg { margin-bottom: 16px; font-size: 13.5px; line-height: 1.75; }
.msg .role { font-size: 11px; font-weight: 600; color: var(--text-faint); margin-bottom: 4px; }
.msg.user .body {
  background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
}
.msg.ai .body { white-space: normal; }
.msg.ai .body code, .msg.ai .body pre {
  font-family: var(--mono); font-size: 12px; background: var(--bg-sidebar);
  border-radius: 4px; padding: 1px 5px;
}
.msg.ai .body pre { padding: 10px 12px; overflow-x: auto; white-space: pre; }
.msg.ai .body pre code { background: none; padding: 0; }
.msg .thinking { color: var(--text-faint); font-style: italic; }
#ask-input-row {
  display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
}
#ask-input {
  flex: 1; resize: none; border: 1px solid var(--border); border-radius: 8px;
  background: #fff; color: var(--text); font-family: var(--ui); font-size: 13px;
  padding: 8px 10px; outline: none;
}
#ask-input:focus { border-color: var(--accent); }
#ask-send {
  border: none; border-radius: 8px; background: var(--accent); color: #fff;
  padding: 0 14px; font-size: 14px;
}
#ask-send:disabled { opacity: .4; cursor: default; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #CACACA; border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #ABABAB; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: #C4DDF1; }

@media (max-width: 900px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .code-cell { border-right: none; }
  .row .exp-cell { padding-left: 68px; padding-bottom: 6px; color: #555555; }
  #sidebar { position: absolute; right: 0; z-index: 10; height: calc(100% - 44px); }
}
/* Tutorial and editor navigation */
#brand { padding: 0 15px; align-self: stretch; display: flex; align-items: center; background: var(--bg); border-inline: 1px solid var(--border); }
#crumb { font-family: var(--ui); }
#overview-btn { margin: 0 0 7px; padding: 6px 16px; width: 100%; border: 0; border-radius: 0; background: transparent; }
#sidebar { width: clamp(190px, 18vw, 295px); }

#overview { margin: 0 auto; }
#overview h2 { font-size: 26px; font-weight: 600; }
h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid #005293; outline-offset: -2px; }
.guide { display: grid; grid-template-columns: minmax(175px, .85fr) minmax(230px, 1.3fr); border-block: 1px solid var(--border); }
.map { padding: 20px 18px 20px 0; }
.graph { position: relative; padding-left: var(--rail); }
.graph svg { position: absolute; top: 0; left: 0; fill: none; stroke: #b8bfc4; }
.graph path.related { stroke: var(--accent); stroke-width: 1.7px; }
.concept { display: flex; align-items: center; height: 40px; position: relative; top: 3px; margin-bottom: 6px; padding: 3px 10px; font-size: 13px; color: #363636; border: 1px solid var(--border); border-radius: 4px; line-height: 1.25; overflow: auto; }
.concept[aria-current] { color: #005293; background: #edf4fa; border-color: #6490ae; font-weight: 600; }
.lesson { border-left: 1px solid var(--border); padding: 20px 0 20px 22px; }
.lesson p, .file-intro p { line-height: 1.7; margin: 8px 0 14px; }
.source-link { display: block; margin: 5px 0; }
.source-link small { display: block; font: 12px var(--mono); color: var(--text-dim); }
.relations { margin-top: 17px; }
.relations a { display: block; color: #485662; margin: 5px 0; font-size: 13px; }
.steps { display: flex; gap: 20px; margin-top: 16px; }
.file-index { margin-top: 22px; }
summary { cursor: pointer; font-weight: 600; }
#file-note { display: none; }
#file-note.visible { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--border); }
.file-heading, .file-intro { padding: 16px 20px; overflow-wrap: anywhere; }
.file-heading { border-right: 1px solid var(--border); }
.file-heading h2 { margin: 6px 0 10px; font: 500 19px var(--mono); }
.file-heading small { color: var(--text-dim); }
.outline { font-size: 13px; max-height: 220px; overflow: auto; }
.outline a { font-family: var(--mono); }
.outline small { font: 12px/1.5 var(--ui); }
.outline .method { margin-left: 14px; }
.row.target-line { background: #e9f2fb; box-shadow: inset 3px 0 #4082ae; }
.exp-cell .source-link { display: inline; font: 11px var(--mono); margin-right: 6px; color: #536b7c; }
@media(max-width: 900px) {
  #sidebar { width: min(75vw, 285px); }
  #file-note.visible { display: block; }
  .file-heading { border: 0; }
}
@media(max-width: 600px) {
  #overview { padding: 16px; }
  .guide { display: block; }
  .lesson { padding: 15px 0; border: 0; border-top: 1px solid var(--border); }
  #brand { display: none; }
  .ov-row { flex-wrap: wrap; }
}

.preview { margin-top: 12px; overflow-x: auto; font: var(--code-font-size)/1.6 var(--mono); }
.preview div { display: flex; width: max-content; }
.preview code { font: inherit; white-space: pre; }
.preview-number { display: inline-block; width: 3ch; margin-right: 12px; text-align: right; color: var(--text-faint); user-select: none; }
.file-heading > .source-link { font-size: 13px; }
@media(max-width: 600px) { .preview { display: none; } }

    <div class="spacer"></div>
    <button id="lang-toggle" title="Switch language">EN</button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
  </header>
  <div id="main">
    <nav id="sidebar">
      <div id="repo-name"></div>
      <button id="overview-btn">▦ <span id="overview-label">仓库总览</span></button>
      <div id="file-tree"></div>
    </nav>
    <div id="content">
      <div id="file-note"></div>
      <div id="overview" class="hidden"></div>
      <div id="reading"></div>
    </div>
  </div>
</div>

<div id="ask-panel" class="hidden">
  <div id="ask-header">
    <span>✦ <span class="ask-title">代码解读</span></span>
    <button id="ask-close">×</button>
  </div>
  <div id="ask-context"></div>
  <div id="ask-messages"></div>
  <div id="ask-input-row">
    <textarea id="ask-input" rows="2" placeholder=""></textarea>
    <button id="ask-send">➤</button>
  </div>
</div>

\n    while (!stopped && !shouldStop()) {\n      try {\n        await fn();\n      } catch (err) {\n        console.warn(\"poll iteration failed\", err);\n      }\n      await new Promise((r) => setTimeout(r, interval));\n    }\n  }\n  tick();\n  return () => { stopped = true; };\n}\n", "symbols": [{"name": "debounce", "start": 3, "end": 9, "zh": "只保留最后一次事件", "en": "Coalesces events into one trailing call"}, {"name": "ApiClient", "start": 11, "end": 48, "zh": "管理 HTTP 请求策略", "en": "Holds the HTTP policy"}, {"name": "ApiClient.constructor", "start": 12, "end": 16, "zh": "保存端点与默认预算", "en": "Stores the endpoint and budgets"}, {"name": "ApiClient.request", "start": 18, "end": 39, "zh": "执行请求并控制重试与超时", "en": "Executes attempts under one deadline"}, {"name": "ApiClient.get", "start": 41, "end": 43, "zh": "读取资源", "en": "Reads a resource"}, {"name": "ApiClient.post", "start": 45, "end": 47, "zh": "发送 JSON", "en": "Sends JSON"}, {"name": "poll", "start": 50, "end": 64, "zh": "串行轮询，返回停止函数", "en": "Polls serially and returns a stop function"}], "blocks": [{"start": 1, "end": 10, "summary_zh": "只执行一串事件中的最后一次调用", "summary_en": "Keep the last call in a burst", "lines": [{"n": 1, "end": 5, "zh": "每次创建防抖函数都会得到独立的计时器；同一个包装函数处理的后续事件共享它。", "en": "Each wrapper owns its timer. All later events handled by that wrapper share it."}, {"n": 6, "end": 9, "zh": "后来的调用撤销前一次预约。经过一段安静时间，最后调用的参数和接收者才被交给 fn。", "en": "A new call cancels its predecessor. After a quiet interval, fn receives the last call’s arguments and receiver."}]}, {"start": 11, "end": 17, "summary_zh": "同一客户端共享基础地址和策略", "summary_en": "Share endpoint and policy across calls", "lines": [{"n": 11, "end": 16, "zh": "移除地址末尾的斜杠，并为每次 request 保存超时和最大重试次数。", "en": "Strip the trailing slash and store the timeout and retry budget used by each request."}]}, {"start": 18, "end": 40, "summary_zh": "一次逻辑请求可包含多次网络尝试", "summary_en": "One logical request may span several attempts", "lines": [{"n": 18, "end": 21, "zh": "在循环外启动中止时钟，所有尝试共用同一个截止时间。", "        task.fn(*task.args, **task.kwargs)\n            except Exception:\n                traceback.print_exc()\n                if task.retries_left > 0:\n                    task.retries_left -= 1\n                    backoff = min(2 ** (3 - task.retries_left), 30)\n                    self.submit(task.fn, *task.args, retries=task.retries_left,\n                                delay=backoff, **task.kwargs)\n            finally:\n                self._queue.task_done()\n\n    def join(self):\n        \"\"\"Block until every queued task has finished.\"\"\"\n        self._queue.join()\n\n    def shutdown(self):\n        self._stopped.set()\n        for t in self._workers:\n            t.join(timeout=1)\n", "symbols": [{"name": "Task", "start": 11, "end": 16, "zh": "保存一次可重试的调用", "en": "Carries a retryable invocation"}, {"name": "TaskQueue", "start": 19, "end": 74, "zh": "协调调度、执行与退出", "en": "Coordinates scheduling, execution and shutdown"}, {"name": "TaskQueue.__init__", "start": 27, "end": 36, "zh": "启动消费同一队列的线程", "en": "Starts workers sharing one queue"}, {"name": "TaskQueue.submit", "start": 38, "end": 44, "zh": "给任务分配到期时间和平局序号", "en": "Assigns a deadline and a tie-breaker"}, {"name": "TaskQueue._run", "start": 46, "end": 65, "zh": "执行并在失败后重新入队", "en": "Runs an attempt and requeues eligible failures"}, {"name": "TaskQueue.join", "start": 67, "end": 69, "zh": "等待所有队列条目结清", "en": "Waits for all queue entries"}, {"name": "TaskQueue.shutdown", "start": 71, "end": 74, "zh": "通知线程结束循环", "en": "Signals workers to leave the loop"}], "blocks": [{"start": 1, "end": 18, "summary_zh": "一次调用如何跨线程保存", "summary_en": "Carry an invocation across threads", "lines": [{"n": 1, "end": 7, "zh": "队列、时钟和同步原语来自标准库，所有任务都留在当前进程。", "en": "The standard library provides the queue, clock and synchronization. All jobs stay in this process."}, {"n": 10, "end": 16, "zh": "保存函数、两类参数及重试预算。每个任务单独创建关键字参数字典，两个任务不会共享默认字典。", "en": "Capture the callable, arguments and retry budget. Each task gets its own default keyword dictionary."}]}, {"start": 19, "end": 37, "summary_zh": "在接收任务前启动工作线程", "summary_en": "Start the consumers before accepting jobs", "lines": [{"n": 19, "end": 25, "zh": "后台线程可以重复执行同一函数，提交有副作用的操作时需要考虑重复执行。", "en": "A failed callable may run again, which matters for a job that already performed a side effect."}, {"n": 27, "end": 32, "zh": "优先队列保存待领任务；序号和锁解决同一到期时间的排序，事件通知所有线程退出。", "en": "The priority queue holds pending work. The lock and counter break deadline ties, and one event signals shutdown."}, {"n": 33, "end": 36, "zh": "每个线程进入同一个取件循环。保存线程句柄以便关闭时等待它退出。", "en": "Each thread enters the same consumer loop. Its handle is kept so shutdown can wait for it."}]}, {"start": 38, "end": 45, "summary_zh": "把相对延迟转成可排序的截止时间", "summary_en": "Convert a delay into a sortable deadline", "lines": [{"n": 38, "end": 39, "zh": "调用立即返回，函数稍后才在工作线程上执行。", "en": "Submission returns before the worker executes the function."}, {"n": 40, "end": 42, "zh": "在锁内领取唯一序号；多个提交者不会拿到同一个平局排序键。", "en": "Claim a unique tie-breaker while holding the lock so concurrent submitters cannot reuse it."}, {"n": 43, "end": 44, "zh": "以单调时钟计算最早运行时刻。队列先比时间，再比序号，最后一个字段才是任务。", "en": "Compute a due time on the monotonic clock. Entries sort by time, then sequence, with the job carried as payload."}]}, {"start": 46, "end": 66, "summary_zh": "执行一次尝试并结清队列计数", "summary_en": "Execute and account for one attempt", "lines": [{"n": 46, "end": 51, "zh": "每隔至多 0.2 秒重新检查停止事件，因此空队列上的线程也能退出。", "en": "A timed dequeue lets an idle worker recheck the stop event every 0.2 seconds."}, {"n": 52, "end": 56, "zh": "取到未来任务的线程等待到期，再用保存的参数调用函数。停止事件也会唤醒等待；此处醒来后仍会调用函数。", "en": "A worker holds a future job until its wait ends, then restores the arguments. A stop signal can also end this wait and execution still proceeds."}, {"n": 57, "end": 61, "zh": "记录异常，再扣除一次重试预算。延迟随剩余预算减少而增加，上限 30 秒。", "en": "Log the failure and spend one retry. The delay grows as the remaining budget shrinks and is capped at 30 seconds."}, {"n": 62, "end": 65, "zh": "重试走同一条提交路径，得到新的到期时间。旧尝试无论成功与否都要结清，否则 join 将一直等待。", "en": "Resubmission creates a fresh deadline. The old attempt must be marked done even on failure or join could wait forever."}]}, {"start": 67, "end": 74, "summary_zh": "等待任务与停止线程是两种操作", "summary_en": "Waiting for work and stopping workers", "lines": [{"n": 67, "end": 69, "zh": "等待队列中每个条目都被标记完成，包括重试时新建的条目。", "en": "Wait for every enqueued entry, including retries, to be marked done."}, {"n": 71, "end": 74, "zh": "广播停止信号，并给每个线程至多一秒退出；此方法本身不保证队列已排空。", "en": "Broadcast shutdown and wait up to a second per worker. This call alone does not guarantee the queue has drained."}]}]}], "tree": ["frontend.js", "task_queue.py"], "structure": {"repo_zh": "一次提交可以触发多次执行。沿一件任务从入队到重试的路径，观察线程之间传递了哪些信息。最后比较独立的浏览器工具如何为请求设置时间预算。", "repo_en": "One submission can trigger several attempts. Follow a job from enqueue to retry, then compare the independent browser client’s timeout policy.", "dirs": {}, "files": {"task_queue.py": {"zh": "线程池任务队列：优先级队列调度，失败指数退避重试", "en": "Thread-pool task queue: priority scheduling with backoff retries"}, "frontend.js": {"zh": "浏览器工具：debounce 防抖、带超时重试的 API 客户端、轮询", "en": "Browser helpers: debounce, timeout/retry API client, polling"}}, "chapters": [{"id": "submit", "title": {"zh": "任务如何排队？", "en": "How does a job enter the queue?"}, "body": {"zh": "假设两个线程同时提交到期时间相同的任务。队列先比较到期时间，再比较锁内分配的序号，因此无需比较两个函数对象。调用方在任务入队后就可以继续工作。", "en": "Suppose two threads submit jobs with the same deadline. The tie-breaking sequence number is assigned under a lock, so the queue never has to compare callable objects. The caller can proceed as soon as the job is queued."}, "refs": [{"file": "task_queue.py", "start": 38, "end": 44, "zh": "看队列条目的三个字段", "en": "Inspect the three fields of a queue entry"}]}, {"id": "worker", "title": {"zh": "谁负责执行？", "en": "Who actually runs the job?"}, "body": {"zh": "工作线程取出最早到期的条目。若时机未到，这个线程持有任务并等待；真正调用函数时，它从任务对象恢复原始参数。", "en": "A worker takes the earliest queued entry. If it is early, that worker holds the job while waiting. Once due, it invokes the callable with the original arguments."}, "refs": [{"file": "task_queue.py", "start": 46, "end": 56, "zh": "从队列取出并执行", "en": "Trace dequeue to invocation"}]}, {"id": "retry", "title": {"zh": "失败后如何重试？", "en": "What happens after a failure?"}, "body": {"zh": "设初始重试次数为 2。第一次失败后还剩 1 次计数，代码计算出 4 秒延迟并重新入队。新的队列条目有自己的完成计数，旧条目在 finally 中结清。", "en": "With a retry budget of two, the first failure reduces the counter to one and schedules a fresh entry four seconds later. That entry has its own completion count. The finally block accounts for the attempt that just ended."}, "refs": [{"file": "task_queue.py", "start": 57, "end": 65, "zh": "追踪剩余次数与重新入队", "en": "Follow the retry budget and resubmission"}]}, {"id": "client", "title": {"zh": "浏览器怎样限制等待？", "en": "How does the browser bound waiting?"}, "body": {"zh": "浏览器工具独立运行。一次 request 的所有尝试共用一个中止信号和计时器；重试等待也消耗这份时间预算。对照工作线程，每次重新入队都会得到新的到期时间。", "en": "The browser helper runs independently. Every attempt within one request shares an abort signal and a timer, so backoff consumes the same deadline. The worker queue, by contrast, assigns each resubmission its own due time."}, "refs": [{"file": "frontend.js", "start": 18, "end": 35, "zh": "定位共享的请求期限", "en": "Locate the shared request deadline"}]}], "edges": [{"from": "submit", "to": "worker", "zh": "传递到期时间、序号和任务", "en": "Passes deadline, sequence and task"}, {"from": "worker", "to": "retry", "zh": "调用抛出异常", "en": "Invocation raises"}, {"from": "retry", "to": "submit", "zh": "带延迟重新提交", "en": "Resubmits with a delay"}]}};</script>
<script>(function () {
  "use strict";

  var DATA = window.MCR_DATA;
  var state = {
    lang: localStorage.getItem("mcr.lang") || "zh",
    fontSize: parseFloat(localStorage.getItem("mcr.fontSize") || "14"),
    fileIndex: 0,
    serverAvailable: false,
    askContext: null,
    history: [],
    askSession: 0,
    busy: false,
    view: "reader",
    collapsed: Object.create(null)
  };

  var $ = function (id) { return document.getElementById(id); };

  var I18N = {
    zh: {
      askTitle: "代码解读",
      placeholder: "继续追问这段代码… (Enter 发送)",
      autoExplain: "解释这段代码",
      autoPrompt: "用 2-3 句话概括我选中代码的作用，再指出最关键的逻辑或坑。控制在 250 字以内，不要逐行罗列；我追问时再展开细节。",
      noServer: "当前为离线 HTML，未连接本地服务。\n要使用划词提问，请在项目目录运行：\n\npython -m mcr.serve <repo> --annotations <dir>\n\n并设置环境变量 MCR_API_KEY（OpenAI 兼容接口）。",
      thinking: "正在解读选中代码…", error: "请求失败：",
      sendError: "发送失败，请重试。",
      overview: "仓库总览", overviewCrumb: "仓库导读",
      annotatedStats: "{a} / {b} 个源文件附有双语讲解",
      noAnnotation: "该文件尚未生成注释，仅展示源代码。"
    },
    en: {
      askTitle: "Code Explainer",
      placeholder: "Ask a follow-up about this code… (Enter to send)",
      autoExplain: "Explain this code",
      autoPrompt: "Summarize what my selected code does in 2-3 sentences, then point out the most important logic or pitfall. Keep it under 150 words; don't go line by line — I'll ask follow-ups for details.",
      noServer: "This is an offline HTML file with no local server attached.\nTo enable code questions, run:\n\npython -m mcr.serve <repo> --annotations <dir>\n\nand set MCR_API_KEY (OpenAI-compatible API).",
      thinking: "Explaining the selection…", error: "Request failed: ",
      sendError: "Failed to send. Please retry.",
      overview: "Overview", overviewCrumb: "Repository guide",
      annotatedStats: "{a} of {b} source files have bilingual guides",
      noAnnotation: "No annotations for this file yet — showing source code only."
    }
  };
  function t(key) { return I18N[state.lang][key]; }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderMarkdownLite(text) {
    var esc = escapeHtml(text);
    esc = esc.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      return "<pre><code>" + code.replace(/^\n+|\n+$/g, "") + "</code></pre>";
    });
    esc = esc.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    esc = esc.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    esc = esc.replace(/^#{1,4}\s+(.+)$/gm, "<strong class=\"md-h\">$1</strong>");
    esc = esc.replace(/^[ \t]*[-*]\s+/gm, "• ");
    esc = esc.replace(/\n/g, "<br>");
    return esc;
  }

  // Highlight the whole file once, then split into per-line HTML while
  // re-balancing <span> tags that cross line boundaries (multi-line strings,
  // block comments, etc.), so each rendered line stays independently valid.
  function highlightLines(code, lang) {
    var html;
    try {
      html = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
    } catch (e) {
      html = escapeHtml(code);
    }
    var lines = [];
    var stack = [];
    var cur = "";
    var re = /(<span[^>]*>|<\/span>|\n|[^<\n]+|<)/g;
    var m;
    while ((m = re.exec(html)) !== null) {
      var tok = m[0];
      if (tok === "\n") {
        cur += new Array(stack.length + 1).join("</span>");
        lines.push(cur);
        cur = stack.join("");
      } else if (tok === "</span>") {
        stack.pop();
        cur += tok;
      } else if (tok.slice(0, 5) === "<span") {
        stack.push(tok);
        cur += tok;
      } else {
        cur += tok;
      }
    }
    lines.push(cur);
    return lines;
  }

  function applyFontSize() {
    document.documentElement.style.setProperty("--code-font-size", state.fontSize + "px");
    document.documentElement.style.setProperty("--exp-font-size", (state.fontSize + 0.5) + "px");
    localStorage.setItem("mcr.fontSize", String(state.fontSize));
  }

  var fileIndexByPath = Object.create(null);
  DATA.files.forEach(function (f, i) { fileIndexByPath[f.path] = i; });

  // Embedded inside the reader closure by mcr.build.
const chapters = DATA.structure.chapters || [];
const edges = DATA.structure.edges || [];
const params = () => new URLSearchParams(location.hash.slice(1));
const currentChapter = () => chapters.find(c => c.id === params().get("chapter")) || chapters[0];
const caption = (zh, en) => state.lang === "zh" ? zh : en;

function el(tag, cls, value) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (value) node.textContent = value;
  return node;
}
function link(values, label, cls) {
  const a = el("a", cls, label);
  a.href = "#" + new URLSearchParams(values);
  return a;
}
function chapterLink(chapter, label, cls) {
  return link({chapter: chapter.id}, label, cls);
}
function evidence(file, start, end, label) {
  const target = {file, start, end};
  if (chapters.length && params().has("chapter")) target.chapter = currentChapter().id;
  return link(target, label, "source-link");
}

function renderTutorial(container) {
  if (!chapters.length) return;
  const selected = currentChapter();
  const lang = state.lang;
  const guide = el("section", "guide");
  const map = el("nav", "map");
  map.setAttribute("aria-label", caption("架构图", "Architecture map"));
  map.append(el("h3", "", caption("架构图", "Architecture map")));
  // Each row is a concept. Arcs use separate lanes so branches and feedback
  // can reach their actual targets without implying a linear runtime pipeline.
  const graph = el("div", "graph");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  const width = 18 + Math.min(edges.length, 8) * 5;
  const rowHeight = 46;
  svg.setAttribute("width", width);
  svg.setAttribute("height", chapters.length * rowHeight);
  svg.setAttribute("aria-hidden", "true");
  graph.style.setProperty("--rail", width + "px");
  graph.append(svg);
  edges.forEach((edge, i) => {
    const y = id => (chapters.findIndex(c => c.id === id) + 0.5) * rowHeight;
    const from = y(edge.from) - 3, to = y(edge.to) + 3;
    const lane = width - 12 - (i % 8) * 5;
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", `M ${width} ${from} H ${lane} V ${to} H ${width-2} m -4 -3 l 4 3 -4 3`);
    p.setAttribute("class", edge.from === selected.id || edge.to === selected.id ? "related" : "");
    const title = document.createElementNS(svgNS, "title");
    title.textContent = edge[lang];
    p.append(title);
    svg.append(p);
  });
  chapters.forEach(ch => {
    const node = chapterLink(ch, ch.title[lang], "concept");
    if (ch === selected) node.setAttribute("aria-current", "step");
    graph.append(node);
  });
  map.append(graph);
  const lesson = el("article", "lesson");
  lesson.append(el("h3", "", selected.title[lang]));
  const body = el("p");
  body.innerHTML = renderMarkdownLite(selected.body[lang]);
  lesson.append(body);
  for (const ref of selected.refs) {
    const a = evidence(ref.file, ref.start, ref.end, ref[lang]);
    // Retain chapter context even on the initial, hashless overview.
    a.href = "#" + new URLSearchParams({file:ref.file, start:ref.start, end:ref.end, chapter:selected.id});
    a.append(el("small", "", ref.file + " · L" + ref.start + "–" + ref.end));
    lesson.append(a);
  }
  const relations = el("div", "relations");
  for (const edge of edges.filter(e => e.from === selected.id || e.to === selected.id)) {
    const outgoing = edge.from === selected.id;
    const other = chapters.find(c => c.id === (outgoing ? edge.to : edge.from));
    relations.append(chapterLink(other, (outgoing ? "→ " : "← ") + other.title[lang] + " · " + edge[lang]));
  }
  lesson.append(relations);
  const i = chapters.indexOf(selected), steps = el("div", "steps");
  if (i) steps.append(chapterLink(chapters[i-1], caption("‹ 上一章", "‹ Previous")));
  if (i+1 < chapters.length) steps.append(chapterLink(chapters[i+1], caption("下一章 ›", "Next ›")));
  lesson.append(steps);
  guide.append(map, lesson);
  container.append(guide);
}

function renderFileIntro(file, note) {
  note.replaceChildren();
  note.classList.add("visible");
  const left = el("div", "file-heading");
  left.append(el("small", "", caption("源代码", "Source")), el("h2", "", file.path.split("/").pop()));
  if (chapters.length && params().has("chapter"))
    left.append(chapterLink(currentChapter(), "‹ " + currentChapter().title[state.lang]));
  // Show the implementation the tutorial discusses while the outline is open.
  const relevant = chapters.flatMap(ch => ch.refs.filter(r => r.file === file.path));
  if (relevant.length) {
    const ref = relevant[0];
    left.append(evidence(file.path, ref.start, ref.end, ref[state.lang]));
    const code = highlightLines(file.code, file.language);
    const preview = el("div", "preview");
    for (let n = ref.start; n <= Math.min(ref.end, ref.start + 6); n++) {
      const line = el("div");
      line.append(el("span", "preview-number", String(n)));
      const token = el("code");
      token.innerHTML = code[n - 1];
      line.append(token);
      preview.append(line);
    }
    left.append(preview);
  }
  const right = el("section", "file-intro");
  right.append(el("h3", "", caption("文件导读", "File guide")));
  const description = (DATA.structure.files || {})[file.path];
  const text = file["note_" + state.lang] || (description && description[state.lang]);
  if (text) {
    const p = el("p");
    p.innerHTML = renderMarkdownLite(text);
    right.append(p);
  } else if (!file.blocks.length) right.append(el("p", "", t("noAnnotation")));
  if (file.symbols.length) {
    const outline = el("details", "outline");
    outline.open = true;
    outline.append(el("summary", "", caption("类与函数", "Classes and functions")));
    file.symbols.forEach(sym => {
      const a = evidence(file.path, sym.start, sym.end, sym.name);
      if (sym.name.includes(".")) a.classList.add("method");
      if (sym[state.lang]) a.append(el("small", "", sym[state.lang]));
      outline.append(a);
    });
    right.append(outline);
  }
  note.append(left, right);
}

function followLocation() {
  const q = params();
  const idx = fileIndexByPath[q.get("file")];
  if (idx === undefined) { showOverview(); return; }
  selectFile(idx);
  const start = Number(q.get("start")), end = Number(q.get("end"));
  const first = $("reading").querySelector('.row[data-line="' + start + '"]');
  if (!first) return;
  for (const row of $("reading").querySelectorAll(".row")) {
    const n = Number(row.dataset.line);
    if (n >= start && n <= end) row.classList.add("target-line");
  }
  first.scrollIntoView({block:"center"});
}


  function buildNested(paths) {
    var root = { dirs: Object.create(null), files: [] };
    paths.forEach(function (p) {
      var parts = p.split("/");
      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        var d = parts[i];
        if (!node.dirs[d]) {
          node.dirs[d] = { dirs: Object.create(null), files: [], path: parts.slice(0, i + 1).join("/") };
        }
        node = node.dirs[d];
      }
      node.files.push(p);
    });
    return root;
  }

  // Keep build artifacts out of the initial explorer while exposing the learning path.
  const guidedDirs = new Set();
  function parents(path) {
    const parts = path.split("/");
    return parts.slice(0, -1).map((_, i) => parts.slice(0, i + 1).join("/"));
  }
  DATA.files.filter(f => f.blocks.length).forEach(f => parents(f.path).forEach(p => guidedDirs.add(p)));
  (DATA.tree || []).forEach(path => parents(path).forEach(p => {
    if (!guidedDirs.has(p)) state.collapsed[p] = true;
  }));

  function renderTree() {
    var tree = $("file-tree");
    tree.innerHTML = "";
    $("repo-name").textContent = DATA.repo;
    var paths = (DATA.tree && DATA.tree.length) ? DATA.tree : DATA.files.map(function (f) { return f.path; });
    var nested = buildNested(paths);

    function walk(node, container, depth) {
      Object.keys(node.dirs).sort().forEach(function (name) {
        var d = node.dirs[name];
        var collapsed = !!state.collapsed[d.path];
        var row = document.createElement("button");
        row.className = "tree-dir";
        row.style.paddingLeft = (12 + depth * 14) + "px";
        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = collapsed ? "▸" : "▾";
        row.appendChild(arrow);
        row.appendChild(document.createTextNode(" " + name));
        row.setAttribute("aria-expanded", String(!collapsed));
        row.onclick = function () {
          if (collapsed) delete state.collapsed[d.path]; else state.collapsed[d.path] = true;
          renderTree();
        };
        container.appendChild(row);
        if (!collapsed) walk(d, container, depth + 1);
      });
      node.files.forEach(function (p) {
        var idx = fileIndexByPath[p];
        var f = idx !== undefined ? DATA.files[idx] : null;
        var btn = document.createElement("button");
        btn.className = "tree-file";
        if (state.view === "reader" && idx === state.fileIndex) btn.classList.add("active");
        if (idx === undefined) btn.classList.add("disabled");
        btn.style.paddingLeft = (26 + depth * 14) + "px";
        const base = p.split("/").pop();
        const ext = base.includes(".") ? base.split(".").pop().toLowerCase() : "";
        const icon = el("span", "file-icon");
        icon.dataset.ext = ext;
        icon.setAttribute("aria-hidden", "true");
        btn.append(icon, document.createTextNode(base));
        btn.title = p;
        if (f && f.blocks.length) {
          var dot = document.createElement("span");
          dot.className = "ann-dot";
          dot.title = state.lang === "zh" ? "已生成注释" : "Annotated";
          btn.appendChild(dot);
        }
        if (idx !== undefined) btn.onclick = function () { openPath(p); };
        container.appendChild(btn);
      });
    }
    walk(nested, tree, 0);
  }

  function navigate(hash) {
    if (hash !== location.hash) history.pushState(null, "", hash);
    followLocation();
  }

  // Resolve internal links during the click so the visible selection and URL
  // always agree. Modified clicks retain the browser's native tab behavior.
  document.addEventListener("click", function (event) {
    const a = event.target.closest("a[href^='#']");
    if (!a || event.button !== 0 || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) return;
    event.preventDefault();
    navigate(a.hash);
  });

  function openPath(path) {
    const hash = "#" + new URLSearchParams({file:path});
    navigate(hash);
    if (matchMedia("(max-width: 900px)").matches) $("sidebar").classList.add("collapsed");
  }

  function selectFile(i) {
    parents(DATA.files[i].path).forEach(p => delete state.collapsed[p]);
    state.fileIndex = i;
    state.view = "reader";
    $("overview").classList.add("hidden");
    $("reading").classList.remove("hidden");
    renderTree();
    renderFile();
    $("content").scrollTop = 0;
  }

  function showOverview() {
    state.view = "overview";
    renderTree();
    $("reading").classList.add("hidden");
    $("file-note").classList.remove("visible");
    $("overview").classList.remove("hidden");
    $("crumb").textContent = t("overviewCrumb");
    renderOverview();
    $("content").scrollTop = 0;
  }

  function renderOverview() {
    var ov = $("overview");
    ov.innerHTML = "";
    var s = DATA.structure || {};
    var key = state.lang;
    var dirInfo = s.dirs || {};
    var fileInfo = s.files || {};
    var annotated = DATA.files.filter(function (f) { return f.blocks.length; }).length;

    var head = document.createElement("div");
    head.className = "ov-head";
    var title = document.createElement("h2");
    title.textContent = DATA.repo;
    head.appendChild(title);
    if (s["repo_" + key]) {
      var p = document.createElement("p");
      p.className = "ov-summary";
      p.innerHTML = renderMarkdownLite(s["repo_" + key]);
      head.appendChild(p);
    }
    var stats = document.createElement("div");
    stats.className = "ov-stats";
    stats.textContent = t("annotatedStats").replace("{a}", annotated).replace("{b}", DATA.files.length);
    head.appendChild(stats);
    ov.appendChild(head);
    renderTutorial(ov);

    var paths = (DATA.tree && DATA.tree.length) ? DATA.tree : DATA.files.map(function (f) { return f.path; });
    var nested = buildNested(paths);
    var list = document.createElement("div");
    list.className = "ov-tree";

    function walk(node, depth) {
      Object.keys(node.dirs).sort().forEach(function (name) {
        var d = node.dirs[name];
        var row = document.createElement("div");
        row.className = "ov-row ov-dir";
        row.style.paddingLeft = (depth * 22) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = name + "/";
        row.appendChild(nm);
        var info = dirInfo[d.path];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        list.appendChild(row);
        walk(d, depth + 1);
      });
      node.files.forEach(function (p) {
        var idx = fileIndexByPath[p];
        var row = document.createElement("div");
        row.className = "ov-row ov-file" + (idx !== undefined ? " clickable" : "");
        row.style.paddingLeft = (depth * 22 + 18) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = p.split("/").pop();
        if (idx !== undefined && DATA.files[idx].blocks.length) nm.classList.add("annotated");
        row.appendChild(nm);
        var info = fileInfo[p];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        if (idx !== undefined) {
          row.title = p;
          row.onclick = function () { openPath(p); };
        }
        list.appendChild(row);
      });
    }
    walk(nested, 0);
    const index = el("details", "file-index");
    index.open = !chapters.length;
    index.append(el("summary", "", caption("目录与文件职责", "Directory and file guide")), list);
    ov.append(index);
  }

  function renderFile() {
    var f = DATA.files[state.fileIndex];
    if (!f) { $("reading").innerHTML = ""; return; }
    $("crumb").replaceChildren();
    if (chapters.length && params().has("chapter")) {
      $("crumb").append(chapterLink(currentChapter(), currentChapter().title[state.lang]), "  ›  ");
    }
    $("crumb").append(f.path + "  ·  " + f.language);
    var note = $("file-note");
    var isRaw = !f.blocks.length;
    renderFileIntro(f, note);

    var rawLines = f.code.replace(/\t/g, "    ").split("\n");
    var codeLines = highlightLines(f.code.replace(/\t/g, "    "), f.language);
    var reading = $("reading");
    reading.innerHTML = "";
    reading.classList.toggle("raw", isRaw);
    var key = state.lang;

    var blocks = isRaw
      ? [{ start: 1, end: rawLines.length - (rawLines[rawLines.length - 1] === "" ? 1 : 0), lines: [] }]
      : f.blocks;
    blocks.forEach(function (b) {
      if (b.end < b.start) return;
      var block = document.createElement("div");
      block.className = "block";

      var header = document.createElement("div");
      header.className = "block-header";
      if (isRaw) header.style.display = "none";
      var range = document.createElement("span");
      range.className = "range";
      range.textContent = "L" + b.start + "–" + b.end;
      var summary = document.createElement("span");
      summary.className = "summary";
      summary.innerHTML = b["summary_" + key] ? renderMarkdownLite(b["summary_" + key]) : "";
      header.appendChild(range);
      header.appendChild(summary);
      header.onclick = function () { block.classList.toggle("focused"); };
      block.appendChild(header);

      var expByLine = {};
      (b.lines || []).forEach(function (ln) { expByLine[ln.n] = ln; });

      for (var n = b.start; n <= b.end; n++) {
        var row = document.createElement("div");
        row.className = "row";
        row.dataset.line = n;
        var codeCell = document.createElement("div");
        codeCell.className = "code-cell";
        var lineno = document.createElement("span");
        lineno.className = "lineno";
        lineno.textContent = n;
        var code = document.createElement("code");
        code.className = "code hljs";
        var idx = n - 1;
        code.innerHTML = (idx < codeLines.length && codeLines[idx]) || " ";
        codeCell.appendChild(lineno);
        codeCell.appendChild(code);

        var expCell = document.createElement("div");
        expCell.className = "exp-cell";
        const explanation = expByLine[n];
        if (explanation) {
          if (explanation.end > n) {
            expCell.append(evidence(f.path, n, explanation.end, "L" + n + "–" + explanation.end));
          }
          const words = el("span");
          words.innerHTML = renderMarkdownLite(explanation[key]);
          expCell.append(words);
        }

        row.appendChild(codeCell);
        row.appendChild(expCell);
        row.onclick = function () {
          var wasPinned = document.querySelector(".row.pinned");
          if (wasPinned) wasPinned.classList.remove("pinned");
          if (wasPinned !== this) this.classList.add("pinned");
        };
        block.appendChild(row);
      }
      reading.appendChild(block);
    });
  }

  function applyLang() {
    localStorage.setItem("mcr.lang", state.lang);
    document.documentElement.lang = state.lang === "zh" ? "zh" : "en";
    $("lang-toggle").textContent = state.lang === "zh" ? "EN" : "中";
    document.querySelector("#ask-panel .ask-title").textContent = t("askTitle");
    $("ask-input").placeholder = t("placeholder");
    $("overview-label").textContent = t("overview");
    if (state.view === "overview") {
      $("crumb").textContent = t("overviewCrumb");
      renderOverview();
    } else {
      followLocation();
    }
  }

  // ---------- selection → instant AI explanation ----------

  document.addEventListener("mouseup", function (e) {
    if ($("ask-panel").contains(e.target)) return;
    setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
      var anchor = sel.anchorNode;
      if (!anchor) return;
      var el = anchor.nodeType === 3 ? anchor.parentElement : anchor;
      var codeCell = el.closest ? el.closest(".code-cell") : null;
      if (!codeCell) return;

      var f = DATA.files[state.fileIndex];
      var startRow = codeCell.closest(".row");
      var focusEl = sel.focusNode && sel.focusNode.nodeType === 3
        ? sel.focusNode.parentElement : sel.focusNode;
      var endCell = focusEl && focusEl.closest ? focusEl.closest(".code-cell") : null;
      var endRow = endCell ? endCell.closest(".row") : startRow;
      var l1 = startRow ? parseInt(startRow.dataset.line, 10) : null;
      var l2 = endRow ? parseInt(endRow.dataset.line, 10) : l1;
      var text = sel.toString();
      if (l1 && l2 && l1 !== l2) {
        // A cross-row DOM selection also captures the right-pane explanation
        // cells. Rebuild the snippet from the actual source lines instead.
        var lo = Math.min(l1, l2), hi = Math.max(l1, l2);
        text = f.code.split("\n").slice(lo - 1, hi).join("\n");
      }
      if (text.length > 8000) text = text.slice(0, 8000);
      state.askContext = {
        file: f.path,
        language: f.language,
        selection: text,
        line: l1 && l2 ? Math.min(l1, l2) : l1,
        lineEnd: l1 && l2 ? Math.max(l1, l2) : l2
      };
      openAsk();
      if (state.serverAvailable) {
        askModel(t("autoExplain"), t("autoPrompt"));
      }
    }, 10);
  });

  function openAsk() {
    state.askSession++;
    state.busy = false;
    $("ask-send").disabled = false;
    $("ask-panel").classList.remove("hidden");
    var ctx = state.askContext;
    var ctxEl = $("ask-context");
    if (ctx) {
      var range = ctx.line ? (ctx.lineEnd && ctx.lineEnd !== ctx.line
        ? " · L" + ctx.line + "–" + ctx.lineEnd : " · L" + ctx.line) : "";
      ctxEl.textContent = ctx.file + range + "\n" +
        (ctx.selection.length > 600 ? ctx.selection.slice(0, 600) + " …" : ctx.selection);
      ctxEl.classList.remove("hidden");
    } else {
      ctxEl.classList.add("hidden");
    }
    $("ask-messages").innerHTML = "";
    state.history = [];
    if (!state.serverAvailable) {
      addMessage("ai", t("noServer"), true);
    }
  }

  function addMessage(role, text, raw) {
    var wrap = $("ask-messages");
    var div = document.createElement("div");
    div.className = "msg " + role;
    var label = document.createElement("div");
    label.className = "role";
    label.textContent = role === "user" ? (state.lang === "zh" ? "你" : "You") : "AI";
    var body = document.createElement("div");
    body.className = "body";
    if (raw) body.textContent = text; else body.innerHTML = renderMarkdownLite(text);
    div.appendChild(label);
    div.appendChild(body);
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return body;
  }

  function askModel(displayQuestion, prompt) {
    if (state.busy) return;
    state.busy = true;
    var session = state.askSession;
    addMessage("user", displayQuestion, true);
    var aiBody = addMessage("ai", t("thinking"), true);
    aiBody.classList.add("thinking");
    $("ask-send").disabled = true;
    var ctx = state.askContext || {};

    function scrollBottom() { $("ask-messages").scrollTop = $("ask-messages").scrollHeight; }

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        file: ctx.file || "",
        language: ctx.language || "",
        selection: ctx.selection || "",
        line: ctx.line || null,
        line_end: ctx.lineEnd || null,
        question: prompt,
        lang: state.lang,
        history: state.history
      })
    }).then(function (r) {
      var ctype = r.headers.get("Content-Type") || "";
      if (!r.ok || ctype.indexOf("text/plain") === -1 || !r.body) {
        return r.json().then(function (data) {
          throw new Error(data.error || ("HTTP " + r.status));
        });
      }
      // Streamed plain-text answer: render tokens as they arrive.
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var acc = "";
      var started = false;
      function pump() {
        return reader.read().then(function (res) {
          if (session !== state.askSession) { reader.cancel(); return null; }
          if (res.done) {
            state.history.push({ role: "user", content: prompt });
            state.history.push({ role: "assistant", content: acc });
            return null;
          }
          acc += decoder.decode(res.value, { stream: true });
          if (!started && acc.trim()) {
            started = true;
            aiBody.classList.remove("thinking");
          }
          if (started) {
            aiBody.innerHTML = renderMarkdownLite(acc);
            scrollBottom();
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      if (session !== state.askSession) return;
      aiBody.classList.remove("thinking");
      aiBody.textContent = t("error") + err.message;
    }).finally(function () {
      if (session !== state.askSession) return;
      state.busy = false;
      $("ask-send").disabled = false;
      $("ask-input").focus();
      scrollBottom();
    });
  }

  function sendQuestion() {
    var input = $("ask-input");
    var q = input.value.trim();
    if (!q || !state.serverAvailable || state.busy) return;
    input.value = "";
    askModel(q, q);
  }

  function checkServer() {
    if (location.protocol === "file:") return;
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (d) {
      state.serverAvailable = !!(d && d.ok && d.llm);
    }).catch(function () { state.serverAvailable = false; });
  }

  // ---------- wire up ----------

  $("sidebar-toggle").onclick = function () { $("sidebar").classList.toggle("collapsed"); };
  $("overview-btn").onclick = function () {
    navigate("#overview");
    if (matchMedia("(max-width: 900px)").matches) $("sidebar").classList.add("collapsed");
  };
  window.addEventListener("hashchange", followLocation);
  $("lang-toggle").onclick = function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    applyLang();
  };
  $("font-dec").onclick = function () { state.fontSize = Math.max(10, state.fontSize - 1); applyFontSize(); };
  $("font-inc").onclick = function () { state.fontSize = Math.min(22, state.fontSize + 1); applyFontSize(); };
  $("ask-close").onclick = function () {
    state.askSession++;
    state.busy = false;
    $("ask-panel").classList.add("hidden");
  };
  $("ask-send").onclick = sendQuestion;
  $("ask-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendQuestion();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      state.askSession++;
      state.busy = false;
      $("ask-panel").classList.add("hidden");
    }
  });

  applyFontSize();
  if (matchMedia("(max-width: 900px)").matches) $("sidebar").classList.add("collapsed");
  state.view = "overview";
  applyLang();
  followLocation();
  checkServer();
})();
</script>
</body>
</html>
