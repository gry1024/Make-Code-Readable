<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-project · Make Code Readable</title>
<style>:root {
  --bg: #FAF9F5;
  --bg-sidebar: #F3F1EA;
  --bg-header: #F7F5EF;
  --bg-hover: #F1EDE2;
  --bg-pinned: #FDF3D7;
  --bg-block-header: #F0EEE6;
  --border: #E4E0D5;
  --text: #3B3A36;
  --text-dim: #8A8578;
  --text-faint: #B3ADA0;
  --accent: #6B5CE7;
  --accent-soft: #EEEBFB;
  --code-font-size: 13px;
  --exp-font-size: 13.5px;
  --mono: "Cascadia Code", "SF Mono", "Fira Code", "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
}
.hidden { display: none !important; }
button { font-family: var(--ui); cursor: pointer; }
.spacer { flex: 1; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 14px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#brand { font-weight: 600; font-size: 13px; letter-spacing: .2px; color: var(--text-dim); white-space: nowrap; }
#crumb {
  margin-left: 10px; font-family: var(--mono); font-size: 12px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#topbar button {
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; line-height: 1.4;
  transition: background .12s, color .12s;
}
#topbar button:hover { background: var(--bg-hover); color: var(--text); }
#sidebar-toggle { border: none !important; font-size: 15px; padding: 4px 8px; }
#lang-toggle { font-weight: 600; }

/* ---------- layout ---------- */
#main { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 264px; flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 0;
}
#sidebar.collapsed { display: none; }
#repo-name {
  font-weight: 600; font-size: 12px; color: var(--text-dim);
  padding: 0 16px 8px; text-transform: uppercase; letter-spacing: .6px;
}
#overview-btn {
  display: block; width: calc(100% - 24px); margin: 0 12px 10px;
  text-align: left; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); color: var(--accent);
  padding: 7px 12px; font-size: 12.5px; font-weight: 600;
}
#overview-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- IDE file tree ---------- */
.tree-dir, .tree-file {
  display: flex; align-items: center; width: 100%; text-align: left;
  border: none; background: none; padding: 3px 12px 3px 0;
  font-size: 12.5px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-dir { font-weight: 600; color: #6E675A; }
.tree-dir .arrow { display: inline-block; width: 14px; color: var(--text-faint); font-size: 10px; }
.tree-dir:hover, .tree-file:hover { background: var(--bg-hover); color: var(--text); }
.tree-file { font-family: var(--mono); font-size: 12px; }
.tree-file.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.tree-file.disabled { opacity: .38; cursor: default; }
.tree-file.disabled:hover { background: none; color: var(--text-dim); }
.ann-dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  margin-left: auto; flex-shrink: 0;
}

#content { flex: 1; overflow: auto; min-width: 0; }

#file-note {
  display: none;
  margin: 14px 20px 0; padding: 10px 14px;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 8px; font-size: 12.5px;
}
#file-note.visible { display: block; }

/* ---------- overview ---------- */
#overview { padding: 26px 34px 60px; max-width: 1100px; }
.ov-head h2 { margin: 0 0 10px; font-size: 22px; }
.ov-summary { font-size: 14px; line-height: 1.8; color: #5B564B; max-width: 760px; }
.ov-summary code, .ov-desc code {
  font-family: var(--mono); font-size: .92em;
  background: #EDEAE0; color: var(--accent); border-radius: 4px; padding: 0 4px;
}
.ov-stats { margin: 12px 0 22px; font-size: 12px; color: var(--text-dim); }
.ov-tree { border-top: 1px solid var(--border); }
.ov-row {
  display: flex; align-items: baseline; gap: 14px;
  padding: 5px 8px; border-bottom: 1px solid #F0EDE4;
}
.ov-dir .ov-name { font-weight: 600; color: #6E675A; font-size: 13px; }
.ov-file .ov-name { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
.ov-file .ov-name.annotated { color: var(--accent); font-weight: 600; }
.ov-file.clickable { cursor: pointer; }
.ov-file.clickable:hover { background: var(--bg-hover); }
.ov-file.clickable:hover .ov-name { color: var(--accent); }
.ov-desc { font-size: 12.5px; color: #7A7263; line-height: 1.6; }

/* ---------- reading grid ---------- */
#reading { padding: 10px 0 40vh; }
.block { margin: 0 0 6px; }
.block-header {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 20px;
  background: var(--bg-block-header);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.block-header .range {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  flex-shrink: 0; min-width: 74px;
}
.block-header .summary { font-size: 12.5px; font-weight: 600; color: #6B6350; }
.block-header:hover .summary { color: var(--accent); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row .code-cell {
  display: flex; min-width: 0;
  border-right: 1px solid var(--border);
  font-family: var(--mono); font-size: var(--code-font-size); line-height: 1.65;
  font-variant-ligatures: none;
}
.row .lineno {
  flex-shrink: 0; width: 52px; padding: 1px 14px 1px 0;
  text-align: right; color: var(--text-faint); user-select: none;
  font-size: calc(var(--code-font-size) - 1.5px); line-height: inherit;
}
.row .code {
  flex: 1; min-width: 0; padding: 1px 16px 1px 0;
  white-space: pre-wrap; word-break: break-all; tab-size: 4;
}
.row .exp-cell {
  min-width: 0; padding: 1px 24px 1px 20px;
  font-size: var(--exp-font-size); line-height: 1.65; color: #4E4A40;
  overflow-wrap: break-word;
}
.row .exp-cell:empty::after { content: " "; }
.row .exp-cell code {
  font-family: var(--mono); font-size: calc(var(--exp-font-size) - 1px);
  background: #EDEAE0; color: #6B5CE7;
  border-radius: 4px; padding: 0 4px;
}
.row .exp-cell strong { color: #3B3A36; }
.block-header .summary code {
  font-family: var(--mono); font-size: 11.5px;
  background: #E7E3D8; border-radius: 4px; padding: 0 4px;
}
.row:hover { background: var(--bg-hover); }
.row:hover .lineno { color: var(--text-dim); }
.row.pinned { background: var(--bg-pinned); }
.block.focused .row { background: var(--bg-hover); }

/* raw (unannotated) file view: code takes the full width */
#reading.raw .row { grid-template-columns: minmax(0, 1fr); }
#reading.raw .row .code-cell { border-right: none; }
#reading.raw .row .exp-cell { display: none; }

/* ---------- syntax highlighting: Cursor / VS Code Light+ palette ---------- */
.hljs-comment, .hljs-quote { color: #008000; font-style: normal; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type { color: #0000FF; }
.hljs-string, .hljs-regexp, .hljs-addition { color: #A31515; }
.hljs-number, .hljs-symbol, .hljs-bullet { color: #098658; }
.hljs-title, .hljs-title.function_, .hljs-section { color: #795E26; }
.hljs-title.class_, .hljs-built_in { color: #267F99; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #001080; }
.hljs-name, .hljs-selector-id, .hljs-selector-class { color: #267F99; }
.hljs-meta { color: #AF00DB; }
.hljs-params { color: #3B3A36; }
.hljs-deletion { color: #C0392B; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }

/* ---------- ask AI ---------- */
#ask-panel {
  position: fixed; right: 24px; bottom: 24px; z-index: 40;
  width: 640px; max-width: calc(100vw - 48px); height: 76vh; max-height: calc(100vh - 48px);
  display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 12px 48px rgba(60, 55, 40, .18);
  overflow: hidden;
}
#ask-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-header); font-weight: 600; font-size: 13px; color: var(--accent);
}
#ask-close { border: none; background: none; font-size: 20px; color: var(--text-dim); line-height: 1; }
#ask-context {
  padding: 8px 16px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
  max-height: 110px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
#ask-messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
.msg { margin-bottom: 16px; font-size: 13.5px; line-height: 1.75; }
.msg .role { font-size: 11px; font-weight: 600; color: var(--text-faint); margin-bottom: 4px; }
.msg.user .body {
  background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
}
.msg.ai .body { white-space: normal; }
.msg.ai .body code, .msg.ai .body pre {
  font-family: var(--mono); font-size: 12px; background: var(--bg-sidebar);
  border-radius: 4px; padding: 1px 5px;
}
.msg.ai .body pre { padding: 10px 12px; overflow-x: auto; white-space: pre; }
.msg.ai .body pre code { background: none; padding: 0; }
.msg .thinking { color: var(--text-faint); font-style: italic; }
#ask-input-row {
  display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
}
#ask-input {
  flex: 1; resize: none; border: 1px solid var(--border); border-radius: 8px;
  background: #fff; color: var(--text); font-family: var(--ui); font-size: 13px;
  padding: 8px 10px; outline: none;
}
#ask-input:focus { border-color: var(--accent); }
#ask-send {
  border: none; border-radius: 8px; background: var(--accent); color: #fff;
  padding: 0 14px; font-size: 14px;
}
#ask-send:disabled { opacity: .4; cursor: default; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #D8D3C5; border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #C4BEAD; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: #D9D2F5; }

@media (max-width: 900px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .code-cell { border-right: none; }
  .row .exp-cell { padding-left: 68px; padding-bottom: 6px; color: #7A7263; }
  #sidebar { position: absolute; z-index: 10; height: 100%; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="sidebar-toggle" title="Toggle file tree">☰</button>
    <div id="brand">Make Code Readable</div>
    <div id="crumb"></div>
    <div class="spacer"></div>
    <button id="lang-toggle" title="Switch language">EN</button>
    <button id="font-dec" title="Decrease font size">A−</button>
    <button id="font-inc" title="Increase font size">A+</button>
  </header>
  <div id="main">
    <nav id="sidebar">
      <div id="repo-name"></div>
      <button id="overview-btn">▦ <span id="overview-label">仓库总览</span></button>
      <div id="file-tree"></div>
    </nav>
    <div id="content">
      <div id="file-note"></div>
      <div id="overview" class="hidden"></div>
      <div id="reading"></div>
    </div>
  </div>
</div>

<div id="ask-panel" class="hidden">
  <div id="ask-header">
    <span>✦ <span class="ask-title">代码解读</span></span>
    <button id="ask-close">×</button>
  </div>
  <div id="ask-context"></div>
  <div id="ask-messages"></div>
  <div id="ask-input-row">
    <textarea id="ask-input" rows="2" placeholder=""></textarea>
    <button id="ask-send">➤</button>
  </div>
</div>

y with exponential backoff"}, {"n": 23, "zh": "说明：直到 `retries_left` 耗尽；队列刻意零依赖，", "en": "Doc: until `retries_left` hits zero; deliberately dependency-free"}, {"n": 24, "zh": "说明：可直接丢进任何项目使用", "en": "Doc: so it drops into any project"}, {"n": 25, "zh": "结束类说明文档字符串", "en": "End of the class docstring"}, {"n": 27, "zh": "构造函数：默认开 4 个工作线程 {", "en": "Constructor: spawn 4 workers by default {"}, {"n": 28, "zh": "创建优先级队列 → 按 `(到期时间, 序号)` 排序，最早到期先出队；读写自带锁", "en": "Create PriorityQueue → ordered by `(due time, seq)`, earliest due first; internally locked"}, {"n": 29, "zh": "`_workers` 置空列表 → 稍后存线程句柄", "en": "`_workers` = empty list → thread handles stored here"}, {"n": 30, "zh": "`_seq` 序号从 0 开始 → 同到期时间时稳定排序，也避免队列去比较 `Task` 对象", "en": "`_seq` starts at 0 → stable ordering for equal due times; also stops the queue comparing Task objects"}, {"n": 31, "zh": "创建互斥锁 → 保护 `_seq` 的并发自增", "en": "Create mutex → guards concurrent `_seq` increments"}, {"n": 32, "zh": "创建停止信号 `Event` → 兼作可中断的等待器", "en": "Create stop `Event` → doubles as an interruptible wait"}, {"n": 33, "zh": "循环 `i` 从 0 到 `workers-1`：逐个建线程 {", "en": "Loop `i` over 0..workers-1: create each thread {"}, {"n": 34, "zh": "新建线程：跑 `_run` 循环；`daemon=True` → 主进程退出时直接杀死，不阻碍退出", "en": "New thread running `_run`; `daemon=True` → killed on process exit, never blocks it"}, {"n": 35, "zh": "启动线程 → 随即阻塞在队列 `get` 上等任务", "en": "Start thread → it immediately blocks on queue `get` waiting for work"}, {"n": 36, "zh": "线程句柄入 `_workers` → 供 `shutdown` 回收", "en": "Append handle to `_workers` → for shutdown to join"}]}, {"start": 38, "end": 45, "summary_zh": "submit：任务包装后按「到期时间 + 序号」入队，调用方不等执行", "summary_en": "submit: enqueue the task by (due time, seq) and return immediately", "lines": [{"n": 38, "zh": "定义 `submit(fn, *args, retries, delay, **kwargs)` { → `retries`/`delay` 归队列，其余透传给 `fn`", "en": "Define `submit(fn, *args, retries, delay, **kwargs)` { → retries/delay belong to the queue, the rest pass through to `fn`"}, {"n": 39, "zh": "说明：调度 `fn(*args, **kwargs)`，立即返回", "en": "Doc: schedule `fn(*args, **kwargs)`, return at once"}, {"n": 40, "zh": "进入锁保护区 {", "en": "Enter the locked section {"}, {"n": 41, "zh": "`_seq` +1", "en": "Increment `_seq`"}, {"n": 42, "zh": "取出本任务序号存入 `seq`", "en": "Copy this task's sequence into `seq`"}, {"n": 43, "zh": "打包成 `Task`：函数 + 参数 + 剩余重试 + 延迟", "en": "Pack a `Task`: function + args + retries left + delay"}, {"n": 44, "zh": "入队 `(now + delay, seq, task)` → 到期时间 = 当前单调时钟 + 延迟", "en": "Enqueue `(now + delay, seq, task)` → due time = monotonic now + delay"}]}, {"start": 46, "end": 66, "summary_zh": "工作线程主循环：取任务 → 等到期 → 执行；失败则递减次数、指数退避后重新入队", "summary_en": "Worker loop: fetch → wait until due → run; on failure decrement retries and re-enqueue with backoff", "lines": [{"n": 46, "zh": "定义 `_run`：每个工作线程都在跑这个循环 {", "en": "Define `_run`: every worker thread runs this loop {"}, {"n": 47, "zh": "循环直到 停止信号置位 {", "en": "Loop until the stop flag is set {"}, {"n": 48, "zh": "尝试取任务 {", "en": "Try to fetch a task {"}, {"n": 49, "zh": "取最早到期任务，最多等 0.2 秒 → 带超时才能定期检查停止信号，否则 `shutdown` 叫不醒线程", "en": "Fetch earliest-due task with 0.2s timeout → the timeout lets threads re-check the stop flag; otherwise shutdown couldn't wake them"}, {"n": 50, "zh": "若 超时无任务（`Empty`）→ {", "en": "If nothing arrived in 0.2s (`Empty`) → {"}, {"n": 51, "zh": "跳回循环开头重新检查", "en": "Loop back and re-check"}, {"n": 52, "zh": "`wait` = 到期时间 − 当前时间", "en": "`wait` = due time − now"}, {"n": 53, "zh": "若 尚未到期 {", "en": "If not yet due {"}, {"n": 54, "zh": "睡到到期；停止信号可立刻唤醒 → 比 `time.sleep` 响应快", "en": "Sleep until due; the stop event wakes it instantly → faster shutdown than time.sleep"}, {"n": 55, "zh": "尝试执行任务 {", "en": "Try to run the task {"}, {"n": 56, "zh": "展开参数，真正调用 `task.fn`", "en": "Unpack args and actually invoke `task.fn`"}, {"n": 57, "zh": "若 任务抛任何异常 → {", "en": "If the task raises anything → {"}, {"n": 58, "zh": "打印完整异常堆栈 → 错误不被静默吞掉", "en": "Print the full traceback → errors never silently swallowed"}, {"n": 59, "zh": "若 剩余重试 > 0 {", "en": "If retries remain {"}, {"n": 60, "zh": "剩余重试 −1", "en": "Decrement retries left"}, {"n": 61, "zh": "`backoff` = `2^(3−剩余次数)` 秒，封顶 30 → 失败越多等越久，故障时保护下游", "en": "`backoff` = `2^(3−retries_left)` s, capped at 30 → longer waits per failure, protecting downstream"}, {"n": 62, "zh": "重新入队同一函数（剩余次数已递减，", "en": "Re-enqueue the same function (retry count decremented,"}, {"n": 63, "zh": "延迟 `backoff` 秒后再执行）", "en": "delayed by `backoff` seconds)"}, {"n": 64, "zh": "`finally`：无论成功、失败还是重试都执行 {", "en": "`finally`: runs on success, failure, or retry {"}, {"n": 65, "zh": "标记任务完成 `task_done` → 漏掉它 `join()` 会永远阻塞", "en": "Mark `task_done` → missing it would block `join()` forever"}]}, {"start": 67, "end": 74, "summary_zh": "生命周期收尾：join 等队列清空，shutdown 发停止信号并回收线程", "summary_en": "Lifecycle: join waits for the queue to drain; shutdown signals stop and joins threads", "lines": [{"n": 67, "zh": "定义 `join` {", "en": "Define `join` {"}, {"n": 68, "zh": "说明：阻塞直到所有排队任务执行完", "en": "Doc: block until every queued task has finished"}, {"n": 69, "zh": "阻塞等待 → 每个入队任务都收到 `task_done` 才返回", "en": "Block → returns only when every enqueued task got `task_done`"}, {"n": 71, "zh": "定义 `shutdown` {", "en": "Define `shutdown` {"}, {"n": 72, "zh": "停止信号置位 → 唤醒所有在 `wait` 或超时循环里的线程", "en": "Set the stop flag → wakes all threads in `wait` or the timeout loop"}, {"n": 73, "zh": "遍历每个工作线程 {", "en": "For each worker thread {"}, {"n": 74, "zh": "等它退出，最多 1 秒 → 守护线程超时也不影响进程结束", "en": "Join with 1s cap → daemon threads won't block process exit anyway"}]}]}], "tree": ["frontend.js", "task_queue.py"], "structure": {"repo_zh": "迷你演示项目：一个 Python 线程池任务队列（支持延迟与指数退避重试）和一个浏览器端 JS 工具库（防抖、API 客户端、轮询），用于展示 Make Code Readable 的双栏阅读效果。", "repo_en": "A tiny demo project: a Python thread-pool task queue (delayed tasks, exponential-backoff retries) and browser JS helpers (debounce, API client, polling), showcasing Make Code Readable's dual-pane reader.", "dirs": {}, "files": {"task_queue.py": {"zh": "线程池任务队列：优先级队列调度，失败指数退避重试", "en": "Thread-pool task queue: priority scheduling with backoff retries"}, "frontend.js": {"zh": "浏览器工具：debounce 防抖、带超时重试的 API 客户端、轮询", "en": "Browser helpers: debounce, timeout/retry API client, polling"}}}};</script>
<script>(function () {
  "use strict";

  var DATA = window.MCR_DATA;
  var state = {
    lang: localStorage.getItem("mcr.lang") || "zh",
    fontSize: parseFloat(localStorage.getItem("mcr.fontSize") || "13"),
    fileIndex: 0,
    serverAvailable: false,
    askContext: null,
    history: [],
    askSession: 0,
    busy: false,
    view: "reader",
    collapsed: {}
  };

  var $ = function (id) { return document.getElementById(id); };

  var I18N = {
    zh: {
      askTitle: "代码解读",
      placeholder: "继续追问这段代码… (Enter 发送)",
      autoExplain: "解释这段代码",
      autoPrompt: "用 2-3 句话概括我选中代码的作用，再指出最关键的逻辑或坑。控制在 250 字以内，不要逐行罗列；我追问时再展开细节。",
      noServer: "当前为离线 HTML，未连接本地服务。\n要使用划词提问，请在项目目录运行：\n\npython -m mcr.serve <repo> --annotations <dir>\n\n并设置环境变量 MCR_API_KEY（OpenAI 兼容接口）。",
      thinking: "正在解读选中代码…", error: "请求失败：",
      sendError: "发送失败，请重试。",
      overview: "仓库总览", overviewCrumb: "仓库结构总览 · 点击文件跳转",
      annotatedStats: "{a} / {b} 个源文件已生成逐行注释；带紫色标记的文件可直接跳转阅读",
      noAnnotation: "该文件尚未生成注释，仅展示源代码。"
    },
    en: {
      askTitle: "Code Explainer",
      placeholder: "Ask a follow-up about this code… (Enter to send)",
      autoExplain: "Explain this code",
      autoPrompt: "Summarize what my selected code does in 2-3 sentences, then point out the most important logic or pitfall. Keep it under 150 words; don't go line by line — I'll ask follow-ups for details.",
      noServer: "This is an offline HTML file with no local server attached.\nTo enable code questions, run:\n\npython -m mcr.serve <repo> --annotations <dir>\n\nand set MCR_API_KEY (OpenAI-compatible API).",
      thinking: "Explaining the selection…", error: "Request failed: ",
      sendError: "Failed to send. Please retry.",
      overview: "Overview", overviewCrumb: "Repository structure · click a file to open",
      annotatedStats: "{a} of {b} source files have line-by-line annotations; files marked in purple open the reader",
      noAnnotation: "No annotations for this file yet — showing source code only."
    }
  };
  function t(key) { return I18N[state.lang][key]; }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderMarkdownLite(text) {
    var esc = escapeHtml(text);
    esc = esc.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      return "<pre><code>" + code.replace(/^\n+|\n+$/g, "") + "</code></pre>";
    });
    esc = esc.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    esc = esc.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    esc = esc.replace(/^#{1,4}\s+(.+)$/gm, "<strong class=\"md-h\">$1</strong>");
    esc = esc.replace(/^[ \t]*[-*]\s+/gm, "• ");
    esc = esc.replace(/\n/g, "<br>");
    return esc;
  }

  // Highlight the whole file once, then split into per-line HTML while
  // re-balancing <span> tags that cross line boundaries (multi-line strings,
  // block comments, etc.), so each rendered line stays independently valid.
  function highlightLines(code, lang) {
    var html;
    try {
      html = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
    } catch (e) {
      html = escapeHtml(code);
    }
    var lines = [];
    var stack = [];
    var cur = "";
    var re = /(<span[^>]*>|<\/span>|\n|[^<\n]+|<)/g;
    var m;
    while ((m = re.exec(html)) !== null) {
      var tok = m[0];
      if (tok === "\n") {
        cur += new Array(stack.length + 1).join("</span>");
        lines.push(cur);
        cur = stack.join("");
      } else if (tok === "</span>") {
        stack.pop();
        cur += tok;
      } else if (tok.slice(0, 5) === "<span") {
        stack.push(tok);
        cur += tok;
      } else {
        cur += tok;
      }
    }
    lines.push(cur);
    return lines;
  }

  function applyFontSize() {
    document.documentElement.style.setProperty("--code-font-size", state.fontSize + "px");
    document.documentElement.style.setProperty("--exp-font-size", (state.fontSize + 0.5) + "px");
    localStorage.setItem("mcr.fontSize", String(state.fontSize));
  }

  var fileIndexByPath = {};
  DATA.files.forEach(function (f, i) { fileIndexByPath[f.path] = i; });

  function buildNested(paths) {
    var root = { dirs: {}, files: [] };
    paths.forEach(function (p) {
      var parts = p.split("/");
      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        var d = parts[i];
        if (!node.dirs[d]) {
          node.dirs[d] = { dirs: {}, files: [], path: parts.slice(0, i + 1).join("/") };
        }
        node = node.dirs[d];
      }
      node.files.push(p);
    });
    return root;
  }

  function renderTree() {
    var tree = $("file-tree");
    tree.innerHTML = "";
    $("repo-name").textContent = DATA.repo;
    var paths = (DATA.tree && DATA.tree.length) ? DATA.tree : DATA.files.map(function (f) { return f.path; });
    var nested = buildNested(paths);

    function walk(node, container, depth) {
      Object.keys(node.dirs).sort().forEach(function (name) {
        var d = node.dirs[name];
        var collapsed = !!state.collapsed[d.path];
        var row = document.createElement("button");
        row.className = "tree-dir";
        row.style.paddingLeft = (12 + depth * 14) + "px";
        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = collapsed ? "▸" : "▾";
        row.appendChild(arrow);
        row.appendChild(document.createTextNode(" " + name));
        row.onclick = function () {
          if (collapsed) delete state.collapsed[d.path]; else state.collapsed[d.path] = true;
          renderTree();
        };
        container.appendChild(row);
        if (!collapsed) walk(d, container, depth + 1);
      });
      node.files.forEach(function (p) {
        var idx = fileIndexByPath[p];
        var f = idx !== undefined ? DATA.files[idx] : null;
        var btn = document.createElement("button");
        btn.className = "tree-file";
        if (state.view === "reader" && idx === state.fileIndex) btn.classList.add("active");
        if (idx === undefined) btn.classList.add("disabled");
        btn.style.paddingLeft = (26 + depth * 14) + "px";
        btn.textContent = p.split("/").pop();
        btn.title = p;
        if (f && f.blocks.length) {
          var dot = document.createElement("span");
          dot.className = "ann-dot";
          dot.title = state.lang === "zh" ? "已生成注释" : "Annotated";
          btn.appendChild(dot);
        }
        if (idx !== undefined) btn.onclick = function () { selectFile(idx); };
        container.appendChild(btn);
      });
    }
    walk(nested, tree, 0);
  }

  function selectFile(i) {
    state.fileIndex = i;
    state.view = "reader";
    $("overview").classList.add("hidden");
    $("reading").classList.remove("hidden");
    renderTree();
    renderFile();
    $("content").scrollTop = 0;
  }

  function showOverview() {
    state.view = "overview";
    renderTree();
    $("reading").classList.add("hidden");
    $("file-note").classList.remove("visible");
    $("overview").classList.remove("hidden");
    $("crumb").textContent = t("overviewCrumb");
    renderOverview();
    $("content").scrollTop = 0;
  }

  function renderOverview() {
    var ov = $("overview");
    ov.innerHTML = "";
    var s = DATA.structure || {};
    var key = state.lang;
    var dirInfo = s.dirs || {};
    var fileInfo = s.files || {};
    var annotated = DATA.files.filter(function (f) { return f.blocks.length; }).length;

    var head = document.createElement("div");
    head.className = "ov-head";
    var title = document.createElement("h2");
    title.textContent = DATA.repo;
    head.appendChild(title);
    if (s["repo_" + key]) {
      var p = document.createElement("p");
      p.className = "ov-summary";
      p.innerHTML = renderMarkdownLite(s["repo_" + key]);
      head.appendChild(p);
    }
    var stats = document.createElement("div");
    stats.className = "ov-stats";
    stats.textContent = t("annotatedStats").replace("{a}", annotated).replace("{b}", DATA.files.length);
    head.appendChild(stats);
    ov.appendChild(head);

    var paths = (DATA.tree && DATA.tree.length) ? DATA.tree : DATA.files.map(function (f) { return f.path; });
    var nested = buildNested(paths);
    var list = document.createElement("div");
    list.className = "ov-tree";

    function walk(node, depth) {
      Object.keys(node.dirs).sort().forEach(function (name) {
        var d = node.dirs[name];
        var row = document.createElement("div");
        row.className = "ov-row ov-dir";
        row.style.paddingLeft = (depth * 22) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = name + "/";
        row.appendChild(nm);
        var info = dirInfo[d.path];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        list.appendChild(row);
        walk(d, depth + 1);
      });
      node.files.forEach(function (p) {
        var idx = fileIndexByPath[p];
        var row = document.createElement("div");
        row.className = "ov-row ov-file" + (idx !== undefined ? " clickable" : "");
        row.style.paddingLeft = (depth * 22 + 18) + "px";
        var nm = document.createElement("span");
        nm.className = "ov-name";
        nm.textContent = p.split("/").pop();
        if (idx !== undefined && DATA.files[idx].blocks.length) nm.classList.add("annotated");
        row.appendChild(nm);
        var info = fileInfo[p];
        if (info && info[key]) {
          var desc = document.createElement("span");
          desc.className = "ov-desc";
          desc.innerHTML = renderMarkdownLite(info[key]);
          row.appendChild(desc);
        }
        if (idx !== undefined) {
          row.title = p;
          row.onclick = function () { selectFile(idx); };
        }
        list.appendChild(row);
      });
    }
    walk(nested, 0);
    ov.appendChild(list);
  }

  function renderFile() {
    var f = DATA.files[state.fileIndex];
    if (!f) { $("reading").innerHTML = ""; return; }
    $("crumb").textContent = f.path + "  ·  " + f.language;
    var note = $("file-note");
    var isRaw = !f.blocks.length;
    var noteText = state.lang === "zh" ? f.note_zh : f.note_en;
    if (isRaw) noteText = noteText || t("noAnnotation");
    note.textContent = noteText || "";
    note.classList.toggle("visible", !!noteText);

    var rawLines = f.code.replace(/\t/g, "    ").split("\n");
    var codeLines = highlightLines(f.code.replace(/\t/g, "    "), f.language);
    var reading = $("reading");
    reading.innerHTML = "";
    reading.classList.toggle("raw", isRaw);
    var key = state.lang;

    var blocks = isRaw
      ? [{ start: 1, end: rawLines.length, lines: [] }]
      : f.blocks;
    blocks.forEach(function (b) {
      if (isRaw && b.end - b.start < 1) return;
      var block = document.createElement("div");
      block.className = "block";

      var header = document.createElement("div");
      header.className = "block-header";
      if (isRaw) header.style.display = "none";
      var range = document.createElement("span");
      range.className = "range";
      range.textContent = "L" + b.start + "–" + b.end;
      var summary = document.createElement("span");
      summary.className = "summary";
      summary.innerHTML = b["summary_" + key] ? renderMarkdownLite(b["summary_" + key]) : "";
      header.appendChild(range);
      header.appendChild(summary);
      header.onclick = function () { block.classList.toggle("focused"); };
      block.appendChild(header);

      var expByLine = {};
      (b.lines || []).forEach(function (ln) { expByLine[ln.n] = ln[key]; });

      for (var n = b.start; n <= b.end; n++) {
        var row = document.createElement("div");
        row.className = "row";
        row.dataset.line = n;
        var codeCell = document.createElement("div");
        codeCell.className = "code-cell";
        var lineno = document.createElement("span");
        lineno.className = "lineno";
        lineno.textContent = n;
        var code = document.createElement("code");
        code.className = "code hljs";
        var idx = n - 1;
        code.innerHTML = (idx < codeLines.length && codeLines[idx]) || " ";
        codeCell.appendChild(lineno);
        codeCell.appendChild(code);

        var expCell = document.createElement("div");
        expCell.className = "exp-cell";
        var exp = expByLine[n] || "";
        if (exp) expCell.innerHTML = renderMarkdownLite(exp);
        // Mirror the code's indentation so the right pane reads like
        // natural-language pseudocode with the same nesting structure.
        var raw = rawLines[idx] || "";
        var spaces = (raw.match(/^ */) || [""])[0].length;
        var level = Math.min(Math.floor(spaces / 4), 10);
        expCell.style.paddingLeft = (20 + level * 18) + "px";

        row.appendChild(codeCell);
        row.appendChild(expCell);
        row.onclick = function () {
          var wasPinned = document.querySelector(".row.pinned");
          if (wasPinned) wasPinned.classList.remove("pinned");
          if (wasPinned !== this) this.classList.add("pinned");
        };
        block.appendChild(row);
      }
      reading.appendChild(block);
    });
  }

  function applyLang() {
    localStorage.setItem("mcr.lang", state.lang);
    document.documentElement.lang = state.lang === "zh" ? "zh" : "en";
    $("lang-toggle").textContent = state.lang === "zh" ? "EN" : "中";
    document.querySelector("#ask-panel .ask-title").textContent = t("askTitle");
    $("ask-input").placeholder = t("placeholder");
    $("overview-label").textContent = t("overview");
    if (state.view === "overview") {
      $("crumb").textContent = t("overviewCrumb");
      renderOverview();
    } else {
      renderFile();
    }
  }

  // ---------- selection → instant AI explanation ----------

  document.addEventListener("mouseup", function (e) {
    if ($("ask-panel").contains(e.target)) return;
    setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
      var anchor = sel.anchorNode;
      if (!anchor) return;
      var el = anchor.nodeType === 3 ? anchor.parentElement : anchor;
      var codeCell = el.closest ? el.closest(".code-cell") : null;
      if (!codeCell) return;

      var f = DATA.files[state.fileIndex];
      var startRow = codeCell.closest(".row");
      var focusEl = sel.focusNode && sel.focusNode.nodeType === 3
        ? sel.focusNode.parentElement : sel.focusNode;
      var endCell = focusEl && focusEl.closest ? focusEl.closest(".code-cell") : null;
      var endRow = endCell ? endCell.closest(".row") : startRow;
      var l1 = startRow ? parseInt(startRow.dataset.line, 10) : null;
      var l2 = endRow ? parseInt(endRow.dataset.line, 10) : l1;
      var text = sel.toString();
      if (l1 && l2 && l1 !== l2) {
        // A cross-row DOM selection also captures the right-pane explanation
        // cells. Rebuild the snippet from the actual source lines instead.
        var lo = Math.min(l1, l2), hi = Math.max(l1, l2);
        text = f.code.split("\n").slice(lo - 1, hi).join("\n");
      }
      if (text.length > 8000) text = text.slice(0, 8000);
      state.askContext = {
        file: f.path,
        language: f.language,
        selection: text,
        line: l1 && l2 ? Math.min(l1, l2) : l1,
        lineEnd: l1 && l2 ? Math.max(l1, l2) : l2
      };
      openAsk();
      if (state.serverAvailable) {
        askModel(t("autoExplain"), t("autoPrompt"));
      }
    }, 10);
  });

  function openAsk() {
    state.askSession++;
    state.busy = false;
    $("ask-send").disabled = false;
    $("ask-panel").classList.remove("hidden");
    var ctx = state.askContext;
    var ctxEl = $("ask-context");
    if (ctx) {
      var range = ctx.line ? (ctx.lineEnd && ctx.lineEnd !== ctx.line
        ? " · L" + ctx.line + "–" + ctx.lineEnd : " · L" + ctx.line) : "";
      ctxEl.textContent = ctx.file + range + "\n" +
        (ctx.selection.length > 600 ? ctx.selection.slice(0, 600) + " …" : ctx.selection);
      ctxEl.classList.remove("hidden");
    } else {
      ctxEl.classList.add("hidden");
    }
    $("ask-messages").innerHTML = "";
    state.history = [];
    if (!state.serverAvailable) {
      addMessage("ai", t("noServer"), true);
    }
  }

  function addMessage(role, text, raw) {
    var wrap = $("ask-messages");
    var div = document.createElement("div");
    div.className = "msg " + role;
    var label = document.createElement("div");
    label.className = "role";
    label.textContent = role === "user" ? (state.lang === "zh" ? "你" : "You") : "AI";
    var body = document.createElement("div");
    body.className = "body";
    if (raw) body.textContent = text; else body.innerHTML = renderMarkdownLite(text);
    div.appendChild(label);
    div.appendChild(body);
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return body;
  }

  function askModel(displayQuestion, prompt) {
    if (state.busy) return;
    state.busy = true;
    var session = state.askSession;
    addMessage("user", displayQuestion, true);
    var aiBody = addMessage("ai", t("thinking"), true);
    aiBody.classList.add("thinking");
    $("ask-send").disabled = true;
    var ctx = state.askContext || {};

    function scrollBottom() { $("ask-messages").scrollTop = $("ask-messages").scrollHeight; }

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        file: ctx.file || "",
        language: ctx.language || "",
        selection: ctx.selection || "",
        line: ctx.line || null,
        line_end: ctx.lineEnd || null,
        question: prompt,
        lang: state.lang,
        history: state.history
      })
    }).then(function (r) {
      var ctype = r.headers.get("Content-Type") || "";
      if (!r.ok || ctype.indexOf("text/plain") === -1 || !r.body) {
        return r.json().then(function (data) {
          throw new Error(data.error || ("HTTP " + r.status));
        });
      }
      // Streamed plain-text answer: render tokens as they arrive.
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var acc = "";
      var started = false;
      function pump() {
        return reader.read().then(function (res) {
          if (session !== state.askSession) { reader.cancel(); return null; }
          if (res.done) {
            state.history.push({ role: "user", content: prompt });
            state.history.push({ role: "assistant", content: acc });
            return null;
          }
          acc += decoder.decode(res.value, { stream: true });
          if (!started && acc.trim()) {
            started = true;
            aiBody.classList.remove("thinking");
          }
          if (started) {
            aiBody.innerHTML = renderMarkdownLite(acc);
            scrollBottom();
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      if (session !== state.askSession) return;
      aiBody.classList.remove("thinking");
      aiBody.textContent = t("error") + err.message;
    }).finally(function () {
      if (session !== state.askSession) return;
      state.busy = false;
      $("ask-send").disabled = false;
      $("ask-input").focus();
      scrollBottom();
    });
  }

  function sendQuestion() {
    var input = $("ask-input");
    var q = input.value.trim();
    if (!q || !state.serverAvailable || state.busy) return;
    input.value = "";
    askModel(q, q);
  }

  function checkServer() {
    if (location.protocol === "file:") return;
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (d) {
      state.serverAvailable = !!(d && d.ok && d.llm);
    }).catch(function () { state.serverAvailable = false; });
  }

  // ---------- wire up ----------

  $("sidebar-toggle").onclick = function () { $("sidebar").classList.toggle("collapsed"); };
  $("overview-btn").onclick = showOverview;
  $("lang-toggle").onclick = function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    applyLang();
  };
  $("font-dec").onclick = function () { state.fontSize = Math.max(10, state.fontSize - 1); applyFontSize(); };
  $("font-inc").onclick = function () { state.fontSize = Math.min(22, state.fontSize + 1); applyFontSize(); };
  $("ask-close").onclick = function () {
    state.askSession++;
    state.busy = false;
    $("ask-panel").classList.add("hidden");
  };
  $("ask-send").onclick = sendQuestion;
  $("ask-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendQuestion();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      state.askSession++;
      state.busy = false;
      $("ask-panel").classList.add("hidden");
    }
  });

  applyFontSize();
  renderTree();
  applyLang();
  checkServer();
})();
</script>
</body>
</html>
